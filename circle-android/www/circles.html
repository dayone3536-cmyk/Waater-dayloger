<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Circles — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-2:#ffb199;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --nav-w:248px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  /* ---------- shared shell (same as profile.html / index.html) ---------- */
  .app{display:flex;max-width:1180px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* =========================================================
     NAVIGATION — sidebar (desktop) / topbar + dock (mobile)
     ========================================================= */
  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.03em;
    display:inline-flex;align-items:baseline;line-height:1;
  }
  .wordmark .dot{color:var(--accent);display:inline-block;transition:transform .45s var(--ease-spring);}
  a.wordmark:hover .dot{transform:translateY(-3px) scale(1.3);}

  /* ---------- Desktop sidebar ---------- */
  .sidebar{
    display:none;width:var(--nav-w);flex-shrink:0;padding:26px 16px 20px;
    flex-direction:column;height:100vh;height:100dvh;position:sticky;top:0;
  }
  .sidebar .brand{align-self:flex-start;font-size:26px;padding:6px 14px;margin-bottom:26px;border-radius:12px;}

  .nav-wrap{position:relative;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;}
  .nav-pill{
    position:absolute;left:0;right:0;top:0;height:46px;border-radius:14px;background:#f3f3f4;
    opacity:0;pointer-events:none;z-index:0;
    transition:transform .38s var(--ease-spring), height .2s var(--ease), opacity .2s ease;
  }
  .nav-pill.on{opacity:1;}
  .nav-pill.snap{transition:opacity .2s ease;}

  .nav-item{
    position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;
    border-radius:14px;font-family:var(--font-display);font-size:15.5px;font-weight:500;letter-spacing:-.005em;
    color:var(--ink-soft);
    transition:color .18s ease, background .18s ease, transform .15s var(--ease-spring);
  }
  .nav-item svg{
    width:22px;height:22px;flex-shrink:0;stroke:currentColor;
    transition:transform .35s var(--ease-spring), stroke .18s ease, fill .18s ease;
  }
  .nav-item:hover{color:var(--ink);}
  .nav-item:hover svg{transform:scale(1.12) rotate(-5deg);}
  .nav-item:active{transform:scale(.97);}
  .nav-item.active{color:var(--ink);font-weight:600;background:var(--accent-soft);}
  .nav-item.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);}
  .nav-item.active::before{
    content:'';position:absolute;left:-6px;top:50%;width:4px;height:20px;border-radius:0 4px 4px 0;
    background:var(--accent);transform:translateY(-50%);
    animation:navBar .45s var(--ease-spring) both;
  }
  @keyframes navBar{ from{transform:translateY(-50%) scaleY(.2);opacity:0;} to{transform:translateY(-50%) scaleY(1);opacity:1;} }
  .nav-item:focus-visible,.sidebar .brand:focus-visible,.nav-create:focus-visible,
  .sidebar-profile:focus-visible,.sidebar-signout:focus-visible,.sidebar-signin:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  .nav-create{
    position:relative;overflow:hidden;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;
    height:48px;border-radius:14px;color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:15px;
    background:linear-gradient(135deg,#ff7d59 0%,var(--accent) 55%,#f2431c 100%);
    box-shadow:0 10px 22px -8px rgba(255,90,54,.6), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .25s var(--ease-spring), box-shadow .25s ease;
  }
  .nav-create svg{width:19px;height:19px;stroke:#fff;transition:transform .4s var(--ease-spring);}
  .nav-create::after{
    content:'';position:absolute;inset:0;transform:translateX(-130%);
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);
    transition:transform .7s var(--ease);
  }
  .nav-create:hover{transform:translateY(-2px);box-shadow:0 16px 28px -8px rgba(255,90,54,.65), inset 0 1px 0 rgba(255,255,255,.3);}
  .nav-create:hover svg{transform:rotate(90deg);}
  .nav-create:hover::after{transform:translateX(130%);}
  .nav-create:active{transform:scale(.97);}

  .sidebar-auth{margin-top:auto;}
  .sidebar-user{
    display:flex;align-items:center;gap:4px;padding:8px;border-radius:18px;
    background:#fff;border:1px solid var(--line);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .sidebar-user:hover{border-color:var(--line-strong);box-shadow:0 8px 22px -14px rgba(20,21,26,.25);}
  .sidebar-profile{
    flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:3px 6px 3px 3px;border-radius:12px;
    transition:background .15s ease;
  }
  .sidebar-profile:hover{background:#f7f7f8;}
  .mini-avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:14px;overflow:hidden;
  }
  .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .sidebar-user .mini-avatar{width:38px;height:38px;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent-soft);}
  .sidebar-profile .who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0;}
  .sidebar-profile .who span:first-child{font-family:var(--font-display);font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-profile .who span:last-child{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}
  .sidebar-signout{
    width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;color:var(--grey);
    transition:background .15s ease, color .15s ease, transform .15s var(--ease-spring);
  }
  .sidebar-signout svg{width:17px;height:17px;stroke:currentColor;}
  .sidebar-signout:hover{background:#fdeeed;color:var(--danger);}
  .sidebar-signout:active{transform:scale(.9);}
  .sidebar-signin{
    margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;
    background:var(--ink);color:#fff!important;border-radius:14px;
    font-family:var(--font-display);font-weight:600;font-size:14.5px;
    transition:background .16s ease, transform .2s var(--ease-spring);
  }
  .sidebar-signin:hover{background:#000;transform:translateY(-1px);}
  .sidebar-signin:active{transform:scale(.97);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    .top-avatar{display:none;}
    .sidebar{display:flex;}
  }

  /* ---------- Mobile floating dock ---------- */
  .bottom-nav{
    position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;height:64px;padding:0 6px;
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    border-radius:24px;z-index:30;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border:1px solid rgba(20,21,26,.06);
    box-shadow:0 14px 34px -10px rgba(20,21,26,.22), 0 2px 8px rgba(20,21,26,.05);
    transition:transform .4s var(--ease), opacity .25s ease;
  }
  .bottom-nav.hidden{transform:translateY(calc(100% + 32px));opacity:0;pointer-events:none;}
  .tab{
    position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.005em;
    -webkit-tap-highlight-color:transparent;
    transition:color .2s ease, transform .2s var(--ease-spring);
  }
  .tab-ico{
    width:48px;height:30px;border-radius:99px;display:grid;place-items:center;
    transition:background .25s ease;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;transition:transform .3s var(--ease-spring);}
  .tab:active svg{transform:scale(.82);}
  .tab.active{color:var(--ink);}
  .tab.active .tab-ico{background:var(--accent-soft);}
  .tab.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);animation:tabPop .5s var(--ease-spring);}
  @keyframes tabPop{ 0%{transform:scale(.7);} 100%{transform:scale(1);} }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:18px;}

  .tab-create{overflow:visible;}
  .tab-create .ring{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#ff7d59,var(--accent) 55%,#f2431c);
    transform:translateY(-14px);
    box-shadow:0 0 0 5px #fff, 0 12px 22px -4px rgba(255,90,54,.55), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .3s var(--ease-spring), box-shadow .3s ease;
  }
  .tab-create svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none;transition:transform .35s var(--ease-spring);}
  .tab-create:active .ring{transform:translateY(-12px) scale(.92);}
  .tab-create:active svg{transform:rotate(90deg);}
  .tab-create .tab-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  @media (min-width:900px){ .bottom-nav{display:none;} }

  @keyframes riseIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

  /* ---------- page head ---------- */
  .page-head{
    padding:32px 22px 6px;
  }
  .page-head-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .page-head h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:24px;
    letter-spacing:-0.01em;
  }
  .page-head p{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--grey);
    margin-top:5px;
    max-width:420px;
    line-height:1.5;
  }
  .stat-pills{
    display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
  }
  .stat-pill{
    display:flex;align-items:baseline;gap:5px;
    background:#f7f7f8;border:1px solid var(--line);
    border-radius:99px;padding:7px 13px;
  }
  .stat-pill b{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);}
  .stat-pill span{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}

  /* ---------- segmented tab control with sliding indicator ---------- */
  .circles-tabs{
    position:relative;
    display:flex;
    gap:4px;
    padding:20px 22px 0;
    border-bottom:1px solid var(--line);
  }
  .circles-tabs-track{
    position:relative;
    display:flex;
    gap:4px;
    background:#f2f2f3;
    border-radius:99px;
    padding:4px;
  }
  .tab-indicator{
    position:absolute;
    top:4px;bottom:4px;left:4px;
    width:0;
    background:var(--ink);
    border-radius:99px;
    transition:transform .28s var(--ease-spring), width .28s var(--ease-spring);
    z-index:0;
  }
  .circles-tab-btn{
    position:relative;
    z-index:1;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:99px;
    color:var(--ink-soft);
    transition:color .2s ease;
    white-space:nowrap;
  }
  .circles-tab-btn.active{color:#fff;}

  .circles-panel{display:none;animation:riseIn .35s var(--ease) forwards;}
  .circles-panel.active{display:block;}

  /* ---------- search ---------- */
  .circles-search-row{
    padding:16px 22px 0;
  }
  .circles-search{
    position:relative;
  }
  .circles-search svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;stroke:var(--grey);pointer-events:none;
  }
  .circles-search input{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:99px;
    padding:10px 14px 10px 38px;
    font-family:var(--font-serif);
    font-size:14px;
    outline:none;
    transition:border-color .16s var(--ease);
  }
  .circles-search input:focus{border-color:var(--accent);}

  /* ---------- CIRCLES ---------- */
  .circles-section{
    width:100%;
    max-width:640px;
    margin-top:6px;
  }
  .circles-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 22px 12px;
  }
  .circles-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    color:var(--ink);
  }
  .circles-head p{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--grey);
    margin-top:3px;
    letter-spacing:.01em;
  }
  .circle-new-btn{
    flex-shrink:0;
    display:flex;align-items:center;gap:6px;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:9px 14px;
    border-radius:99px;
    transition:background .15s ease, transform .1s ease;
  }
  .circle-new-btn:hover{background:#000;}
  .circle-new-btn:active{transform:scale(.96);}
  .circle-new-btn svg{width:14px;height:14px;stroke:#fff;}

  .circle-card{
    margin:0 16px 10px;
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    opacity:0;
    animation:riseIn .4s var(--ease) forwards;
    transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .circle-card:hover{
    box-shadow:0 6px 22px rgba(20,21,26,.06);
    border-color:var(--line-strong);
  }

  .circle-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    cursor:pointer;
    position:relative;
  }
  .circle-row::before{
    content:'';
    position:absolute;
    left:0;top:10px;bottom:10px;
    width:3px;
    border-radius:99px;
    background:var(--row-accent, var(--accent));
    opacity:.75;
  }

  .circle-cluster{
    display:flex;
    flex-shrink:0;
    width:52px;
    margin-left:6px;
  }
  .circle-cluster .cluster-avatar{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid var(--white);
    margin-left:-12px;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:11px;
    overflow:hidden;
  }
  .circle-cluster .cluster-avatar:first-child{margin-left:0;}
  .circle-cluster .cluster-avatar img{width:100%;height:100%;object-fit:cover;}
  .circle-cluster .cluster-more{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--white);margin-left:-12px;
    background:#f2f2f3;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:9.5px;
  }

  .circle-info{flex:1;min-width:0;}
  .circle-info .circle-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .circle-info .circle-meta{
    display:flex;align-items:center;gap:5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--grey);
    margin-top:2px;
  }
  .circle-info .circle-meta svg{width:11px;height:11px;flex-shrink:0;}
  .owner-chip{
    font-family:var(--font-mono);
    font-size:9px;
    color:#c24020;
    background:var(--accent-soft);
    padding:2px 6px;
    border-radius:6px;
    margin-left:4px;
    letter-spacing:.03em;
  }

  .circle-chevron{
    width:28px;height:28px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s var(--ease-spring), background .15s ease;
    border-radius:50%;
  }
  .circle-chevron:hover{background:#f2f2f3;}
  .circle-chevron svg{width:15px;height:15px;stroke:var(--grey);}
  .circle-row.expanded .circle-chevron{transform:rotate(90deg);}

  .circle-expand{
    overflow:hidden;
    max-height:0;
    transition:max-height .3s var(--ease);
    background:#faf9f8;
    border-top:1px solid transparent;
  }
  .circle-expand.open{max-height:460px;border-top-color:var(--line);}
  .circle-expand-inner{padding:14px 16px 18px;}

  .circle-members-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .circle-member-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--white);
    border:1px solid var(--line-strong);
    border-radius:99px;
    padding:4px 10px 4px 4px;
    transition:border-color .14s var(--ease);
  }
  .circle-member-chip:hover{border-color:var(--accent);}
  .circle-member-chip .mini-avatar{width:22px;height:22px;font-size:9.5px;}
  .circle-member-chip span{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }

  .circle-action-row{display:flex;gap:8px;}
  .circle-open-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:12px;
    transition:opacity .15s ease, transform .1s ease;
    flex:1;
    justify-content:center;
  }
  .circle-open-btn:hover{opacity:.85;}
  .circle-open-btn:active{transform:scale(.97);}
  .circle-open-btn svg{width:14px;height:14px;stroke:#fff;}

  .circle-invite-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--accent-soft);
    color:#c24020;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:12px;
    transition:opacity .15s ease, transform .1s ease;
    flex:1;
    justify-content:center;
  }
  .circle-invite-btn:hover{opacity:.85;}
  .circle-invite-btn:active{transform:scale(.97);}
  .circle-invite-btn:disabled{opacity:.5;cursor:default;}
  .circle-invite-btn svg{width:14px;height:14px;stroke:#c24020;}

  .circle-leave-btn,.circle-delete-btn{
    display:flex;align-items:center;gap:7px;
    background:#fdeceb;
    color:var(--danger);
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:12px;
    transition:opacity .15s ease, transform .1s ease;
    justify-content:center;
    flex-shrink:0;
  }
  .circle-leave-btn:hover,.circle-delete-btn:hover{opacity:.85;}
  .circle-leave-btn:active,.circle-delete-btn:active{transform:scale(.97);}
  .circle-leave-btn:disabled,.circle-delete-btn:disabled{opacity:.5;cursor:default;}

  /* ---------- invite result card, rebuilt with a countdown ring ---------- */
  .circle-invite-result{
    margin-top:12px;
    background:var(--white);
    border:1px dashed var(--line-strong);
    border-radius:16px;
    padding:16px;
    opacity:0;
    animation:riseIn .3s var(--ease) forwards;
  }
  .invite-result-top{
    display:flex;align-items:center;gap:14px;
  }
  .invite-ring-wrap{
    position:relative;
    width:46px;height:46px;
    flex-shrink:0;
  }
  .invite-ring-wrap svg{transform:rotate(-90deg);}
  .invite-ring-bg{fill:none;stroke:var(--line);stroke-width:4;}
  .invite-ring-fg{
    fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;
    transition:stroke-dashoffset 1s linear, stroke .3s ease;
  }
  .invite-ring-label{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:9px;color:var(--ink-soft);
  }
  .circle-invite-code{
    font-family:var(--font-mono);
    font-size:17px;
    font-weight:500;
    letter-spacing:.04em;
    color:var(--ink);
    word-break:break-all;
  }
  .circle-invite-sub{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--grey);
    margin-top:3px;
  }
  .invite-result-actions{
    display:flex;gap:8px;margin-top:12px;
  }
  .invite-result-actions button{
    flex:1;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12px;
    padding:9px;
    border-radius:99px;
    transition:background .15s ease, transform .1s ease;
  }
  .invite-copy-btn{background:var(--ink);color:#fff;}
  .invite-copy-btn:hover{background:#000;}
  .invite-share-btn{background:#f2f2f3;color:var(--ink-soft);}
  .invite-share-btn:hover{background:#e9e9ea;}
  .invite-result-actions button:active{transform:scale(.96);}

  .circles-empty{
    padding:40px 22px 34px;
    text-align:center;
  }
  .circles-empty .empty-rings{
    display:flex;justify-content:center;gap:0;margin-bottom:18px;
  }
  .circles-empty .empty-rings span{
    width:40px;height:40px;border-radius:50%;
    border:2px solid var(--line-strong);
    margin-left:-11px;
    animation:emptyPulse 2.4s var(--ease) infinite;
  }
  .circles-empty .empty-rings span:first-child{margin-left:0;animation-delay:0s;}
  .circles-empty .empty-rings span:nth-child(2){animation-delay:.25s;}
  .circles-empty .empty-rings span:nth-child(3){animation-delay:.5s;}
  @keyframes emptyPulse{
    0%,100%{transform:scale(1);border-color:var(--line-strong);}
    50%{transform:scale(1.08);border-color:var(--accent);}
  }
  .circles-empty h3{
    font-family:var(--font-display);font-weight:600;font-size:15px;
    margin-bottom:6px;
  }
  .circles-empty p{
    font-family:var(--font-serif);
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:280px;
    margin:0 auto 18px;
  }
  .circles-empty .circle-new-btn{margin:0 auto;}

  .circles-no-results{
    padding:34px 22px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--grey);
  }

  .circles-join-row{
    display:flex;gap:8px;
    padding:18px 22px 2px;
    margin-top:6px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .circles-join-row input{
    flex:1;
    border:1px solid var(--line-strong);
    border-radius:99px;
    padding:11px 16px;
    font-family:var(--font-mono);
    font-size:12.5px;
    outline:none;
    transition:border-color .16s var(--ease);
    min-width:0;
  }
  .circles-join-row input:focus{border-color:var(--accent);}
  .circles-join-row button{
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    background:var(--ink);
    color:#fff;
    padding:0 18px;
    border-radius:99px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s ease, transform .1s ease;
  }
  .circles-join-row button:hover:not(:disabled){background:#000;}
  .circles-join-row button:active:not(:disabled){transform:scale(.95);}
  .circles-join-row button:disabled{opacity:.5;cursor:not-allowed;}

  .circles-join-status{
    padding:0 22px;
    font-family:var(--font-mono);
    font-size:10.5px;
    margin-top:6px;
    min-height:14px;
  }
  .circles-join-status.error{color:var(--danger);}
  .circles-join-status.ok{color:#2e8b57;}

  .mini-spinner{
    width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{transform:rotate(360deg);} }

  /* ---------- discover panel ---------- */
  .discover-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
  }
  .discover-row .circle-info{flex:1;min-width:0;}
  .discover-join-btn{
    flex-shrink:0;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12px;
    padding:9px 16px;
    border-radius:99px;
    transition:background .15s ease, transform .1s ease;
    display:flex;align-items:center;gap:6px;
  }
  .discover-join-btn:hover{background:#000;}
  .discover-join-btn:active{transform:scale(.95);}
  .discover-join-btn:disabled{opacity:.55;cursor:default;}
  .discover-join-btn.joined{background:#2e8b57;}

  /* ---------- loading skeleton ---------- */
  .circles-skeleton{padding:16px 16px 0;}
  .skel-card{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;margin-bottom:10px;
    border:1px solid var(--line);border-radius:18px;
  }
  .skel{background:linear-gradient(100deg,#f2f2f3 30%,#fafafa 50%,#f2f2f3 70%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px;}
  @keyframes shimmer{ 0%{background-position:180% 0;} 100%{background-position:-20% 0;} }
  .skel-avatars{display:flex;}
  .skel-avatars .skel{width:34px;height:34px;border-radius:50%;margin-left:-12px;}
  .skel-avatars .skel:first-child{margin-left:0;}
  .skel-lines{flex:1;}
  .skel-line{height:11px;border-radius:6px;margin-bottom:7px;}
  .skel-line.w1{width:40%;}
  .skel-line.w2{width:60%;height:9px;margin-bottom:0;}

  /* ---------- create-circle modal (shared shape with best-friend modal) ---------- */
  .bf-modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,21,26,.55);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .bf-modal-overlay.show{ opacity:1; pointer-events:auto; }
  .bf-modal{
    background:#fff; border-radius:24px; max-width:380px; width:100%;
    padding:32px 26px 26px; text-align:center;
    transform:scale(.9) translateY(10px); transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 30px 60px rgba(0,0,0,.3);
    max-height:90vh;
    overflow-y:auto;
  }
  .bf-modal-overlay.show .bf-modal{ transform:scale(1) translateY(0); }
  .bf-modal-actions{ display:flex; gap:10px; margin-top:22px; }
  .bf-modal-actions button{
    flex:1; padding:13px; border-radius:14px; font-family:var(--font-display); font-weight:600; font-size:14px;
    transition:transform .1s ease, opacity .15s ease;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .bf-modal-actions button:active{ transform:scale(.96); }
  .bf-modal-cancel{ background:#f2f2f3; color:var(--ink-soft); }
  .bf-modal-confirm{
    background:linear-gradient(90deg,#ff5a36,#ff7d52); color:#fff;
    box-shadow:0 6px 16px rgba(255,90,54,.35);
  }
  .bf-modal-confirm:disabled{ opacity:.6; }
  .bf-modal-confirm.danger{
    background:linear-gradient(90deg,var(--danger),#eb5a56); color:#fff;
    box-shadow:0 6px 16px rgba(224,67,63,.35);
  }

  .circle-modal-icon{
    width:64px;height:64px;margin:0 auto 16px;
    border-radius:50%;
    background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s var(--ease-spring);
  }
  .circle-modal-icon.bump{animation:iconBump .4s var(--ease-spring);}
  @keyframes iconBump{ 0%{transform:scale(1);} 40%{transform:scale(1.15) rotate(-4deg);} 100%{transform:scale(1);} }
  .circle-modal-icon svg{width:28px;height:28px;stroke:var(--accent);}

  .bf-modal h3{
    font-family:var(--font-display); font-weight:700; font-size:18px;
    margin-bottom:10px; letter-spacing:-.01em;
  }
  .bf-modal p{
    font-family:var(--font-serif); font-size:14.5px; color:var(--ink-soft);
    line-height:1.5; margin-bottom:6px;
  }

  .circle-form-field{
    text-align:left;
    margin-bottom:14px;
  }
  .circle-form-field label{
    display:flex;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--grey);
    margin-bottom:6px;
    letter-spacing:.02em;
  }
  .circle-form-field input,
  .circle-form-field textarea{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:12px;
    padding:11px 14px;
    font-family:var(--font-serif);
    font-size:14.5px;
    outline:none;
    resize:none;
    transition:border-color .16s var(--ease);
  }
  .circle-form-field input:focus,
  .circle-form-field textarea:focus{border-color:var(--accent);}

  .circle-privacy-toggle{
    display:flex;
    border:1px solid var(--line-strong);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .circle-privacy-toggle button{
    flex:1;
    padding:10px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease;
  }
  .circle-privacy-toggle button + button{border-left:1px solid var(--line-strong);}
  .circle-privacy-toggle button.active{background:var(--ink);color:#fff;}

  .circle-privacy-note{
    text-align:left;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--grey);
    line-height:1.5;
    margin-bottom:14px;
    transition:opacity .15s ease;
  }

  .modal-error{
    color:var(--danger);font-family:var(--font-mono);font-size:11px;margin-top:8px;text-align:left;
  }

  /* ---------- toast ---------- */
  .waater-toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;
    padding:11px 18px;border-radius:99px;box-shadow:0 12px 30px rgba(20,21,26,.25);
    display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;z-index:200;
    transition:opacity .2s ease, transform .2s ease;white-space:nowrap;
    max-width:90vw;
  }
  .waater-toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .waater-toast.show{opacity:1;transform:translate(-50%,0);}
  .waater-toast.error{background:var(--danger);}
  .waater-toast svg{width:15px;height:15px;stroke:#fff;flex-shrink:0;}
  @media (min-width:900px){ .waater-toast{bottom:34px;} }

  .page-loading{
    padding:80px 22px;text-align:center;
    font-family:var(--font-mono);font-size:12px;color:var(--grey);
  }

  /* ---------- my profile popup (opens inside this page) ---------- */
  button.sidebar-profile{border:0;background:none;font:inherit;text-align:left;cursor:pointer;color:inherit;}
  button.tab{background:none;border:0;font:inherit;cursor:pointer;color:inherit;}
  .tab-ico .dock-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;}
  .profile-backdrop{
    position:fixed;inset:0;z-index:300;background:rgba(20,21,26,.45);
    display:flex;align-items:center;justify-content:center;padding:18px;
    opacity:0;transition:opacity .2s ease;
  }
  .profile-backdrop.show{opacity:1;}
  .profile-card{
    width:100%;max-width:360px;background:#fff;border-radius:24px;padding:26px 22px 20px;
    text-align:center;position:relative;
    box-shadow:0 30px 70px -20px rgba(20,21,26,.45);
    transform:translateY(14px) scale(.97);transition:transform .3s var(--ease-spring);
  }
  .profile-backdrop.show .profile-card{transform:none;}
  .profile-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:#f4f4f6;font-size:18px;line-height:1;cursor:pointer;color:var(--ink);}
  .profile-close:hover{background:#eaeaee;}
  .profile-card h3{font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:18px;}
  .profile-avatar-btn{
    position:relative;width:112px;height:112px;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:44px;overflow:hidden;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--accent-soft);
  }
  .profile-avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .profile-avatar-btn .cam{
    position:absolute;left:0;right:0;bottom:0;padding:6px 0;background:rgba(20,21,26,.55);
    font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.02em;
  }
  .profile-avatar-btn.busy{opacity:.6;pointer-events:none;}
  .profile-name{font-family:var(--font-display);font-weight:600;font-size:16px;margin-top:14px;}
  .profile-change{
    margin-top:14px;background:var(--ink);color:#fff;border:0;border-radius:99px;cursor:pointer;
    font-family:var(--font-display);font-weight:600;font-size:13px;padding:10px 18px;
  }
  .profile-change:hover{background:#000;}
  .profile-change:disabled{opacity:.55;cursor:default;}
  .profile-signout{display:block;margin:16px auto 0;background:none;border:0;cursor:pointer;color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:12.5px;}
  .profile-signout:hover{color:var(--danger);}

  /* ---------- mobile top bar: profile circle top-left ---------- */
  .top-avatar{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:20;
    width:40px;height:40px;border-radius:50%;padding:0;overflow:hidden;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent-soft);
    transition:transform .2s var(--ease-spring);
    -webkit-tap-highlight-color:transparent;
  }
  .top-avatar:active{transform:scale(.9);}
  .top-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  /* desktop: profile already lives in the sidebar, so hide the top-left circle (must come AFTER the base rule) */
  @media (min-width:900px){ .top-avatar{display:none;} }
  /* mobile: no top bar, so leave room for the floating profile pic */
  @media (max-width:899.98px){ .main{padding-top:calc(40px + env(safe-area-inset-top));} }

  /* ---------- first-time welcome ---------- */
  .welcome{position:relative;max-width:460px;margin:0 auto;padding:18px 22px 40px;text-align:center;overflow:hidden;}
  .welcome > *{animation:welcomeIn .8s var(--ease) both;}
  .welcome > *:nth-child(3){animation-delay:.05s;}
  .welcome > *:nth-child(4){animation-delay:.12s;}
  .welcome > *:nth-child(5){animation-delay:.18s;}
  .welcome > *:nth-child(6){animation-delay:.24s;}
  .welcome > *:nth-child(7){animation-delay:.3s;}
  .welcome > *:nth-child(8){animation-delay:.36s;}
  .welcome > *:nth-child(9){animation-delay:.42s;}
  @keyframes welcomeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  .welcome-glow{
    position:absolute;left:50%;top:-30px;width:520px;height:420px;margin-left:-260px;z-index:-1;
    background:radial-gradient(closest-side, rgba(255,90,54,.16), rgba(255,177,153,.08) 55%, transparent 75%);
    pointer-events:none;animation:none;
  }
  .welcome-orbit{position:relative;width:270px;height:270px;margin:6px auto 8px;}
  .orbit-ring{
    position:absolute;inset:26px;border-radius:50%;border:1.5px dashed var(--line-strong);
    animation:orbitSpin 70s linear infinite;
  }
  .orbit-ring.inner{inset:70px;border-style:solid;border-color:rgba(255,90,54,.18);animation:none;}
  @keyframes orbitSpin{to{transform:rotate(360deg);}}
  .orbit-me{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;}
  .orbit-halo{
    position:absolute;inset:-14px;border-radius:50%;background:rgba(255,90,54,.14);
    animation:orbitHalo 3.2s var(--ease) infinite;
  }
  @keyframes orbitHalo{0%,100%{transform:scale(.92);opacity:.9;}50%{transform:scale(1.12);opacity:.35;}}
  .orbit-face{
    position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:32px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px #fff, 0 14px 30px -10px rgba(255,90,54,.55);
  }
  .orbit-face img{width:100%;height:100%;object-fit:cover;display:block;}
  .seat{
    position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    transform:rotate(var(--a)) translateX(104px) rotate(calc(-1 * var(--a)));
  }
  .seat i{
    display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
    font-style:normal;animation:seatFloat 5s ease-in-out infinite;animation-delay:var(--d);
  }
  .seat i.face{
    background:linear-gradient(135deg,var(--c1),var(--c2));
    border:3px solid #fff;box-shadow:0 10px 20px -8px var(--c2);
  }
  .seat i.plus{
    border:1.5px dashed var(--accent-2);background:#fff;color:var(--accent);
    font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1;
  }
  @keyframes seatFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}

  .welcome-kicker{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-top:10px;
  }
  .welcome-title{
    font-family:var(--font-display);font-weight:700;font-size:35px;line-height:1.04;letter-spacing:-.035em;
    margin-top:12px;color:var(--ink);
  }
  .welcome-title em{font-style:normal;color:var(--accent);}
  .welcome-sub{
    font-family:var(--font-serif);font-size:16.5px;line-height:1.55;color:var(--ink-soft);
    max-width:340px;margin:14px auto 0;
  }
  .welcome-cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:330px;height:56px;margin:26px auto 0;border-radius:99px;
    background:var(--ink);color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.005em;
    box-shadow:0 20px 34px -14px rgba(20,21,26,.55), inset 0 1px 0 rgba(255,255,255,.14);
    transition:transform .25s var(--ease-spring), box-shadow .25s ease, background .15s ease;
  }
  .welcome-cta svg{width:19px;height:19px;transition:transform .3s var(--ease-spring);}
  .welcome-cta:hover{background:#000;transform:translateY(-2px);box-shadow:0 26px 40px -16px rgba(20,21,26,.6), inset 0 1px 0 rgba(255,255,255,.14);}
  .welcome-cta:hover svg{transform:translateX(4px);}
  .welcome-cta:active{transform:scale(.97);}
  .welcome-fine{font-family:var(--font-mono);font-size:11px;color:var(--grey);margin-top:12px;}

  .welcome-steps{
    list-style:none;text-align:left;margin:30px auto 0;max-width:360px;
    background:#fafafa;border:1px solid var(--line);border-radius:20px;padding:6px 16px;
  }
  .welcome-steps li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;}
  .welcome-steps li + li{border-top:1px solid var(--line);}
  .welcome-steps .n{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    font-family:var(--font-display);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .welcome-steps b{display:block;font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--ink);}
  .welcome-steps span:not(.n){display:block;font-family:var(--font-serif);font-size:14px;line-height:1.45;color:var(--ink-soft);margin-top:2px;}

  .welcome-join{max-width:360px;margin:26px auto 0;text-align:left;}
  .welcome-join-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:8px;}
  .welcome-join .circles-join-row{border-top:0;padding:0;margin:0;}

  /* the Invite button glows once, right after your first circle exists */
  .circle-invite-btn.nudge{animation:invitePulse 1.5s ease-in-out infinite;}
  /* ---------- activity: someone posted while you were away ---------- */
  .away-card{
    display:flex;align-items:center;gap:14px;margin:18px 0 4px;padding:14px 16px;border-radius:20px;
    background:linear-gradient(135deg,#fff3ee,#fff 70%);border:1px solid rgba(255,90,54,.28);
    box-shadow:0 14px 30px -18px rgba(255,90,54,.55);animation:riseIn .5s var(--ease) both;
    transition:transform .2s var(--ease-spring), box-shadow .2s ease;
  }
  .away-card:hover{transform:translateY(-2px);box-shadow:0 18px 34px -16px rgba(255,90,54,.6);}
  .away-card:active{transform:scale(.98);}
  .away-pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:awayPulse 1.8s ease-out infinite;}
  @keyframes awayPulse{0%{box-shadow:0 0 0 0 rgba(255,90,54,.55);}100%{box-shadow:0 0 0 14px rgba(255,90,54,0);}}
  .away-text{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;}
  .away-text b{font-family:var(--font-display);font-size:15px;font-weight:700;}
  .away-text span{font-size:14px;color:var(--ink-soft);}
  .away-go{display:flex;align-items:center;gap:6px;flex-shrink:0;font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--accent);}
  .away-go svg{width:15px;height:15px;transition:transform .25s var(--ease-spring);}
  .away-card:hover .away-go svg{transform:translateX(3px);}
  @media (max-width:520px){ .away-go{display:none;} }
  .new-badge{
    min-width:24px;height:24px;padding:0 7px;border-radius:99px;display:grid;place-items:center;flex-shrink:0;
    background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:700;font-size:12px;
    box-shadow:0 6px 14px -4px rgba(255,90,54,.6);animation:tabPop .5s var(--ease-spring);
  }
  .circle-card.has-new{box-shadow:0 0 0 1.5px rgba(255,90,54,.35), 0 12px 28px -18px rgba(255,90,54,.55);}
  .circle-meta .new-line{color:var(--accent);font-weight:600;}
  .circle-card.celebrate{animation:celebrate 1.4s var(--ease) both;}
  @keyframes celebrate{
    0%{box-shadow:0 0 0 0 rgba(255,90,54,.6);transform:scale(.97);}
    35%{transform:scale(1.015);}
    100%{box-shadow:0 0 0 26px rgba(255,90,54,0);transform:scale(1);}
  }
  @keyframes invitePulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,90,54,.45);}
    50%{box-shadow:0 0 0 8px rgba(255,90,54,0);}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a href="index.html" class="wordmark brand" aria-label="Waater home">waater<span class="dot">.</span></a>


    <div id="sidebarAuthArea" class="sidebar-auth"></div>
  </aside>

  <main class="main">
    <button type="button" class="top-avatar" id="topProfileBtn" aria-label="My profile"><span id="topAvatarInner"></span></button>

    <div id="pageBody">
      <div class="page-loading" id="pageLoading">Loading circles…</div>
    </div>
  </main>
</div>

<div class="waater-toast" id="waaterToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="waaterToastText"></span>
</div>

<script>
const SITE = 'https://YOUR-DOMAIN.com'; // TODO: your real website domain (used for invite/share links)

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
  function initials(name) {
    return (name || '?').trim().slice(0, 1).toUpperCase();
  }

  // ============================================================
  // SUPABASE CONFIG — same project as the rest of the app.
  // ============================================================
  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUsername = null;

  function requireAuth(nextPath) {
    if (currentUser) return true;
    window.location.href = `auth.html?next=${encodeURIComponent(nextPath || "circles.html")}`;
    return false;
  }

  // ---- toast ----
  let toastTimer = null;
  function showToast(text, type){
    const toast = document.getElementById('waaterToast');
    document.getElementById('waaterToastText').textContent = text;
    toast.classList.remove('error');
    if (type === 'error') toast.classList.add('error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ---- sidebar auth widget (shared look with the rest of the app) ----
  async function renderSidebar() {
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');

    if (!currentUser) {
      area.innerHTML = `<a href="auth.html" class="sidebar-signin">Sign in</a>`;
      return;
    }

    const { data: me } = await supabaseClient
      .from('profiles')
      .select('username, avatar_url')
      .eq('id', currentUser.id)
      .maybeSingle();

    currentUsername = me?.username || currentUser.email || 'You';
    const avatarHtml = me?.avatar_url
      ? `<img src="${escapeHtml(me.avatar_url)}" alt="">`
      : initials(currentUsername);

    area.innerHTML = `
      <div class="sidebar-user">
        <button type="button" class="sidebar-profile" id="openProfileBtn">
          <div class="mini-avatar">${avatarHtml}</div>
          <div class="who"><span>${escapeHtml(currentUsername)}</span><span>your profile</span></div>
        </button>
        <button class="sidebar-signout" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  }

  const CIRCLE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>`;

  // a small deterministic palette so each circle card gets a consistent
  // accent stripe/color, based on a hash of its id — purely cosmetic
  const ROW_ACCENTS = ['#ff5a36', '#7fb8ff', '#a3e88f', '#c79dff', '#ffb199', '#5fd3c4'];
  function accentForId(id){
    let hash = 0;
    const str = String(id || '');
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return ROW_ACCENTS[hash % ROW_ACCENTS.length];
  }

  // build the URL for a circle's own page — matches what circle.html expects
  function circleHref(circle){

    return `circle.html?private&ID=${encodeURIComponent(circle.id)}`;

  }

  // ============================================================
  // ACTIVITY — "someone posted while you were away"
  // >>> Match these names to the posts table circle.html writes to. <<<
  // ============================================================
  const CIRCLE_POSTS = { table:'circle_posts', circleCol:'circle_id', authorCol:'user_id', timeCol:'created_at' };
  const seenKey = id => `waater:circleSeen:${currentUser ? currentUser.id : ''}:${id}`;
  function markCircleSeen(id){ try{ localStorage.setItem(seenKey(id), new Date().toISOString()); }catch(e){} }
  function timeAgo(iso){
    const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 60000));
    if (m < 60) return m + 'm ago';
    if (m < 1440) return Math.round(m / 60) + 'h ago';
    return Math.round(m / 1440) + 'd ago';
  }
  function whoPosted(c, max){
    const names = (c.latestAuthors || []).map(id => (c.memberProfiles || []).find(p => p.id === id)?.username).filter(Boolean);
    if (!names.length) return 'Someone';
    if (names.length <= max) return names.join(' & ');
    return names.slice(0, max).join(', ') + ' & ' + (names.length - max) + ' more';
  }
  async function attachActivity(circles){
    circles.forEach(c => { c.unread = 0; });
    try {
      const baseOf = c => {
        let seen = 0; try { seen = Date.parse(localStorage.getItem(seenKey(c.id))) || 0; } catch(e){}
        return Math.max(seen, Date.parse(c.joined_at) || Date.parse(c.created_at) || 0);
      };
      const P = CIRCLE_POSTS;
      const earliest = Math.min(...circles.map(baseOf));
      const { data, error } = await supabaseClient.from(P.table)
        .select(`${P.circleCol}, ${P.authorCol}, ${P.timeCol}`)
        .in(P.circleCol, circles.map(c => c.id))
        .neq(P.authorCol, currentUser.id)
        .gt(P.timeCol, new Date(earliest).toISOString())
        .order(P.timeCol, { ascending: false }).limit(500);
      if (error || !data) return;
      circles.forEach(c => {
        const b = baseOf(c);
        const fresh = data.filter(p => p[P.circleCol] === c.id && Date.parse(p[P.timeCol]) > b);
        if (!fresh.length) return;
        c.unread = fresh.length;
        c.latestAt = fresh[0][P.timeCol];
        c.latestAuthors = [...new Set(fresh.map(p => p[P.authorCol]))];
      });
    } catch(e) { /* no posts table yet: page just shows no badges */ }
  }
  function renderAwayCard(circles){
    const live = circles.filter(c => c.unread > 0);
    if (!live.length) return '';
    const top = live.slice().sort((a, b) => b.unread - a.unread)[0];
    const total = live.reduce((n, c) => n + c.unread, 0);
    const who = live.length === 1 ? whoPosted(top, 2) : whoPosted(top, 1) + (live.length > 1 ? ' and others' : '');
    return `
      <a class="away-card" href="${circleHref(top)}" data-seen-circle="${top.id}">
        <span class="away-pulse" aria-hidden="true"></span>
        <div class="away-text">
          <b>While you were away</b>
          <span>${escapeHtml(who)} posted ${total === 1 ? 'something' : total + ' times'} in ${live.length === 1 ? escapeHtml(top.name) : live.length + ' circles'}.</span>
        </div>
        <span class="away-go">See what you missed
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>`;
  }
  // opening a circle clears its badge
  document.addEventListener('click', e => {
    const a = e.target.closest('.circle-open-btn, .away-card');
    if (!a) return;
    const id = a.dataset.seenCircle || a.closest('.circle-card')?.querySelector('.circle-row')?.dataset.circleId;
    if (id) markCircleSeen(id);
  }, true);

  // cache of the last loaded lists so the search box can filter instantly
  // without a refetch
  let lastMyCircles = [];

  const PRIVATE_CIRCLE_LIMIT = 4;

  function countPrivateCircles(circles) {

    return circles.filter(c => c.is_private).length;

  }

  // turn the raw Postgres trigger error into something readable in the UI

  function friendlyCircleError(err) {

    const msg = err?.message || '';

    if (msg.includes('PRIVATE_CIRCLE_LIMIT')) {

      return `You're already in ${PRIVATE_CIRCLE_LIMIT} private circles — leave one first to join or create another.`;

    }

    return msg || 'Something went wrong';

  }



  // ---- load the circles the current user belongs to, with member previews ----
  async function loadMyCircles(userId) {
    const { data: memberships } = await supabaseClient
      .from('circle_members')
      .select('circle_id, role, joined_at, circles!inner(id, name, is_private, created_at)')
      .eq('user_id', userId)
      .eq('circles.is_private', true)
      .order('joined_at', { ascending: false });

    const list = (memberships || []).filter(m => m.circles);
    if (list.length === 0) return [];

    const circleIds = list.map(m => m.circle_id);

    const { data: allMembers } = await supabaseClient
      .from('circle_members')
      .select('circle_id, user_id')
      .in('circle_id', circleIds);

    const userIds = [...new Set((allMembers || []).map(m => m.user_id))];
    const { data: memberProfiles } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', userIds.length > 0 ? userIds : ['00000000-0000-0000-0000-000000000000']);

    const profileById = {};
    (memberProfiles || []).forEach(p => { profileById[p.id] = p; });

    return list.map(m => {
      const members = (allMembers || []).filter(x => x.circle_id === m.circle_id);
      const memberProfilesForCircle = members.map(x => profileById[x.user_id]).filter(Boolean);
      return {
        ...m.circles,
        joined_at: m.joined_at,
        myRole: m.role,
        memberCount: members.length,
        memberProfiles: memberProfilesForCircle,
      };
    });
  }

  function circleMetaIcon(isPrivate) {
    return isPrivate
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/></svg>`;
  }

  function renderCircleCluster(members) {
    const shown = members.slice(0, 3);
    const extra = members.length - shown.length;
    const avatars = shown.map(m => {
      const name = m.username || '?';
      const html = m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(name);
      return `<div class="cluster-avatar">${html}</div>`;
    }).join('');
    const moreHtml = extra > 0 ? `<div class="cluster-more">+${extra}</div>` : '';
    return `<div class="circle-cluster">${avatars}${moreHtml}</div>`;
  }

  function renderCircleRow(circle) {
    const clusterHtml = renderCircleCluster(circle.memberProfiles || []);
    const accent = accentForId(circle.id);
    return `
      <div class="circle-card${circle.unread ? ' has-new' : ''}" style="--row-accent:${accent};">
        <div class="circle-row" data-circle-id="${circle.id}" data-private="${circle.is_private ? '1' : '0'}">
          ${clusterHtml}
          <div class="circle-info">
            <div class="circle-name">${escapeHtml(circle.name)}${circle.myRole === 'owner' ? '<span class="owner-chip">owner</span>' : ''}</div>
            <div class="circle-meta">
              ${circleMetaIcon(circle.is_private)}
              ${circle.unread
                ? `<span class="new-line">${escapeHtml(whoPosted(circle, 2))} posted · ${timeAgo(circle.latestAt)}</span>`
                : `<span>${circle.is_private ? 'private' : 'public'} · ${circle.memberCount} ${circle.memberCount === 1 ? 'person' : 'people'}</span>`}
            </div>
          </div>
          ${circle.unread ? `<span class="new-badge" aria-label="${circle.unread} new">${circle.unread > 99 ? '99+' : circle.unread}</span>` : ''}
          <button class="circle-chevron" data-circle-id="${circle.id}" aria-label="Quick actions" title="Quick actions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="circle-expand" id="circle-expand-${circle.id}">
          <div class="circle-expand-inner">
            <div class="circle-members-row">
              ${(circle.memberProfiles || []).map(m => `
                <div class="circle-member-chip">
                  <div class="mini-avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username || '?')}</div>
                  <span>${escapeHtml(m.username || 'someone')}</span>
                </div>
              `).join('')}
            </div>
            <div class="circle-action-row">
              <a class="circle-open-btn" href="${circleHref(circle)}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                Open circle
              </a>
              <button class="circle-invite-btn" data-circle-id="${circle.id}">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
                Invite
              </button>
              ${circle.myRole !== 'owner' ? `
                <button class="circle-leave-btn" data-circle-id="${circle.id}">Leave</button>
              ` : `
                <button class="circle-delete-btn" data-circle-id="${circle.id}" data-circle-name="${escapeHtml(circle.name)}">Delete</button>
              `}
            </div>
            <div class="circle-invite-result" id="circle-invite-result-${circle.id}" style="display:none;"></div>
          </div>
        </div>
      </div>
    `;
  }

  function renderCirclesSkeleton(){
    return `
      <div class="circles-skeleton">
        ${[0,1,2].map(() => `
          <div class="skel-card">
            <div class="skel-avatars">
              <div class="skel"></div><div class="skel"></div><div class="skel"></div>
            </div>
            <div class="skel-lines">
              <div class="skel skel-line w1"></div>
              <div class="skel skel-line w2"></div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function circleMatchesQuery(circle, q){
    if (!q) return true;
    return (circle.name || '').toLowerCase().includes(q);
  }

  function renderCirclesSection(circles, opts = {}) {
    const totalPeople = circles.reduce((sum, c) => sum + (c.memberCount || 0), 0);
    const filtered = circles.filter(c => circleMatchesQuery(c, opts.query));

    let listHtml;
    if (circles.length === 0) {
      listHtml = `
        <div class="circles-empty">
          <div class="empty-rings"><span></span><span></span><span></span></div>
          <h3>No circle yet</h3>
          <p>A circle is a small space — just the people you'd actually want seeing your gossip.</p>
          <button class="circle-new-btn" id="circleNewBtnEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            Start your first circle
          </button>
        </div>
      `;
    } else if (filtered.length === 0) {
      listHtml = `<div class="circles-no-results">No circles match "${escapeHtml(opts.query)}".</div>`;
    } else {
      listHtml = filtered.map(renderCircleRow).join('');
    }

    return `
      <div class="circles-section">
        <div class="circles-head">
          <div>
            <h2>Your circles</h2>
            <p>${circles.length} ${circles.length === 1 ? 'circle' : 'circles'} · ${totalPeople} ${totalPeople === 1 ? 'person' : 'people'} total</p>
          </div>
          ${circles.length > 0 ? `
            <button class="circle-new-btn" id="circleNewBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
              New
            </button>
          ` : ''}
        </div>
        ${circles.length > 3 ? `
        <div class="circles-search-row" style="padding-bottom:12px;">
          <div class="circles-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="circleSearchInput" placeholder="Search your circles..." value="${escapeHtml(opts.query || '')}">
          </div>
        </div>
        ` : ''}
        ${listHtml}
        <div class="circles-join-row">
          <input type="text" id="circleJoinInput" placeholder="Have an invite code or link?" maxlength="300">
          <button id="circleJoinBtn">Join</button>
        </div>
        <div class="circles-join-status" id="circleJoinStatus"></div>
      </div>
    `;
  }

  // ---- extract a bare invite code whether the user pasted a raw code
  // or a full invite link (e.g. https://app.com/circle/join?code=XXXX)
  function extractInviteCode(raw) {
    const trimmed = (raw || '').trim();
    if (!trimmed) return '';
    if (trimmed.includes('://') || trimmed.startsWith('/')) {
      try {
        const url = new URL(trimmed.includes('://') ? trimmed : window.location.origin + trimmed);
        const codeParam = url.searchParams.get('code');
        if (codeParam) return codeParam.trim();
      } catch (e) {
        // not a parseable URL — fall through and treat it as a raw code
      }
    }
    return trimmed;
  }

  // ---- wire clicks/expand/invite/leave/join for "Your circles" ----
  function wireYourCirclesUI() {
    // tapping the row itself opens the circle — matches circle.html's
    // /circle?private|public&ID=... URL shape
    document.querySelectorAll('.circle-row').forEach(row => {

      row.addEventListener('click', () => {
        const id = row.dataset.circleId;
        window.location.href = `circle.html?private&ID=${encodeURIComponent(id)}`;
      });
    });

    // the chevron is a dedicated button for quick actions (members,
    // invite, leave) without leaving the circles list — it must stop
    // the click from bubbling up to the row's "open circle" handler
    document.querySelectorAll('.circle-chevron').forEach(chev => {
      chev.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = chev.dataset.circleId;
        const row = chev.closest('.circle-row');
        const expand = document.getElementById(`circle-expand-${id}`);
        const isOpen = expand.classList.contains('open');
        document.querySelectorAll('.circle-expand.open').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.circle-row.expanded').forEach(el => el.classList.remove('expanded'));
        if (!isOpen) {
          expand.classList.add('open');
          row.classList.add('expanded');
        }
      });
    });

    document.querySelectorAll('.circle-invite-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (btn.disabled) return; // guard against double-tap firing two invites
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<span class="mini-spinner" style="border-color:rgba(194,64,32,.35);border-top-color:#c24020;"></span> Creating…`;
        const circleId = btn.dataset.circleId;
        const resultEl = document.getElementById(`circle-invite-result-${circleId}`);
        try {
          const { data, error } = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
          if (error) throw error;
          showInviteResult(resultEl, data, circleId);
        } catch (err) {
          showToast(err.message || 'Could not create invite', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
    });

    document.querySelectorAll('.circle-leave-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (btn.disabled) return;
        btn.disabled = true;
        const circleId = btn.dataset.circleId;
        try {
          const { error } = await supabaseClient
            .from('circle_members')
            .delete()
            .eq('circle_id', circleId)
            .eq('user_id', currentUser.id);
          if (error) throw error;
          showToast('You left the circle');
          renderPage();
        } catch (err) {
          console.error('Leave circle failed:', err);
          showToast(err.message || 'Could not leave circle', 'error');
          btn.disabled = false;
        }
      });
    });

      });

    let isJoiningByCode = false;
    const joinBtn = document.getElementById('circleJoinBtn');
    const joinInput = document.getElementById('circleJoinInput');
    const joinStatus = document.getElementById('circleJoinStatus');

    if (joinBtn) {
      const submitJoin = async () => {
        if (!requireAuth()) return;
        if (isJoiningByCode) return;

        // accept either a bare invite code or a full invite link pasted in
        const code = extractInviteCode(joinInput.value);
        if (!code) return;

        isJoiningByCode = true;
        joinBtn.disabled = true;
        joinBtn.innerHTML = `<span class="mini-spinner"></span>`;
        joinStatus.className = 'circles-join-status';
        joinStatus.textContent = '';

        try {
          const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: code });
          if (error) throw error;
          joinStatus.className = 'circles-join-status ok';
          joinStatus.textContent = `You're in ${data?.name || 'the circle'} now.`;
          showToast(`Joined ${data?.name || 'the circle'}`);
          joinInput.value = '';
          renderPage();

          } catch (err) {
    joinStatus.className = 'circles-join-status error';
    joinStatus.textContent = friendlyCircleError(err);

  } finally {



          isJoiningByCode = false;
          joinBtn.disabled = false;
          joinBtn.textContent = 'Join';
        }

      };
      
      joinBtn.addEventListener('click', submitJoin);
      joinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitJoin(); } });
      // handle paste explicitly too, so a pasted link is normalized
      // immediately rather than waiting for the user to hit Join
      joinInput.addEventListener('paste', (e) => {
        const pasted = (e.clipboardData || window.clipboardData)?.getData('text');
        if (!pasted) return;
        const extracted = extractInviteCode(pasted);
        if (extracted && extracted !== pasted.trim()) {
          e.preventDefault();
          joinInput.value = extracted;
        }
      });
    }
  }

  function showInviteResult(resultEl, invite, circleId) {
    resultEl.style.display = 'block';
    const link = `${SITE}/circle?code=${encodeURIComponent(invite.code)}`; // opens the no-sign-in preview first
    const RADIUS = 20;
    const CIRC = 2 * Math.PI * RADIUS;

    resultEl.innerHTML = `
      <div class="invite-result-top">
        <div class="invite-ring-wrap">
          <svg width="46" height="46" viewBox="0 0 46 46">
            <circle class="invite-ring-bg" cx="23" cy="23" r="${RADIUS}"></circle>
            <circle class="invite-ring-fg" id="invite-ring-${invite.id}" cx="23" cy="23" r="${RADIUS}"
              stroke-dasharray="${CIRC}" stroke-dashoffset="0"></circle>
          </svg>
          <div class="invite-ring-label" id="invite-ring-label-${invite.id}">10:00</div>
        </div>
        <div>
          <div class="circle-invite-code">${escapeHtml(invite.code)}</div>

        <button class="invite-share-btn" id="invite-share-${invite.id}">Share…</button>
      </div>
    `;

    const copyBtn = resultEl.querySelector(`#invite-copy-${invite.id}`);
    copyBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(link);
        copyBtn.textContent = 'Copied ✓';
        showToast('Invite link copied');
        setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1800);
      } catch (err) {
        showToast('Could not copy — copy it manually: ' + link, 'error');
      }
    });

    const shareBtn = resultEl.querySelector(`#invite-share-${invite.id}`);
    shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Join my circle on Waater', text: 'Come join my circle on Waater', url: link });
        } catch (err) { /* user cancelled — fine */ }
      } else {
        try {
          await navigator.clipboard.writeText(link);
          showToast('Invite link copied');
        } catch (err) {
          showToast('Could not share — copy it manually: ' + link, 'error');
        }
      }
    });

    const ringEl = resultEl.querySelector(`#invite-ring-${invite.id}`);
    const labelEl = resultEl.querySelector(`#invite-ring-label-${invite.id}`);
    const expiresAt = new Date(invite.expires_at).getTime();
    const totalMs = Math.max(1, expiresAt - Date.now());

    const tick = () => {
      const msLeft = expiresAt - Date.now();
      if (msLeft <= 0) {
        labelEl.textContent = 'done';
        ringEl.style.strokeDashoffset = CIRC;
        ringEl.style.stroke = 'var(--grey)';
        clearInterval(interval);
        return;
      }
      const fraction = msLeft / totalMs;
      ringEl.style.strokeDashoffset = String(CIRC * (1 - fraction));
      const m = Math.floor(msLeft / 60000);
      const s = Math.floor((msLeft % 60000) / 1000);
      labelEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
      if (msLeft < 60000) ringEl.style.stroke = 'var(--danger)';
    };
    tick();
    const interval = setInterval(tick, 1000);
  }

  // crop to a centered square, shrink to 512px, save as jpeg
  function fileToAvatarBlob(file){
    return new Promise((resolve, reject) => {
      const objUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const size = 512;
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        const cv = document.createElement('canvas');
        cv.width = cv.height = size;
        cv.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
        URL.revokeObjectURL(objUrl);
        cv.toBlob(b => b ? resolve(b) : reject(new Error('Could not process that image')), 'image/jpeg', 0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error('Could not read that image')); };
      img.src = objUrl;
    });
  }

  async function openProfile(){
    if (!currentUser){ requireAuth('index.html'); return; }

    const { data: me } = await supabaseClient.from('profiles')
      .select('username, avatar_url').eq('id', currentUser.id).maybeSingle();

      document.removeEventListener('keydown', onKey);

      setTimeout(() => { overlay.remove(); profileOverlay = null; }, 200);
    }
    document.addEventListener('keydown', onKey);

    const fileInput = overlay.querySelector('#profileFile');

    const changeBtn = overlay.querySelector('#profileChangeBtn');
    avatarBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')){ showToast('Pick an image file', 'error'); return; }

      avatarBtn.classList.add('busy');
      changeBtn.disabled = true;
      changeBtn.textContent = 'Uploading…';
      let uploadedPath = null;
      try {
        const blob = await fileToAvatarBlob(file);
        uploadedPath = `${currentUser.id}/avatar-${Date.now()}.jpg`;
        const { error: upErr } = await supabaseClient.storage.from(AVATAR_BUCKET)
          .upload(uploadedPath, blob, { contentType: 'image/jpeg', cacheControl: '3600' });
        if (upErr) throw upErr;

        const newUrl = supabaseClient.storage.from(AVATAR_BUCKET).getPublicUrl(uploadedPath).data.publicUrl;
        const { data: saved, error: dbErr } = await supabaseClient.from('profiles')
          .update({ avatar_url: newUrl }).eq('id', currentUser.id).select('id');
        if (dbErr) throw dbErr;
        if (!saved || !saved.length) throw new Error('Could not save your picture');

        // tidy up the previous photo (only ever our own folder)
        const marker = `/${AVATAR_BUCKET}/`;
        if (avatarUrl && avatarUrl.includes(marker)){
          const oldPath = decodeURIComponent(avatarUrl.split(marker)[1].split('?')[0]);
          if (oldPath.startsWith(currentUser.id + '/')) supabaseClient.storage.from(AVATAR_BUCKET).remove([oldPath]);
        }
        avatarUrl = newUrl;
        overlay.querySelector('#profileAvatarInner').innerHTML = `<img src="${escapeHtml(newUrl)}" alt="">`;
        paintAvatars(newUrl);
        showToast('Profile picture updated');
      } catch (err) {
        if (uploadedPath) supabaseClient.storage.from(AVATAR_BUCKET).remove([uploadedPath]); // no orphan file
        showToast(err?.message || 'Could not update your picture', 'error');
      } finally {
        avatarBtn.classList.remove('busy');
        changeBtn.disabled = false;
        changeBtn.textContent = 'Change profile picture';
      }
    });

    overlay.querySelector('#profileSignOut').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  }

  function paintAvatarsFromSidebar(){
    const img = document.querySelector('.sidebar-profile .mini-avatar img');
    paintAvatars(img ? img.getAttribute('src') : '');
  }

  async function init() {
    await renderSidebar();
    paintAvatarsFromSidebar();
    if (currentUser && new URLSearchParams(location.search).has('profile')){
      history.replaceState(null, '', location.pathname);
      openProfile();
    }
    await renderPage();
  }

  init();
</script>

<script>
// Navigation behaviour: active link, sliding hover pill, topbar shadow, dock polish
(function(){
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
  var first = '/' + (path.split('/')[1] || '');
  var keyMap = {'/':'circles','/circles':'circles','/circle':'circles'};
  var key = keyMap[path] || keyMap[first];
  if (key){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      var on = el.getAttribute('data-nav') === key && !el.classList.contains('nav-create') && !el.classList.contains('tab-create');
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
  }

  // sliding hover pill (desktop)
  var list = document.querySelector('.nav-list');
  var pill = document.querySelector('.nav-pill');
  if (list && pill){
    var move = function(el){
      var y = el.getBoundingClientRect().top - list.getBoundingClientRect().top;
      pill.style.height = el.offsetHeight + 'px';
      if (!pill.classList.contains('on')){
        pill.classList.add('snap');
        pill.style.transform = 'translateY(' + y + 'px)';
        void pill.offsetWidth;
        pill.classList.remove('snap');
        pill.classList.add('on');
      } else {
        pill.style.transform = 'translateY(' + y + 'px)';
      }
    };
    list.querySelectorAll('.nav-item').forEach(function(a){
      a.addEventListener('mouseenter', function(){ move(a); });
      a.addEventListener('focus', function(){ if (a.matches(':focus-visible')) move(a); });
    });
    list.addEventListener('mouseleave', function(){ pill.classList.remove('on'); });
    list.addEventListener('focusout', function(){ pill.classList.remove('on'); });
  }

  // dock: light haptic tap, and tuck away while typing so the keyboard has room
  var dock = document.querySelector('.bottom-nav');
  if (dock){
    dock.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ if (navigator.vibrate) navigator.vibrate(8); });
    });
    var FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]';
    var isField = function(el){ return el && el.matches && el.matches(FIELD); };
    document.addEventListener('focusin', function(e){
      if (isField(e.target) && window.matchMedia('(max-width:899.98px)').matches) dock.classList.add('hidden');
    });
    document.addEventListener('focusout', function(){
      setTimeout(function(){ if (!isField(document.activeElement)) dock.classList.remove('hidden'); }, 60);
    });
  }
})();
</script>
