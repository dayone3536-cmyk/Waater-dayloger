<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --white:#ffffff;--ink:#14151a;--ink-soft:#4a4d55;--grey:#8a8d94;
    --line:#ececec;--accent:#ff5a36;--accent-soft:#fff1ec;
    --bubble-theirs:#f2f2f3;
    --nav-w:230px;--list-w:360px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--white);color:var(--ink);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  input{font-family:inherit;}

  .app{display:flex;max-width:1200px;margin:0 auto;height:100vh;}

  /* ---------- sidebar (unchanged app nav, simplified) ---------- */
  .sidebar{display:none;width:var(--nav-w);flex-shrink:0;padding:28px 16px;flex-direction:column;height:100vh;border-right:1px solid var(--line);}
  .sidebar .wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;padding:0 8px;margin-bottom:32px;}
  .sidebar .wordmark .dot{color:var(--accent);}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:12px;font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--ink-soft);}
  .nav-item svg{width:21px;height:21px;flex-shrink:0;}
  .nav-item:hover{background:#f7f7f8;color:var(--ink);}
  .nav-item.active{color:var(--ink);}
  .nav-item.active svg{stroke:var(--accent);}
  .sidebar-signin,.sidebar-profile{margin-top:auto;}
  .sidebar-signin{display:block;text-align:center;background:var(--ink);color:#fff!important;font-family:var(--font-display);font-weight:600;font-size:13px;padding:11px;border-radius:12px;}
  .sidebar-profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffb199,var(--accent));flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:13px;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .sidebar-profile .who{font-family:var(--font-display);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-signout{font-family:var(--font-mono);font-size:10px;color:var(--grey);padding:6px 10px;text-align:left;}
  @media (min-width:900px){ .sidebar{display:flex;} }

  /* ---------- inbox list ---------- */
  .list-pane{width:100%;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;background:var(--white);}
  @media (min-width:700px){ .list-pane{width:var(--list-w);flex-shrink:0;} }

  .list-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .list-head h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin-bottom:12px;}
  .search-box{position:relative;}
  .search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--grey);}
  .search-box input{width:100%;border:none;border-radius:99px;padding:9px 14px 9px 34px;font-size:13.5px;font-family:var(--font-serif);outline:none;background:#f2f2f3;}
  .search-box input:focus{background:#ebebeb;}

  .conv-list{flex:1;overflow-y:auto;padding:6px 8px;}
  .conv-row{display:flex;align-items:center;gap:12px;padding:9px 10px;cursor:pointer;border-radius:14px;}
  .conv-row:hover{background:#f7f7f8;}
  .conv-row.active{background:var(--accent-soft);}
  .conv-row .avatar{width:50px;height:50px;font-size:17px;}
  .conv-row .meta{flex:1;min-width:0;}
  .conv-row .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .conv-row .name{font-family:var(--font-display);font-weight:600;font-size:14.5px;}
  .conv-row .time{font-family:var(--font-mono);font-size:10px;color:var(--grey);flex-shrink:0;}
  .conv-row .preview{font-family:var(--font-serif);font-size:13px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}

  .empty-note{padding:50px 24px;text-align:center;font-family:var(--font-mono);font-size:11.5px;color:var(--grey);line-height:1.6;}
  .empty-note .big{font-family:var(--font-display);font-size:14px;color:var(--ink);font-weight:600;margin-bottom:6px;display:block;}

  /* ---------- thread ---------- */
  .thread-pane{flex:1;display:none;flex-direction:column;height:100vh;min-width:0;}
  .thread-pane.show{display:flex;}
  @media (min-width:700px){ .thread-pane{display:flex;} }

  .thread-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .thread-back{display:flex;padding:2px;}
  @media (min-width:700px){ .thread-back{display:none;} }
  .thread-back svg{width:20px;height:20px;stroke:var(--ink);}
  .thread-head .avatar{width:38px;height:38px;font-size:13px;}
  .thread-head .name{font-family:var(--font-display);font-weight:600;font-size:14.5px;}

  .thread-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:2px;}
  .bubble-wrap{display:flex;flex-direction:column;max-width:70%;margin-bottom:6px;}
  .bubble-wrap.mine{align-self:flex-end;align-items:flex-end;}
  .bubble-wrap.theirs{align-self:flex-start;align-items:flex-start;}
  .bubble{padding:10px 14px;border-radius:18px;font-family:var(--font-serif);font-size:14.5px;line-height:1.4;word-wrap:break-word;}
  .bubble.mine{background:var(--ink);color:#fff;border-bottom-right-radius:5px;}
  .bubble.theirs{background:var(--bubble-theirs);color:var(--ink);border-bottom-left-radius:5px;}
  .day-divider{align-self:center;font-family:var(--font-mono);font-size:10px;color:var(--grey);background:#f2f2f3;padding:4px 12px;border-radius:99px;margin:12px 0;}

  .thread-form{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;}
  .thread-form input{flex:1;border:none;border-radius:99px;padding:11px 16px;font-family:var(--font-serif);font-size:14.5px;outline:none;background:#f2f2f3;}
  .thread-form button{width:38px;height:38px;border-radius:50%;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .thread-form button svg{width:16px;height:16px;stroke:#fff;}
  .thread-form button:disabled{opacity:.4;}

  .thread-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:var(--grey);gap:10px;}
  .thread-empty .big{font-family:var(--font-display);font-size:15px;color:var(--ink);font-weight:600;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="wordmark">waater<span class="dot">.</span></div>
    <ul class="nav-list">
      
      <li><a href="/" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a></li>

  
      
      <li><a href="/create" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Create</a></li>
      <li><a href="/messages" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Messages</a></li>
      <li><a href="/profile" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Profile</a></li>
    </ul>
    <div id="sidebarAuthArea"><a href="/auth" class="sidebar-signin">Sign in</a></div>
  </aside>

  <div class="list-pane" id="listPane">
    <div class="list-head">
      <h1>Messages</h1>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="convSearch" placeholder="Search">
      </div>
    </div>
    <div class="conv-list" id="convList">
      <div class="empty-note">Loading…</div>
    </div>
  </div>

  <div class="thread-pane" id="threadPane">
    <div class="thread-empty" id="threadEmpty">
      <span class="big">Your messages</span>
      Pick a friend to start chatting.
    </div>
  </div>
</div>

<script>
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
  function initials(name){ return (name || '?').trim().slice(0,1).toUpperCase(); }
  function timeAgo(iso){
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return `${Math.floor(diff/60)}m`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h`;
    return `${Math.floor(diff/86400)}d`;
  }
  function dayLabel(iso){
    const d = new Date(iso);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate() - 1);
    const sameDay = (a,b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return 'Today';
    if (sameDay(d, yest)) return 'Yesterday';
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
  }

  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let activeConversationId = null;
  let activeChannel = null;
  let inboxByUserId = {}; // otherUserId -> { user, conversationId, lastMessage }

  function requireAuth(){
    if (currentUser) return true;
    window.location.href = `/auth?next=${encodeURIComponent('/messages')}`;
    return false;
  }

  async function renderSidebar(){
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');
    if (!currentUser){ area.innerHTML = `<a href="/auth" class="sidebar-signin">Sign in</a>`; return; }

    const { data: me } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', currentUser.id).maybeSingle();
    const name = me?.username || currentUser.email || 'You';
    const avatarHtml = me?.avatar_url ? `<img src="${escapeHtml(me.avatar_url)}" alt="">` : initials(name);
    area.innerHTML = `
      <a href="/profile" class="sidebar-profile">
        <div class="avatar">${avatarHtml}</div>
        <div class="who">${escapeHtml(name)}</div>
      </a>
      <button class="sidebar-signout" id="signOutBtn">Sign out</button>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });
  }

  // Fetch every accepted friend of the current user. Queried in two simple
  // passes (as requester, then as addressee) instead of relying on named
  // foreign-key hints, which silently fail if the constraint name changes.
  async function loadFriends(){
    const [{ data: asRequester, error: e1 }, { data: asAddressee, error: e2 }] = await Promise.all([
      supabaseClient.from('friendships').select('addressee_id').eq('requester_id', currentUser.id).eq('status', 'accepted'),
      supabaseClient.from('friendships').select('requester_id').eq('addressee_id', currentUser.id).eq('status', 'accepted'),
    ]);
    if (e1) console.error('loadFriends (requester side) failed:', e1);
    if (e2) console.error('loadFriends (addressee side) failed:', e2);

    const friendIds = [
      ...(asRequester || []).map(r => r.addressee_id),
      ...(asAddressee || []).map(r => r.requester_id),
    ];
    if (friendIds.length === 0) return [];

    const { data: profiles, error: e3 } = await supabaseClient
      .from('profiles').select('id, username, avatar_url').in('id', friendIds);
    if (e3) console.error('loadFriends (profiles) failed:', e3);
    return profiles || [];
  }

  async function loadExistingConversations(){
    const { data: myRows, error } = await supabaseClient
      .from('conversation_participants').select('conversation_id').eq('user_id', currentUser.id);
    if (error) console.error('loadExistingConversations failed:', error);

    const convIds = (myRows || []).map(r => r.conversation_id);
    if (convIds.length === 0) return {};

    const { data: otherParticipants } = await supabaseClient
      .from('conversation_participants')
      .select('conversation_id, user_id, profiles(id, username, avatar_url)')
      .in('conversation_id', convIds)
      .neq('user_id', currentUser.id);

    const { data: lastMessages } = await supabaseClient
      .from('dm_messages').select('*').in('conversation_id', convIds).order('created_at', { ascending: false });

    const lastByConv = {};
    (lastMessages || []).forEach(m => { if (!lastByConv[m.conversation_id]) lastByConv[m.conversation_id] = m; });

    const byUserId = {};
    (otherParticipants || []).forEach(p => {
      if (!p.profiles) return;
      byUserId[p.profiles.id] = {
        conversationId: p.conversation_id,
        user: p.profiles,
        lastMessage: lastByConv[p.conversation_id] || null,
      };
    });
    return byUserId;
  }

  function renderInbox(){
    const convListEl = document.getElementById('convList');
    const rows = Object.values(inboxByUserId).sort((a, b) => {
      const at = a.lastMessage?.created_at || '';
      const bt = b.lastMessage?.created_at || '';
      if (at && bt) return new Date(bt) - new Date(at);
      if (at) return -1;
      if (bt) return 1;
      return (a.user.username || '').localeCompare(b.user.username || '');
    });

    if (rows.length === 0){
      convListEl.innerHTML = `<div class="empty-note"><span class="big">No friends yet</span>Add friends and they'll show up here to message.</div>`;
      return;
    }

    convListEl.innerHTML = rows.map(r => {
      const name = escapeHtml(r.user.username || 'Someone');
      const avatarHtml = r.user.avatar_url ? `<img src="${escapeHtml(r.user.avatar_url)}" alt="">` : initials(name);
      const preview = r.lastMessage ? escapeHtml(r.lastMessage.body) : 'Say hi 👋';
      const time = r.lastMessage ? timeAgo(r.lastMessage.created_at) : '';
      return `
        <div class="conv-row" data-user-id="${r.user.id}" data-name="${name.toLowerCase()}">
          <div class="avatar">${avatarHtml}</div>
          <div class="meta">
            <div class="top-line"><span class="name">${name}</span><span class="time">${time}</span></div>
            <div class="preview">${preview}</div>
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('.conv-row').forEach(row => {
      row.addEventListener('click', () => openConversationWithUser(row.dataset.userId));
    });
  }

  async function refreshInbox(){
    if (!requireAuth()) return;
    const [friends, existing] = await Promise.all([loadFriends(), loadExistingConversations()]);

    inboxByUserId = { ...existing };
    friends.forEach(f => {
      if (!inboxByUserId[f.id]) inboxByUserId[f.id] = { conversationId: null, user: f, lastMessage: null };
    });
    renderInbox();
  }

  document.getElementById('convSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.conv-row').forEach(row => {
      row.style.display = row.dataset.name.includes(q) ? '' : 'none';
    });
  });

  function renderBubble(msg, showDay){
    const mine = msg.sender_id === currentUser.id;
    const dayHtml = showDay ? `<div class="day-divider">${dayLabel(msg.created_at)}</div>` : '';
    return `
      ${dayHtml}
      <div class="bubble-wrap ${mine ? 'mine' : 'theirs'}">
        <div class="bubble ${mine ? 'mine' : 'theirs'}">${escapeHtml(msg.body)}</div>
      </div>
    `;
  }

  function renderThreadMessages(msgs){
    let lastDay = null;
    return msgs.map(m => {
      const day = dayLabel(m.created_at);
      const showDay = day !== lastDay;
      lastDay = day;
      return renderBubble(m, showDay);
    }).join('');
  }

  async function findOrCreateConversation(otherUserId){
    const existing = inboxByUserId[otherUserId]?.conversationId;
    if (existing) return existing;

    const { data: newConv, error } = await supabaseClient.from('conversations').insert({}).select().single();
    if (error){ console.error('Failed to create conversation:', error); return null; }

    const { error: partErr } = await supabaseClient.from('conversation_participants').insert([
      { conversation_id: newConv.id, user_id: currentUser.id },
      { conversation_id: newConv.id, user_id: otherUserId },
    ]);
    if (partErr) console.error('Failed to add participants:', partErr);

    if (inboxByUserId[otherUserId]) inboxByUserId[otherUserId].conversationId = newConv.id;
    return newConv.id;
  }

  async function openConversationWithUser(otherUserId){
    if (!requireAuth()) return;
    const entry = inboxByUserId[otherUserId];
    if (!entry) return;

    const conversationId = await findOrCreateConversation(otherUserId);
    if (!conversationId) return;
    activeConversationId = conversationId;

    document.querySelectorAll('.conv-row').forEach(r => r.classList.toggle('active', r.dataset.userId === otherUserId));
    document.getElementById('listPane').classList.remove('show');
    const threadPane = document.getElementById('threadPane');
    threadPane.classList.add('show');

    const name = escapeHtml(entry.user.username || 'Someone');
    const uname = entry.user.username || '';
    const avatarHtml = entry.user.avatar_url ? `<img src="${escapeHtml(entry.user.avatar_url)}" alt="">` : initials(name);

    threadPane.innerHTML = `
      <div class="thread-head">
        <button class="thread-back" id="threadBackBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <div class="avatar">${avatarHtml}</div>
        <a href="/profile?u=${encodeURIComponent(uname)}" class="name">${name}</a>
      </div>
      <div class="thread-body" id="threadBody"><div class="empty-note">Loading…</div></div>
      <form class="thread-form" id="threadForm">
        <input type="text" id="threadInput" placeholder="Message..." maxlength="1000" autocomplete="off">
        <button type="submit" id="threadSendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
      </form>
    `;

    document.getElementById('threadBackBtn').addEventListener('click', () => {
      document.getElementById('listPane').classList.add('show');
      document.getElementById('threadPane').classList.remove('show');
    });

    const { data: msgs, error: msgErr } = await supabaseClient
      .from('dm_messages').select('*').eq('conversation_id', conversationId).order('created_at', { ascending: true });
    if (msgErr) console.error('Failed to load messages:', msgErr);

    const threadBody = document.getElementById('threadBody');
    threadBody.innerHTML = (msgs && msgs.length) ? renderThreadMessages(msgs) : `<div class="empty-note">Say hi 👋 — this is the start of your conversation.</div>`;
    threadBody.scrollTop = threadBody.scrollHeight;

    let lastRenderedDay = msgs && msgs.length ? dayLabel(msgs[msgs.length - 1].created_at) : null;

    document.getElementById('threadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('threadInput');
      const body = input.value.trim();
      if (!body) return;
      input.value = '';
      const { error: sendErr } = await supabaseClient.from('dm_messages').insert({
        conversation_id: conversationId,
        sender_id: currentUser.id,
        body,
      });
      if (sendErr) console.error('Failed to send message:', sendErr);
    });

    if (activeChannel) supabaseClient.removeChannel(activeChannel);
    activeChannel = supabaseClient
      .channel(`conv-${conversationId}`)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'dm_messages', filter: `conversation_id=eq.${conversationId}`,
      }, (payload) => {
        const body2 = document.getElementById('threadBody');
        if (!body2) return;
        const day = dayLabel(payload.new.created_at);
        const showDay = day !== lastRenderedDay;
        lastRenderedDay = day;
        body2.insertAdjacentHTML('beforeend', renderBubble(payload.new, showDay));
        body2.scrollTop = body2.scrollHeight;
        if (inboxByUserId[otherUserId]) inboxByUserId[otherUserId].lastMessage = payload.new;
      })
      .subscribe();

    renderInbox();
  }

  async function init(){
    await renderSidebar();
    await refreshInbox();

    const params = new URLSearchParams(window.location.search);
    const withUserId = params.get('with');
    if (withUserId && currentUser){
      openConversationWithUser(withUserId);
    }
  }
  init();
</script>

</body>
</html>
