<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Circles — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-2:#ffb199;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --nav-w:248px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(98px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  /* ---------- shared shell (same as profile.html / index.html) ---------- */
  .app{display:flex;max-width:1180px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* =========================================================
     NAVIGATION — sidebar (desktop) / topbar + dock (mobile)
     ========================================================= */
  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.03em;
    display:inline-flex;align-items:baseline;line-height:1;
  }
  .wordmark .dot{color:var(--accent);display:inline-block;transition:transform .45s var(--ease-spring);}
  a.wordmark:hover .dot{transform:translateY(-3px) scale(1.3);}

  /* ---------- Mobile top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    height:58px;padding:0 18px;
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
    transition:box-shadow .25s ease;
  }
  .topbar.scrolled{box-shadow:0 8px 22px -14px rgba(20,21,26,.28);}

  /* ---------- Desktop sidebar ---------- */
  .sidebar{
    display:none;width:var(--nav-w);flex-shrink:0;padding:26px 16px 20px;
    flex-direction:column;height:100vh;height:100dvh;position:sticky;top:0;
  }
  .sidebar .brand{align-self:flex-start;font-size:26px;padding:6px 14px;margin-bottom:26px;border-radius:12px;}

  .nav-wrap{position:relative;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;}
  .nav-pill{
    position:absolute;left:0;right:0;top:0;height:46px;border-radius:14px;background:#f3f3f4;
    opacity:0;pointer-events:none;z-index:0;
    transition:transform .38s var(--ease-spring), height .2s var(--ease), opacity .2s ease;
  }
  .nav-pill.on{opacity:1;}
  .nav-pill.snap{transition:opacity .2s ease;}

  .nav-item{
    position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;
    border-radius:14px;font-family:var(--font-display);font-size:15.5px;font-weight:500;letter-spacing:-.005em;
    color:var(--ink-soft);
    transition:color .18s ease, background .18s ease, transform .15s var(--ease-spring);
  }
  .nav-item svg{
    width:22px;height:22px;flex-shrink:0;stroke:currentColor;
    transition:transform .35s var(--ease-spring), stroke .18s ease, fill .18s ease;
  }
  .nav-item:hover{color:var(--ink);}
  .nav-item:hover svg{transform:scale(1.12) rotate(-5deg);}
  .nav-item:active{transform:scale(.97);}
  .nav-item.active{color:var(--ink);font-weight:600;background:var(--accent-soft);}
  .nav-item.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);}
  .nav-item.active::before{
    content:'';position:absolute;left:-6px;top:50%;width:4px;height:20px;border-radius:0 4px 4px 0;
    background:var(--accent);transform:translateY(-50%);
    animation:navBar .45s var(--ease-spring) both;
  }
  @keyframes navBar{ from{transform:translateY(-50%) scaleY(.2);opacity:0;} to{transform:translateY(-50%) scaleY(1);opacity:1;} }
  .nav-item:focus-visible,.sidebar .brand:focus-visible,.nav-create:focus-visible,
  .sidebar-profile:focus-visible,.sidebar-signout:focus-visible,.sidebar-signin:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  .nav-create{
    position:relative;overflow:hidden;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;
    height:48px;border-radius:14px;color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:15px;
    background:linear-gradient(135deg,#ff7d59 0%,var(--accent) 55%,#f2431c 100%);
    box-shadow:0 10px 22px -8px rgba(255,90,54,.6), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .25s var(--ease-spring), box-shadow .25s ease;
  }
  .nav-create svg{width:19px;height:19px;stroke:#fff;transition:transform .4s var(--ease-spring);}
  .nav-create::after{
    content:'';position:absolute;inset:0;transform:translateX(-130%);
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);
    transition:transform .7s var(--ease);
  }
  .nav-create:hover{transform:translateY(-2px);box-shadow:0 16px 28px -8px rgba(255,90,54,.65), inset 0 1px 0 rgba(255,255,255,.3);}
  .nav-create:hover svg{transform:rotate(90deg);}
  .nav-create:hover::after{transform:translateX(130%);}
  .nav-create:active{transform:scale(.97);}

  .sidebar-auth{margin-top:auto;}
  .sidebar-user{
    display:flex;align-items:center;gap:4px;padding:8px;border-radius:18px;
    background:#fff;border:1px solid var(--line);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .sidebar-user:hover{border-color:var(--line-strong);box-shadow:0 8px 22px -14px rgba(20,21,26,.25);}
  .sidebar-profile{
    flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:3px 6px 3px 3px;border-radius:12px;
    transition:background .15s ease;
  }
  .sidebar-profile:hover{background:#f7f7f8;}
  .mini-avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:14px;overflow:hidden;
  }
  .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .sidebar-user .mini-avatar{width:38px;height:38px;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent-soft);}
  .sidebar-profile .who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0;}
  .sidebar-profile .who span:first-child{font-family:var(--font-display);font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-profile .who span:last-child{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}
  .sidebar-signout{
    width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;color:var(--grey);
    transition:background .15s ease, color .15s ease, transform .15s var(--ease-spring);
  }
  .sidebar-signout svg{width:17px;height:17px;stroke:currentColor;}
  .sidebar-signout:hover{background:#fdeeed;color:var(--danger);}
  .sidebar-signout:active{transform:scale(.9);}
  .sidebar-signin{
    margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;
    background:var(--ink);color:#fff!important;border-radius:14px;
    font-family:var(--font-display);font-weight:600;font-size:14.5px;
    transition:background .16s ease, transform .2s var(--ease-spring);
  }
  .sidebar-signin:hover{background:#000;transform:translateY(-1px);}
  .sidebar-signin:active{transform:scale(.97);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    .topbar{display:none;}
    .sidebar{display:flex;}
  }

  /* ---------- Mobile floating dock ---------- */
  .bottom-nav{
    position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;height:64px;padding:0 6px;
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    border-radius:24px;z-index:30;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border:1px solid rgba(20,21,26,.06);
    box-shadow:0 14px 34px -10px rgba(20,21,26,.22), 0 2px 8px rgba(20,21,26,.05);
    transition:transform .4s var(--ease), opacity .25s ease;
  }
  .bottom-nav.hidden{transform:translateY(calc(100% + 32px));opacity:0;pointer-events:none;}
  .tab{
    position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.005em;
    -webkit-tap-highlight-color:transparent;
    transition:color .2s ease, transform .2s var(--ease-spring);
  }
  .tab-ico{
    width:48px;height:30px;border-radius:99px;display:grid;place-items:center;
    transition:background .25s ease;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;transition:transform .3s var(--ease-spring);}
  .tab:active svg{transform:scale(.82);}
  .tab.active{color:var(--ink);}
  .tab.active .tab-ico{background:var(--accent-soft);}
  .tab.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);animation:tabPop .5s var(--ease-spring);}
  @keyframes tabPop{ 0%{transform:scale(.7);} 100%{transform:scale(1);} }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:18px;}

  .tab-create{overflow:visible;}
  .tab-create .ring{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#ff7d59,var(--accent) 55%,#f2431c);
    transform:translateY(-14px);
    box-shadow:0 0 0 5px #fff, 0 12px 22px -4px rgba(255,90,54,.55), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .3s var(--ease-spring), box-shadow .3s ease;
  }
  .tab-create svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none;transition:transform .35s var(--ease-spring);}
  .tab-create:active .ring{transform:translateY(-12px) scale(.92);}
  .tab-create:active svg{transform:rotate(90deg);}
  .tab-create .tab-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  @media (min-width:900px){ .bottom-nav{display:none;} }

  @keyframes riseIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

  /* ---------- page head ---------- */
  .page-head{
    padding:32px 22px 6px;
  }
  .page-head-top{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  .page-head h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:24px;
    letter-spacing:-0.01em;
  }
  .page-head p{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--grey);
    margin-top:5px;
    max-width:420px;
    line-height:1.5;
  }
  .stat-pills{
    display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
  }
  .stat-pill{
    display:flex;align-items:baseline;gap:5px;
    background:#f7f7f8;border:1px solid var(--line);
    border-radius:99px;padding:7px 13px;
  }
  .stat-pill b{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);}
  .stat-pill span{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}

  /* ---------- segmented tab control with sliding indicator ---------- */
  .circles-tabs{
    position:relative;
    display:flex;
    gap:4px;
    padding:20px 22px 0;
    border-bottom:1px solid var(--line);
  }
  .circles-tabs-track{
    position:relative;
    display:flex;
    gap:4px;
    background:#f2f2f3;
    border-radius:99px;
    padding:4px;
  }
  .tab-indicator{
    position:absolute;
    top:4px;bottom:4px;left:4px;
    width:0;
    background:var(--ink);
    border-radius:99px;
    transition:transform .28s var(--ease-spring), width .28s var(--ease-spring);
    z-index:0;
  }
  .circles-tab-btn{
    position:relative;
    z-index:1;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:99px;
    color:var(--ink-soft);
    transition:color .2s ease;
    white-space:nowrap;
  }
  .circles-tab-btn.active{color:#fff;}

  .circles-panel{display:none;animation:riseIn .35s var(--ease) forwards;}
  .circles-panel.active{display:block;}

  /* ---------- search ---------- */
  .circles-search-row{
    padding:16px 22px 0;
  }
  .circles-search{
    position:relative;
  }
  .circles-search svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;stroke:var(--grey);pointer-events:none;
  }
  .circles-search input{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:99px;
    padding:10px 14px 10px 38px;
    font-family:var(--font-serif);
    font-size:14px;
    outline:none;
    transition:border-color .16s var(--ease);
  }
  .circles-search input:focus{border-color:var(--accent);}

  /* ---------- CIRCLES ---------- */
  .circles-section{
    width:100%;
    max-width:640px;
    margin-top:6px;
  }
  .circles-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:16px 22px 12px;
  }
  .circles-head h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    color:var(--ink);
  }
  .circles-head p{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--grey);
    margin-top:3px;
    letter-spacing:.01em;
  }
  .circle-new-btn{
    flex-shrink:0;
    display:flex;align-items:center;gap:6px;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:9px 14px;
    border-radius:99px;
    transition:background .15s ease, transform .1s ease;
  }
  .circle-new-btn:hover{background:#000;}
  .circle-new-btn:active{transform:scale(.96);}
  .circle-new-btn svg{width:14px;height:14px;stroke:#fff;}

  .circle-card{
    margin:0 16px 10px;
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    opacity:0;
    animation:riseIn .4s var(--ease) forwards;
    transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .circle-card:hover{
    box-shadow:0 6px 22px rgba(20,21,26,.06);
    border-color:var(--line-strong);
  }

  .circle-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    cursor:pointer;
    position:relative;
  }
  .circle-row::before{
    content:'';
    position:absolute;
    left:0;top:10px;bottom:10px;
    width:3px;
    border-radius:99px;
    background:var(--row-accent, var(--accent));
    opacity:.75;
  }

  .circle-cluster{
    display:flex;
    flex-shrink:0;
    width:52px;
    margin-left:6px;
  }
  .circle-cluster .cluster-avatar{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid var(--white);
    margin-left:-12px;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:11px;
    overflow:hidden;
  }
  .circle-cluster .cluster-avatar:first-child{margin-left:0;}
  .circle-cluster .cluster-avatar img{width:100%;height:100%;object-fit:cover;}
  .circle-cluster .cluster-more{
    width:34px;height:34px;border-radius:50%;
    border:2px solid var(--white);margin-left:-12px;
    background:#f2f2f3;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:9.5px;
  }

  .circle-info{flex:1;min-width:0;}
  .circle-info .circle-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .circle-info .circle-meta{
    display:flex;align-items:center;gap:5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--grey);
    margin-top:2px;
  }
  .circle-info .circle-meta svg{width:11px;height:11px;flex-shrink:0;}
  .owner-chip{
    font-family:var(--font-mono);
    font-size:9px;
    color:#c24020;
    background:var(--accent-soft);
    padding:2px 6px;
    border-radius:6px;
    margin-left:4px;
    letter-spacing:.03em;
  }

  .circle-chevron{
    width:28px;height:28px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s var(--ease-spring), background .15s ease;
    border-radius:50%;
  }
  .circle-chevron:hover{background:#f2f2f3;}
  .circle-chevron svg{width:15px;height:15px;stroke:var(--grey);}
  .circle-row.expanded .circle-chevron{transform:rotate(90deg);}

  .circle-expand{
    overflow:hidden;
    max-height:0;
    transition:max-height .3s var(--ease);
    background:#faf9f8;
    border-top:1px solid transparent;
  }
  .circle-expand.open{max-height:460px;border-top-color:var(--line);}
  .circle-expand-inner{padding:14px 16px 18px;}

  .circle-members-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .circle-member-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--white);
    border:1px solid var(--line-strong);
    border-radius:99px;
    padding:4px 10px 4px 4px;
    transition:border-color .14s var(--ease);
  }
  .circle-member-chip:hover{border-color:var(--accent);}
  .circle-member-chip .mini-avatar{width:22px;height:22px;font-size:9.5px;}
  .circle-member-chip span{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }

  .circle-action-row{display:flex;gap:8px;}
  .circle-open-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:12px;
    transition:opacity .15s ease, transform .1s ease;
    flex:1;
    justify-content:center;
  }
  .circle-open-btn:hover{opacity:.85;}
  .circle-open-btn:active{transform:scale(.97);}
  .circle-open-btn svg{width:14px;height:14px;stroke:#fff;}

  .circle-invite-btn{
    display:flex;align-items:center;gap:7px;
    background:var(--accent-soft);
    color:#c24020;
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:12px;
    transition:opacity .15s ease, transform .1s ease;
    flex:1;
    justify-content:center;
  }
  .circle-invite-btn:hover{opacity:.85;}
  .circle-invite-btn:active{transform:scale(.97);}
  .circle-invite-btn:disabled{opacity:.5;cursor:default;}
  .circle-invite-btn svg{width:14px;height:14px;stroke:#c24020;}

  .circle-leave-btn{
    display:flex;align-items:center;gap:7px;
    background:#fdeceb;
    color:var(--danger);
    font-family:var(--font-display);
    font-weight:600;
    font-size:12.5px;
    padding:10px 16px;
    border-radius:12px;
    transition:opacity .15s ease, transform .1s ease;
    justify-content:center;
    flex-shrink:0;
  }
  .circle-leave-btn:hover{opacity:.85;}
  .circle-leave-btn:active{transform:scale(.97);}
  .circle-leave-btn:disabled{opacity:.5;cursor:default;}

  /* ---------- invite result card, rebuilt with a countdown ring ---------- */
  .circle-invite-result{
    margin-top:12px;
    background:var(--white);
    border:1px dashed var(--line-strong);
    border-radius:16px;
    padding:16px;
    opacity:0;

<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
  function initials(name) {
    return (name || '?').trim().slice(0, 1).toUpperCase();
  }

  // ============================================================
  // SUPABASE CONFIG — same project as the rest of the app.
  // ============================================================
  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUsername = null;

  function requireAuth(nextPath) {
    if (currentUser) return true;
    window.location.href = `/auth?next=${encodeURIComponent(nextPath || window.location.pathname)}`;
    return false;
  }

  // ---- toast ----
  let toastTimer = null;
  function showToast(text, type){
    const toast = document.getElementById('waaterToast');
    document.getElementById('waaterToastText').textContent = text;
    toast.classList.remove('error');
    if (type === 'error') toast.classList.add('error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ---- sidebar auth widget (shared look with the rest of the app) ----
  async function renderSidebar() {
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');

    if (!currentUser) {
      area.innerHTML = `<a href="/auth" class="sidebar-signin">Sign in</a>`;
      return;
    }

    const { data: me } = await supabaseClient
      .from('profiles')
      .select('username, avatar_url')
      .eq('id', currentUser.id)
      .maybeSingle();

    currentUsername = me?.username || currentUser.email || 'You';
    const avatarHtml = me?.avatar_url
      ? `<img src="${escapeHtml(me.avatar_url)}" alt="">`
      : initials(currentUsername);

    area.innerHTML = `
      <div class="sidebar-user">
        <a href="/profile" class="sidebar-profile">
          <div class="mini-avatar">${avatarHtml}</div>
          <div class="who"><span>${escapeHtml(currentUsername)}</span><span>view profile</span></div>
        </a>
        <button class="sidebar-signout" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });
  }

  const CIRCLE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>`;

  // a small deterministic palette so each circle card gets a consistent
  // accent stripe/color, based on a hash of its id — purely cosmetic
  const ROW_ACCENTS = ['#ff5a36', '#7fb8ff', '#a3e88f', '#c79dff', '#ffb199', '#5fd3c4'];
  function accentForId(id){
    let hash = 0;
    const str = String(id || '');
    for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    return ROW_ACCENTS[hash % ROW_ACCENTS.length];
  }

  // build the URL for a circle's own page — matches what circle.html expects
  function circleHref(circle){

    return `/circle?${circle.is_private ? 'private' : 'public'}&ID=${encodeURIComponent(circle.id)}`;

  }

  // cache of the last loaded lists so the search box can filter instantly
  // without a refetch
  let lastMyCircles = [];
  let lastDiscoverCircles = [];

  const PRIVATE_CIRCLE_LIMIT = 4;

  function countPrivateCircles(circles) {

    return circles.filter(c => c.is_private).length;

  }

  // turn the raw Postgres trigger error into something readable in the UI

  function friendlyCircleError(err) {

    const msg = err?.message || '';

    if (msg.includes('PRIVATE_CIRCLE_LIMIT')) {

      return `You're already in ${PRIVATE_CIRCLE_LIMIT} private circles — leave one first to join or create another.`;

    }

    return msg || 'Something went wrong';

  }



  // ---- load the circles the current user belongs to, with member previews ----
  async function loadMyCircles(userId) {
    const { data: memberships } = await supabaseClient
      .from('circle_members')
      .select('circle_id, role, joined_at, circles(id, name, is_private, created_at)')
      .eq('user_id', userId)
      .order('joined_at', { ascending: false });

    const list = (memberships || []).filter(m => m.circles);
    if (list.length === 0) return [];

    const circleIds = list.map(m => m.circle_id);

    const { data: allMembers } = await supabaseClient
      .from('circle_members')
      .select('circle_id, user_id')
      .in('circle_id', circleIds);

    const userIds = [...new Set((allMembers || []).map(m => m.user_id))];
    const { data: memberProfiles } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', userIds.length > 0 ? userIds : ['00000000-0000-0000-0000-000000000000']);

    const profileById = {};
    (memberProfiles || []).forEach(p => { profileById[p.id] = p; });

    return list.map(m => {
      const members = (allMembers || []).filter(x => x.circle_id === m.circle_id);
      const memberProfilesForCircle = members.map(x => profileById[x.user_id]).filter(Boolean);
      return {
        ...m.circles,
        myRole: m.role,
        memberCount: members.length,
        memberProfiles: memberProfilesForCircle,
      };
    });
  }

  // ---- discover: public circles the user hasn't joined yet ----
  async function loadDiscoverCircles(userId, myCircleIds) {
    const { data } = await supabaseClient
      .from('circles')
      .select('id, name, is_private, created_at')
      .eq('is_private', false)
      .order('created_at', { ascending: false })
      .limit(30);

    const list = (data || []).filter(c => !myCircleIds.has(c.id));
    if (list.length === 0) return [];

    const circleIds = list.map(c => c.id);
    const { data: allMembers } = await supabaseClient
      .from('circle_members')
      .select('circle_id')
      .in('circle_id', circleIds);

    const counts = {};
    (allMembers || []).forEach(m => { counts[m.circle_id] = (counts[m.circle_id] || 0) + 1; });

  // ---- extract a bare invite code whether the user pasted a raw code
  // or a full invite link (e.g. https://app.com/circle/join?code=XXXX)
  function extractInviteCode(raw) {
    const trimmed = (raw || '').trim();
    if (!trimmed) return '';
    if (trimmed.includes('://') || trimmed.startsWith('/')) {
      try {
        const url = new URL(trimmed.includes('://') ? trimmed : window.location.origin + trimmed);
        const codeParam = url.searchParams.get('code');
        if (codeParam) return codeParam.trim();
      } catch (e) {
        // not a parseable URL — fall through and treat it as a raw code
      }
    }
    return trimmed;
  }

  // ---- wire clicks/expand/invite/leave/join for "Your circles" ----
  function wireYourCirclesUI() {
    // tapping the row itself opens the circle — matches circle.html's
    // /circle?private|public&ID=... URL shape
    document.querySelectorAll('.circle-row').forEach(row => {

      row.addEventListener('click', () => {
        const id = row.dataset.circleId;
        const isPrivate = row.dataset.private === '1';
        window.location.href = `/circle?${isPrivate ? 'private' : 'public'}&ID=${encodeURIComponent(id)}`;
      });
    });

    // the chevron is a dedicated button for quick actions (members,
    // invite, leave) without leaving the circles list — it must stop
    // the click from bubbling up to the row's "open circle" handler
    document.querySelectorAll('.circle-chevron').forEach(chev => {
      chev.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = chev.dataset.circleId;
        const row = chev.closest('.circle-row');
        const expand = document.getElementById(`circle-expand-${id}`);
        const isOpen = expand.classList.contains('open');
        document.querySelectorAll('.circle-expand.open').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.circle-row.expanded').forEach(el => el.classList.remove('expanded'));
        if (!isOpen) {
          expand.classList.add('open');
          row.classList.add('expanded');
        }
      });
    });

    document.querySelectorAll('.circle-invite-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (btn.disabled) return; // guard against double-tap firing two invites
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<span class="mini-spinner" style="border-color:rgba(194,64,32,.35);border-top-color:#c24020;"></span> Creating…`;
        const circleId = btn.dataset.circleId;
        const resultEl = document.getElementById(`circle-invite-result-${circleId}`);
        try {
          const { data, error } = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
          if (error) throw error;
          showInviteResult(resultEl, data, circleId);
        } catch (err) {
          showToast(err.message || 'Could not create invite', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
    });

    document.querySelectorAll('.circle-leave-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (btn.disabled) return;
        btn.disabled = true;
        const circleId = btn.dataset.circleId;
        try {
          const { error } = await supabaseClient
            .from('circle_members')
            .delete()
            .eq('circle_id', circleId)
            .eq('user_id', currentUser.id);
          if (error) throw error;
          showToast('You left the circle');
          renderPage();
        } catch (err) {
          console.error('Leave circle failed:', err);
          showToast(err.message || 'Could not leave circle', 'error');
          btn.disabled = false;
        }
      });
    });

    const newBtn = document.getElementById('circleNewBtn');
    if (newBtn) newBtn.addEventListener('click', openCreateCircleModal);
    const newBtnEmpty = document.getElementById('circleNewBtnEmpty');
    if (newBtnEmpty) newBtnEmpty.addEventListener('click', openCreateCircleModal);

    const searchInput = document.getElementById('circleSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        const panel = document.getElementById('panel-mine');
        const scrollPos = window.scrollY;
        panel.innerHTML = renderCirclesSection(lastMyCircles, { query: searchInput.value.trim().toLowerCase() });
        wireYourCirclesUI();
        const reInput = document.getElementById('circleSearchInput');
        if (reInput) { reInput.focus(); reInput.setSelectionRange(reInput.value.length, reInput.value.length); }
        window.scrollTo(0, scrollPos);
      });
    }

    // guard so a double-tap on Join can't fire the RPC twice
    let isJoiningByCode = false;
    const joinBtn = document.getElementById('circleJoinBtn');
    const joinInput = document.getElementById('circleJoinInput');
    const joinStatus = document.getElementById('circleJoinStatus');

    if (joinBtn) {
      const submitJoin = async () => {
        if (!requireAuth()) return;
        if (isJoiningByCode) return;

        // accept either a bare invite code or a full invite link pasted in
        const code = extractInviteCode(joinInput.value);
        if (!code) return;

        isJoiningByCode = true;
        joinBtn.disabled = true;
        joinBtn.innerHTML = `<span class="mini-spinner"></span>`;
        joinStatus.className = 'circles-join-status';
        joinStatus.textContent = '';

        try {
          const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: code });
          if (error) throw error;
          joinStatus.className = 'circles-join-status ok';
          joinStatus.textContent = `You're in ${data?.name || 'the circle'} now.`;
          showToast(`Joined ${data?.name || 'the circle'}`);
          joinInput.value = '';
          renderPage();

          } catch (err) {
    joinStatus.className = 'circles-join-status error';
    joinStatus.textContent = friendlyCircleError(err);

  } finally {



          isJoiningByCode = false;
          joinBtn.disabled = false;
          joinBtn.textContent = 'Join';
        }

      };
      
      joinBtn.addEventListener('click', submitJoin);
      joinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitJoin(); } });
      // handle paste explicitly too, so a pasted link is normalized
      // immediately rather than waiting for the user to hit Join
      joinInput.addEventListener('paste', (e) => {
        const pasted = (e.clipboardData || window.clipboardData)?.getData('text');
        if (!pasted) return;
        const extracted = extractInviteCode(pasted);
        if (extracted && extracted !== pasted.trim()) {
          e.preventDefault();
          joinInput.value = extracted;
        }
      });
    }
  }

  // ---- show a freshly created invite code with a live countdown ring ----
  function showInviteResult(resultEl, invite, circleId) {
    resultEl.style.display = 'block';
    const link = `${window.location.origin}/circle/join?code=${encodeURIComponent(invite.code)}`;
    const RADIUS = 20;
    const CIRC = 2 * Math.PI * RADIUS;

    resultEl.innerHTML = `
      <div class="invite-result-top">
        <div class="invite-ring-wrap">
          <svg width="46" height="46" viewBox="0 0 46 46">
            <circle class="invite-ring-bg" cx="23" cy="23" r="${RADIUS}"></circle>
            <circle class="invite-ring-fg" id="invite-ring-${invite.id}" cx="23" cy="23" r="${RADIUS}"
              stroke-dasharray="${CIRC}" stroke-dashoffset="0"></circle>
          </svg>
          <div class="invite-ring-label" id="invite-ring-label-${invite.id}">10:00</div>
        </div>
        <div>
          <div class="circle-invite-code">${escapeHtml(invite.code)}</div>
          <div class="circle-invite-sub">Works once, for the next 10 minutes only.</div>
        </div>
      </div>
      <div class="invite-result-actions">
        <button class="invite-copy-btn" id="invite-copy-${invite.id}">Copy link</button>
        <button class="invite-share-btn" id="invite-share-${invite.id}">Share…</button>
      </div>
    `;

    const copyBtn = resultEl.querySelector(`#invite-copy-${invite.id}`);
    copyBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        await navigator.clipboard.writeText(link);
        copyBtn.textContent = 'Copied ✓';
        showToast('Invite link copied');
        setTimeout(() => { copyBtn.textContent = 'Copy link'; }, 1800);
      } catch (err) {
        showToast('Could not copy — copy it manually: ' + link, 'error');
      }
    });

    const shareBtn = resultEl.querySelector(`#invite-share-${invite.id}`);
    shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Join my circle on Waater', text: 'Come join my circle on Waater', url: link });
        } catch (err) { /* user cancelled — fine */ }
      } else {
        try {
          await navigator.clipboard.writeText(link);
          showToast('Invite link copied');
        } catch (err) {
          showToast('Could not share — copy it manually: ' + link, 'error');
        }
      }
    });

    const ringEl = resultEl.querySelector(`#invite-ring-${invite.id}`);
    const labelEl = resultEl.querySelector(`#invite-ring-label-${invite.id}`);
    const expiresAt = new Date(invite.expires_at).getTime();
    const totalMs = Math.max(1, expiresAt - Date.now());

    const tick = () => {
      const msLeft = expiresAt - Date.now();
      if (msLeft <= 0) {
        labelEl.textContent = 'done';
        ringEl.style.strokeDashoffset = CIRC;
        ringEl.style.stroke = 'var(--grey)';
        clearInterval(interval);
        return;
      }
      const fraction = msLeft / totalMs;
      ringEl.style.strokeDashoffset = String(CIRC * (1 - fraction));
      const m = Math.floor(msLeft / 60000);
      const s = Math.floor((msLeft % 60000) / 1000);
      labelEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
      if (msLeft < 60000) ringEl.style.stroke = 'var(--danger)';
    };
    tick();
    const interval = setInterval(tick, 1000);
  }

  // ---- create-circle modal ----
  function openCreateCircleModal() {

    if (!requireAuth()) return;
    const overlay = document.createElement('div');
    overlay.className = 'bf-modal-overlay';
    overlay.innerHTML = `
      <div class="bf-modal">
        <div class="circle-modal-icon" id="circleModalIcon">${CIRCLE_ICON_SVG}</div>

          <button class="bf-modal-confirm" id="circleModalConfirm">Create circle</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));

    const nameInput = overlay.querySelector('#circleNameInput');
    const nameCount = overlay.querySelector('#circleNameCount');
    nameInput.addEventListener('input', () => {
      nameCount.textContent = `${nameInput.value.length}/40`;
      nameInput.style.borderColor = '';
    });
    setTimeout(() => nameInput.focus(), 260);

    let isPrivate = true;
    const toggleBtns = overlay.querySelectorAll('.circle-privacy-toggle button');
    const note = overlay.querySelector('#circlePrivacyNote');
    const icon = overlay.querySelector('#circleModalIcon');
    toggleBtns.forEach(btn => {

      btn.addEventListener('click', () => {
        toggleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        isPrivate = btn.dataset.value === 'private';
        note.textContent = isPrivate
          ? 'Only people already inside can bring someone in — three invites a day each, and every invite code stops working after 10 minutes.'
          : 'Anyone can see this circle and what gets posted in it — people can also join it straight from Discover.';
        icon.classList.remove('bump');
        void icon.offsetWidth;
        icon.classList.add('bump');
      });
    });

    const close = () => {
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 200);
    };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('#circleModalCancel').addEventListener('click', close);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); overlay.querySelector('#circleModalConfirm').click(); }
    });

    let isCreating = false;
    overlay.querySelector('#circleModalConfirm').addEventListener('click', async () => {
      if (isCreating) return; // guard against a double-tap creating two circles
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.style.borderColor = 'var(--danger)';
        nameInput.focus();
        return;
      }
      isCreating = true;
      const btn = overlay.querySelector('#circleModalConfirm');
      btn.disabled = true;
      btn.innerHTML = `<span class="mini-spinner"></span> Creating…`;
      overlay.querySelector('#circleModalErrorSlot').innerHTML = '';

      try {

          if (isPrivate && countPrivateCircles(lastMyCircles) >= PRIVATE_CIRCLE_LIMIT) {
            
            throw new Error('PRIVATE_CIRCLE_LIMIT');

          }



        const { data: newCircle, error } = await supabaseClient

          .from('circles')

          .insert({ name, is_private: isPrivate, created_by: currentUser.id })

          .select()

          .single();

        if (error) throw error;

        // owner membership is created automatically by the on_circle_created trigger
        showToast(`${name} is live`);



        close();
        renderPage();
      } catch (err) {
        isCreating = false;
        btn.disabled = false;
        btn.textContent = 'Create circle';
        overlay.querySelector('#circleModalErrorSlot').innerHTML =
          `<p class="modal-error">${escapeHtml(friendlyCircleError(err))}</p>`;
      }
    });
  }

  // ---- main render ----
  async function renderPage() {

    body.innerHTML = `
      <div class="page-head">
        <div class="page-head-top">
          <div>
            <h1>Circles</h1>
            <p>Small, close spaces — create one, invite people in, or find a public one to join.</p>
          </div>
        </div>
      </div>
      ${renderCirclesSkeleton()}
    `;

    const myCircles = await loadMyCircles(currentUser.id);
    const myCircleIds = new Set(myCircles.map(c => c.id));
    const discoverCircles = await loadDiscoverCircles(currentUser.id, myCircleIds);

    lastMyCircles = myCircles;
    lastDiscoverCircles = discoverCircles;

    const totalPeople = new Set(myCircles.flatMap(c => (c.memberProfiles || []).map(p => p.id))).size;

    body.innerHTML = `
      <div class="page-head">
        <div class="page-head-top">
          <div>
            <h1>Circles</h1>
            <p>Small, close spaces — create one, invite people in, or find a public one to join.</p>
          </div>
        </div>
        <div class="stat-pills">
          <div class="stat-pill"><b>${myCircles.length}</b><span>${myCircles.length === 1 ? 'circle' : 'circles'}</span></div>
          <div class="stat-pill"><b>${totalPeople}</b><span>${totalPeople === 1 ? 'person' : 'people'} across them</span></div>
        </div>
      </div>

      <div class="circles-tabs">
        <div class="circles-tabs-track">
          <div class="tab-indicator"></div>
          <button class="circles-tab-btn active" data-tab="mine">Your circles</button>
          <button class="circles-tab-btn" data-tab="discover">Discover</button>
        </div>
      </div>

      <div class="circles-panel active" id="panel-mine">
        ${renderCirclesSection(myCircles)}
      </div>

      <div class="circles-panel" id="panel-discover">
        ${renderDiscoverSection(discoverCircles)}
      </div>
    `;

    wireTabs();
    wireYourCirclesUI();
    wireDiscoverUI();

  }

  async function init() {
    await renderSidebar();
    await renderPage();
  }

  init();
</script>

<script>
// Navigation behaviour: active link, sliding hover pill, topbar shadow, dock polish
(function(){
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
  var first = '/' + (path.split('/')[1] || '');
  var keyMap = {'/':'home','/home':'home','/index':'home','/create':'create','/circles':'circles','/circle':'circles','/messages':'messages','/profile':'profile'};
  var key = keyMap[path] || keyMap[first];
  if (key){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      var on = el.getAttribute('data-nav') === key && !el.classList.contains('nav-create') && !el.classList.contains('tab-create');
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
  }

  // sliding hover pill (desktop)
  var list = document.querySelector('.nav-list');
  var pill = document.querySelector('.nav-pill');
  if (list && pill){
    var move = function(el){
      var y = el.getBoundingClientRect().top - list.getBoundingClientRect().top;
      pill.style.height = el.offsetHeight + 'px';
      if (!pill.classList.contains('on')){
        pill.classList.add('snap');
        pill.style.transform = 'translateY(' + y + 'px)';
        void pill.offsetWidth;
        pill.classList.remove('snap');
        pill.classList.add('on');
      } else {
        pill.style.transform = 'translateY(' + y + 'px)';
      }
    };
    list.querySelectorAll('.nav-item').forEach(function(a){
      a.addEventListener('mouseenter', function(){ move(a); });
      a.addEventListener('focus', function(){ if (a.matches(':focus-visible')) move(a); });
    });
    list.addEventListener('mouseleave', function(){ pill.classList.remove('on'); });
    list.addEventListener('focusout', function(){ pill.classList.remove('on'); });
  }

  // topbar gets a soft shadow once you scroll
  var tb = document.querySelector('.topbar');
  if (tb){
    var f = function(){ tb.classList.toggle('scrolled', window.scrollY > 4); };
    window.addEventListener('scroll', f, {passive:true}); f();
  }

  // dock: light haptic tap, and tuck away while typing so the keyboard has room
  var dock = document.querySelector('.bottom-nav');
  if (dock){
    dock.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ if (navigator.vibrate) navigator.vibrate(8); });
    });
    var FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]';
    var isField = function(el){ return el && el.matches && el.matches(FIELD); };
    document.addEventListener('focusin', function(e){
      if (isField(e.target) && window.matchMedia('(max-width:899.98px)').matches) dock.classList.add('hidden');
    });
    document.addEventListener('focusout', function(){
      setTimeout(function(){ if (!isField(document.activeElement)) dock.classList.remove('hidden'); }, 60);
    });
  }
})();
</script>
