          <div class="home-comment-bubble"><b>${escapeHtml(name)}</b><p>${escapeHtml(c.content)}</p></div>
          <div class="home-comment-time">${timeAgo(c.created_at)}${deleteBtn}</div>
        </div>
      </div>
    `;
  }

  async function openComments(postId, card){
    const panel = card.querySelector('.home-comments');
    const listEl = card.querySelector('.home-comment-list');
    const wasOpen = panel.classList.contains('open');
    if (wasOpen){ panel.classList.remove('open'); return; }
    panel.classList.add('open');
    if (!panel.dataset.loaded){
      listEl.innerHTML = `<div class="home-comment-empty">Loading…</div>`;
      const comments = await loadComments(postId);
      listEl.innerHTML = comments.length
        ? comments.map(renderCommentItem).join('')
        : `<div class="home-comment-empty">No comments yet — be the first.</div>`;
      panel.dataset.loaded = '1';
    }
  }

  // Shown once, only to someone who was just invited, right on the post
  // they were invited to see — opens the reply box for them and names
  // exactly who can see it. This is the moment a newcomer coming from
  // public, anonymous platforms hesitates ("is this like Reddit? who's
  // actually watching?"), so the reassurance is concrete and local to
  // the one reply that matters, not a generic app-wide banner.
  async function showInviteReplyNudge(postId){
    const card = document.querySelector(`#viewFeed .home-post-card[data-post-id="${postId}"]`);
    if (!card) return;
    await openComments(postId, card);
    const panel = card.querySelector('.home-comments');
    if (panel.querySelector('.invite-reply-nudge')) return;
    const row = panel.querySelector('.home-comment-input-row');
    if (!row || !row.parentElement) return;
    const tip = document.createElement('div');
    tip.className = 'invite-reply-nudge';
    tip.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>Only ${members.length} people will ever see this — say what you'd actually say</span>`;
    row.parentElement.insertBefore(tip, row);
    setTimeout(() => tip.remove(), 9000);
  }

  document.addEventListener('click', async (e) => {
    const delBtn = e.target.closest('.home-comment-delete');
    if (!delBtn) return;
    e.stopPropagation();
    if (!currentUser) return;
    const commentId = delBtn.dataset.commentId;
    const kind = delBtn.dataset.commentKind;
    const item = delBtn.closest('.home-comment-item');
    const postCard = delBtn.closest('.home-post-card');
    const postId = postCard ? postCard.dataset.postId : null;
    if (!window.confirm('Delete this comment?')) return;
    delBtn.disabled = true;
    try {
      const isMediaComment = kind === 'voice' || kind === 'video';
      const table = isMediaComment ? 'voice_comments' : 'post_comments';
      const fileRef = isMediaComment ? await mediaRefBeforeDelete('voice_comments', commentId) : null;
      const { error } = await supabaseClient
        .from(table)
        .delete()
        .eq('id', commentId)
        .eq('user_id', currentUser.id);
      if (error) throw error;
      eraseMedia(fileRef);
      if (postId && postCard) {
        const comments = await loadComments(postId);
        syncCommentsEverywhere(postId, comments, postCard);
      } else if (item) {
        item.remove();
      }

      showToast(err.message || 'Could not delete comment', 'error');

  // =========================================================
  // VIDEO POSTS — record (or pick) → review → Send. The upload
  // then happens in the background; the recording is never lost
  // (a failed send keeps the clip on screen with a Retry).
  // =========================================================
  function vrFmt(sec, floor){
    const t = Math.max(0, floor ? Math.floor(sec) : Math.round(sec));
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }

  const VR_HINT_KEY = 'waater_vr_hint_seen';
  const VR_BLUR_KEY = 'waater_vr_blur';                 // '0' = the person turned the blur shield off
  const VR_BLUR_INTRO_KEY = 'waater_vr_blur_intro';     // first-time explainer already seen
  const VR_LEN_KEY = 'waater_vr_len';           // 'long' = full 60s; anything else = quick
  const VR_QUICK_SECONDS = 30;                  // the default: "you only need 30 seconds"
  // Conversation starters. Casual on purpose — nobody has ever been blocked by "tell us about your day".
  const VR_PROMPTS = {
    post: [

  const VR_ICON = {
    x: '<svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    flip: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>',

    send: '<svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>'
  };

  // ---- feed playback: autoplay muted in view, tap for sound ----
  let vrRecording = false;               // recorder open: feed videos stay paused so the camera gets the CPU
  let videoSoundOn = false;              // once they unmute one, the next ones start with sound
  const vrObserved = new Set();
  const vrIO = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
    entries.forEach(en => {
      const v = en.target;
      if (!vrRecording && en.isIntersecting && en.intersectionRatio >= 0.6) vrPlay(v);
      else v.pause();
    });
  }, { threshold: [0, 0.6, 1] }) : null;

  function vrSyncSoundUi(v){
    const wrap = v.closest('.home-video');
    if (wrap) wrap.classList.toggle('unmuted', !v.muted);
  }

  function vrPlay(v){
    if (vrRecording) return;
    const wrap = v.closest('.home-video');
    if (wrap && wrap.classList.contains('hv-once')) return;   // view-once videos only ever start from a tap
    if (wrap && wrap.classList.contains('upaused')) return;
    document.querySelectorAll('.home-video video, .home-vc video').forEach(o => { if (o !== v && !o.paused) o.pause(); });
    v.muted = !videoSoundOn;
    const p = v.play();
    if (p && p.then) p.then(() => { if (!v.muted) rxMaybeArm(v); }).catch(() => {});
    if (p && p.catch) p.catch(() => {
      // browser refused sound without a fresh tap — fall back to muted
      v.muted = true; videoSoundOn = false; vrSyncSoundUi(v);
      v.play().catch(() => {});
    });
    vrSyncSoundUi(v);
  }

  // View-once: record the view, then remove the video for this person only.
  async function vrMarkSeen(postId){
    if (!currentUser) return false;
    for (let i = 0; i < 2; i++){
      try {
        const { error } = await supabaseClient.from('post_seen').insert({ post_id: postId, user_id: currentUser.id });
        if (!error || error.code === '23505') return true;   // 23505 = already recorded
        console.warn('post_seen insert failed', error);
      } catch (e) { console.warn('post_seen insert threw', e); }
      await new Promise(r => setTimeout(r, 700));
    }
    return false;
  }
  // A view-once video never keeps playing in a background tab.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    document.querySelectorAll('.home-video.hv-once video').forEach(o => { try { o.pause(); } catch (_) {} });
  });
  function vrGoneForMe(wrap, v){
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (_) {}
    if (vrIO) vrIO.unobserve(v);
    vrObserved.delete(v);
    const media = wrap.closest('.home-post-media') || wrap;
    media.innerHTML = '<div class="hv-gone">\uD83D\uDC40 You watched this one. It\u2019s gone for you now, still there for anyone who hasn\u2019t.</div>';
  }


  // =========================================================
  // REACTION CAM
  // A friend watches your video; on the last few seconds we capture
  // their face (NO sound), show them a preview with a cancel button,
  // then send it to you. You watch it once and the server copy is
  // deleted the moment it is on your device. Off switch on every video.
  // =========================================================
  const RX_SECONDS = 5;                    // length of the reaction clip
  const RX_AUTOSEND_MS = 3000;             // preview window before it sends
  const RX_TTL_MS = 24 * 3600 * 1000;      // an unopened reaction is swept after a day
  const RX_ON_KEY = 'waater_rx_on';        // '0' = reactions off for this person
  const RX_INTRO_KEY = 'waater_rx_intro';  // the explainer was answered
  let rxBusy = null;                       // the capture in progress (warming / recording)
  let rxIntroOpen = false;
  let rxCamBlocked = false;
  const rxDone = new Set();                // posts already reacted to this session

  function rxEnabled(){ try { return localStorage.getItem(RX_ON_KEY) !== '0'; } catch (_) { return true; } }
  function rxIntroSeen(){ try { return localStorage.getItem(RX_INTRO_KEY) === '1'; } catch (_) { return false; } }
  function rxSetEnabled(on){
    try { localStorage.setItem(RX_ON_KEY, on ? '1' : '0'); } catch (_) {}
    document.querySelectorAll('.home-video').forEach(rxSyncChip);
  }
  function rxMime(){
    const list = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp8', 'video/webm'];
    return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }
  function rxSyncChip(wrap){
    const chip = wrap.querySelector('.hv-react');
    if (!chip) return;
    const on = rxEnabled();
    chip.classList.toggle('off', !on);
    const b = chip.querySelector('b');
    if (b) b.textContent = on ? 'React: on' : 'React: off';
    const snd = wrap.querySelector('.hv-sound');
    const last = snd && snd.lastChild;
    if (last && last.nodeType === 3) last.textContent = on ? 'Tap to watch & react' : 'Tap for sound';
  }

  // Who is this video from? null = we never react (own video, whisper, not signed in).
  function rxCardInfo(v){
    const card = v.closest('.home-post-card');
    if (!card || !currentUser) return null;
    if (card.querySelector('.home-post-delete') || card.classList.contains('whisper')) return null;
    const postId = card.dataset.postId, ownerId = card.dataset.ownerId;
    if (!postId || !ownerId || ownerId === currentUser.id) return null;
    const nameEl = card.querySelector('.home-post-head .who b');
    return { postId, ownerId, ownerName: (nameEl && nameEl.textContent) || 'your friend' };
  }

  function rxMaybeArm(v){
    if (!v || v._rxArmed || vrRecording || v.muted) return;
    if (!rxEnabled() || rxCamBlocked) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return;
    const info = rxCardInfo(v);
    if (!info || rxDone.has(info.postId)) return;
    if (!rxIntroSeen()){ rxShowIntro(v); return; }
    rxArm(v, info);
  }

  // Armed = listening to the video. The camera only opens ~1.4s before the last
  // RX_SECONDS and closes the moment the clip is done.
  function rxArm(v, info){
    v._rxArmed = true;
    const st = { v, info, state: 'idle', stream: null, rec: null, chunks: [], timer: null, tick: null, live: null, aborted: false, listeners: [] };
    const on = (el, ev, fn) => { el.addEventListener(ev, fn); st.listeners.push([el, ev, fn]); };
    st.check = () => {
      if (st.aborted || !v.duration || !isFinite(v.duration)) return;
      const left = v.duration - v.currentTime;
      if (st.state === 'idle' && left <= RX_SECONDS + 1.4) rxWarm(st);
      else if (st.state === 'ready' && left <= RX_SECONDS + 0.05) rxStart(st);
    };
    on(v, 'timeupdate', st.check);
    on(v, 'pause', () => { if (!v.ended && (st.state === 'warming' || st.state === 'ready')) rxCool(st); });
    on(v, 'ended', () => { if (st.state === 'recording') rxStop(st); });
    on(document, 'visibilitychange', () => {
      if (!document.hidden) return;
      if (st.state === 'recording') rxAbort(st);
      else if (st.state === 'warming' || st.state === 'ready') rxCool(st);
    });
  }
  function rxDetach(st){ st.listeners.forEach(([el, ev, fn]) => el.removeEventListener(ev, fn)); st.listeners = []; }
  function rxStopStream(st){ if (st.stream){ st.stream.getTracks().forEach(t => t.stop()); st.stream = null; } }

  async function rxWarm(st){
    if (rxBusy && rxBusy !== st) return;
    rxBusy = st; st.state = 'warming';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 }, frameRate: { ideal: 24, max: 30 } },
        audio: false
      });
      if (st.aborted || st.state !== 'warming'){ stream.getTracks().forEach(t => t.stop()); return; }
      st.stream = stream; st.state = 'ready';
      st.check();
    } catch (e) {
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){
        rxCamBlocked = true;
        showToast('Camera is blocked, so reactions are off', 'error');
      }
      rxAbort(st);
    }
  }
  // Back to idle (camera closed) without giving up on this video.
  function rxCool(st){
    rxStopStream(st);
    st.state = 'idle';
    if (rxBusy === st) rxBusy = null;
  }
  function rxStart(st){
    if (st.state !== 'ready' || !st.stream) return;
    let rec;
    try {
      const mime = rxMime();
      rec = new MediaRecorder(st.stream, mime ? { mimeType: mime, videoBitsPerSecond: 800000 } : { videoBitsPerSecond: 800000 });
    } catch (_) { rxAbort(st); return; }
    st.state = 'recording';
    st.rec = rec; st.mime = rec.mimeType || rxMime() || 'video/webm'; st.chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) st.chunks.push(e.data); };
    rec.onstop = () => rxFinish(st);
    rec.start(250);
    rxShowLive(st);
    st.timer = setTimeout(() => rxStop(st), RX_SECONDS * 1000 + 300);
  }
  function rxStop(st){
    if (st.state !== 'recording') return;
    st.state = 'stopping';
    clearTimeout(st.timer);
    try { st.rec.stop(); } catch (_) { rxAbort(st); }
  }
  function rxAbort(st){
    st.aborted = true;
    clearTimeout(st.timer);
    if ((st.state === 'recording' || st.state === 'stopping') && st.rec && st.rec.state !== 'inactive'){
      try { st.rec.stop(); return; } catch (_) {}   // onstop -> rxFinish discards it
    }
    rxHideLive(st); rxStopStream(st); rxDetach(st);
    if (rxBusy === st) rxBusy = null;
    st.state = 'done';
  }
  function rxFinish(st){
    rxHideLive(st); rxStopStream(st); rxDetach(st);
    const blob = new Blob(st.chunks, { type: (st.mime || 'video/webm').split(';')[0] });
    st.chunks = [];
    st.state = 'done';
    if (rxBusy === st) rxBusy = null;
    if (st.aborted || blob.size < 1500) return;
    rxDone.add(st.info.postId);
    rxShowSendSheet(st.info, blob, st.mime);
  }

  // The red self-view bubble: you always see when your camera is on. Tap it to cancel.
  function rxShowLive(st){
    const el = document.createElement('div');
    el.className = 'rx-live';
    el.innerHTML = '<video muted playsinline autoplay></video><span class="rx-live-tag"><i></i>Reacting <b>' + RX_SECONDS + '</b> \u2715</span>';
    const pv = el.querySelector('video');
    pv.srcObject = st.stream; pv.muted = true;
    pv.play().catch(() => {});
    el.addEventListener('click', () => rxAbort(st));
    document.body.appendChild(el);
    st.live = el;
    let n = RX_SECONDS;
    st.tick = setInterval(() => { n -= 1; const b = el.querySelector('b'); if (b) b.textContent = Math.max(0, n); }, 1000);
  }
  function rxHideLive(st){
    clearInterval(st.tick);
    if (st.live){ st.live.remove(); st.live = null; }
  }

  // Preview + 3 second window to cancel. Nothing leaves the phone before it ends.
  function rxShowSendSheet(info, blob, mime){
    const url = URL.createObjectURL(blob);
    const el = document.createElement('div');
    el.className = 'rx-sheet';
    el.innerHTML =
      '<div class="rx-sheet-card">' +
        '<video src="' + url + '" muted loop playsinline autoplay></video>' +
        '<div class="rx-sheet-txt"><b>Sending your reaction to ' + escapeHtml(info.ownerName) + '</b><span>They watch it once, then it\u2019s gone.</span></div>' +
        '<div class="rx-sheet-btns"><button type="button" class="rx-x">Cancel</button><button type="button" class="rx-go">Send now</button></div>' +
        '<i class="rx-bar"></i>' +
      '</div>';
    document.body.appendChild(el);
    const pv = el.querySelector('video');
    pv.muted = true; pv.play().catch(() => {});
    const bar = el.querySelector('.rx-bar');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = 'transform ' + RX_AUTOSEND_MS + 'ms linear';
      bar.style.transform = 'scaleX(0)';
      el.classList.add('in');
    }));
    let finished = false;
    let timer = null;
    const close = () => {
      clearTimeout(timer);
      el.classList.remove('in');
      setTimeout(() => { el.remove(); URL.revokeObjectURL(url); }, 280);
    };
    const go = async () => {
      if (finished) return;
      finished = true; close();
      try {
        await rxUpload(info, blob, mime);
        showToast('Reaction sent \uD83D\uDE2E');
        try { posthog.capture('reaction_sent', { circle_id: circleId, post_id: info.postId }); } catch (_) {}
      } catch (e) { console.warn('reaction not sent', e); }
    };
    timer = setTimeout(go, RX_AUTOSEND_MS);
    el.querySelector('.rx-go').addEventListener('click', go);
    el.querySelector('.rx-x').addEventListener('click', () => {
      if (finished) return;
      finished = true; close();
      showToast('Deleted. Nothing was sent.');
    });
  }

  async function rxUpload(info, blob, mime){
    const base = ((mime || blob.type || 'video/webm').split(';')[0].trim()) || 'video/webm';
    const ext = base.includes('mp4') ? 'mp4' : 'webm';
    const path = currentUser.id + '/' + circleId + '/' + info.postId + '.' + ext;
    const { error: upErr } = await supabaseClient.storage.from('reactions').upload(path, blob, { contentType: base, cacheControl: '60' });
    if (upErr){
      if (String(upErr.statusCode) !== '409') showToast('Couldn\u2019t send your reaction', 'error');
      throw upErr;
    }
    const { error: insErr } = await supabaseClient.from('reactions').insert({
      post_id: info.postId, circle_id: circleId, from_user: currentUser.id, to_user: info.ownerId, path
    });
    if (insErr){
      supabaseClient.storage.from('reactions').remove([path]);   // no orphan file
      if (insErr.code !== '23505') showToast('Couldn\u2019t send your reaction', 'error');
      throw insErr;
    }
  }

  // One-time explainer. Shown the first time sound-on playback would start a reaction.
  function rxShowIntro(v){
    if (rxIntroOpen) return;
    rxIntroOpen = true;
    try { v.pause(); } catch (_) {}
    const el = document.createElement('div');
    el.className = 'rx-intro';
    el.innerHTML =
      '<div class="rx-intro-card">' +
        '<div class="rx-intro-emoji">\uD83D\uDE2E</div>' +
        '<h3>Let them see your reaction</h3>' +
        '<p>While you watch a friend\u2019s video, we capture the last ' + RX_SECONDS + ' seconds of your face. No sound, and you get a preview with a cancel button before anything is sent.</p>' +
        '<ul>' +
          '<li>Only the friend who made the video gets it</li>' +
          '<li>They can watch it once, then it\u2019s deleted</li>' +
          '<li>Your camera light and a red bubble show whenever it\u2019s on</li>' +
          '<li>Turn it off any time with the \uD83D\uDE2E button on a video</li>' +
        '</ul>' +
        '<small>No app can stop a friend from screen-recording, so react how you\u2019d be fine with them seeing.</small>' +
        '<button class="rx-yes" type="button">Turn on reactions</button>' +

    el.querySelector('.rx-yes').addEventListener('click', async () => {

      // ask for the camera now, with the explanation fresh, then release it right away
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        s.getTracks().forEach(t => t.stop());
      } catch (e) {
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')){ rxCamBlocked = true; showToast('Camera is blocked, so reactions are off', 'error'); }
      }
      closeIntro();
      rxSetEnabled(true);
      try { posthog.capture('reaction_cam_opt_in', { circle_id: circleId }); } catch (_) {}
      if (v._onceResume) v._onceResume(); else vrPlay(v);
      setTimeout(() => rxMaybeArm(v), 400);
    });
    el.querySelector('.rx-no').addEventListener('click', () => {
      try { localStorage.setItem(RX_INTRO_KEY, '1'); } catch (_) {}
      closeIntro();
      rxSetEnabled(false);
      try { posthog.capture('reaction_cam_opt_out', { circle_id: circleId }); } catch (_) {}
      if (v._onceResume) v._onceResume(); else vrPlay(v);
    });

  // ---------- the other side: the friend who made the video ----------
  let rxInbox = [];
  let rxChannel = null;
  let rxViewerOpen = false;

  async function rxNames(ids){
    const out = {};
    const uniq = [...new Set(ids)].filter(Boolean);
    if (!uniq.length) return out;
    const { data } = await supabaseClient.from('profiles').select('id, username').in('id', uniq);
    (data || []).forEach(p => { out[p.id] = p.username; });
    return out;
  }

  async function rxInit(){
    if (!currentUser || !circleId) return;
    await rxLoadInbox();
    rxSubscribe();
  }

  async function rxLoadInbox(){
    try {
      const { data, error } = await supabaseClient.from('reactions')
        .select('id, post_id, from_user, path, created_at')
        .eq('to_user', currentUser.id).eq('circle_id', circleId)
        .order('created_at', { ascending: true }).limit(50);
      if (error || !data) return;
      const stale = data.filter(r => Date.now() - new Date(r.created_at).getTime() > RX_TTL_MS);
      const fresh = data.filter(r => stale.indexOf(r) === -1);
      if (stale.length){
        // never opened within a day: erase for real
        const { data: gone, error: e2 } = await supabaseClient.storage.from('reactions').remove(stale.map(r => r.path));
        if (!e2 && gone) await supabaseClient.from('reactions').delete().in('id', stale.map(r => r.id));
      }
      const names = await rxNames(fresh.map(r => r.from_user));
      rxInbox = fresh.map(r => ({ ...r, name: names[r.from_user] || 'a friend' }));
      rxRenderPill();
    } catch (_) {}
  }

  function rxSubscribe(){
    if (rxChannel) return;
    rxChannel = supabaseClient
      .channel('reactions-' + currentUser.id)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'reactions', filter: 'to_user=eq.' + currentUser.id },
        async (payload) => {
          const r = payload.new;
          if (!r || r.circle_id !== circleId || rxInbox.some(x => x.id === r.id)) return;
          const names = await rxNames([r.from_user]);
          const name = names[r.from_user] || 'a friend';
          rxInbox.push({ id: r.id, post_id: r.post_id, from_user: r.from_user, path: r.path, created_at: r.created_at, name });
          rxRenderPill(true);
          showToast(name + ' reacted to your video \uD83D\uDE2E');
          if (navigator.vibrate) navigator.vibrate(12);
        })
      .subscribe();
  }
  window.addEventListener('beforeunload', () => { if (rxChannel) supabaseClient.removeChannel(rxChannel); });

  function rxRenderPill(pop){
    let pill = document.getElementById('rxPill');
    const n = rxInbox.length;
    if (!n){ if (pill) pill.remove(); return; }
    if (!pill){
      pill = document.createElement('button');
      pill.type = 'button'; pill.id = 'rxPill'; pill.className = 'rx-pill';
      pill.addEventListener('click', rxOpenViewer);
      document.body.appendChild(pill);
    }
    pill.innerHTML = '<span class="rx-pill-e">\uD83D\uDE2E</span><b>' +
      (n === 1 ? escapeHtml(rxInbox[0].name) + ' reacted' : n + ' new reactions') +
      '</b><em>Tap to watch</em>';
    if (pop){ pill.classList.remove('pop'); void pill.offsetWidth; pill.classList.add('pop'); }
  }

  async function rxOpenViewer(){
    if (rxViewerOpen || !rxInbox.length) return;
    rxViewerOpen = true;
    document.querySelectorAll('.home-video video, .home-vc video').forEach(o => { try { o.pause(); } catch (_) {} });
    const el = document.createElement('div');
    el.className = 'rx-view';
    el.innerHTML = '<div class="rx-view-in"><div class="rx-view-name"></div><div class="rx-view-disc"><video playsinline muted></video></div><i class="rx-view-bar"></i><div class="rx-view-note">Gone for good after this</div></div>';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    while (rxInbox.length){
      const ok = await rxPlayOne(el, rxInbox[0]);
      if (!ok) break;          // could not load: keep it for next time
      rxInbox.shift();
      rxRenderPill();
    }
    el.classList.remove('in');
    setTimeout(() => el.remove(), 300);
    rxViewerOpen = false;
  }

  // Download the clip, erase the server copy straight away, then play it from memory.
  async function rxPlayOne(el, item){
    const disc = el.querySelector('.rx-view-disc');
    const pv = disc.querySelector('video');
    const bar = el.querySelector('.rx-view-bar');
    el.querySelector('.rx-view-name').textContent = item.name + ' reacted \uD83D\uDE2E';
    disc.classList.remove('gone');
    let blobUrl = null;
    try {
      const { data: signed, error: sErr } = await supabaseClient.storage.from('reactions').createSignedUrl(item.path, 60);
      if (sErr || !signed || !signed.signedUrl){
        await supabaseClient.from('reactions').delete().eq('id', item.id);   // file already gone: drop the dangling row
        return true;
      }
      const res = await fetch(signed.signedUrl);
      if (!res.ok) throw new Error('fetch ' + res.status);
      const blob = await res.blob();
      blobUrl = URL.createObjectURL(blob);
      const { data: removed, error: rmErr } = await supabaseClient.storage.from('reactions').remove([item.path]);
      if (!rmErr && removed && removed.length) await supabaseClient.from('reactions').delete().eq('id', item.id);
      else console.warn('reaction file was not erased from the server', rmErr);
    } catch (e) {
      showToast('Couldn\u2019t load that reaction. Try again.', 'error');
      return false;
    }
    await new Promise((resolve) => {
      let done = false;
      let cap = null;
      const finish = () => {
        if (done) return;
        done = true; clearTimeout(cap);
        disc.classList.add('gone');
        setTimeout(() => {
          try { pv.pause(); pv.removeAttribute('src'); pv.load(); } catch (_) {}
          URL.revokeObjectURL(blobUrl);
          resolve();
        }, 650);
      };
      cap = setTimeout(finish, (RX_SECONDS + 1.5) * 1000);
      pv.onended = finish; pv.onerror = finish;
      el.onclick = finish;             // tap to skip to the next one
      pv.src = blobUrl; pv.muted = true; pv.loop = false;
      bar.style.animation = 'none'; void bar.offsetWidth;
      bar.style.animation = 'rxbar ' + RX_SECONDS + 's linear forwards';
      pv.play().catch(() => {});
    });
    return true;
  }

  function initVideoCards(root = document){
    vrObserved.forEach(v => { if (!v.isConnected){ if (vrIO) vrIO.unobserve(v); vrObserved.delete(v); } });
    root.querySelectorAll('.home-video').forEach(wrap => {
      if (wrap.dataset.vbound) return;
      wrap.dataset.vbound = '1';
      const v = wrap.querySelector('video');
      const bar = wrap.querySelector('.hv-progress i');
      if (!v) return;
      const vcard = wrap.closest('.home-post-card');
      const vid = vcard && vcard.dataset.postId;
      const vOwn = !vcard || !!(currentUser && vcard.dataset.ownerId === currentUser.id);   // your own videos never vanish for you
      let vSeen = false;
      let played = 0, lastT = null, started = false;   // seconds REALLY played (never scrubbing, never paused/hidden time)
      if (!vOwn && vcard && vcard.dataset.ownerId && !vcard.classList.contains('whisper') && currentUser && vcard.dataset.ownerId !== currentUser.id){
        const chip = document.createElement('button');
        chip.type = 'button'; chip.className = 'hv-react'; chip.setAttribute('aria-label', 'Reactions on or off');
        chip.innerHTML = '<span>\uD83D\uDE2E</span><b></b>';
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          const turnOn = !rxEnabled();
          rxSetEnabled(turnOn);
          if (!turnOn && rxBusy) rxAbort(rxBusy);
          showToast(turnOn ? 'Reactions on: friends see your face for a few seconds' : 'Reactions off: no camera, nothing sent');
        });
        wrap.appendChild(chip);
        rxSyncChip(wrap);
      }
      const once = !vOwn && !!vid;
      if (once) {
        wrap.classList.add('hv-once');
        v.loop = false; v.removeAttribute('loop');
        const coverB = wrap.querySelector('.hv-cover b');
        const label = () => { if (coverB) coverB.textContent = played > 0.5 ? 'Tap to continue' : 'Tap to watch'; };
        // webm clips recorded in the browser can report an infinite duration; fall back to the saved length
        const getDur = () => (v.duration && isFinite(v.duration)) ? v.duration : (parseFloat(wrap.dataset.dur) || 0);
        const needed = () => { const d = getDur(); return d > 0 ? d * 0.9 : Infinity; };
        const markIfDone = () => { if (!vSeen && played >= needed()){ vSeen = true; vrMarkSeen(vid); } };
        v.addEventListener('play', () => { lastT = v.currentTime; });
        v.addEventListener('seeking', () => { lastT = null; });
        v.addEventListener('seeked', () => { lastT = v.currentTime; });
        v.addEventListener('playing', () => { lastT = v.currentTime; wrap.classList.add('hv-playing'); });
        ['pause', 'error'].forEach(ev => v.addEventListener(ev, () => { wrap.classList.remove('hv-playing'); label(); }));
        v.addEventListener('timeupdate', () => {
          const t = v.currentTime;
          if (v.paused || v.seeking || document.hidden || !wrap.classList.contains('hv-playing')){ lastT = t; return; }
          if (lastT !== null){ const d = t - lastT; if (d > 0 && d <= 1.25) played += d; }   // a jump is not watching
          lastT = t;
          markIfDone();
        });
        v.addEventListener('ended', () => {
          wrap.classList.remove('hv-playing');
          const d = getDur() || v.currentTime;
          if (lastT !== null && d - lastT > 0 && d - lastT <= 1.25) played += d - lastT;
          if (!vSeen && d > 0 && played >= d * 0.9){ vSeen = true; vrMarkSeen(vid); }
          if (vSeen){ setTimeout(() => vrGoneForMe(wrap, v), 350); return; }
          // it ended but it was not really watched: give it back, nothing is marked
          played = 0; lastT = null; started = false;
          try { v.currentTime = 0; } catch (_) {}
          label();
        });
        v._onceResume = () => {
          document.querySelectorAll('.home-video video, .home-vc video').forEach(o => { if (o !== v && !o.paused) o.pause(); });
          wrap.classList.remove('upaused');
          videoSoundOn = true; v.muted = false;
          if (!started){ started = true; try { v.currentTime = 0; } catch (_) {} }
          const pr = v.play();
          if (pr && pr.catch) pr.catch(() => { showToast('Could not play that video. Tap to try again', 'error'); });
        };
        label();
      }
      v.addEventListener('timeupdate', () => {
        if (bar && v.duration && isFinite(v.duration)) bar.style.width = (v.currentTime / v.duration * 100) + '%';
      });
      wrap.addEventListener('click', (e) => {
        e.stopPropagation();
        if (once){
          if (v.paused || v.ended){
            v._onceResume();
            if (navigator.vibrate) navigator.vibrate(6);
            setTimeout(() => rxMaybeArm(v), 400);
          } else {
            v.pause();
          }
          return;
        }
        if (v.muted){
          // first tap = sound on, from the very beginning (the start is where the tea is)
          videoSoundOn = true;
          wrap.classList.remove('upaused');
          v.muted = false;
          v.currentTime = 0;
          v.play().catch(() => { v.muted = true; videoSoundOn = false; vrSyncSoundUi(v); });
          vrSyncSoundUi(v);
          if (navigator.vibrate) navigator.vibrate(6);
          setTimeout(() => rxMaybeArm(v), 400);
        } else if (v.paused){
          wrap.classList.remove('upaused');
          v.play().catch(() => {});
        } else {
          wrap.classList.add('upaused');
          v.pause();
        }
      });
      if (vrIO){ vrIO.observe(v); vrObserved.add(v); }
    });
  }

  // ---- video replies: tap to play with sound, tap again to pause ----
  document.addEventListener('click', (e) => {
    const tile = e.target.closest('.home-vc');
    if (!tile) return;
    e.stopPropagation();
    const v = tile.querySelector('video');
    if (!v) return;
    if (v.paused){
      document.querySelectorAll('.home-video video, .home-vc video').forEach(o => { if (o !== v && !o.paused) o.pause(); });
      v.muted = false;
      v.play().catch(() => {});
    } else {
      v.pause();
    }
  });
  ['play', 'pause', 'ended'].forEach(ev => document.addEventListener(ev, (e) => {
    const v = e.target;
    if (!v || v.tagName !== 'VIDEO') return;
    const tile = v.closest('.home-vc');
    if (tile) tile.classList.toggle('playing', ev === 'play');
  }, true));

  // ---- background upload queue ----
  const vrJobs = new Map();
  let vrJobSeq = 0;
  let vrUploading = 0;
  let vrOpen = false;
  window.addEventListener('beforeunload', (e) => {
    if (vrUploading > 0){ e.preventDefault(); e.returnValue = ''; }
  });

  function vrRenderPending(job){
    const feed = document.getElementById('homeFeed');
    if (!feed) return;
    let card = document.getElementById('vrp-' + job.id);
    if (!card){
      card = document.createElement('div');
      card.id = 'vrp-' + job.id;
      card.className = 'vr-pending';
      feed.prepend(card);
    }
    const failed = !!job.failedMsg;
    card.classList.toggle('failed', failed);
    const mb = (job.blob.size / 1048576).toFixed(1);
    card.innerHTML = `
      <div class="vr-pending-media"><video src="${job.objectUrl}" muted loop autoplay playsinline></video></div>
      <div class="vr-pending-bar">
        ${failed ? '' : '<span class="vr-spin"></span>'}
        <div>${failed ? 'Couldn\u2019t send' : 'Sending to your circle\u2026'}<div class="sub">${failed ? escapeHtml(job.failedMsg) : mb + ' MB'}</div></div>
        ${failed ? '<div class="vr-pending-actions"><button type="button" data-vr="discard">Discard</button><button type="button" class="go" data-vr="retry">Retry</button></div>' : ''}
      </div>`;
    const retry = card.querySelector('[data-vr="retry"]');
    const discard = card.querySelector('[data-vr="discard"]');
    if (retry) retry.addEventListener('click', () => { job.failedMsg = ''; vrRenderPending(job); vrRunUpload(job); });
    if (discard) discard.addEventListener('click', () => {
      if (!window.confirm('Discard this video? It hasn\u2019t been sent yet.')) return;
      vrJobs.delete(job.id);
      URL.revokeObjectURL(job.objectUrl);
      card.remove();
    });
  }

  function vrRestorePending(){
    vrJobs.forEach(job => { if (!document.getElementById('vrp-' + job.id)) vrRenderPending(job); });
  }

  async function vrRunUpload(job){
    vrUploading++;
    let uploadedPath = null;
    try {
      const baseMime = ((job.mime || 'video/mp4').split(';')[0].trim()) || 'video/mp4';
      const ext = baseMime.includes('mp4') ? 'mp4' : baseMime.includes('quicktime') ? 'mov' : 'webm';
      const path = `${currentUser.id}/${circleId}/${Date.now()}.${ext}`;
      const { error: upErr } = await supabaseClient.storage

    let nativeOpen = false;
    const resumeCam = () => {
      if (!nativeOpen) return;
      // give a just-picked file time to arrive (change event) before deciding they backed out
      setTimeout(() => {
        if (!nativeOpen) return;
        nativeOpen = false;
        if (!closed && state !== 'review' && !sending && !(stream && stream.active)) startCamera(facing);
      }, 1200);
    };
    if (nativeChip) nativeChip.addEventListener('click', () => {
      if (state !== 'ready') return;
      try { posthog.capture('video_native_camera', { circle_id: circleId, degraded: VIDEO_DEGRADED, low_end: VIDEO_LOW_END }); } catch (_) {}
      nativeOpen = true;
      stopStream();                      // release the camera so the native app can use it
      fileInput.setAttribute('capture', facing === 'user' ? 'user' : 'environment');
      fileInput.click();
      window.addEventListener('focus', resumeCam, { once: true });   // user backed out
    });
    fileInput.addEventListener('cancel', resumeCam);
    fileInput.addEventListener('change', () => { nativeOpen = false; });
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!f) return;
      if (!/^video\//.test(f.type) && !/\.(mp4|mov|m4v|webm)$/i.test(f.name)){ showToast('That doesn\u2019t look like a video', 'error'); return; }
      if (f.size > VIDEO_MAX_BYTES){ showToast('That video is over 50 MB \u2014 try a shorter one', 'error'); return; }
      const url = URL.createObjectURL(f);
      const probe = document.createElement('video');
      const done = (d) => {
        URL.revokeObjectURL(url);
        if (closed) return;
        if (mode === 'post' && d > VR_QUICK_SECONDS + 0.5){
          showToast('Videos are ' + VR_QUICK_SECONDS + ' seconds max \u2014 trim it and try again', 'error');
          return;
        }
        enterReview({ blob: f, mime: f.type || 'video/mp4', duration: d, source: 'library' });
      };
      probe.preload = 'metadata';
      probe.onloadedmetadata = () => done(isFinite(probe.duration) ? probe.duration : 0);
      probe.onerror = () => done(0);
      probe.src = url;
    });

    $('vrRetake').addEventListener('click', () => {
      if (sending) return;
      review.pause(); review.removeAttribute('src'); review.load();
      if (reviewUrl){ URL.revokeObjectURL(reviewUrl); reviewUrl = null; }
      take = null;
      try { posthog.capture('video_retake', { circle_id: circleId }); } catch (_) {}
      const t = stream && stream.getVideoTracks()[0];
      if (t && t.readyState === 'live') goReady();
      else startCamera(facing);
    });

    let expChoice = null;
    const send = async () => {
      if (!take) return;
      if (mode === 'comment'){
        // Video reply: the take stays on screen until it's really posted,
        // so a bad connection never costs anyone their recording.
        if (sending) return;
        sending = true;
        const sendBtn = $('vrSend');
        const sendHtml = sendBtn.innerHTML;
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending\u2026';
        try {
          await sendVideoComment(opts.postId, take.blob, take.mime, take.duration, opts.card);
          showToast('Video reply sent');
          sending = false;
          teardown();
        } catch (err){
          sending = false;
          sendBtn.disabled = false;
          sendBtn.innerHTML = sendHtml;
          showToast((err && err.message) || 'Could not send \u2014 try again', 'error');
        }
        return;
      }
      if (!expChoice){ vrAskExpiry((h) => { expChoice = h; send(); }); return; }
      const job = Object.assign({}, take, { caption: caption.value.trim(), expires_hours: expChoice });
      const usedComposerText = !!prefill && job.caption === prefill;
      teardown();
      if (usedComposerText && composerText){
        composerText.value = ''; composerText.style.height = 'auto';
        composerText.dispatchEvent(new Event('input'));
      }
      vrEnqueueUpload(job);
      try { showToast('\u23f3 This video disappears in ' + expChoice + (expChoice === 1 ? ' hour' : ' hours')); } catch (_) {}
      if (typeof opts.onSent === 'function'){ try { opts.onSent(); } catch (_) {} }
    };
    $('vrSend').addEventListener('click', send);
    caption.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); send(); } });

    // ---- prompt + length + emoji wiring ----
    newPrompt();
    renderLen();
    $('vrShuffle').addEventListener('click', () => {
      if (state === 'recording') return;
      newPrompt();
      try { posthog.capture('video_prompt_shuffled', { circle_id: circleId, mode }); } catch (_) {}
    });
    // 30s is the only length now, so the pill is just a label.
    lenBtn.disabled = true;
    root.querySelectorAll('#vrQuick button').forEach(b => b.addEventListener('click', () => {
      caption.value = (caption.value + ' ' + b.dataset.e).trim();
      if (navigator.vibrate) navigator.vibrate(6);
    }));

    // ---- blur shield wiring ----
    const renderBlurTgl = () => {
      blurTgl.textContent = '\uD83E\uDEE7 Blur ' + (blurOn ? 'on' : 'off');
      blurTgl.classList.toggle('on', blurOn);
      blurTgl.setAttribute('aria-pressed', blurOn ? 'true' : 'false');
    };
    const setBlur = (on) => {
      blurOn = on;
      try { localStorage.setItem(VR_BLUR_KEY, on ? '1' : '0'); } catch (_) {}
      renderBlurTgl();
      if (state === 'ready') goReady();
    };
    renderBlurTgl();
    blurTgl.addEventListener('click', () => {
      if (state === 'recording') return;
      setBlur(!blurOn);
      try { posthog.capture('video_blur_toggled', { circle_id: circleId, on: blurOn }); } catch (_) {}
    });
    const peekOn = (e) => { e.preventDefault(); review.classList.remove('vr-veil'); };
    const peekOff = () => { if (take && take.source === 'camera' && blurOn) review.classList.add('vr-veil'); };
    peekBtn.addEventListener('pointerdown', peekOn);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => peekBtn.addEventListener(ev, peekOff));
    peekBtn.addEventListener('contextmenu', (e) => e.preventDefault());

    let introSeen = false;
    try { introSeen = !!localStorage.getItem(VR_BLUR_INTRO_KEY); } catch (_) {}
    if (!introSeen){
      vrBlurIntro((on) => {
        try { localStorage.setItem(VR_BLUR_INTRO_KEY, '1'); } catch (_) {}
        try { posthog.capture('video_blur_intro', { circle_id: circleId, chose_blur: on }); } catch (_) {}
        if (!closed) setBlur(on);
      });
    }

    startCamera('user');
  }

    root.querySelectorAll('.home-comment-cam').forEach(btn => {

      });
    });

    root.querySelectorAll('.home-comment-mic').forEach(btn => {
      const card = btn.closest('.home-post-card');
      const postId = btn.dataset.postId;
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let timerInterval = null;
      const timerEl = card.querySelector('.home-comment-rec-timer');

      btn.addEventListener('click', async () => {
        if (!requireAuth()) return;

        if (btn.classList.contains('recording')) {
          mediaRecorder.stop();
          return;
        }

        try {
          const stream = await getVoiceStream();
          mediaRecorder = createVoiceRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            timerEl.style.display = 'none';
            btn.classList.remove('recording');

            const durationSeconds = (Date.now() - startTime) / 1000;
            const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });

            btn.disabled = true;
            try {
              await sendVoiceComment(postId, blob, durationSeconds, card);
              showToast('Voice comment posted');
            } catch (err) {
              showToast(err.message || 'Could not post voice comment', 'error');
            } finally {
              btn.disabled = false;
            }
          };

          const MAX_RECORDING_SECONDS = 60;

          mediaRecorder.start();
          startTime = Date.now();
          btn.classList.add('recording');
          timerEl.style.display = 'inline';
          timerInterval = setInterval(() => {
            const secs = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_RECORDING_SECONDS) {
              mediaRecorder.stop();
            }
          }, 250);

        } catch (err) {
          showToast('Microphone access denied or unavailable', 'error');
        }
      });
    });
  }

  async function loadActivePrompt(){
    if (!currentUser) return null;

    // A deep link (?prompt=<id>) is honoured first, but it's no longer the
    // *only* way to see a question. Previously, if the recipient opened the
    // circle normally instead of the exact clipboard link, this returned
    // null and they'd never learn a question was waiting for them.
    const promptId = params.get('prompt');
    if (promptId){
      const { data, error } = await supabaseClient
        .from('golden_hour_prompts')
        .select('id, from_user_id, question, answered_at, created_at, is_anonymous')
        .eq('id', promptId)
        .eq('to_user_id', currentUser.id)
        .is('answered_at', null)
        .maybeSingle();
      if (!error && data) return data;
      // Link was stale, already answered, or wrong — fall through and still
      // check for whatever's actually waiting, instead of showing nothing.
    }

    const { data, error } = await supabaseClient
      .from('golden_hour_prompts')
      .select('id, from_user_id, question, answered_at, created_at, is_anonymous')
      .eq('to_user_id', currentUser.id)
      .eq('circle_id', circleId)
      .is('answered_at', null)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();
    if (error){ console.error('loadActivePrompt failed', error); return null; }
    return data;
  }

  function groupPhotosByMonth(photos){
    const groups = new Map();
    photos.forEach(p => {
      const d = new Date(p.created_at);
      const key = isNaN(d) ? 'Earlier' : d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    return groups;
  }

  // =========================================================
  // GOLDEN HOUR — gating (5-6pm, once a day) + the feed card
  // =========================================================
  const GOLDEN_HOUR_START = 17; // 5pm
  const GOLDEN_HOUR_END = 18;   // 6pm
  const GH_OVERRIDE_KEY = 'waater_gh_test_override';

  // Testing helper: visit this page once with ?ghtest=1 in the URL and
  // Golden Hour will stay "live" on this device/browser until you visit
  // with ?ghtest=0 (or clear it from the test banner on the card).
  (function applyGoldenHourTestParam(){
    const v = params.get('ghtest');
    if (v === '1') localStorage.setItem(GH_OVERRIDE_KEY, '1');
    if (v === '0') localStorage.removeItem(GH_OVERRIDE_KEY);
  })();

  function isGoldenHourOverrideOn(){
    return localStorage.getItem(GH_OVERRIDE_KEY) === '1';
  }

  function isGoldenHourNow(){
    if (isGoldenHourOverrideOn()) return true;
    const h = new Date().getHours();
    return h >= GOLDEN_HOUR_START && h < GOLDEN_HOUR_END;
  }

  // A prompt unlocks at 6pm on the day it was sent (prompts can only be
  // sent 5-6pm, so this is always "later today" relative to created_at).
  function goldenHourRevealTime(prompt){
    const d = new Date(prompt.created_at || Date.now());
    d.setHours(GOLDEN_HOUR_END, 0, 0, 0);
    return d.getTime();
  }
  function isPromptRevealed(prompt){
    if (!prompt) return false;
    if (isGoldenHourOverrideOn()) return true; // test mode: skip the wait
    return Date.now() >= goldenHourRevealTime(prompt);
  }

  function msUntilHour(hour){
    const now = new Date();
    const t = new Date(now);
    t.setHours(hour, 0, 0, 0);
    if (t <= now) t.setDate(t.getDate() + 1);
    return t - now;
  }

  function formatCountdown(ms){
    ms = Math.max(0, ms);
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  async function hasSentGoldenHourPromptToday(){
    if (isGoldenHourOverrideOn()) return false; // testing: never block yourself
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    const { data, error } = await supabaseClient
      .from('golden_hour_prompts')
      .select('id')
      .eq('circle_id', circleId)
      .eq('from_user_id', currentUser.id)
      .gte('created_at', startOfDay.toISOString())
      .limit(1);
    if (error){ console.error('hasSentGoldenHourPromptToday failed', error); return false; }
    return !!(data && data.length);
  }

  async function initGoldenHourCard(){

  function renderGoldenHourCard(){
    const card = document.getElementById('goldenHourCard');

    const others = members.filter(m => m.id !== currentUser?.id);

        <button class="gh-chip" type="button" data-user-id="${m.id}" data-username="${escapeHtml(m.username || 'Someone')}">

      card.innerHTML = `
        <div class="gh-head">
          <span class="gh-dot live"></span>
          <span class="gh-eyebrow">Golden Hour · live</span>
          <span class="gh-countdown" id="ghCountdown"></span>
        </div>
        <div class="gh-question">Say the thing you'd never say with your name on it. They won't know it was you.</div>
        <div class="gh-chip-row">${chips}</div>
      `;
    } else if (live && goldenHourAskedToday){
      card.innerHTML = `
        <div class="gh-head">
          <span class="gh-dot live"></span>
          <span class="gh-eyebrow">Golden Hour · live</span>
          <span class="gh-countdown" id="ghCountdown"></span>
        </div>
        <div class="gh-question">Sent. Somewhere in this circle, someone's about to wonder who asked. Back tomorrow at 5.</div>
      `;
    } else {
      card.innerHTML = `
        <div class="gh-head">
          <span class="gh-dot"></span>
          <span class="gh-eyebrow">Golden Hour in <span class="gh-countdown" id="ghCountdown"></span></span>
        </div>
        <div class="gh-question">One hour a day, one anonymous question — the one you'd never ask out loud.</div>
        <div class="gh-chip-row">${others.map(m => `
          <span class="gh-chip disabled" data-username="${escapeHtml(m.username || 'Someone')}">
            <span class="gh-chip-avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username || '?')}</span>
            <span>${escapeHtml(m.username || 'Someone')}</span>
          </span>`).join('')}</div>
      `;
    }

    if (isGoldenHourOverrideOn()){

      if (off) off.addEventListener('click', () => {

      });

    wireGoldenHourCard();
    startGoldenHourTicker();

  function wireGoldenHourCard(){
    document.querySelectorAll('#goldenHourCard .gh-chip[data-user-id]').forEach(chip => {
      chip.addEventListener('click', () => {

        openSendPromptModal(chip.dataset.userId, chip.dataset.username);
      });
    });
    document.querySelectorAll('#goldenHourCard .gh-chip.disabled').forEach(chip => {
      chip.addEventListener('click', () => showToast("Golden Hour isn't open yet — come back at 5pm", 'error'));

  function startGoldenHourTicker(){
    clearInterval(goldenHourTimer);
    ghLastLiveState = isGoldenHourNow();
    updateGoldenHourCountdownText();
    goldenHourTimer = setInterval(() => {
      const nowLive = isGoldenHourNow();
      if (nowLive !== ghLastLiveState){
        ghLastLiveState = nowLive;
        clearInterval(goldenHourTimer);
        initGoldenHourCard();
        return;
      }
      updateGoldenHourCountdownText();
    }, 1000);
  }

  function updateGoldenHourCountdownText(){
    const target = document.getElementById('ghCountdown');
    if (!target){ clearInterval(goldenHourTimer); return; }
    target.textContent = isGoldenHourNow()
      ? formatCountdown(msUntilHour(GOLDEN_HOUR_END))
      : formatCountdown(msUntilHour(GOLDEN_HOUR_START));

  // GOLDEN HOUR — send a prompt to another member

  function openSendPromptModal(toUserId, toUsername){
    const modal = document.createElement('div');
    modal.className = 'invite-modal-backdrop';
    modal.innerHTML = `
      <div class="invite-modal">
        <h3>Ask ${escapeHtml(toUsername)} something</h3>
        <p>They'll see a blurred card waiting for them — it only unlocks once Golden Hour ends.</p>
        <textarea id="promptQuestionInput" maxlength="200" placeholder="What do you want to ask them?"></textarea>
        <div class="gh-send-as" role="radiogroup" aria-label="Send as">
          <label class="gh-send-as-opt">
            <input type="radio" name="ghSendAs" value="anon" checked>
            <span>Send anonymously</span>
          </label>
          <label class="gh-send-as-opt">
            <input type="radio" name="ghSendAs" value="self">
            <span>Send as yourself</span>
          </label>
        </div>
        <p class="gh-send-as-note">Either way, ${escapeHtml(toUsername)} only sees "Someone asked you something" until the blur lifts.</p>
        <div class="invite-modal-row">
          <button class="invite-modal-skip" type="button" id="promptModalCancel">Cancel</button>
          <button class="invite-modal-send" type="button" id="promptModalSend">Send</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 220); };
    modal.querySelector('#promptModalCancel').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    modal.querySelector('#promptModalSend').addEventListener('click', async () => {
      const question = modal.querySelector('#promptQuestionInput').value.trim();
      if (!question) return;
      const isAnon = modal.querySelector('input[name="ghSendAs"]:checked')?.value !== 'self';

      if (!isGoldenHourNow()){
        showToast("Golden Hour just closed — try again tomorrow at 5", 'error');
        return;
      }
      if (await hasSentGoldenHourPromptToday()){
        showToast("You've already sent your question for today", 'error');
        return;
      }

      const sendBtn = modal.querySelector('#promptModalSend');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        const { data, error } = await supabaseClient
          .from('golden_hour_prompts')
          .insert({
            circle_id: circleId,
            from_user_id: currentUser.id,
            to_user_id: toUserId,
            question,
            is_anonymous: isAnon,
          })
          .select('id')
          .single();
        if (error) throw error;

        const link = `${window.location.origin}/circle?private&ID=${encodeURIComponent(circleId)}&prompt=${encodeURIComponent(data.id)}`;
        await navigator.clipboard.writeText(link);
        showToast('Question sent — link copied 🔗');
        goldenHourAskedToday = true;
        renderGoldenHourCard();
        close();
      } catch (err) {
        if (err.code === '23505'){
          showToast("You've already sent your question for today", 'error');
          goldenHourAskedToday = true;
          renderGoldenHourCard();
        } else {
          showToast(err.message || 'Could not send question', 'error');
        }
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    });
  }

    }
    // The newest photo gets one featured slot up top; everything else,
    // including that same photo's neighbours, keeps strict chronological
    // order in the grid below so scrolling still reads like a timeline.
    const [heroPhoto, ...rest] = photos;
    const groups = groupPhotosByMonth(rest);

  // Fires the pop + flash + notification the moment a pending prompt's
  // blur is due to lift — whether the person is staring at the card when
  // it happens, or opens the tab again after 6pm has already passed.
  let promptRevealTicker = null;
  function startPromptRevealTicker(){
    clearInterval(promptRevealTicker);
    promptRevealTicker = setInterval(() => {
      if (!activePrompt || activePrompt.answered_at){ clearInterval(promptRevealTicker); return; }
      const countdownEl = document.getElementById('ghRevealCountdown');
      if (countdownEl) countdownEl.textContent = formatCountdown(msUntilHour(GOLDEN_HOUR_END));
      if (revealNotifiedIds.has(activePrompt.id) || !isPromptRevealed(activePrompt)) return;
      revealNotifiedIds.add(activePrompt.id);

  function triggerPromptReveal(prompt){
    const banner = document.getElementById('promptPinBanner');
    const asker = members.find(m => m.id === prompt.from_user_id);
    const name = prompt.is_anonymous ? 'Anonymous' : (asker?.username || 'Someone');
    if (banner && banner.dataset.promptId === String(prompt.id) && !banner.classList.contains('revealed')){
      banner.classList.add('revealed');
      const eyebrowText = document.getElementById('ghRevealEyebrowText');
      if (eyebrowText) eyebrowText.textContent = `${name} asked you something`;
      document.getElementById('ghRevealLock')?.remove();
      if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
      const flash = document.createElement('div');
      flash.className = 'gh-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 500);
    }
    showToast(`🌇 Golden Hour's over — ${name === 'Anonymous' ? "your question" : name + "'s question"} is revealed`);
    // No local Notification() call here anymore — the golden-hour-notify
    // cron sends a real push (or email) server-side now, so firing one
    // here too would just double-notify anyone with the tab open.
  }

  // =========================================================
  // GOLDEN HOUR — reveal notification preference (push vs. email)
  // Shown once per person, only when they actually have a pending,
  // unrevealed question waiting — not on every page load.
  // =========================================================
  const VAPID_PUBLIC_KEY = 'BIalNH9oKrDmbPECZvnf1Eu2J7V7xj81xNMOS-MARE8zXNa3HqyI4HJjhRV5MnJY6-5tXpcv_CFKfxHEB4fFzJ8';

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
  }

  async function registerServiceWorker(){
    if (!('serviceWorker' in navigator)) return null;
    try { return await navigator.serviceWorker.register('/sw.js'); }
    catch (err){ console.error('Service worker registration failed:', err); return null; }
  }

  async function subscribeToPush(){
    if (!('PushManager' in window) || !currentUser) return;
    const registration = await registerServiceWorker();
    if (!registration) return;
    try {
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription){
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      const raw = subscription.toJSON();
      const { error } = await supabaseClient.from('push_subscriptions').upsert(
        { user_id: currentUser.id, endpoint: raw.endpoint, p256dh: raw.keys.p256dh, auth: raw.keys.auth },
        { onConflict: 'endpoint' }
      );
      if (error) throw error;
    } catch (err){ console.error('Push subscription failed:', err); }
  }

  async function setGhNotifyChannel(channel){
    currentUserGhChannel = channel;
    if (!currentUser) return;
    const { error } = await supabaseClient.from('profiles').update({ gh_notify_channel: channel }).eq('id', currentUser.id);
    if (error) console.error('setGhNotifyChannel failed', error);
  }

  // Decides whether to ask, silently reconcile, or do nothing — the actual
  // Yes/No prompt only ever shows when there's a real pending question AND
  // the person hasn't already told us push or email before.
  async function maybePromptGoldenHourNotify(){
    if (!currentUser || !activePrompt || isPromptRevealed(activePrompt)) return;

    if (!('Notification' in window) || !('PushManager' in window)){
      if (currentUserGhChannel !== 'email') await setGhNotifyChannel('email');
      return;
    }
    if (Notification.permission === 'denied'){
      if (currentUserGhChannel !== 'email') await setGhNotifyChannel('email');
      return;
    }
    if (Notification.permission === 'granted'){
      if (currentUserGhChannel !== 'push') await setGhNotifyChannel('push');
      await subscribeToPush();
      return;
    }
    // Notification.permission === 'default' — never decided before.
    if (currentUserGhChannel !== 'unset') return;
    showGoldenHourNotifyOverlay();
  }

  function showGoldenHourNotifyOverlay(){
    if (document.getElementById('ghNotifOverlay')) return;
    const overlay = document.createElement('div');
    overlay.className = 'invite-modal-backdrop';
    overlay.id = 'ghNotifOverlay';
    overlay.innerHTML = `
      <div class="invite-modal">
        <h3>Enable notifications</h3>
        <p>We'll ping you the second Golden Hour ends and your card unblurs. Say no and we'll email you instead — this is just for Golden Hour, your other email settings aren't touched.</p>
        <div class="invite-modal-row">
          <button class="invite-modal-skip" type="button" id="ghNotifNoBtn">No, email me</button>
          <button class="invite-modal-send" type="button" id="ghNotifYesBtn">Yes, notify me</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    const close = () => { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 220); };

    overlay.querySelector('#ghNotifNoBtn').addEventListener('click', async () => {
      await setGhNotifyChannel('email');
      showToast("Got it — we'll email you when it unblurs 📧");
      close();
    });
    overlay.querySelector('#ghNotifYesBtn').addEventListener('click', async () => {
      close();
      try {
        const result = await Notification.requestPermission();
        if (result === 'granted'){
          await setGhNotifyChannel('push');
          await subscribeToPush();
          showToast('Notifications on 🔔');
        } else {
          // They said yes here but denied the real browser prompt — fall
          // back to email rather than leaving them with nothing.
          await setGhNotifyChannel('email');
          showToast("No worries — we'll email you instead 📧");
        }
      } catch (err){
        console.error('Notification permission request failed:', err);
        await setGhNotifyChannel('email');
      }
    });
  }

  function openGalleryLightbox(photos, startIndex){
    let idx = startIndex;
    const overlay = document.createElement('div');
    overlay.className = 'album-lightbox-backdrop';

    const close = () => {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => overlay.remove(), 200);
    };

    function render(){
      const photo = photos[idx];
      const m = members.find(x => x.id === photo.user_id);
      const name = m?.username || 'Someone';
      overlay.innerHTML = `
        <button class="album-lightbox-close" id="albumLbClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="album-lightbox">
          ${photos.length > 1 ? `
          <button class="album-lightbox-nav album-lightbox-prev" id="albumLbPrev" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="album-lightbox-nav album-lightbox-next" id="albumLbNext" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
          </button>` : ''}
          <img src="${escapeHtml(photo.photo_url)}" alt="">
          <div class="album-lightbox-info">
            <span>${escapeHtml(name)}${photo.caption ? ' · ' + escapeHtml(photo.caption) : ''}</span>
            <span>${timeAgo(photo.created_at)}</span>
          </div>
        </div>
      `;
      overlay.querySelector('#albumLbClose').addEventListener('click', close);
      const prevBtn = overlay.querySelector('#albumLbPrev');
      const nextBtn = overlay.querySelector('#albumLbNext');
      if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx - 1 + photos.length) % photos.length; render(); });
      if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx + 1) % photos.length; render(); });
    }

    function onKey(e){
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft' && photos.length > 1){ idx = (idx - 1 + photos.length) % photos.length; render(); }
      else if (e.key === 'ArrowRight' && photos.length > 1){ idx = (idx + 1) % photos.length; render(); }
    }

    render();
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => overlay.classList.add('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  }
