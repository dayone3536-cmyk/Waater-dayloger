<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-2:#ffb199;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --nav-w:248px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --pub-up:#ff5a36;
    --pub-down:#7c8cff;
    --pub-bg:#f6f6f4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}
  img{display:block;max-width:100%;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  .app{display:flex;max-width:1180px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);z-index:20;
  }
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:2px;}
  .wordmark .dot{color:var(--accent);}
  .topbar-back{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-soft);}
  .topbar-back svg{width:16px;height:16px;stroke:var(--ink-soft);}

  .sidebar{
    display:none;width:var(--nav-w);flex-shrink:0;padding:28px 18px;
    flex-direction:column;height:100vh;position:sticky;top:0;
  }
  .sidebar .wordmark{font-size:24px;padding:0 10px;margin-bottom:36px;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:12px;
    font-family:var(--font-display);font-size:15.5px;font-weight:500;
    color:var(--ink-soft);transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{width:22px;height:22px;flex-shrink:0;}
  .nav-item:hover{background:#f7f7f8;color:var(--ink);}
  .nav-item.active{color:var(--ink);}
  .nav-item.active svg{stroke:var(--accent);}
  .nav-create{margin-top:14px;background:var(--ink);color:var(--white)!important;justify-content:center;font-weight:600;padding:13px 12px;}
  .nav-create:hover{background:#000;}
  .nav-create svg{stroke:var(--white);}

  .sidebar-profile{
    margin-top:auto;display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    transition:border-color .16s var(--ease);
  }
  .sidebar-profile:hover{border-color:var(--line-strong);}
  .mini-avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:14px;overflow:hidden;
  }
  .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .sidebar-profile .who{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0;}
  .sidebar-profile .who span:first-child{font-family:var(--font-display);font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-profile .who span:last-child{font-family:var(--font-mono);font-size:11px;color:var(--grey);}
  .sidebar-signout{font-family:var(--font-mono);font-size:10px;color:var(--grey);padding:4px 6px;border-radius:6px;flex-shrink:0;}
  .sidebar-signout:hover{color:var(--accent);}
  .sidebar-signin{
    margin-top:auto;display:block;text-align:center;background:var(--ink);color:#fff!important;
    font-family:var(--font-display);font-weight:600;font-size:13.5px;padding:12px;border-radius:12px;
    transition:background .16s var(--ease);
  }
  .sidebar-signin:hover{background:#000;}

  @media (min-width:900px){
    body{padding-bottom:0;}
    .topbar{display:none;}
    .sidebar{display:flex;}
  }

  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:64px;
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-around;z-index:30;
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--grey);font-family:var(--font-mono);font-size:9.5px;letter-spacing:.02em;padding:6px 10px;transition:transform .12s var(--ease);}
  .tab:active{transform:scale(.92);}
  .tab svg{width:22px;height:22px;stroke:var(--grey);}
  .tab.active{color:var(--ink);}
  .tab.active svg{stroke:var(--ink);}
  .tab-create{position:relative;top:-20px;}
  .tab-create .ring{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,90,54,.4);}
  .tab-create svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;}
  .tab-create span{display:none;}
  @media (min-width:900px){ .bottom-nav{display:none;} }

  @keyframes riseIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .mini-spinner{
    width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;flex-shrink:0;
  }

  .page-loading, .page-error{
    padding:80px 22px;text-align:center;
    font-family:var(--font-mono);font-size:12px;color:var(--grey);
  }
  .page-error h2{font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:8px;font-weight:700;}
  .page-error a{color:var(--accent);text-decoration:underline;}

  .home-hero{
    padding:30px 22px 20px;
    background:linear-gradient(180deg, var(--accent-soft), rgba(255,241,236,0) 70%);
    border-bottom:1px solid var(--line);
  }
  .home-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .home-hero h1{
    font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-0.01em;
  }
  .home-hero .home-sub{
    font-family:var(--font-serif);font-size:14px;color:var(--ink-soft);margin-top:5px;
  }
  .home-settings-btn{
    flex-shrink:0;width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line-strong);
    transition:border-color .15s ease, transform .1s ease;
  }
  .home-settings-btn:hover{border-color:var(--accent);}
  .home-settings-btn:active{transform:scale(.94);}
  .home-settings-btn svg{width:16px;height:16px;stroke:var(--ink-soft);}

  .home-people-row{
    display:flex;gap:14px;margin-top:20px;overflow-x:auto;padding-bottom:4px;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .home-people-row::-webkit-scrollbar{display:none;}
  .home-person{
    display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:56px;
  }
  .home-person .ring{
    width:52px;height:52px;border-radius:50%;padding:2.5px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    display:flex;align-items:center;justify-content:center;
  }
  .home-person .ring-inner{
    width:100%;height:100%;border-radius:50%;background:#fff;padding:2px;
  }
  .home-person .avatar{
    width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:15px;overflow:hidden;
  }
  .home-person .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-person span{
    font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);
    max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .home-composer{
    margin:18px 22px 0;
    background:#fff;border:1px solid var(--line-strong);border-radius:20px;
    padding:16px;
  }
  .home-composer textarea{
    width:100%;border:none;resize:none;outline:none;
    font-family:var(--font-serif);font-size:15px;color:var(--ink);
    min-height:44px;max-height:180px;line-height:1.5;
  }
  .home-composer textarea::placeholder{color:var(--grey);}
  .home-composer-media{margin-top:8px;}
  .home-composer-media input{
    width:100%;border:1px dashed var(--line-strong);border-radius:12px;
    padding:9px 12px;font-family:var(--font-mono);font-size:11px;outline:none;
    transition:border-color .15s ease;
  }
  .home-composer-media input:focus{border-color:var(--accent);}
  .home-composer-row{
    display:flex;align-items:center;justify-content:space-between;margin-top:12px;
  }
  .home-composer-tools{display:flex;gap:6px;}
  .home-composer-tool{
    width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);transition:background .15s ease, transform .1s ease;
  }
  .home-composer-tool:hover{background:#ffe4d8;}
  .home-composer-tool:active{transform:scale(.92);}
  .home-composer-tool svg{width:16px;height:16px;stroke:#c24020;}
  .home-composer-tool.active{background:var(--accent);}
  .home-composer-tool.active svg{stroke:#fff;}
  .home-composer-tool.recording{background:var(--danger);animation:micPulse 1.1s ease-in-out infinite;}
  .home-composer-tool.recording svg{stroke:#fff;}

  #homeAnonToggle{background:#1a1b1f;}
    #homeAnonToggle:hover{background:#000;}
    #homeAnonToggle.active{background:#000;box-shadow:inset 0 0 0 2px #555;}


  .home-post-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:9px 18px;border-radius:99px;transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .home-post-btn:hover:not(:disabled){background:#000;}
  .home-post-btn:active:not(:disabled){transform:scale(.96);}
  .home-post-btn:disabled{opacity:.5;cursor:default;}

  .home-composer{
    max-height:600px;
    transition:max-height .32s var(--ease), opacity .22s var(--ease), transform .28s var(--ease),
              margin .32s var(--ease), padding .32s var(--ease), border-color .32s var(--ease);
    overflow:hidden;
  }
  /* Collapse-on-scroll + FAB is a phone-only space-saving pattern.
     Below 900px only: composer tucks away on scroll, a FAB brings it back. */
  @media (max-width:899.98px){
    .home-composer.collapsed{
      max-height:0;
      opacity:0;
      transform:translateY(-8px);
      margin-top:0;
      padding-top:0;
      padding-bottom:0;
      border-color:transparent;
      pointer-events:none;
    }
    .home-composer.overlay{
      position:fixed;
      left:50%;
      top:78px;
      transform:translate(-50%,-14px);
      width:calc(100% - 44px);
      max-width:520px;
      z-index:50;
      box-shadow:0 22px 50px rgba(20,21,26,.2);
      opacity:0;
      pointer-events:none;
    }
    .home-composer.overlay.overlay-open{
      opacity:1;
      transform:translate(-50%,0);
      pointer-events:auto;
    }
  }
  /* Desktop: the composer never hides. It stays pinned in view while you
     scroll the feed, so posting never requires scrolling back up or a refresh. */
  @media (min-width:900px){
    .home-composer{
      position:sticky;
      top:20px;
      z-index:15;
    }
    .home-composer.collapsed{
      max-height:600px;
      opacity:1;
      transform:none;
      pointer-events:auto;
    }
    .home-fab{ display:none; }
  }

  .home-fab{
    position:fixed;
    right:20px;
    bottom:96px;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px rgba(20,21,26,.28);
    z-index:40;
    opacity:0;
    transform:translateY(16px) scale(.8);
    pointer-events:none;
    transition:opacity .22s var(--ease), transform .3s var(--ease-spring), background .15s ease;
  }
  .home-fab.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .home-fab:hover{ background:#000; }
  .home-fab:active{ transform:scale(.9); }
  .home-fab svg{ width:22px;height:22px;stroke:#fff; }
  @media (min-width:900px){ .home-fab{ bottom:34px; } }

  .home-feed{padding:20px 22px 30px;display:flex;flex-direction:column;gap:16px;}
  .home-empty{
    text-align:center;padding:50px 22px;
  }
  .home-empty h3{font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:6px;}
  .home-empty p{font-family:var(--font-serif);font-size:14px;color:var(--ink-soft);max-width:280px;margin:0 auto;line-height:1.5;}

  .home-post-card{
    background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    opacity:0;animation:riseIn .4s var(--ease) forwards;
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  .home-post-card:hover{box-shadow:0 8px 26px rgba(20,21,26,.06);border-color:var(--line-strong);}
  .home-post-head{
    display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  }
  .home-post-head .avatar{
    width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:12.5px;overflow:hidden;flex-shrink:0;
  }
  .home-post-head .avatar.anon-avatar{background:linear-gradient(135deg,#3a3d47,#1a1b1f);}


  .home-post-head .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-post-head .who{display:flex;flex-direction:column;line-height:1.25;}
  .home-post-head .who b{font-family:var(--font-display);font-size:13.5px;font-weight:600;}
  .home-post-head .who span{font-family:var(--font-mono);font-size:10px;color:var(--grey);}
  .home-post-body{padding:0 16px 14px;}
  .home-post-text{font-family:var(--font-serif);font-size:15px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}
  .home-post-media{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .home-post-media img, .home-post-media video{width:100%;max-height:420px;object-fit:cover;display:block;}

  .home-hero .home-eyebrow{
    font-family:var(--font-mono);font-size:10.5px;color:var(--accent);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;font-weight:500;
  }

  .home-post-actions{
    display:flex;align-items:center;gap:18px;
    padding:10px 16px 12px;border-top:1px solid var(--line);margin-top:2px;
  }
  .home-action-btn{
    display:flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
    transition:color .15s ease;
  }
  .home-action-btn svg{width:18px;height:18px;stroke:var(--ink-soft);fill:none;transition:fill .15s ease, stroke .15s ease;}
  .home-action-btn:hover{color:var(--ink);}
  .home-action-btn:hover svg{stroke:var(--ink);}
  .home-action-btn.liked{color:var(--accent);}
  .home-action-btn.liked svg{fill:var(--accent);stroke:var(--accent);}
  .home-like-btn.pop svg{animation:likePop .35s var(--ease-spring);}
  @keyframes likePop{ 0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);} }

  /* ============================================================
     LIKE BUTTON — universe.io-style heart: fill-in, bounce, a
     checkmark-draw confirmation ring, and a hover tooltip that
     flips the like count from old → new. Scoped to fit inline
     in the post action row rather than a standalone pill button.
  ============================================================ */
  .li-trigger{
    --li-cl:var(--accent);--li-bg:#fff;--li-sz:19px;
    position:relative;
  }
  .li-heart-wrap{position:relative;width:var(--li-sz);height:var(--li-sz);display:flex;align-items:center;justify-content:center;}
  .li-heart-wrap .li-heart{
    width:var(--li-sz);height:var(--li-sz);color:var(--ink-soft);
    transition:transform .15s ease, color .15s ease;
  }
  .li-trigger .li-heart-wrap .li-heart path{fill:currentColor;}
  .li-heart-wrap .li-heart .li-fill{opacity:0;transition:opacity .2s ease;}
  .li-trigger.liked .li-heart-wrap .li-heart{color:var(--li-cl);}
  .li-trigger.liked .li-heart-wrap .li-heart .li-fill{opacity:.35;}

  .li-trigger:hover .li-heart-wrap .li-heart{
    --scale-1:1.14;--scale-2:1.24;
    animation:liScale .9s ease infinite;
  }
  @keyframes liScale{
    0%{transform:scale(1);}
    20%,90%{transform:scale(var(--scale-1));}
    50%{transform:scale(var(--scale-2));}
  }

  .li-trigger .li-heart-wrap .li-check{
    position:absolute;inset:-5px;fill:none;stroke:var(--li-cl);
    stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dashoffset:162.6;stroke-dasharray:0 330 158 134.6;
    rotate:130deg;opacity:0;pointer-events:none;
  }
  .li-trigger.just-liked .li-heart-wrap .li-check{
    opacity:.7;
    animation:liStroke .6s linear forwards, liCheckHide .35s linear .6s forwards;
  }
  @keyframes liStroke{ to{stroke-dasharray:0 163 158 134.6;} }
  @keyframes liCheckHide{ to{stroke:var(--li-bg);opacity:0;} }

  .li-tooltip{
    position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) scale(.85);
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:11px;
    padding:6px 11px;border-radius:99px;white-space:nowrap;pointer-events:none;
    display:inline-flex;align-items:center;
    opacity:0;transition:opacity .2s ease, transform .2s ease, bottom .2s ease;z-index:6;
  }
  .li-tooltip::after{
    content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--ink);
  }
  .li-trigger:hover .li-tooltip{opacity:1;transform:translateX(-50%) scale(1);bottom:calc(100% + 12px);}

  .li-tooltip .flip{position:relative;height:13px;overflow:hidden;display:inline-flex;flex-direction:column;align-items:flex-start;margin-left:3px;}
  .li-tooltip .flip::before,.li-tooltip .flip::after{position:relative;transform:translateY(7px);transition:transform .4s ease;line-height:1;}
  .li-tooltip .flip::before{content:attr(data-from);}
  .li-tooltip .flip::after{content:attr(data-to);}
  .li-trigger.liked .li-tooltip .flip::before,
  .li-trigger.liked .li-tooltip .flip::after{transform:translateY(-7px);}

  .home-comments{
    display:none;padding:2px 16px 16px;border-top:1px solid var(--line);
  }
  .home-comments.open{display:block;animation:riseIn .25s var(--ease) forwards;}
  .home-comment-list{display:flex;flex-direction:column;gap:12px;margin:14px 0 12px;}
  .home-comment-item{display:flex;gap:9px;}
  .home-comment-item .avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:10px;overflow:hidden;
  }
  .home-comment-item .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-comment-bubble{background:#f7f7f8;border-radius:14px;padding:8px 13px;flex:1;min-width:0;}
  .home-comment-bubble b{font-family:var(--font-display);font-size:12.5px;font-weight:600;}
  .home-comment-bubble p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink);margin-top:2px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .home-comment-time{font-family:var(--font-mono);font-size:9px;color:var(--grey);margin-top:4px;margin-left:2px;}
  .home-comment-empty{font-family:var(--font-mono);font-size:11px;color:var(--grey);text-align:center;padding:8px 0 14px;}
  .home-comment-input-row{display:flex;gap:8px;align-items:center;}
  .home-comment-input{
    flex:1;border:1px solid var(--line-strong);border-radius:99px;
    padding:9px 15px;font-family:var(--font-serif);font-size:13.5px;outline:none;
    transition:border-color .15s ease;
  }
  .home-comment-input:focus{border-color:var(--accent);}
  .home-comment-send{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--ink);display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .home-comment-send:hover:not(:disabled){background:#000;}
  .home-comment-send:active:not(:disabled){transform:scale(.92);}
  .home-comment-send:disabled{opacity:.4;}
  .home-comment-send svg{width:14px;height:14px;stroke:#fff;}

  .home-comment-mic{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .home-comment-mic:hover{background:#ffe4d8;}
  .home-comment-mic:active{transform:scale(.92);}
  .home-comment-mic svg{width:16px;height:16px;stroke:#c24020;}
  .home-comment-mic.recording{background:var(--danger);animation:micPulse 1.1s ease-in-out infinite;}
  .home-comment-mic.recording svg{stroke:#fff;}
  @keyframes micPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(224,67,63,.4);} 50%{box-shadow:0 0 0 8px rgba(224,67,63,0);} }
  .home-comment-rec-timer{
    font-family:var(--font-mono);font-size:11px;color:var(--danger);flex-shrink:0;min-width:32px;
  }
  .home-voice-bubble{
    background:#f7f7f8;border-radius:14px;padding:8px 13px;flex:1;min-width:0;
  }
  .home-voice-bubble b{font-family:var(--font-display);font-size:12.5px;font-weight:600;}
  .home-voice-bubble audio{width:100%;margin-top:6px;height:32px;}

  .pub-wrap{background:var(--pub-bg);}
  .pub-banner{
    background:linear-gradient(120deg, var(--ink) 0%, #2a2c35 100%);
    padding:26px 22px 18px;color:#fff;position:relative;overflow:hidden;
  }
  .pub-banner::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 85% 0%, rgba(255,90,54,.35), transparent 55%);
    pointer-events:none;
  }
  .pub-banner-inner{position:relative;display:flex;align-items:center;gap:14px;}
  .pub-icon{
    width:56px;height:56px;border-radius:16px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),#ff8a5c);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(255,90,54,.35);
  }
  .pub-icon svg{width:26px;height:26px;stroke:#fff;}
  .pub-banner h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;}
  .pub-banner .pub-tag{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.65);margin-top:4px;}
  .pub-banner-actions{position:relative;margin-top:16px;display:flex;gap:10px;align-items:center;}
  .pub-join-btn{
    background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:10px 20px;border-radius:99px;transition:background .15s ease, transform .1s ease;
    display:flex;align-items:center;gap:7px;
  }
  .pub-join-btn:hover{background:#e64a27;}
  .pub-join-btn:active{transform:scale(.96);}
  .pub-join-btn.joined{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);}
  .pub-stat{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.7);}
  .pub-stat b{color:#fff;font-family:var(--font-display);}

  .pub-body{display:flex;gap:20px;align-items:flex-start;padding:20px 22px 40px;}
  .pub-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}

  .pub-sort-row{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    display:flex;gap:4px;padding:5px;margin-bottom:2px;
  }
  .pub-sort-btn{
    font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);
    padding:8px 14px;border-radius:10px;transition:background .15s ease, color .15s ease;
    display:flex;align-items:center;gap:5px;
  }
  .pub-sort-btn svg{width:13px;height:13px;}
  .pub-sort-btn.active{background:var(--accent-soft);color:#c24020;}

  .pub-composer{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  .pub-composer textarea{
    width:100%;border:none;resize:none;outline:none;font-family:var(--font-serif);font-size:14.5px;
    min-height:38px;max-height:160px;line-height:1.5;
  }
  .pub-composer input{
    width:100%;margin-top:8px;border:1px dashed var(--line-strong);border-radius:10px;
    padding:8px 10px;font-family:var(--font-mono);font-size:11px;outline:none;
  }
  .pub-composer-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .pub-post-btn{
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;
    padding:8px 16px;border-radius:99px;transition:background .15s ease;
  }
  .pub-post-btn:hover:not(:disabled){background:#000;}
  .pub-post-btn:disabled{opacity:.5;}

  .pub-post-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    display:flex;overflow:hidden;
    opacity:0;animation:riseIn .35s var(--ease) forwards;
    transition:border-color .15s ease;
  }
  .pub-post-card:hover{border-color:var(--line-strong);}
  .pub-vote-col{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:12px 8px;background:#fafafa;border-right:1px solid var(--line);flex-shrink:0;width:44px;
  }
  .pub-vote-btn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .12s ease, transform .1s ease;}
  .pub-vote-btn:hover{background:var(--line);}
  .pub-vote-btn:active{transform:scale(.9);}
  .pub-vote-btn svg{width:15px;height:15px;stroke:var(--grey);}
  .pub-vote-btn.up.active svg{stroke:var(--pub-up);fill:var(--pub-up);}
  .pub-vote-btn.down.active svg{stroke:var(--pub-down);fill:var(--pub-down);}
  .pub-vote-score{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink);}

  .pub-post-main{flex:1;min-width:0;padding:12px 14px;}
  .pub-post-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);margin-bottom:5px;}
  .pub-post-meta b{color:var(--ink-soft);}
  .pub-post-meta b.anon-tag{color:var(--grey);font-style:italic;}
  .pub-post-text{font-family:var(--font-serif);font-size:14.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}
  .pub-post-media{margin-top:9px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:420px;}
  .pub-post-media img, .pub-post-media video{width:100%;max-height:420px;object-fit:cover;}

  .pub-sidebar{
    width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;
  }
  @media (max-width:820px){ .pub-sidebar{display:none;} }
  .pub-about-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
  }
  .pub-about-card h3{font-family:var(--font-display);font-weight:600;font-size:13px;margin-bottom:8px;}
  .pub-about-card p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink-soft);line-height:1.5;}
  .pub-about-stats{display:flex;gap:16px;margin-top:14px;}
  .pub-about-stats div{display:flex;flex-direction:column;}
  .pub-about-stats b{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .pub-about-stats span{font-family:var(--font-mono);font-size:9.5px;color:var(--grey);}
  .pub-about-created{font-family:var(--font-mono);font-size:10px;color:var(--grey);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .pub-members-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

  .locked-notice{
    display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:#c24020;
    font-family:var(--font-mono);font-size:11.5px;padding:12px 14px;border-radius:12px;margin-bottom:2px;
  }
  .locked-notice svg{width:15px;height:15px;stroke:#c24020;flex-shrink:0;}

  .waater-toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;
    padding:11px 18px;border-radius:99px;box-shadow:0 12px 30px rgba(20,21,26,.25);
    display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;z-index:200;
    transition:opacity .2s ease, transform .2s ease;white-space:nowrap;max-width:90vw;
  }
  .waater-toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .waater-toast.show{opacity:1;transform:translate(-50%,0);}
  .waater-toast.error{background:var(--danger);}
  .waater-toast svg{width:15px;height:15px;stroke:#fff;flex-shrink:0;}
  @media (min-width:900px){ .waater-toast{bottom:34px;} }

  /* ============================================================
     PRIVACY BADGE — always-visible reassurance in the circle header
  ============================================================ */
  .privacy-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line-strong);
    padding:6px 11px 6px 9px;border-radius:99px;margin-top:11px;
  }
  .privacy-badge svg{width:12px;height:12px;stroke:var(--accent);flex-shrink:0;}
  .privacy-badge span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);}
  .privacy-badge b{color:var(--ink);font-family:var(--font-display);font-weight:600;font-style:normal;}

  /* ============================================================
     WELCOME CEREMONY — first-time entry into a private circle
  ============================================================ */
  .welcome-overlay{
    position:fixed;inset:0;z-index:500;
    background:linear-gradient(135deg,var(--ink),#2a2c35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    padding:32px;text-align:center;
    opacity:0;transition:opacity .4s var(--ease);
  }
  .welcome-overlay.show{opacity:1;}
  .welcome-lock{
    width:46px;height:46px;border-radius:50%;
    background:rgba(255,90,54,.16);border:1px solid rgba(255,90,54,.35);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.6);animation:welcomePop .4s var(--ease-spring) forwards;
    animation-delay:.05s;
  }
  .welcome-lock svg{width:20px;height:20px;stroke:var(--accent-2);}
  .welcome-ring{display:flex;flex-wrap:wrap;justify-content:center;max-width:360px;}
  .welcome-avatar{
    margin:0 -14px 8px;opacity:0;transform:translateY(20px) scale(.6);
    animation:welcomeIn .5s var(--ease-spring) forwards;
  }
  .welcome-avatar .avatar{
    width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;overflow:hidden;
  }
  @keyframes welcomeIn{to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes welcomePop{to{opacity:1;transform:scale(1);}}
  .welcome-text{color:#fff;max-width:420px;}
  .welcome-eyebrow{font-family:var(--font-mono);font-size:12px;color:var(--accent-2);letter-spacing:.08em;text-transform:uppercase;}
  .welcome-title{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,6vw,34px);margin-top:8px;letter-spacing:-.01em;}
  .welcome-sub{font-family:var(--font-serif);font-size:15px;color:rgba(255,255,255,.72);margin-top:10px;line-height:1.55;}
  .welcome-note{
    margin-top:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    border-radius:16px;padding:14px 16px;text-align:left;
  }
  .welcome-note b{font-family:var(--font-display);font-size:11.5px;color:var(--accent-2);letter-spacing:.03em;text-transform:uppercase;}
  .welcome-note p{font-family:var(--font-serif);font-size:14.5px;color:#fff;margin-top:6px;line-height:1.5;}
  .welcome-privacy-line{
    display:flex;align-items:center;gap:8px;margin-top:18px;justify-content:center;
    font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.55);
  }
  .welcome-privacy-line svg{width:13px;height:13px;stroke:rgba(255,255,255,.55);flex-shrink:0;}
  .welcome-enter{
    background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:600;font-size:14px;
    padding:13px 30px;border-radius:99px;transition:transform .15s var(--ease), background .15s ease;
    margin-top:4px;
  }
  .welcome-enter:hover{background:#e64a27;}
  .welcome-enter:active{transform:scale(.95);}

  /* ============================================================
     INVITE MODAL — personal note attached to an invite link
  ============================================================ */
  .invite-modal-backdrop{
    position:fixed;inset:0;z-index:400;background:rgba(20,21,26,.5);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;transition:opacity .2s ease;
  }
  .invite-modal-backdrop.show{opacity:1;}
  .invite-modal{
    background:#fff;border-radius:20px;padding:22px;max-width:360px;width:100%;
    transform:translateY(10px) scale(.97);transition:transform .22s var(--ease-spring);
  }
  .invite-modal-backdrop.show .invite-modal{transform:translateY(0) scale(1);}
  .invite-modal h3{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .invite-modal p{font-family:var(--font-serif);font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.45;}
  .invite-modal textarea{
    width:100%;margin-top:12px;border:1px solid var(--line-strong);border-radius:12px;
    padding:10px 12px;font-family:var(--font-serif);font-size:13.5px;resize:none;min-height:64px;outline:none;
    transition:border-color .15s ease;
  }
  .invite-modal textarea:focus{border-color:var(--accent);}
  .invite-modal-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .invite-modal-skip{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:9px 14px;border-radius:99px;}
  .invite-modal-skip:hover{background:#f7f7f8;}
  .invite-modal-send{background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:99px;}
  .invite-modal-send:hover{background:#000;}

  /* ---- Circle Album (capture modal — the gallery itself lives in the
     Album tab, styled further down) ---- */
  .album-modal-backdrop{
    position:fixed;inset:0;background:rgba(20,21,26,.6);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s ease;
  }
  @media (min-width:640px){ .album-modal-backdrop{align-items:center;} }
  .album-modal-backdrop.show{opacity:1;}
  .album-modal{
    background:#fff;border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;
    transform:translateY(16px);transition:transform .24s var(--ease-spring);
  }
  @media (min-width:640px){ .album-modal{border-radius:22px;} }
  .album-modal-backdrop.show .album-modal{transform:translateY(0);}
  .album-modal h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin-bottom:4px;}
  .album-modal p.hint{font-family:var(--font-serif);font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .album-canvas-wrap{
    width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#111;
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;
  }
  .album-canvas-wrap canvas{width:100%;height:100%;object-fit:cover;}
  .album-canvas-placeholder{color:#7c7f88;font-family:var(--font-mono);font-size:11px;text-align:center;padding:20px;}
  .album-pick-row{display:flex;gap:8px;margin-bottom:14px;}
  .album-pick-btn{
    flex:1;border:1px solid var(--line-strong);border-radius:12px;padding:10px;
    font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .album-pick-btn svg{width:15px;height:15px;}
  .album-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none;}
  .album-filter-row::-webkit-scrollbar{display:none;}
  .album-filter-swatch{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .album-filter-swatch .sw{width:46px;height:46px;border-radius:50%;border:2px solid transparent;overflow:hidden;background:#eee;}
  .album-filter-swatch.active .sw{border-color:var(--accent);}
  .album-filter-swatch span{font-family:var(--font-mono);font-size:8.5px;color:var(--ink-soft);}
  .album-modal textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;
    font-family:var(--font-serif);font-size:13.5px;resize:none;min-height:52px;outline:none;margin-bottom:14px;
  }
  .album-modal-row{display:flex;justify-content:flex-end;gap:8px;}
  .album-modal-cancel{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:9px 14px;border-radius:99px;}
  .album-modal-cancel:hover{background:#f7f7f8;}
  .album-modal-post{background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:9px 18px;border-radius:99px;display:flex;align-items:center;gap:6px;}
  .album-modal-post:disabled{opacity:.5;}
  .album-modal-post:hover:not(:disabled){background:#000;}

  .album-lightbox-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:210;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease;
  }
  .album-lightbox-backdrop.show{opacity:1;}
  .album-lightbox{max-width:min(92vw,480px);width:100%;position:relative;}
  .album-lightbox img{width:100%;border-radius:14px;display:block;}
  .album-lightbox-info{color:#fff;padding:12px 4px 0;font-family:var(--font-mono);font-size:11px;display:flex;justify-content:space-between;align-items:center;}
  .album-lightbox-close{position:absolute;top:18px;right:18px;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .album-lightbox-close svg{width:22px;height:22px;stroke:#fff;}
  .album-lightbox-nav{
    position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
    z-index:3;transition:background .15s ease, transform .15s ease;
  }
  .album-lightbox-nav:hover{background:rgba(0,0,0,.6);}
  .album-lightbox-nav:active{transform:translateY(-50%) scale(.88);}
  .album-lightbox-nav svg{width:19px;height:19px;stroke:#fff;}
  .album-lightbox-prev{left:10px;}
  .album-lightbox-next{right:10px;}

  /* ============================================================
     VIEW TABS — Feed / Album switcher, lives inside the circle page
     (no route change — just swaps which panel is visible)
  ============================================================ */
  .view-tabs{
    display:flex;gap:4px;margin:16px 22px 0;padding:4px;
    background:#f3f3f1;border-radius:14px;position:relative;z-index:5;
  }
  .view-tab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 10px;border-radius:11px;font-family:var(--font-display);font-weight:600;font-size:13px;
    color:var(--ink-soft);transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);
  }
  .view-tab svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0;}
  .view-tab:hover{color:var(--ink);}
  .view-tab.active{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(20,21,26,.09);}
  .view-tab .count{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}
  .view-tab.active .count{color:var(--accent);}

  .view-panel{display:none;}
  .view-panel.active{display:block;animation:riseIn .34s var(--ease);}

  /* ============================================================
     ALBUM GALLERY — the magical full album view inside the Album tab
  ============================================================ */
  .gallery-wrap{padding:22px 22px 40px;position:relative;}

  .gallery-glow{
    position:absolute;top:-10px;left:0;right:0;height:220px;pointer-events:none;z-index:0;
    background:
      radial-gradient(240px 150px at 12% 15%, rgba(255,90,54,.16), transparent 70%),
      radial-gradient(220px 150px at 88% 5%, rgba(124,140,255,.13), transparent 70%);
    filter:blur(8px);
    animation:galleryDrift 9s ease-in-out infinite alternate;
  }
  @keyframes galleryDrift{ from{transform:translateY(0) scale(1);} to{transform:translateY(12px) scale(1.04);} }

  .gallery-head{position:relative;z-index:1;}
  .gallery-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:10.5px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;
  }
  .gallery-title{
    font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-.01em;margin-top:5px;
    display:flex;align-items:center;gap:8px;
  }
  .gallery-title .sparkle{display:inline-block;animation:sparkleSpin 3.4s ease-in-out infinite;}
  @keyframes sparkleSpin{ 0%,100%{transform:rotate(0) scale(1);} 50%{transform:rotate(16deg) scale(1.15);} }
  .gallery-sub{font-family:var(--font-serif);font-size:14px;color:var(--ink-soft);margin-top:6px;}
  .gallery-meta{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .gallery-facepile{display:flex;}
  .gallery-facepile .fp{
    width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:9.5px;overflow:hidden;flex-shrink:0;
  }
  .gallery-facepile .fp:first-child{margin-left:0;}
  .gallery-facepile .fp img{width:100%;height:100%;object-fit:cover;}
  .gallery-meta-text{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}

  .gallery-add-btn{
    margin-top:16px;display:inline-flex;align-items:center;gap:8px;
    background:var(--ink);color:#fff!important;font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:10px 18px;border-radius:99px;transition:transform .15s var(--ease),background .15s ease,box-shadow .2s ease;
    box-shadow:0 8px 20px rgba(20,21,26,.16);
  }
  .gallery-add-btn:hover{background:#000;transform:translateY(-1px);}
  .gallery-add-btn:active{transform:scale(.96);}
  .gallery-add-btn svg{width:15px;height:15px;stroke:#fff;}

  .gallery-group{position:relative;z-index:1;margin-top:26px;}
  .gallery-group-label{
    font-family:var(--font-mono);font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.07em;
    margin-bottom:10px;padding-left:2px;
  }
  .gallery-grid{columns:2 140px;column-gap:10px;}
  @media (min-width:640px){ .gallery-grid{columns:3 160px;} }
  @media (min-width:900px){ .gallery-grid{columns:3 180px;} }

  .gallery-tile{
    break-inside:avoid;margin-bottom:10px;border-radius:16px;overflow:hidden;position:relative;
    background:#f6f6f4;border:1px solid var(--line);cursor:pointer;width:100%;display:block;
    opacity:0;transform:translateY(14px) scale(.97);animation:galleryTileIn .5s var(--ease-spring) forwards;
    transition:box-shadow .2s ease, transform .2s var(--ease);
  }
  .gallery-tile:hover{box-shadow:0 14px 34px rgba(20,21,26,.16);transform:translateY(-3px) scale(1.01);}
  .gallery-tile img{width:100%;display:block;}
  @keyframes galleryTileIn{ to{opacity:1;transform:translateY(0) scale(1);} }

  .gallery-tile .overlay{
    position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 55%);
    opacity:0;transition:opacity .2s ease;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;
    text-align:left;
  }
  .gallery-tile:hover .overlay{opacity:1;}
  .gallery-tile .overlay .who{display:flex;align-items:center;gap:6px;}
  .gallery-tile .overlay .who .mini{
    width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-family:var(--font-display);font-weight:700;overflow:hidden;flex-shrink:0;
  }
  .gallery-tile .overlay .who .mini img{width:100%;height:100%;object-fit:cover;}
  .gallery-tile .overlay span{font-family:var(--font-mono);font-size:9px;color:#fff;}
  .gallery-tile .overlay .cap{
    font-family:var(--font-serif);font-size:11.5px;color:#fff;margin-top:4px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .gallery-cover{column-span:all;margin-bottom:14px;border-radius:20px;aspect-ratio:16/9;}
  .gallery-cover .overlay{opacity:1;background:linear-gradient(0deg,rgba(0,0,0,.62),transparent 65%);padding:16px;}
  .gallery-cover .overlay .cap{font-size:13.5px;-webkit-line-clamp:1;}

  .gallery-empty{
    position:relative;z-index:1;text-align:center;padding:56px 20px;margin-top:20px;
    border:1.5px dashed var(--line-strong);border-radius:22px;background:var(--accent-soft);
  }
  .gallery-empty .ic{
    width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;box-shadow:0 6px 18px rgba(20,21,26,.08);
    animation:galleryFloat 2.6s ease-in-out infinite;
  }
  @keyframes galleryFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
  .gallery-empty .ic svg{width:22px;height:22px;stroke:var(--accent);}
  .gallery-empty h3{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .gallery-empty p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink-soft);margin-top:6px;max-width:260px;margin-left:auto;margin-right:auto;line-height:1.5;}
  .gallery-empty .gallery-add-btn{margin-top:18px;}
</style>

<div class="waater-toast" id="waaterToast">

  <span id="waaterToastText"></span>
</div>

<script>
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }
  function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
  function timeAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if (s<60) return 'just now';
    if (s<3600) return `${Math.floor(s/60)}m ago`;
    if (s<86400) return `${Math.floor(s/3600)}h ago`;
    if (s<604800) return `${Math.floor(s/86400)}d ago`;
    return new Date(iso).toLocaleDateString();
  }
  function getGreeting(){
    const h = new Date().getHours();
    if (h < 5) return 'Still up';
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUsername = null;

  function requireAuth(nextPath){
    if (currentUser) return true;
    window.location.href = `/auth?next=${encodeURIComponent(nextPath || window.location.pathname + window.location.search)}`;
    return false;
  }

  let toastTimer = null;
  function showToast(text, type){
    const toast = document.getElementById('waaterToast');
    document.getElementById('waaterToastText').textContent = text;
    toast.classList.remove('error');
    if (type === 'error') toast.classList.add('error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ============================================================
  // PRIVACY / BELONGING HELPERS
  // ============================================================

  // Was this member's join timestamp within the last minute? Used to decide
  // whether to play the welcome ceremony (vs. just navigating back later).
  function justJoined(meRow){
    if (!meRow || !meRow.joined_at) return false;
    return (Date.now() - new Date(meRow.joined_at).getTime()) < 300000; // 5 min window
  }

  // Best-effort fetch of a personal note left by whoever invited this user.
  // Expects an optional `welcome_note` text column on circle_members.
  // If that column doesn't exist yet, this quietly returns null — nothing breaks.
  async function loadMyWelcomeNote(){
    try{
      const { data, error } = await supabaseClient
        .from('circle_members')
        .select('welcome_note, invited_by')
        .eq('circle_id', circleId)
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if (error || !data) return { note: null, inviter: null };

      let inviter = null;
      if (data.invited_by){
        const { data: prof } = await supabaseClient
          .from('profiles')
          .select('username, avatar_url')
          .eq('id', data.invited_by)
          .maybeSingle();
        inviter = prof || null;
      }
      return { note: data.welcome_note || null, inviter };
    } catch(e){ return { note: null, inviter: null }; }
  }

  function renderPeopleRow(){
    return `
      <div class="home-people-row">
        ${members.map(m => `
          <div class="home-person">
            <div class="ring"><div class="ring-inner"><div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div></div></div>
            <span>${escapeHtml((m.username||'?').split(' ')[0])}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Full-screen, one-time "you're in" moment. Plays over the feed while it
  // loads underneath — the moment the person sees the second they land.
  async function playWelcomeCeremony(note, inviter){
    return new Promise(resolve => {
      const inviterName = inviter?.username || null;
      const overlay = document.createElement('div');
      overlay.className = 'welcome-overlay';
      overlay.innerHTML = `
        <div class="welcome-lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        </div>
        <div class="welcome-ring">
          ${members.map((m,i) => `
            <div class="welcome-avatar" style="animation-delay:${(i*0.08).toFixed(2)}s">
              <div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div>
            </div>
          `).join('')}
        </div>
        <div class="welcome-text">
          <div class="welcome-eyebrow">you're special</div>
          <h1 class="welcome-title">${inviterName ? `That's why ${escapeHtml(inviterName)} invited you` : `You're in ${escapeHtml(circle.name)}`}</h1>
          <p class="welcome-sub">${members.length} of you now. What gets shared here stays inside this circle — always.</p>
          ${note ? `
            <div class="welcome-note">
              <b>${inviterName ? `a note from ${escapeHtml(inviterName)}` : 'a note for you'}</b>
              <p>${escapeHtml(note)}</p>
            </div>
          ` : ''}
          <div class="welcome-privacy-line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            Private circle — only these ${members.length} people can ever see what's posted here
          </div>
        </div>
        <button class="welcome-enter">Enter circle</button>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      const finish = () => {
        overlay.classList.remove('show');
        setTimeout(() => { overlay.remove(); resolve(); }, 350);
      };
      overlay.querySelector('.welcome-enter').addEventListener('click', finish);
    });
  }

  // Small modal so the person inviting someone can attach a personal note.
  // Resolves to the note string, or null if skipped/closed.
  function openInviteModal(){
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'invite-modal-backdrop';
      modal.innerHTML = `
        <div class="invite-modal">
          <h3>Invite someone to ${escapeHtml(circle.name)}</h3>
          <p>Add a personal note — it'll be the first thing they see when they arrive.</p>
          <textarea id="inviteNoteInput" maxlength="140" placeholder="e.g. finally got you in here 🎉"></textarea>
          <div class="invite-modal-row">
            <button class="invite-modal-skip" type="button">Skip note</button>
            <button class="invite-modal-send" type="button">Create invite</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));
      const close = (note) => {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 220);
        resolve(note);
      };
      modal.querySelector('.invite-modal-skip').addEventListener('click', () => close(null));
      modal.querySelector('.invite-modal-send').addEventListener('click', () => {
        const val = modal.querySelector('#inviteNoteInput').value.trim();
        close(val || null);
      });
      modal.addEventListener('click', (e) => { if (e.target === modal) close(null); });
    });
  }

  // Live "someone just joined" broadcast via Supabase Realtime — makes the
  // circle feel alive and lets everyone currently inside see arrivals happen.
  // Requires Realtime enabled on the circle_members table in Supabase.
  let circleChannel = null;
  function subscribeToCircleActivity(){
    if (circleChannel || !circle?.is_private) return;
    circleChannel = supabaseClient
      .channel(`circle-activity-${circleId}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'circle_members', filter: `circle_id=eq.${circleId}` },
        async (payload) => {
          if (!payload.new || payload.new.user_id === currentUser?.id) return;
          const { data: prof } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', payload.new.user_id).maybeSingle();
          showToast(`${prof?.username || 'someone'} just joined the circle 👋`);
          members = await loadMembers();
          const row = document.querySelector('.home-people-row');
          if (row) row.outerHTML = renderPeopleRow();
        }
      )
      .subscribe();
  }
  window.addEventListener('beforeunload', () => { if (circleChannel) supabaseClient.removeChannel(circleChannel); });

  async function renderSidebar(){
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');
    if (!currentUser){
      area.innerHTML = `<a href="/auth" class="sidebar-signin">Sign in</a>`;
      return;
    }
    const { data: me } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', currentUser.id).maybeSingle();
    currentUsername = me?.username || currentUser.email || 'You';
    const avatarHtml = me?.avatar_url ? `<img src="${escapeHtml(me.avatar_url)}" alt="">` : initials(currentUsername);
    area.innerHTML = `
      <a href="/profile" class="sidebar-profile">
        <div class="mini-avatar">${avatarHtml}</div>
        <div class="who"><span>${escapeHtml(currentUsername)}</span><span>view profile</span></div>
      </a>
      <button class="sidebar-signout" id="signOutBtn">Sign out</button>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });
  }

  const params = new URLSearchParams(window.location.search);
  const circleId = params.get('ID');
  const urlSaysPrivate = params.has('private');

  let circle = null;
  let myRole = null;
  let members = [];
  let currentSort = 'new';

  async function loadCircle(){
    const { data: c, error } = await supabaseClient
      .from('circles')
      .select('id, name, description, is_private, created_at, created_by')
      .eq('id', circleId)
      .maybeSingle();
    if (error || !c) return null;
    return c;
  }

  async function loadMembers(){
    const { data: mem } = await supabaseClient
      .from('circle_members')
      .select('user_id, role, joined_at')
      .eq('circle_id', circleId)
      .order('joined_at', { ascending: true });

    const list = mem || [];
    if (list.length === 0) return [];

    const userIds = list.map(m => m.user_id);
    const { data: profs } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', userIds);

    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });

    return list
      .map(m => {
        const p = profileById[m.user_id];
        if (!p) return null;
        return { ...p, role: m.role, joined_at: m.joined_at };
      })
      .filter(Boolean);
  }

  // ---- posts ----
  // posts table columns: id, user_id, caption, media_url, media_type, created_at,
  // circle_id, score, likes_count, comment_count, is_anonymous
  async function loadPosts(sort){
    let query = supabaseClient
      .from('posts')
      .select('id, user_id, caption, media_url, media_type, duration_seconds, created_at, score, likes_count, comment_count, is_anonymous')
      .eq('circle_id', circleId);

    if (sort === 'top') query = query.order('score', { ascending: false });
    else query = query.order('created_at', { ascending: false });

    const { data, error } = await query.limit(50);
    if (error) { console.error('loadPosts failed', error); return []; }
    let list = data || [];

    if (list.length > 0) {
      const userIds = [...new Set(list.map(p => p.user_id))];
      const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
      const profileById = {};
      (profs || []).forEach(p => { profileById[p.id] = p; });
      list = list.map(p => ({ ...p, profiles: profileById[p.user_id] || null }));
    }

    if (sort === 'hot') {
      list = list.map(p => ({ ...p, _hot: (p.score||0) / Math.pow((Date.now()-new Date(p.created_at))/3600000 + 2, 1.3) }))
                 .sort((a,b) => b._hot - a._hot);
    }
    return list;
  }

  async function loadMyVotes(postIds){
    if (!currentUser || postIds.length === 0) return {};
    const { data } = await supabaseClient.from('post_votes').select('post_id, value').eq('user_id', currentUser.id).in('post_id', postIds);
    const m = {};
    (data||[]).forEach(v => { m[v.post_id] = v.value; });
    return m;
  }

  async function loadMyLikes(postIds){
    if (!currentUser || postIds.length === 0) return new Set();
    const { data } = await supabaseClient.from('post_likes').select('post_id').eq('user_id', currentUser.id).in('post_id', postIds);
    return new Set((data||[]).map(r => r.post_id));
  }

  // =========================================================
  // PRIVATE MODE — home feed
  // =========================================================
  function renderHomePostCard(post, isLiked){
    const isAnonPost = post.is_anonymous;
    const name = isAnonPost ? 'Anonymous' : (post.profiles?.username || 'someone');

    const avatarHtml = isAnonPost
      ? `<svg viewBox="0 0 32 32" style="width:70%;height:70%;" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M16 3C8.8 3 2.9 8.3 1.9 15.2c-.2 1.6 1 3 2.6 3h1.2l-1.5 2.8a1 1 0 001.8.9l1.9-3.7h16.2l1.9 3.7a1 1 0 001.8-.9L26.3 18.2h1.2c1.6 0 2.8-1.4 2.6-3C29.1 8.3 23.2 3 16 3z"/>
          <circle cx="10.5" cy="15.5" r="2.8" fill="#14151a"/>

  async function loadComments(postId){
    const [{ data: textRows }, { data: voiceRows }] = await Promise.all([
      supabaseClient.from('post_comments').select('id, user_id, content, created_at').eq('post_id', postId),
      supabaseClient.from('voice_comments').select('id, user_id, audio_url, duration_seconds, created_at').eq('post_id', postId)
    ]);
    const combined = [
      ...(textRows || []).map(c => ({ ...c, kind: 'text' })),
      ...(voiceRows || []).map(c => ({ ...c, kind: 'voice' }))
    ].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    if (combined.length === 0) return [];
    const userIds = [...new Set(combined.map(c => c.user_id))];
    const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });
    return combined.map(c => ({ ...c, profile: profileById[c.user_id] || null }));
  }

  function renderCommentItem(c){
    const name = c.profile?.username || 'someone';
    const avatarHtml = c.profile?.avatar_url ? `<img src="${escapeHtml(c.profile.avatar_url)}" alt="">` : initials(name);
    if (c.kind === 'voice') {
      const dur = c.duration_seconds ? `${Math.round(c.duration_seconds)}s` : '';
      return `
        <div class="home-comment-item">
          <div class="avatar">${avatarHtml}</div>
          <div style="flex:1;min-width:0;">
            <div class="home-voice-bubble">
              <b>${escapeHtml(name)}</b> ${dur ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--grey);">· ${dur}</span>` : ''}
              <audio controls src="${escapeHtml(c.audio_url)}"></audio>
            </div>
            <div class="home-comment-time">${timeAgo(c.created_at)}</div>
          </div>
        </div>
      `;
    }
    return `
      <div class="home-comment-item">
        <div class="avatar">${avatarHtml}</div>
        <div>
          <div class="home-comment-bubble"><b>${escapeHtml(name)}</b><p>${escapeHtml(c.content)}</p></div>
          <div class="home-comment-time">${timeAgo(c.created_at)}</div>
        </div>
      </div>
    `;
  }

  async function openComments(postId){
    const panel = document.getElementById(`home-comments-${postId}`);
    const listEl = document.getElementById(`home-comment-list-${postId}`);
    const wasOpen = panel.classList.contains('open');
    if (wasOpen){ panel.classList.remove('open'); return; }
    panel.classList.add('open');
    if (!panel.dataset.loaded){
      listEl.innerHTML = `<div class="home-comment-empty">Loading…</div>`;
      const comments = await loadComments(postId);
      listEl.innerHTML = comments.length
        ? comments.map(renderCommentItem).join('')
        : `<div class="home-comment-empty">No comments yet — be the first.</div>`;
      panel.dataset.loaded = '1';
    }
  }

  function wireHomeActions(){
    document.querySelectorAll('.home-like-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!requireAuth()) return;
        if (btn.dataset.busy) return;
        btn.dataset.busy = '1';
        const postId = btn.dataset.postId;
        const countEl = btn.querySelector('.home-like-count');
        const flipEl = btn.querySelector('.flip');
        const wasLiked = btn.classList.contains('liked');
        try {
          if (wasLiked){
            const { error } = await supabaseClient.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
            if (error) throw error;
            const fromCount = Number(countEl.textContent);
            const toCount = Math.max(0, fromCount - 1);
            if (flipEl){ flipEl.dataset.from = fromCount; flipEl.dataset.to = toCount; }
            btn.classList.remove('liked');
            countEl.textContent = toCount;
          } else {
            const { error } = await supabaseClient.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
            if (error) throw error;
            const fromCount = Number(countEl.textContent);
            const toCount = fromCount + 1;
            if (flipEl){ flipEl.dataset.from = fromCount; flipEl.dataset.to = toCount; }
            btn.classList.add('liked');
            btn.classList.add('pop', 'just-liked');
            setTimeout(() => btn.classList.remove('pop', 'just-liked'), 700);
            countEl.textContent = toCount;
          }
        } catch (err) {
          showToast(err.message || 'Could not update like', 'error');
        } finally {
          delete btn.dataset.busy;
        }
      });
    });

    document.querySelectorAll('.home-comment-toggle').forEach(btn => {
      btn.addEventListener('click', () => openComments(btn.dataset.postId));
    });

    document.querySelectorAll('.home-comment-input').forEach(input => {
      const postId = input.id.replace('home-comment-input-', '');
      const sendBtn = document.getElementById(`home-comment-send-${postId}`);
      input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim(); });
      const submit = async () => {
        if (!requireAuth()) return;
        const text = input.value.trim();
        if (!text || sendBtn.disabled) return;
        sendBtn.disabled = true;
        try {
          const { error } = await supabaseClient.from('post_comments').insert({ post_id: postId, user_id: currentUser.id, content: text });
          if (error) throw error;
          input.value = '';
          const listEl = document.getElementById(`home-comment-list-${postId}`);
          const comments = await loadComments(postId);
          listEl.innerHTML = comments.map(renderCommentItem).join('');
          const countEl = document.querySelector(`.home-comment-toggle[data-post-id="${postId}"] .home-comment-count`);
          if (countEl) countEl.textContent = comments.length;
        } catch (err) {
          showToast(err.message || 'Could not post comment', 'error');
        } finally {
          sendBtn.disabled = !input.value.trim();
        }
      };
      sendBtn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } });
    });

    document.querySelectorAll('.home-comment-mic').forEach(btn => {
      const postId = btn.dataset.postId;
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let timerInterval = null;
      const timerEl = document.getElementById(`home-comment-rec-timer-${postId}`);

      btn.addEventListener('click', async () => {
        if (!requireAuth()) return;

        if (btn.classList.contains('recording')) {
          mediaRecorder.stop();
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            timerEl.style.display = 'none';
            btn.classList.remove('recording');

            const durationSeconds = (Date.now() - startTime) / 1000;
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const path = `${currentUser.id}/${postId}/${Date.now()}.webm`;

            btn.disabled = true;
            try {
              const { error: uploadError } = await supabaseClient.storage
                .from('voice-comments')
                .upload(path, blob, { contentType: 'audio/webm' });
              if (uploadError) throw uploadError;

              const { data: { publicUrl } } = supabaseClient.storage.from('voice-comments').getPublicUrl(path);

              const { error: insertError } = await supabaseClient.from('voice_comments').insert({
                post_id: postId,
                user_id: currentUser.id,
                audio_url: publicUrl,
                duration_seconds: durationSeconds
              });
              if (insertError) throw insertError;

              const listEl = document.getElementById(`home-comment-list-${postId}`);
              const comments = await loadComments(postId);
              listEl.innerHTML = comments.map(renderCommentItem).join('');
              const countEl = document.querySelector(`.home-comment-toggle[data-post-id="${postId}"] .home-comment-count`);
              if (countEl) countEl.textContent = comments.length;
              showToast('Voice comment posted');
            } catch (err) {
              showToast(err.message || 'Could not post voice comment', 'error');
            } finally {
              btn.disabled = false;
            }
          };

          const MAX_RECORDING_SECONDS = 60;

          mediaRecorder.start();
          startTime = Date.now();
          btn.classList.add('recording');
          timerEl.style.display = 'inline';
          timerInterval = setInterval(() => {
            const secs = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_RECORDING_SECONDS) {
              mediaRecorder.stop();
            }
          }, 250);

        } catch (err) {
          showToast('Microphone access denied or unavailable', 'error');
        }
      });
    });
  }

  // =========================================================
  // CIRCLE ALBUM — permanent, private photo memories
  // Filter presets are our own canvas-based looks (not Snapchat's actual
  // Lens filters — those run on Snap's closed AR SDK and aren't something
  // we can pull into a webpage). Chosen filter is baked into the pixels
  // before upload, so it's permanent, not just a CSS overlay.
  // =========================================================
  const ALBUM_FILTERS = [
    { id: 'original', label: 'Original', css: 'none' },
    { id: 'warm',     label: 'Warm',     css: 'saturate(1.35) sepia(.18) contrast(1.05) brightness(1.03)' },
    { id: 'cool',     label: 'Cool',     css: 'saturate(1.1) hue-rotate(-12deg) contrast(1.05) brightness(1.02)' },
    { id: 'mono',     label: 'Mono',     css: 'grayscale(1) contrast(1.1)' },
    { id: 'vintage',  label: 'Vintage',  css: 'sepia(.35) saturate(.85) contrast(.95) brightness(1.05)' },
    { id: 'vivid',    label: 'Vivid',    css: 'saturate(1.6) contrast(1.12)' },
    { id: 'fade',     label: 'Fade',     css: 'saturate(.6) contrast(.9) brightness(1.08)' },
  ];

  let albumId = null;

  async function getOrCreateAlbum(){
    const { data: existing } = await supabaseClient
      .from('albums')
      .select('id')
      .eq('circle_id', circleId)
      .order('created_at', { ascending: true })
      .limit(1)
      .maybeSingle();
    if (existing) return existing.id;

    const { data: created, error } = await supabaseClient
      .from('albums')
      .insert({ circle_id: circleId, name: 'Memories', created_by: currentUser.id })
      .select('id')
      .single();
    if (error){ console.error('could not create album', error); return null; }
    return created.id;
  }

  async function loadAlbumPhotos(){
    if (!albumId) return [];
    const { data, error } = await supabaseClient
      .from('album_photos')
      .select('id, user_id, photo_url, filter_applied, caption, created_at')
      .eq('album_id', albumId)
      .order('created_at', { ascending: false })
      .limit(30);
    if (error){ console.error('loadAlbumPhotos failed', error); return []; }
    return data || [];
  }

  function groupPhotosByMonth(photos){
    const groups = new Map();
    photos.forEach(p => {
      const d = new Date(p.created_at);
      const key = isNaN(d) ? 'Earlier' : d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    return groups;
  }

  function renderGalleryHeader(photos){
    const contributorIds = [...new Set(photos.map(p => p.user_id))];
    const facepile = contributorIds.slice(0, 5).map(uid => {

      const av = m?.avatar_url;
      return `<div class="fp">${av ? `<img src="${escapeHtml(av)}" alt="">` : initials(m?.username || '?')}</div>`;
    }).join('');
    return `
      <div class="gallery-head">
        <div class="gallery-eyebrow">private &amp; permanent</div>
        <h2 class="gallery-title"><span class="sparkle">✨</span> The Album</h2>
        <div class="gallery-sub">Every little moment this circle wants to keep.</div>
        ${photos.length ? `
        <div class="gallery-meta">
          <div class="gallery-facepile">${facepile}</div>
          <span class="gallery-meta-text">${photos.length} memor${photos.length === 1 ? 'y' : 'ies'} from ${contributorIds.length} of you</span>

  function renderGalleryTile(ph, idx, isCover){
    const m = members.find(x => x.id === ph.user_id);
    const name = m?.username || 'Someone';
    const avatarHtml = m?.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(name);
    return `
      <button class="gallery-tile${isCover ? ' gallery-cover' : ''}" data-photo-id="${ph.id}" style="animation-delay:${Math.min(idx * 45, 480)}ms;" type="button">
        <img src="${escapeHtml(ph.photo_url)}" alt="" loading="lazy">
        <div class="overlay">
          <div class="who"><span class="mini">${avatarHtml}</span><span>${escapeHtml(name)} · ${timeAgo(ph.created_at)}</span></div>
          ${ph.caption ? `<div class="cap">${escapeHtml(ph.caption)}</div>` : ''}
        </div>
      </button>
    `;
  }

  function renderAlbumGallery(photos){
    if (photos.length === 0){
      return `
        <div class="gallery-glow"></div>
        ${renderGalleryHeader(photos)}
        <div class="gallery-empty">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <h3>No memories yet</h3>
          <p>Be the first to drop a photo into this circle's private album.</p>
        </div>
      `;
    }
    const groups = groupPhotosByMonth(photos);
    let idx = 0;
    let first = true;
    const groupsHtml = [...groups.entries()].map(([label, groupPhotos]) => {
      const tiles = groupPhotos.map(ph => {
        const html = renderGalleryTile(ph, idx, first);
        idx++; first = false;
        return html;
      }).join('');
      return `
        <div class="gallery-group">
          <div class="gallery-group-label">${label}</div>
          <div class="gallery-grid">${tiles}</div>
        </div>
      `;
    }).join('');
    return `
      <div class="gallery-glow"></div>
      ${renderGalleryHeader(photos)}
      ${groupsHtml}
    `;
  }

  function wireGalleryActions(photos){

  function openGalleryLightbox(photos, startIndex){
    let idx = startIndex;
    const overlay = document.createElement('div');
    overlay.className = 'album-lightbox-backdrop';

    const close = () => {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => overlay.remove(), 200);
    };

    function render(){
      const photo = photos[idx];
      const m = members.find(x => x.id === photo.user_id);
      const name = m?.username || 'Someone';
      overlay.innerHTML = `
        <button class="album-lightbox-close" id="albumLbClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="album-lightbox">
          ${photos.length > 1 ? `
          <button class="album-lightbox-nav album-lightbox-prev" id="albumLbPrev" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="album-lightbox-nav album-lightbox-next" id="albumLbNext" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
          </button>` : ''}
          <img src="${escapeHtml(photo.photo_url)}" alt="">
          <div class="album-lightbox-info">
            <span>${escapeHtml(name)}${photo.caption ? ' · ' + escapeHtml(photo.caption) : ''}</span>
            <span>${timeAgo(photo.created_at)}</span>
          </div>
        </div>
      `;
      overlay.querySelector('#albumLbClose').addEventListener('click', close);
      const prevBtn = overlay.querySelector('#albumLbPrev');
      const nextBtn = overlay.querySelector('#albumLbNext');
      if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx - 1 + photos.length) % photos.length; render(); });
      if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx + 1) % photos.length; render(); });
    }

    function onKey(e){
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft' && photos.length > 1){ idx = (idx - 1 + photos.length) % photos.length; render(); }
      else if (e.key === 'ArrowRight' && photos.length > 1){ idx = (idx + 1) % photos.length; render(); }
    }

    render();
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => overlay.classList.add('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  }

    modal.innerHTML = `

        <input type="file" accept="image/*" id="albumFileGallery" style="display:none;">
