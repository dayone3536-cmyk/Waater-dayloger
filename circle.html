          <button class="album-pick-btn" id="albumTakePhoto" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>
            Camera
          </button>
          <button class="album-pick-btn" id="albumPickPhoto" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Gallery
          </button>
        </div>
        <input type="file" accept="image/*" capture="environment" id="albumFileCamera" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;" tabindex="-1" aria-hidden="true">
        <input type="file" accept="image/*" id="albumFileGallery" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;" tabindex="-1" aria-hidden="true">
        <div class="album-filter-row" id="albumFilterRow" style="display:none;"></div>
        <textarea id="albumCaptionInput" maxlength="140" placeholder="${promptToAnswer ? 'Answer their question... (optional)' : 'Say something about this one... (optional)'}"></textarea>
        <div class="album-modal-row">
          <button class="album-modal-cancel" type="button" id="albumModalCancel">Cancel</button>
          <button class="album-modal-post" type="button" id="albumModalPost" disabled>Post to album</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const canvasWrap = modal.querySelector('#albumCanvasWrap');
    const filterRow = modal.querySelector('#albumFilterRow');
    const postBtn = modal.querySelector('#albumModalPost');
    const captionInput = modal.querySelector('#albumCaptionInput');
    let sourceImg = null;
    let swatchThumb = '';
    let loadToken = 0;
    let activeFilterId = 'original';
    let canvas = null;

    function drawWithFilter(filterCss){
      if (!sourceImg) return;
      if (!canvas){
        canvas = document.createElement('canvas');
        canvasWrap.innerHTML = '';
        canvasWrap.appendChild(canvas);
      }
      const size = 900;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.filter = filterCss;
      const scale = Math.max(size / sourceImg.width, size / sourceImg.height);
      const w = sourceImg.width * scale, h = sourceImg.height * scale;
      ctx.drawImage(sourceImg, (size - w) / 2, (size - h) / 2, w, h);
    }

    function renderFilterSwatches(){
      filterRow.style.display = 'flex';
      filterRow.innerHTML = ALBUM_FILTERS.map(f => `
        <button class="album-filter-swatch${f.id === activeFilterId ? ' active' : ''}" data-filter="${f.id}" type="button">
          <span class="sw" style="filter:${f.css === 'none' ? '' : f.css};background-image:url('${swatchThumb}');background-size:cover;background-position:center;"></span>
          <span>${f.label}</span>
        </button>
      `).join('');
      filterRow.querySelectorAll('.album-filter-swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilterId = btn.dataset.filter;
          filterRow.querySelectorAll('.album-filter-swatch').forEach(b => b.classList.toggle('active', b === btn));
          const f = ALBUM_FILTERS.find(x => x.id === activeFilterId);
          drawWithFilter(f.css === 'none' ? 'none' : f.css);
        });
      });
    }

    function showReadError(){
      canvas = null;
      sourceImg = null;
      filterRow.style.display = 'none';
      postBtn.disabled = true;
      canvasWrap.innerHTML = `<div class="album-canvas-placeholder">Couldn't read that photo — try again.</div>`;
    }

    // Phone cameras hand back 12-48MP photos. Reading those as a base64 data
    // URL (and repeating that string in every filter swatch) blew up memory
    // and made the tab crash or silently drop the photo on some phones.
    // Now: load via an object URL, shrink once to <=1800px (the final image is
    // 900x900 anyway), and give the swatches a tiny 96px thumbnail.
    function handleFile(file){
      if (!file) return;
      const token = ++loadToken;
      canvas = null;
      sourceImg = null;
      filterRow.style.display = 'none';
      canvasWrap.innerHTML = `
        <div class="album-canvas-loading">
          <span class="ring"></span>
          <span class="txt">Bringing your photo in…</span>
        </div>`;
      postBtn.disabled = true;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onerror = () => {
        URL.revokeObjectURL(url);
        if (token === loadToken) showReadError();
      };
      img.onload = () => {
        try {
          if (token !== loadToken) return;
          const iw = img.naturalWidth || img.width;
          const ih = img.naturalHeight || img.height;
          if (!iw || !ih) throw new Error('empty image');
          const k = Math.min(1, 1800 / Math.max(iw, ih));
          const w = Math.max(1, Math.round(iw * k));
          const h = Math.max(1, Math.round(ih * k));
          const src = document.createElement('canvas');
          src.width = w; src.height = h;
          src.getContext('2d').drawImage(img, 0, 0, w, h);

          const th = document.createElement('canvas');
          th.width = th.height = 96;
          const s = Math.max(96 / w, 96 / h);
          th.getContext('2d').drawImage(src, (96 - w * s) / 2, (96 - h * s) / 2, w * s, h * s);
          swatchThumb = th.toDataURL('image/jpeg', 0.7);

          sourceImg = src;
          activeFilterId = 'original';
          drawWithFilter('none');
          renderFilterSwatches();
          postBtn.disabled = false;
        } catch (err) {
          console.error('album photo load failed', err);
          if (token === loadToken) showReadError();
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      img.src = url;
    }

    // Inside the Android/iOS app (Capacitor) the plain <input type=file> route is
    // flaky (permissions, FileProvider, WebView chooser quirks). If the native
    // Camera plugin is installed, use it; otherwise fall back to the file inputs.
    async function nativePick(source){
      try {
        const cap = window.Capacitor;
        if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return false;
        const Cam = (cap.Plugins && cap.Plugins.Camera) || (cap.registerPlugin && cap.registerPlugin('Camera'));
        if (!Cam || !Cam.getPhoto) return false;
        const photo = await Cam.getPhoto({ source, resultType: 'uri', quality: 90, width: 1800, correctOrientation: true });
        if (!photo || !photo.webPath) return false;
        const res = await fetch(photo.webPath);
        handleFile(await res.blob());
        return true;
      } catch (err) {
        const msg = String((err && (err.message || err)) || '');
        if (/cancel/i.test(msg)) return true;   // user backed out, do nothing
        console.warn('native photo pick failed, using file input', err);
        return false;
      }
    }
    modal.querySelector('#albumTakePhoto').addEventListener('click', async () => {
      if (!(await nativePick('CAMERA'))) modal.querySelector('#albumFileCamera').click();
    });
    modal.querySelector('#albumPickPhoto').addEventListener('click', async () => {
      if (!(await nativePick('PHOTOS'))) modal.querySelector('#albumFileGallery').click();
    });
    // Some Android cameras return the same filename every time, and a browser
    // only fires 'change' when the selection differs — so clear the input once
    // the file has been handed off (handleFile grabs its object URL synchronously).
    ['#albumFileCamera', '#albumFileGallery'].forEach(sel => {
      const input = modal.querySelector(sel);
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        handleFile(file);
        input.value = '';
      });
    });

    const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 220); };
    modal.querySelector('#albumModalCancel').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    postBtn.addEventListener('click', async () => {
      if (!canvas || !albumId) return;
      const takeBtn = modal.querySelector('#albumTakePhoto');
      const pickBtn = modal.querySelector('#albumPickPhoto');
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span> Posting...`;
      takeBtn.disabled = true;
      pickBtn.disabled = true;
      filterRow.style.pointerEvents = 'none';
      filterRow.style.opacity = '.4';
      captionInput.disabled = true;

      const overlay = document.createElement('div');
      overlay.className = 'album-canvas-uploading';
      overlay.innerHTML = `
        <span class="ring"></span>
        <span class="txt">Saving to the album…</span>
        <span class="sub">Just this circle will ever see it</span>
        <span class="album-upload-bar"></span>
      `;
      canvasWrap.appendChild(overlay);

      const resetControls = () => {
        overlay.remove();
        postBtn.disabled = false;
        postBtn.textContent = 'Post to album';
        takeBtn.disabled = false;
        pickBtn.disabled = false;
        filterRow.style.pointerEvents = '';
        filterRow.style.opacity = '';
        captionInput.disabled = false;
      };

      try {
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
        const path = `${albumId}/${Date.now()}-${currentUser.id}.jpg`;
        const { error: uploadError } = await supabaseClient.storage
          .from('album-photos')
          .upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;

        const { data: newPhoto, error: insertError } = await supabaseClient.from('album_photos').insert({
          album_id: albumId,
          user_id: currentUser.id,
          photo_url: path,
          filter_applied: activeFilterId,
          caption: captionInput.value.trim() || null,
        }).select('id').single();
        if (insertError) throw insertError;
        posthog.capture('album_photo_added', { circle_id: circleId, filter_applied: activeFilterId, answered_prompt: !!promptToAnswer });

        showToast('Added to the album 📸');
        close();
        await refreshAlbumGallery();
      } catch (err) {
        resetControls();
        showToast(err.message || 'Could not post photo', 'error');
      }
    });
  }

  // Golden Hour — reply to a pinned question with a recorded voice note.
  // Records straight into the browser (MediaRecorder, same as the regular
  // voice-post button), lets the person preview/re-record before sending,
  // then posts it to the main feed — tagged with the question it answers.
  function openGoldenHourVoiceReplyModal(promptToAnswer){
    if (!promptToAnswer) return;
    const asker = members.find(m => m.id === promptToAnswer.from_user_id);
    // Respect the sender's anonymity choice here too — this modal only
    // opens once the card is already unblurred, but that reveal shows
    // "Anonymous" for anon sends, so this name has to match.
    const askerName = promptToAnswer.is_anonymous ? 'Anonymous' : (asker?.username || 'Someone');

    const modal = document.createElement('div');
    modal.className = 'album-modal-backdrop';
    modal.innerHTML = `
      <div class="album-modal">
        <h3>Reply with your voice</h3>
        <p class="hint">Only ${escapeHtml(askerName)} will hear this.</p>
        <div class="album-modal-pinned-q">
          <span class="pin-ic">🌇</span>
          <span>${escapeHtml(promptToAnswer.question)}</span>
        </div>
        <div class="gh-voice-stage" id="ghVoiceStage">
          <button class="gh-voice-record-btn" id="ghVoiceRecordBtn" type="button" aria-label="Record">
            <svg class="gh-voice-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span class="gh-voice-stop-icon"></span>
          </button>
          <span class="gh-voice-hint" id="ghVoiceHint">Tap to record</span>
          <span class="gh-voice-timer" id="ghVoiceTimer" style="display:none;">0:00</span>
        </div>
        <textarea id="ghVoiceCaption" maxlength="140" placeholder="Add a caption... (optional)" style="display:none;"></textarea>
        <div class="album-modal-row">
          <button class="album-modal-cancel" type="button" id="ghVoiceCancel">Cancel</button>
          <button class="album-modal-post" type="button" id="ghVoiceSend" disabled>Send reply</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const stage = modal.querySelector('#ghVoiceStage');
    const recordBtn = modal.querySelector('#ghVoiceRecordBtn');
    const hint = modal.querySelector('#ghVoiceHint');
    const timerEl = modal.querySelector('#ghVoiceTimer');
    const captionInput = modal.querySelector('#ghVoiceCaption');
    const sendBtn = modal.querySelector('#ghVoiceSend');
    const cancelBtn = modal.querySelector('#ghVoiceCancel');

    const MAX_SECONDS = 90;
    let recorder = null;
    let chunks = [];
    let stream = null;
    let startTime = null;
    let timerInterval = null;
    let recordedBlob = null;
    let durationSeconds = 0;

    const close = () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      clearInterval(timerInterval);
      modal.classList.remove('show');
      setTimeout(() => modal.remove(), 220);
    };
    cancelBtn.addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    function renderPreview(){
      const url = URL.createObjectURL(recordedBlob);
      stage.innerHTML = `
        <div class="gh-voice-preview">
          <audio src="${url}" controls controlsList="nodownload noremoteplayback" oncontextmenu="return false;"></audio>
          <button class="gh-voice-rerecord" type="button" id="ghVoiceRerecord">Re-record</button>
        </div>
      `;
      stage.querySelector('#ghVoiceRerecord').addEventListener('click', () => {
        recordedBlob = null;
        sendBtn.disabled = true;
        renderIdleStage();
      });
      captionInput.style.display = 'block';
      sendBtn.disabled = false;
    }

    function renderIdleStage(){
      stage.innerHTML = `
        <button class="gh-voice-record-btn" id="ghVoiceRecordBtn" type="button" aria-label="Record">
          <svg class="gh-voice-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span class="gh-voice-stop-icon"></span>
        </button>
        <span class="gh-voice-hint" id="ghVoiceHint">Tap to record</span>
        <span class="gh-voice-timer" id="ghVoiceTimer" style="display:none;">0:00</span>
      `;
      wireRecordBtn(stage.querySelector('#ghVoiceRecordBtn'), stage.querySelector('#ghVoiceHint'), stage.querySelector('#ghVoiceTimer'));
    }

    function wireRecordBtn(btn, hintEl, timerEl){
      btn.addEventListener('click', async () => {
        if (btn.classList.contains('recording')){ recorder.stop(); return; }
        try {
          stream = await getVoiceStream();
          recorder = createVoiceRecorder(stream);
          chunks = [];
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            durationSeconds = (Date.now() - startTime) / 1000;
            recordedBlob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
            renderPreview();
          };
          recorder.start();
          startTime = Date.now();
          btn.classList.add('recording');
          hintEl.textContent = 'Recording — tap to stop';
          timerEl.style.display = 'inline';
          if (navigator.vibrate) navigator.vibrate(15);
          timerInterval = setInterval(() => {
            const secs = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_SECONDS) recorder.stop();
          }, 250);
        } catch (err) {
          showToast('Microphone access denied or unavailable', 'error');
        }
      });
    }
    wireRecordBtn(recordBtn, hint, timerEl);

    sendBtn.addEventListener('click', async () => {
      if (!recordedBlob || !currentUser) return;
      sendBtn.disabled = true;
      cancelBtn.disabled = true;
      sendBtn.innerHTML = `<span class="mini-spinner"></span> Sending...`;

      try {
        const ghMimeType = recordedBlob.type || 'audio/webm';
        const ghExt = ghMimeType.includes('mp4') ? 'm4a' : 'webm';
        const path = `${currentUser.id}/${circleId}/${Date.now()}-gh.${ghExt}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('voice-posts')
          .upload(path, recordedBlob, { contentType: ghMimeType });
        if (uploadError) throw uploadError;

        const { error: insertError } = await supabaseClient.from('posts').insert({
          circle_id: circleId,
          user_id: currentUser.id,
          caption: captionInput.value.trim() || null,
          media_url: path,
          media_type: 'voice',
          duration_seconds: durationSeconds,
          is_anonymous: false,
          gh_question: promptToAnswer.question,
          gh_asker_name: askerName,
        });
        if (insertError) throw insertError;
        posthog.capture('golden_hour_prompt_answered', { circle_id: circleId, prompt_id: promptToAnswer.id, response_type: 'voice', duration_seconds: durationSeconds });

        await supabaseClient
          .from('golden_hour_prompts')
          .update({ answered_at: new Date().toISOString() })
          .eq('id', promptToAnswer.id);

        revealNotifiedIds.delete(promptToAnswer.id);
        clearInterval(promptRevealTicker);
        activePrompt = null;
        const url = new URL(window.location.href);
        url.searchParams.delete('prompt');
        window.history.replaceState(null, '', url.pathname + url.search);

        showToast('Reply sent 🎤');
        close();
        document.getElementById('ghPinSlot').innerHTML = '';
        await refreshHomeFeed();
      } catch (err) {
        sendBtn.disabled = false;
        cancelBtn.disabled = false;
        sendBtn.textContent = 'Send reply';
        showToast(err.message || 'Could not send your reply', 'error');
      }
    });
  }

  // CAMERA TAB — Snapchat-style: returning members land here and
  // the recorder is already open, so the default action is making
  // something, not scrolling. Dismiss the recorder and this panel
  // is a one-tap way back in (plus a nudge toward Home).
  // ---------------------------------------------------------
  function openCameraRecorder(){

    try { posthog.capture('camera_tab_opened', { circle_id: circleId }); } catch (_) {}
    openVideoRecorder({
      from: 'camera_tab',

    });

  // LANDING RULE (Snapchat-style):
  //  - A member's very FIRST time in this circle -> Home/feed, never the camera.
  //  - Every return after that (same day, next day, any time) -> Camera.
  //  - Invite arrivals, deep links to a post, and Golden Hour replies force Home.
  // "First time" is remembered per user + circle on this device. A short grace
  // window keeps a reload during that first session on Home instead of
  // flipping to the camera. The decision is held in memory for this page load
  // so in-app re-renders never re-open the camera by surprise.
  const FIRST_SESSION_MS = 10 * 60 * 1000;
  let landingForThisLoad = null;
  function decideLanding(forceHome){
    if (landingForThisLoad) return landingForThisLoad;
    const uid = currentUser ? currentUser.id : 'anon';
    const seenKey = `waater_firstseen_${uid}_${circleId}`;
    const legacyKey = `waater_visits_${uid}_${circleId}`;   // older builds counted visits
    let firstSeenAt = 0, legacyVisits = 0;
    try { firstSeenAt = parseInt(localStorage.getItem(seenKey) || '0', 10) || 0; } catch (_) {}
    try { legacyVisits = parseInt(localStorage.getItem(legacyKey) || '0', 10) || 0; } catch (_) {}
    const params = new URLSearchParams(window.location.search);
    const deepLink = params.has('post') || params.has('prompt');
    const everSeen = firstSeenAt > 0 || legacyVisits > 0;
    const inFirstSession = firstSeenAt > 0 && (Date.now() - firstSeenAt) < FIRST_SESSION_MS;
    const isFirstEver = !everSeen;
    const landing = (forceHome || deepLink || isFirstEver || inFirstSession) ? 'home' : 'camera';
    if (isFirstEver){
      try { localStorage.setItem(seenKey, String(Date.now())); } catch (_) {}
    }
    landingForThisLoad = landing;
    try { posthog.capture('circle_landing', { circle_id: circleId, landing, first_ever: isFirstEver, forced_home: !!(forceHome || deepLink) }); } catch (_) {}
    return landing;
  }

  // "Who's posted today" — drives the Camera panel line and the Home nudge.
  function postedTodayStats(posts){
    const dayAgo = Date.now() - 24 * 3600 * 1000;
    const recent = (posts || []).filter(p => !p.is_anonymous && new Date(p.created_at).getTime() > dayAgo);
    const ids = new Set(recent.map(p => p.user_id));
    return { count: ids.size, iPosted: !!(currentUser && ids.has(currentUser.id)) };
  }

  function updateCameraStatus(posts){
    const el = document.getElementById('camSub');
    if (!el) return;
    const st = postedTodayStats(posts);
    const others = st.count - (st.iPosted ? 1 : 0);
    if (st.iPosted) el.textContent = others > 0 ? `You posted today · ${others} other${others === 1 ? '' : 's'} did too` : 'You posted today. Go again — nobody\u2019s counting.';
    else if (others > 0) el.textContent = `${others} of ${Math.max(members.length - 1, 1)} friend${others === 1 ? '' : 's'} posted today. Your turn.`;
    else el.textContent = 'Nobody has posted today. Be the one who starts it.';
  }

  function renderHomeNudge(posts){
    const st = postedTodayStats(posts);
    const others = st.count - (st.iPosted ? 1 : 0);
    if (st.iPosted || others < 1) return '';
    return `
      <button class="home-nudge" id="homeNudge" type="button">
        <span class="home-nudge-dot"></span>
        <span class="home-nudge-copy"><b>${others} friend${others === 1 ? '' : 's'} posted today.</b> Film up to 30 seconds.</span>
        <span class="home-nudge-go">Camera</span>
      </button>`;
  }

            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;">

      if (!requireAuth()) return;

      if (voiceBtn.classList.contains('recording')) {
        voiceRecorder.stop();
        return;

      try {
        const stream = await getVoiceStream();
        voiceRecorder = createVoiceRecorder(stream);
        voiceChunks = [];
        voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);

        voiceRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(voiceTimerInterval);
          voiceTimer.style.display = 'none';
          voiceBtn.classList.remove('recording');

          const durationSeconds = (Date.now() - voiceStartTime) / 1000;
          const voiceMimeType = voiceRecorder.mimeType || 'audio/webm';
          const voiceExt = voiceMimeType.includes('mp4') ? 'm4a' : 'webm';
          const blob = new Blob(voiceChunks, { type: voiceMimeType });
          const path = `${currentUser.id}/${circleId}/${Date.now()}.${voiceExt}`;

          voiceBtn.disabled = true;
          try {
            const { error: uploadError } = await supabaseClient.storage
              .from('voice-posts')
              .upload(path, blob, { contentType: voiceMimeType });
            if (uploadError) throw uploadError;

            const { error: insertError } = await supabaseClient.from('posts').insert({
              circle_id: circleId,
              user_id: currentUser.id,
              caption: textarea.value.trim() || null,
              media_url: path,

        voiceStartTime = Date.now();

        voiceTimer.style.display = 'inline';

          const secs = Math.floor((Date.now() - voiceStartTime) / 1000);
          voiceTimer.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_VOICE_SECONDS) voiceRecorder.stop();

      if (invitesUsedToday >= 2) {
        showToast("You've used both invites for today — try again tomorrow", 'error');
        return;

      // Soft nudge, not a gate: if this circle has zero posts, whoever gets
      // invited next lands on a blank page and bounces. Give whoever's
      // inviting a beat to seed it first — but never block the invite if
      // they'd rather send it anyway. Applies to every member, not just

      if (!circleHasPosts) {

          return;

        if (choice === 'cancel') return;
        // 'invite' (invite anyway) and 'posted' (they just wrote something) both
        // fall through to the normal invite flow.
      }

      const inviteRes = await openInviteModal();
      const note = inviteRes ? inviteRes.note : null;
      const inviteMedia = inviteRes ? inviteRes.media : null;
      try {
        // Try passing the note through to the RPC. If the backend hasn't
        // been updated to accept p_note yet, fall back to the plain call
        // so invites never break because of this feature.
        let rpcResult;
        if (note) {
          rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId, p_note: note });
          if (rpcResult.error) {
            rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
          }
        } else {
          rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
        }
        const { data, error } = rpcResult;
        if (error) throw error;
        if (inviteMedia) {
          try { await uploadWelcomeMedia(inviteMedia); }
          catch (e) { showToast(`Invite is ready, but your ${inviteMedia.type === 'voice' ? 'voice note' : 'video'} didn't upload`, 'error'); }
        }
        posthog.capture('invite_sent', { circle_id: circleId, has_note: !!note, has_media: inviteMedia ? inviteMedia.type : null, invites_used_today: invitesUsedToday + 1 });

        invitesUsedToday += 1;
        const badge = document.getElementById('inviteCountBadge');
        if (badge) {
          badge.textContent = `${invitesUsedToday}/2 today`;
          badge.style.color = invitesUsedToday >= 2 ? 'var(--danger)' : 'var(--grey)';
        }
        if (invitesUsedToday >= 2) inviteBtn.disabled = true;

        try {

          await navigator.clipboard.writeText(`${window.location.origin}/circle?code=${encodeURIComponent(data.code)}`);
          
          showToast('Invite link copied — works for 24 hours');
        } catch (e) {
          showToast(`Invite code: ${data.code}`);
        }
      } catch (err) {
        if (err.message?.includes('invite_limit_reached')) {
          showToast("You've used both invites for today — try again tomorrow", 'error');
          invitesUsedToday = 2;
          inviteBtn.disabled = true;
        } else if (err.message?.includes('circle_full')) {
          showToast('This circle is full (max 10 members)', 'error');
        } else {
          showToast(err.message || 'Could not create invite', 'error');
        }
      }
    });

    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => {

    // First time here -> Home. Every time after -> straight into the camera.

    const landing = decideLanding(shouldWelcome);
    if (landing === 'camera'){

    initGoldenHourCard();

    subscribeToGoldenHourPrompts();
    rxInit();

    // Play the ceremony without blocking the feed load beneath it.

  // ---- small utilities --------------------------------------------------
  // escapeHtml() above doesn't escape quotes, so it isn't safe inside an
  // attribute like src="..." — these are.
  function pcEsc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // http(s) only. Anything else (javascript:, data:, garbage) returns ''.
  function pcSafeUrl(u){
    try {
      const x = new URL(String(u || '').trim(), window.location.href);
      return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
    } catch(_) { return ''; }
  }
  function pcHash(s){
    let h = 2166136261;
    for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function pcRand(seed){
    let a = seed | 0;
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pcAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    if (s < 604800) return `${Math.floor(s / 86400)}d`;
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function pcAvatar(p, size, cls){
    const name = p?.username || '?';
    const style = `--s:${size}px`;
    const url = p?.avatar_url ? pcSafeUrl(p.avatar_url) : '';
    if (url) return `<span class="pc-av ${cls || ''}" style="${style}"><img src="${pcEsc(url)}" alt="" loading="lazy"></span>`;
    const h = pcHash(name) % 360;
    return `<span class="pc-av ${cls || ''}" style="${style};background:hsl(${h} 52% 46%)">${pcEsc(initials(name))}</span>`;
  }
  function pcAnonAvatar(size, cls){

  function pcMe(){ return currentUser ? members.find(m => m.id === currentUser.id) : null; }

  // ---- mobile hero: small face-pile of the first few members, for belonging ----
  function pcFacepileHtml(isMember){
    if (!members.length) return '';
    const shown = members.slice(0, 5);
    const stack = shown.map(m => pcAvatar(m, 26)).join('');
    const rest = members.length - shown.length;
    const copy = isMember
      ? (rest > 0 ? `<b>You</b> + ${members.length - 1} ${members.length - 1 === 1 ? 'other' : 'others'} are in here` : `Just <b>you</b> so far — invite someone`)
      : (rest > 0 ? `<b>${members.length}</b> people already here` : `<b>${members.length}</b> ${members.length === 1 ? 'person is' : 'people are'} already here`);
    return `<div class="pc-facepile"><span class="stack">${stack}</span><span class="copy">${copy}</span></div>`;
  }

  // ---- cover: the orbit ---------------------------------------------------
  function pcOrbitHtml(isMember){
    const rand = pcRand(pcHash(String(circle.id)));
    // [radius as fraction of the orbit box, avatar size, capacity]
    const rings = [ { r: .17, s: 42, cap: 3 }, { r: .31, s: 36, cap: 5 }, { r: .44, s: 30, cap: 7 } ];
    const total = rings.reduce((n, r) => n + r.cap, 0);
    const wantsSlot = !isMember;
    const overflow = members.length > total;
    const visible = members.slice(0, wantsSlot || overflow ? total - 1 : total);
    const specials = wantsSlot ? 'slot' : (overflow ? 'more' : null);
    const items = visible.map(m => ({ m }));
    if (specials) items.push({ special: specials });

    let html = `
      <div class="pc-ring r1"></div><div class="pc-ring r2"></div><div class="pc-ring r3"></div><div class="pc-ring r4"></div>
      <div class="pc-core">${PC_ICON.orbit}</div>`;
    let idx = 0;
    rings.forEach(ring => {
      const chunk = items.slice(idx, idx + ring.cap);
      if (!chunk.length) return;
      const base = rand() * Math.PI * 2;
      chunk.forEach((it, i) => {
        const ang = base + (i * Math.PI * 2 / chunk.length) + (rand() - .5) * .3;
        const left = 50 + ring.r * 100 * Math.cos(ang);
        const top  = 50 + ring.r * 100 * Math.sin(ang);
        const pos = `left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;--s:${ring.s};--d:${(.15 + (idx + i) * .07).toFixed(2)}s`;
        if (it.special === 'slot'){
          html += `<button type="button" class="pc-av pc-orb slot" style="${pos}" data-act="join" aria-label="Join this circle">${PC_ICON.plus}</button>`;
        } else if (it.special === 'more'){
          html += `<span class="pc-av pc-orb more" style="${pos}">+${members.length - visible.length}</span>`;
        } else {
          const isMe = currentUser && it.m.id === currentUser.id;
          const p = it.m;
          const h = pcHash(p.username || '?') % 360;
          const url = p.avatar_url ? pcSafeUrl(p.avatar_url) : '';
          html += `<span class="pc-av pc-orb ${isMe ? 'me' : ''}" style="${pos};${url ? '' : `background:hsl(${h} 52% 46%)`}" title="${pcEsc(p.username || '')}">${url ? `<img src="${pcEsc(url)}" alt="">` : pcEsc(initials(p.username))}</span>`;
        }
      });
      idx += chunk.length;
    });
    return html;
  }

  // ---- voting (optimistic, reverts on failure) --------------------------
  function pcApplyVote(article, myVote, score, burst){
    article.dataset.my = myVote;
    const up = article.querySelector('.pc-v.up'), down = article.querySelector('.pc-v.down');
    up.classList.toggle('on', myVote === 1);   up.setAttribute('aria-pressed', myVote === 1);
    down.classList.toggle('on', myVote === -1); down.setAttribute('aria-pressed', myVote === -1);
    const el = article.querySelector('.pc-score');
    const changed = Number(el.dataset.score) !== score;
    el.dataset.score = score;
    el.textContent = score;
    el.classList.toggle('pos', score > 0);
    el.classList.toggle('neg', score < 0);
    if (changed){
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
    if (burst){
      up.classList.remove('burst'); void up.offsetWidth; up.classList.add('burst');
      setTimeout(() => up.classList.remove('burst'), 520);
    }
  }

  async function pcVote(article, value){
    if (!requireAuth(null, 'vote')) return;
    if (article.dataset.busy === '1') return;
    const id = article.dataset.postId;
    const prev = Number(article.dataset.my || 0);
    const next = prev === value ? 0 : value;
    const prevScore = Number(article.querySelector('.pc-score').dataset.score);
    pcApplyVote(article, next, prevScore + (next - prev), next === 1);
    article.dataset.busy = '1';
    try {
      const { error } = await supabaseClient.rpc('vote_post', { p_post_id: id, p_value: next });
      if (error) throw error;
      const { data } = await supabaseClient.from('posts').select('score').eq('id', id).maybeSingle();
      if (data && typeof data.score === 'number') pcApplyVote(article, next, data.score, false);
    } catch (err) {
      pcApplyVote(article, prev, prevScore, false);
      showToast(err.message || 'Could not vote', 'error');
    } finally {
      delete article.dataset.busy;
    }
  }

    if (open && !thread.dataset.loaded){

  async function pcSendComment(article){
    if (!requireAuth(null, 'reply')) return;
    const input = article.querySelector('.pc-cinput');
    const btn = article.querySelector('.pc-csend');
    if (!input || !btn || btn.disabled) return;
    const text = input.value.trim();
    if (!text) return;
    btn.disabled = true;
    try {
      const { error } = await supabaseClient.from('post_comments').insert({ post_id: article.dataset.postId, user_id: currentUser.id, content: text });
      if (error) throw error;
      input.value = '';
      await pcLoadThread(article);
    } catch (err) {
      showToast(err.message || 'Could not post reply', 'error');
    } finally {
      btn.disabled = !input.value.trim();
    }
  }

  // First click arms the button ("Delete?"), second click within 3s confirms.
  function pcArm(btn, armedLabel, onConfirm){
    if (btn.dataset.armed === '1'){
      clearTimeout(btn._t);
      btn.dataset.armed = '';
      return onConfirm();
    }
    const original = btn.innerHTML;
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = armedLabel;
    btn._t = setTimeout(() => {
      btn.dataset.armed = '';
      btn.classList.remove('armed');
      btn.innerHTML = original;
    }, 3000);
  }

  function pcDeletePost(article, btn){
    if (!currentUser) return;
    pcArm(btn, 'Delete?', async () => {
      btn.disabled = true;
      try {
        const fileRef = await mediaRefBeforeDelete('posts', article.dataset.postId);
        const { error } = await supabaseClient.from('posts').delete().eq('id', article.dataset.postId).eq('user_id', currentUser.id);
        if (error) throw error;
        eraseMedia(fileRef);
        article.remove();
        showToast('Post deleted');
        if (!document.querySelector('#pcFeed .pc-post')) refreshPubFeed();
      } catch (err) {
        btn.disabled = false;
        showToast(err.message || 'Could not delete post', 'error');

    });

    else { el.alt = ''; }

    const wrap = document.getElementById('pcCompose');
    if (!wrap) return;
    const ph = document.getElementById('pcComposePh');
    const text = document.getElementById('pcText');
    const mediaBtn = document.getElementById('pcMediaBtn');

    const anonBanner = document.getElementById('pcAnonBanner');

    const open = () => { wrap.classList.add('open'); text.focus(); };
    ph.addEventListener('click', open);
    window.pcOpenComposer = open;

    const refresh = () => {
      const hasUrl = !!mediaUrl.value.trim();
      postBtn.disabled = !text.value.trim() && !hasUrl;

      text.style.height = 'auto';

      if (showing) mediaUrl.focus();

        pcSetSort('new');
      } catch (err) {
        showToast(err.message || 'Could not post', 'error');

  function pcUpdatePulse(posts){
    const el = document.getElementById('pcPulse');
    if (!el || currentSort === 'top') return;      // "top" isn't ordered by recency
    const dayAgo = Date.now() - 86400000;
    const n = posts.filter(p => new Date(p.created_at).getTime() > dayAgo).length;
    el.innerHTML = n === 0
      ? ''
      : `<i></i>${n}${posts.length >= 50 ? '+' : ''} ${n === 1 ? 'post' : 'posts'} today`;
  }

  async function refreshPubFeed(){
    const feed = document.getElementById('pcFeed');
    if (!feed) return;
    PC.pending = 0;
    const pill = document.getElementById('pcNew');
    if (pill) pill.classList.remove('show');

    const sortAtStart = currentSort;
    if (feed.querySelector('.pc-post')) feed.classList.add('is-loading');
    const posts = await loadPosts(sortAtStart);
    if (sortAtStart !== currentSort) return;         // a newer sort click won the race
    PC.posts = posts;
    pcUpdatePulse(posts);

    if (!posts.length){
      feed.classList.remove('is-loading');
      feed.innerHTML = `
        <div class="pc-empty">
          <h3>Nothing here yet</h3>
          <p>${myRole !== null ? 'Start the first thread and set the tone for this circle.' : 'Join the circle to start the first thread.'}</p>
          <button type="button" data-act="${myRole !== null ? 'compose' : 'join'}">${myRole !== null ? 'Start a thread' : 'Join circle'}</button>
        </div>`;
      return;
    }

    const votes = await loadMyVotes(posts.map(p => p.id));
    if (sortAtStart !== currentSort) return;

    const first = posts[0];
    const spotId = (sortAtStart === 'hot' && (first.score || 0) >= 3 &&
      Date.now() - new Date(first.created_at).getTime() < 172800000) ? first.id : null;

    feed.innerHTML = posts.map(p => pcPostHtml(p, votes[p.id] || 0, { spot: p.id === spotId })).join('');
    feed.classList.remove('is-loading');
  }

  let composerTimer = null;

  function setupComposerBehavior(){
    const fab = document.getElementById('homeFab');
    const composer = document.getElementById('homeComposer');
    if (!fab || !composer) return;
    const THRESHOLD = 40;
    const isMobile = () => window.matchMedia('(max-width:899.98px)').matches;

    function resetToVisible(){
      // Desktop (or a resize onto desktop): composer is always visible,
      // never collapsed, never in overlay mode. This is the fix — nothing
      // here should ever require a refresh to undo.
      composer.classList.remove('collapsed', 'overlay', 'overlay-open');
      fab.classList.remove('show');
    }

    function onScroll(){
      if (!isMobile()){ resetToVisible(); return; }
      if (composer.classList.contains('overlay-open')) return;

      const y = window.scrollY;
      const isCollapsed = composer.classList.contains('collapsed');

      if (!isCollapsed){
        // how much scroll room would be left once the composer is gone?
        const composerH = composer.offsetHeight + 18; // +18 for its margin-top
        const spare = document.documentElement.scrollHeight - window.innerHeight - composerH;

        // only collapse if there's still plenty of page left to scroll
        if (y > THRESHOLD && spare > THRESHOLD + 60){
          composer.classList.add('collapsed');
          fab.classList.add('show');
        }
      } else if (y < 4){
        // only expand when you're basically at the very top
        composer.classList.remove('collapsed');
        fab.classList.remove('show');
      }
    }


    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll, { passive:true });
    onScroll();

    fab.addEventListener('click', () => {
      composer.classList.remove('collapsed');
      composer.classList.add('overlay', 'overlay-open');
      fab.classList.remove('show');
      document.getElementById('homeComposerText').focus();
      resetComposerTimer();
      // Bring the navbar back down along with the composer.
      if (window.__waaterShowNav) window.__waaterShowNav();
    });

    document.addEventListener('click', (e) => {
      if (!composer.classList.contains('overlay-open')) return;
      if (composer.contains(e.target) || fab.contains(e.target)) return;
      closeComposerOverlay();
    });
  }

  function resetComposerTimer(){
    clearTimeout(composerTimer);
    composerTimer = setTimeout(() => {
      const text = document.getElementById('homeComposerText').value.trim();
      const media = document.getElementById('homeMediaUrl').value.trim();
      const focused = document.activeElement === document.getElementById('homeComposerText')
        || document.activeElement === document.getElementById('homeMediaUrl');
      // Only auto-close an empty, untouched composer — never cut someone off
      // mid-thought just because they paused for a few seconds.
      if (!text && !media && !focused) closeComposerOverlay();
    }, 15000);
  }

  function closeComposerOverlay(){
    const composer = document.getElementById('homeComposer');
    clearTimeout(composerTimer);
    composer.classList.remove('overlay-open');
    setTimeout(() => composer.classList.remove('overlay'), 260);
    composer.classList.add('collapsed');
    if (window.scrollY > 40) document.getElementById('homeFab')?.classList.add('show');
  }

  // =========================================================
  // SCREENSHOT GUARD — deterrent layer for private circles
  //
  // Be honest with yourself about what this is: a web page can NOT
  // truly block screenshots. Phone screenshots and photos of a screen
  // fire no browser event at all. This layer does what a browser can:
  //   1. catches desktop screenshot shortcuts and shows the popup
  //   2. blocks print / save-page / right-click + drag on media
  // For real blocking you'd need a native app (Android FLAG_SECURE).
  // The blur-on-focus-loss layer was removed — it was confusing users.
  // =========================================================
  const SG_CAUGHT_LINES = [
    { emoji:'📸', title:'You got caught!',            body:'You can\u2019t screenshot here. Everything stays inside the circle.',            button:'ok, I\u2019m sorry' },
    { emoji:'🚨', title:'The circle police are here.', body:'Whatever you just tried to take out of here \u2014 put it back. This place is for us only.', button:'fine, I\u2019ll behave' },
    { emoji:'🕵️', title:'Nice try, paparazzi.',        body:'Your friends said those things because they trust you. What\u2019s said here stays here.', button:'my bad' },
    { emoji:'🙈', title:'Nope.',                        body:'Screenshots don\u2019t live here. Memories do \u2014 add it to the album instead.',       button:'ok ok' },
  ];

  let sgPopup = null;

  function showCaughtPopup(){
    if (sgPopup) return;
    const line = SG_CAUGHT_LINES[Math.floor(Math.random() * SG_CAUGHT_LINES.length)];
    const el = document.createElement('div');
    el.className = 'sg-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <span class="sg-emoji">${line.emoji}</span>
        <h3>${line.title}</h3>
        <p>${line.body}</p>
        <button class="sg-btn" type="button">${line.button}</button>
      </div>`;
    document.body.appendChild(el);
    sgPopup = el;
    requestAnimationFrame(() => el.classList.add('show'));

    const btn = el.querySelector('.sg-btn');
    const close = () => {
      el.classList.remove('show');
      setTimeout(() => { el.remove(); sgPopup = null; }, 200);
    };
    btn.addEventListener('click', close);
    btn.focus();
  }

  function enableScreenshotGuard(){
    if (window.__sgOn) return;
    window.__sgOn = true;
    const body = document.body;
    body.classList.add('sg-active');

    // 1. desktop screenshot shortcuts (Windows: PrintScreen, Win+Shift+S;
    //    macOS: Cmd+Shift+3/4/5). Best effort: the OS may swallow the keys.
    const isShotShortcut = (e) =>
      e.key === 'PrintScreen' ||
      (e.metaKey && e.shiftKey && ['Digit3', 'Digit4', 'Digit5', 'KeyS'].includes(e.code));

    const onShot = () => {
      // Windows puts PrintScreen images on the clipboard; overwrite it.
      // (This replaces whatever the user had copied, only on this shortcut.)
      try { navigator.clipboard.writeText(' ').catch(() => {}); } catch (_) {}
      showCaughtPopup();
    };
    window.addEventListener('keydown', (e) => { if (isShotShortcut(e)) onShot(); });
    window.addEventListener('keyup',   (e) => { if (isShotShortcut(e)) onShot(); });

    // 2. print / save page, right-click and drag on media
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['p', 's'].includes((e.key || '').toLowerCase())){
        e.preventDefault();
        showCaughtPopup();
      }
    });
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest && e.target.closest('img, video')) e.preventDefault();
    });
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

  }

  // =========================================================
  // GUEST ENTRY
  // Invite link -> nickname -> straight into the circle. No sign-up.
  // The guest is a real (anonymous) Supabase user, so every RLS policy keeps
  // working. The server (join_circle_as_guest) is what enforces the valid
  // code and starts the 3-day clock; after that, a restrictive RLS policy
  // walls them off until they create an account.
  // =========================================================
  const TURNSTILE_SITE_KEY = '';   // paste your Cloudflare Turnstile SITE key here once CAPTCHA is on in Supabase

  let guestStatus = null;
  let guestTicker = null;

  function loadTurnstile(){
    if (window.turnstile) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.async = true; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  // Resolves with a fresh token, or undefined when CAPTCHA isn't configured.
  function startCaptcha(container){
    if (!TURNSTILE_SITE_KEY) return { token: () => Promise.resolve(undefined) };
    let current = null, waiters = [];
    loadTurnstile().then(() => {
      window.turnstile.render(container, {
        sitekey: TURNSTILE_SITE_KEY,
        appearance: 'interaction-only',
        callback: (t) => { current = t; waiters.splice(0).forEach(w => w(t)); },
        'expired-callback': () => { current = null; },
        'error-callback': () => { current = null; },
      });
    }).catch(() => {});
    return { token: () => current ? Promise.resolve(current) : new Promise(r => waiters.push(r)) };
  }

  function friendlyJoinError(e){
    const m = (e && e.message || '').toLowerCase();
    if (m.includes('invalid_nickname')) return 'Use 2 to 24 characters for your name.';
    if (m.includes('invite invalid') || m.includes('expired')) return 'This invite has expired or was already used. Ask for a new link.';
    if (m.includes('captcha')) return 'Verification failed. Refresh the page and try again.';
    if (m.includes('anonymous') && m.includes('disabled')) return 'Guest entry is switched off. Turn on anonymous sign-ins in Supabase.';
    if (m.includes('rate') || m.includes('too many')) return 'Too many tries. Wait a minute and try again.';
    return (e && e.message) || 'Something went wrong. Try again.';
  }

  function renderGuestGate(preview, inviteCode){
    const circleName = escapeHtml(preview?.circle_name || 'a private circle');
    const n = preview?.member_count;
    const who = n ? `${n} ${n === 1 ? 'person is' : 'people are'} in here.` : 'It is a small, private room.';
    const next = `/circle?code=${encodeURIComponent(inviteCode)}`;

    document.getElementById('pageBody').innerHTML = `
      <div class="gg">
        <div class="gg-avatar" id="ggAvatar" aria-hidden="true">?</div>
        <h1>You're invited to ${circleName}</h1>
        <p class="gg-sub">${who} Pick a name and step inside. No account needed.</p>
        <input class="gg-field" id="ggName" type="text" maxlength="24" autocomplete="off"
               autocapitalize="words" enterkeyhint="go" placeholder="Your name in here" aria-label="Your name">
        <div id="ggCaptcha"></div>
        <button class="gg-go" id="ggGo" type="button" disabled>Step inside</button>
        <div class="gg-err" id="ggErr" role="alert"></div>
        <p class="gg-foot">Only people in this circle can see what's inside.<br>
          Already have an account? <a href="/auth?next=${encodeURIComponent(next)}">Sign in</a></p>
      </div>`;

    const nameEl = document.getElementById('ggName');
    const goEl = document.getElementById('ggGo');
    const errEl = document.getElementById('ggErr');
    const avEl = document.getElementById('ggAvatar');
    const captcha = startCaptcha(document.getElementById('ggCaptcha'));
    let lastLetter = '';

    nameEl.addEventListener('input', () => {
      const v = nameEl.value.trim();
      goEl.disabled = v.length < 2;
      errEl.textContent = '';
      const letter = v ? v[0].toUpperCase() : '';
      avEl.classList.toggle('on', !!letter);
      avEl.textContent = letter || '?';
      if (letter && letter !== lastLetter){ avEl.classList.remove('pop'); void avEl.offsetWidth; avEl.classList.add('pop'); }
      lastLetter = letter;
    });

    async function go(){
      const nick = nameEl.value.trim();
      if (nick.length < 2 || goEl.disabled) return;
      goEl.disabled = true; nameEl.disabled = true;
      goEl.textContent = 'Opening the door…';
      errEl.textContent = '';
      let signedIn = false;
      try {
        const token = await captcha.token();
        const { error: aErr } = await supabaseClient.auth.signInAnonymously(token ? { options: { captchaToken: token } } : undefined);
        if (aErr) throw aErr;
        signedIn = true;
        const { data, error } = await supabaseClient.rpc('join_circle_as_guest', { p_code: inviteCode, p_nickname: nick });
        if (error) throw error;
        const cid = data && data.circle_id;
        if (!cid) throw new Error('Could not join this circle.');
        try { posthog.capture('guest_joined', { circle_id: cid }); } catch(_) {}
        window.location.replace(`/circle?private&ID=${encodeURIComponent(cid)}`);
      } catch(e){
        if (signedIn) { try { await supabaseClient.auth.signOut(); } catch(_) {} }
        errEl.textContent = friendlyJoinError(e);
        goEl.textContent = 'Step inside';
        goEl.disabled = nameEl.value.trim().length < 2;
        nameEl.disabled = false;
      }
    }
    goEl.addEventListener('click', go);
    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    setTimeout(() => nameEl.focus(), 150);
  }

  // ---------- Guest chip, sign-up sheet, expiry wall ----------
  function guestTimeLabel(secs){
    if (secs >= 86400){ const d = Math.ceil(secs / 86400); return `${d} day${d === 1 ? '' : 's'} left`; }
    if (secs >= 3600) return `${Math.floor(secs / 3600)}h left`;
    return 'Under 1h left';
  }

  function openGuestSignup(mode){
    if (document.getElementById('guestSheet')) return;
    const wall = mode === 'wall';
    const el = document.createElement('div');
    el.id = 'guestSheet';
    el.className = 'gs-backdrop' + (wall ? ' wall' : '');
    el.innerHTML = `
      <div class="gs" role="dialog" aria-modal="true" aria-labelledby="gsTitle">
        <h2 id="gsTitle">${wall ? 'Your 3 days are up' : 'Keep your spot'}</h2>
        <p>${wall
          ? 'Everything you posted is saved. Create an account to pick up where you left off.'
          : "Add an email and password so you don't lose this circle or anything you've posted."}</p>
        <label for="gsEmail">Email</label>
        <input id="gsEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        <label for="gsPass">Password</label>
        <input id="gsPass" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <div class="gs-err" id="gsErr" role="alert"></div>
        <div class="gs-ok" id="gsOk"></div>
        <button class="gs-go" id="gsGo" type="button">Create account</button>
        <div class="gs-alt">
          ${wall ? '' : '<button type="button" id="gsClose">Not now</button> · '}
          Already have an account? <a href="/auth?next=${encodeURIComponent(location.pathname + location.search)}">Sign in</a>
        </div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    const close = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); };
    if (!wall){
      el.querySelector('#gsClose').addEventListener('click', close);
      el.addEventListener('click', (e) => { if (e.target === el) close(); });
    }

    const go = el.querySelector('#gsGo'), err = el.querySelector('#gsErr'), ok = el.querySelector('#gsOk');
    async function submit(){
      const email = el.querySelector('#gsEmail').value.trim();
      const password = el.querySelector('#gsPass').value;
      err.textContent = ''; ok.textContent = '';
      if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
      if (password.length < 8) { err.textContent = 'Use at least 8 characters for your password.'; return; }
      go.disabled = true; go.textContent = 'Creating…';
      const { error } = await supabaseClient.auth.updateUser({ email, password }, { emailRedirectTo: location.origin + location.pathname + location.search });
      if (error){
        err.textContent = /already|registered/i.test(error.message)
          ? 'That email already has an account. Use Sign in below.' : error.message;
        go.disabled = false; go.textContent = 'Create account';
        return;
      }
      try { posthog.capture('guest_upgrade_started'); } catch(_) {}
      ok.textContent = `Check ${email} and tap the confirmation link. You'll be fully signed up after that.`;
      go.textContent = 'Email sent';
    }
    go.addEventListener('click', submit);
    el.querySelector('#gsPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  }

  function paintGuestChip(){
    if (!guestStatus) return;
    let chip = document.getElementById('guestChip');
    if (!chip){
      chip = document.createElement('button');
      chip.id = 'guestChip'; chip.type = 'button'; chip.className = 'guest-chip';
      chip.addEventListener('click', () => openGuestSignup('sheet'));
      document.body.appendChild(chip);
    }
    const secs = Math.max(0, Math.floor((new Date(guestStatus.expires_at).getTime() - Date.now()) / 1000));
    chip.classList.toggle('low', secs < 6 * 3600);
    chip.innerHTML = `<span class="gc-time">${guestStatus.expires_at ? guestTimeLabel(secs) : 'Guest'}</span><b>Sign up</b>`;
    if (guestStatus.expires_at && secs <= 0) { openGuestSignup('wall'); }
  }

  // Returns true when the visitor is an expired guest (page load should stop).
  async function initGuestLayer(){
    if (!currentUser || !currentUser.is_anonymous) return false;
    const { data, error } = await supabaseClient.rpc('my_guest_status');
    if (error || !data) { guestStatus = { expires_at: null }; paintGuestChip(); return false; }
    guestStatus = data;
    if (data.expired){
      document.getElementById('pageBody').innerHTML = '';
      openGuestSignup('wall');
      return true;
    }
    paintGuestChip();
    clearInterval(guestTicker);
    guestTicker = setInterval(paintGuestChip, 60000);
    return false;
  }

  // =========================================================
  // MAIN INIT
  // =========================================================
  async function init(){
    // Swap the static "Loading circle…" label for the water loader the
    // instant scripts run — covers every visit, joiners included.
    document.getElementById('pageBody').innerHTML = renderWaterLoader('Loading circle…');
    mountWaterLoader();

    await renderSidebar();
    if (await initGuestLayer()) return;

      const inviteCode = params.get('code');
      if (inviteCode && !circleId){
        // Not signed in — show the value first instead of a sign-up wall.
        // requireAuth()/redemption below is unchanged for anyone who's
        // already authenticated.
        if (!currentUser){
          document.getElementById('pageBody').innerHTML = renderWaterLoader('Loading…');
          mountWaterLoader();
          const { data: preview, error: previewError } = await supabaseClient
            .rpc('preview_circle_invite', { p_code: inviteCode });
          if (previewError || !preview){
            document.getElementById('pageBody').innerHTML = `
              <div class="page-error">
                <h2>Invite invalid or expired</h2>
                <p>${previewError?.message || 'This invite link no longer works.'} <a href="/circles">Back to your circles</a></p>
              </div>`;
            return;
          }
          renderGuestGate(preview, inviteCode);
          return;
        }

        document.getElementById('pageBody').innerHTML = renderWaterLoader('Checking circle access…');
        mountWaterLoader();
        
        // Check current circle count
        const circleCount = await getUserCircleCount();
        
        if (circleCount >= MAX_CIRCLES){
          // User is at max capacity
          document.getElementById('pageBody').innerHTML = renderWaterLoader('Loading your circles…');
          mountWaterLoader();
          const userCircles = await getUserCircles();
          
          showRemoveCircleModal(userCircles, async (circleToRemove) => {
            // Remove user from selected circle
            const { error: removeError } = await supabaseClient
              .from('circle_members')
              .delete()
              .eq('user_id', currentUser.id)
              .eq('circle_id', circleToRemove);
            
            if (removeError){
              document.getElementById('pageBody').innerHTML = `
                <div class="page-error">
                  <h2>Error leaving circle</h2>
                  <p>${removeError.message} <a href="/circles">Back to your circles</a></p>
                </div>`;
              return;
            }

            // Now redeem the invite
            document.getElementById('pageBody').innerHTML = renderWaterLoader('Joining circle…');
            mountWaterLoader();
            const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: inviteCode });
            if (error || !data?.circle_id){
              document.getElementById('pageBody').innerHTML = `
                <div class="page-error">
                  <h2>Invite invalid or expired</h2>
                  <p>${error?.message || 'Could not join circle.'} <a href="/circles">Back to your circles</a></p>
                </div>`;
              return;
            }
            window.location.replace(`/circle?private&ID=${encodeURIComponent(data.circle_id)}`);
          });
          return;
        }

        // User has space, proceed with invite redemption
        document.getElementById('pageBody').innerHTML = renderWaterLoader('Joining circle…');
        mountWaterLoader();
        const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: inviteCode });
        if (error || !data?.circle_id){
          const errorMsg = error?.message || 'Could not join circle.';
          document.getElementById('pageBody').innerHTML = `
            <div class="page-error">
              <h2>Cannot join circle</h2>
              <p>${errorMsg} <a href="/circles">Back to your circles</a></p>
            </div>`;
          return;
        }
        window.location.replace(`/circle?private&ID=${encodeURIComponent(data.circle_id)}`);
        return;


      }

    if (!circleId){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>No circle ID was given. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    circle = await loadCircle();
    if (!circle){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>This circle doesn't exist or was removed. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    if (!circle.is_private){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>This circle doesn't exist or was removed. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    if (urlSaysPrivate !== circle.is_private){
      const correctUrl = `/circle?${circle.is_private ? 'private' : 'public'}&ID=${encodeURIComponent(circle.id)}`;
      window.history.replaceState(null, '', correctUrl);
    }

    members = await loadMembers();
    if (currentUser){
      const mine = members.find(m => m.id === currentUser.id);
      myRole = mine ? mine.role : null;
    }

    if (circle.is_private){
      if (!requireAuth()) return;
      if (myRole === null){
        document.getElementById('pageBody').innerHTML = `
          <div class="page-error">
            <h2>This circle is private</h2>
            <p>You need an invite to see what's inside. <a href="/circles">Back to your circles</a></p>
          </div>
        `;
        return;
      }
      enableScreenshotGuard();
      const homeState = await renderHomeMode();

      const targetPostId = params.get('post');
      if (targetPostId) {
        setTimeout(() => {
          const card = document.querySelector(`#viewFeed .home-post-card[data-post-id="${targetPostId}"]`);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('post-highlight');
            setTimeout(() => card.classList.remove('post-highlight'), 2200);
            // Landing straight on the post they were invited to see is
            // exactly when a brand-new member needs the reassurance most.
            if (homeState?.shouldWelcome) showInviteReplyNudge(targetPostId);
          }
        }, 300);
      }
    } else {
      await renderPublicMode();
    }
  }



  init();
</script>

<script>
// Navigation behaviour: topbar shadow
(function(){
  // topbar gets a soft shadow once you scroll
  var tb = document.querySelector('.topbar');
  if (tb){
    var shadowF = function(){ tb.classList.toggle('scrolled', window.scrollY > 4); };
    window.addEventListener('scroll', shadowF, {passive:true}); shadowF();
  }

  // ------------------------------------------------------------------
  // Topbar hides on scroll, YouTube-style: the
  // instant you scroll, it tucks away — and it stays away. It does NOT
  // creep back on its own (no reveal-on-scroll-up, no settling back in
  // once you stop), because the whole point is to get out of the
  // reader's way and stay out of it. The only way back is the "+"
  // (the post composer button): tapping it brings the composer up AND
  // brings the navbar back down, via window.__waaterShowNav below,
  // wired into its click handler. Scrolling after that hides it again.
  // ------------------------------------------------------------------
  if (tb){
    var mobileMQ = window.matchMedia('(max-width:899.98px)');
    var TOP_ZONE = 4;    // basically the very top of the page
    var navHidden = false;

    var show = function(){
      navHidden = false;
      if (tb) tb.classList.remove('nav-hide');
    };
    var hide = function(){
      if (!mobileMQ.matches) return;
      navHidden = true;
      if (tb) tb.classList.add('nav-hide');
    };

    window.addEventListener('scroll', function(){
      if (!mobileMQ.matches){ if (navHidden) show(); return; }
      if (navHidden) return;                    // already hidden — stays hidden
      if (window.scrollY <= TOP_ZONE) return;    // don't hide before they've actually moved
      hide();
    }, {passive:true});

    mobileMQ.addEventListener ? mobileMQ.addEventListener('change', show) : mobileMQ.addListener(show);

    // Exposed so the "+" / new-post button can bring the navbar back
    // down at the same time it brings the composer up.
    window.__waaterShowNav = show;
  }
})();
</script>
