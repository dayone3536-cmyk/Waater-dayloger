  /* ---- Golden Hour — dramatic blurred reveal card ----
     The question arrives blurred behind glass; tapping "reveal" clears the
     blur with a pop + camera-flash so opening it actually feels like a
     moment, instead of just reading pre-rendered text. Lives at the very
     top of the main feed now — the first thing you see, not something
     buried in a tab. */
  .gh-reveal{
    position:relative;margin:0 0 18px;padding:30px 22px 26px;border-radius:24px;
    overflow:hidden;text-align:center;isolation:isolate;
    background:linear-gradient(150deg,#15100c 0%,#2b1c12 45%,#1c130e 78%,#100b08 100%);
    border:1px solid rgba(255,196,120,.28);
    box-shadow:0 30px 60px -22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    animation:ghRevealIn .55s var(--ease-spring) both;
  }
  @keyframes ghRevealIn{from{opacity:0;transform:translateY(-10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  /* slow drifting gold shimmer around the border, so the card never sits
     fully still — reads as "something is happening here" at a glance */
  .gh-reveal::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:0;pointer-events:none;
    background:conic-gradient(from var(--gh-a,0deg), transparent 0 20%, rgba(255,196,120,.9) 30%, transparent 45%, rgba(255,90,54,.55) 65%, transparent 80%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:ghBorderSpin 6s linear infinite;
  }
  @keyframes ghBorderSpin{to{--gh-a:360deg;}}
  @property --gh-a{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .gh-reveal-glow{
    position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:260px;height:260px;
    border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle, rgba(255,177,90,.5), rgba(255,90,54,.18) 55%, transparent 75%);
    animation:ghGlowPulse 3.2s ease-in-out infinite;
  }
  @keyframes ghGlowPulse{0%,100%{opacity:.6;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.22);}}
  .gh-reveal-eyebrow{
    position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;justify-content:center;
    font-family:var(--font-mono);font-size:11px;color:#ffcf9e;text-transform:uppercase;
    letter-spacing:.12em;margin-bottom:18px;width:100%;
  }
  .gh-reveal-eyebrow .gh-dot.live{background:#ff9a4d;box-shadow:0 0 0 0 rgba(255,154,77,.55);animation:ghPulse 1.6s ease-out infinite;}
  .gh-reveal-stage{position:relative;z-index:1;min-height:78px;display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .gh-reveal-blur{
    font-family:var(--font-serif);font-size:19px;line-height:1.5;color:#fff;
    filter:blur(11px);opacity:.5;user-select:none;transform:scale(.95);
    transition:filter .9s var(--ease), opacity .9s var(--ease), transform .9s var(--ease-spring);
  }
  .gh-reveal.revealed .gh-reveal-blur{
    filter:blur(0);opacity:1;transform:scale(1);
    animation:ghRevealPop .6s var(--ease-spring);
  }
  @keyframes ghRevealPop{0%{transform:scale(.88);}55%{transform:scale(1.05);}100%{transform:scale(1);}}
  /* Locked badge — replaces the old tap-to-reveal button. Not clickable;
     it just tells you when the blur will lift on its own. */
  .gh-reveal-lock{
    position:absolute;z-index:2;display:inline-flex;align-items:center;gap:8px;
    padding:12px 22px;border-radius:99px;color:#fff;pointer-events:none;

    font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:.01em;
    animation:ghTapFloat 2.2s ease-in-out infinite;
  }
  @keyframes ghTapFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .gh-reveal.revealed .gh-reveal-lock{display:none;}
  .gh-reveal-from{
    position:relative;z-index:1;font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.4);
    margin-top:14px;letter-spacing:.03em;
  }
  .gh-reveal .prompt-pin-answer{

  .gh-reveal .prompt-pin-answer:hover{filter:brightness(1.06);}
  .gh-reveal.revealed .prompt-pin-answer{display:inline-flex;animation:promptPinIn .4s var(--ease-spring) .12s both;}
  /* full-screen flash fired the instant a question is revealed */
  .gh-flash{
    position:fixed;inset:0;z-index:9999;pointer-events:none;background:#fff;
    animation:ghFlashFade .5s ease forwards;
  }
  @keyframes ghFlashFade{from{opacity:.5;}to{opacity:0;}}

  /* ---- Golden Hour — voice reply modal (record → preview → send) ---- */
  .gh-voice-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 6px;}
  .gh-voice-record-btn{
    position:relative;width:80px;height:80px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ff9a4d,var(--accent));color:#fff;
    box-shadow:0 14px 30px -10px rgba(255,90,54,.6);
    transition:transform .15s var(--ease-spring);
  }
  .gh-voice-record-btn svg{width:26px;height:26px;stroke:#fff;position:relative;z-index:1;}
  .gh-voice-record-btn:active{transform:scale(.94);}
  .gh-voice-record-btn.recording{background:linear-gradient(135deg,#ff6a52,var(--danger));animation:ghMicPulse 1.1s ease-in-out infinite;}
  .gh-voice-record-btn .gh-voice-stop-icon{width:22px;height:22px;border-radius:5px;background:#fff;display:none;}
  .gh-voice-record-btn.recording .gh-voice-mic-icon{display:none;}
  .gh-voice-record-btn.recording .gh-voice-stop-icon{display:block;}
  @keyframes ghMicPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,67,63,.45), 0 14px 30px -10px rgba(255,90,54,.6);}50%{box-shadow:0 0 0 14px rgba(224,67,63,0), 0 14px 30px -10px rgba(255,90,54,.6);}}
  .gh-voice-hint{font-family:var(--font-display);font-weight:500;font-size:12.5px;color:var(--ink-soft);}
  .gh-voice-timer{font-family:var(--font-mono);font-size:13px;color:var(--danger);letter-spacing:.02em;}
  .gh-voice-preview{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 4px;}
  .gh-voice-preview audio{width:100%;}
  .gh-voice-rerecord{font-family:var(--font-mono);font-size:11px;color:var(--grey);text-decoration:underline;text-underline-offset:2px;}
  .gh-voice-rerecord:hover{color:var(--ink);}
  #ghVoiceCaption{
    width:100%;margin-top:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    font-family:var(--font-serif);font-size:13.5px;resize:none;min-height:44px;
  }

  .album-modal-pinned-q{
    display:flex;align-items:flex-start;gap:8px;margin:10px 0 14px;padding:11px 13px;
    border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-2);
    font-family:var(--font-serif);font-size:13.5px;line-height:1.4;color:var(--ink);
  }
  .album-modal-pinned-q .pin-ic{flex-shrink:0;}

  /* ---- Golden Hour — feed card (open to everyone, gated to 5-6pm, 1/day) ----
     Redesigned for breathing room: generous padding, the countdown pulled
     out into its own quiet pill instead of being wedged into the eyebrow
     line, and more air between question and chips. */
  .gh-card{
    position:relative;overflow:hidden;margin:0 0 22px;padding:24px 22px 22px;border-radius:22px;
    background:linear-gradient(160deg,#fffaf6 0%,var(--accent-soft) 72%,#fff 100%);
    border:1px solid rgba(255,177,153,.5);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -26px rgba(255,90,54,.4);
    animation:promptPinIn .4s var(--ease-spring) both;
  }
  .gh-card::after{
    content:'';position:absolute;top:-46px;right:-46px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,177,153,.35),transparent 72%);pointer-events:none;
  }
  .gh-head{position:relative;z-index:1;display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap;row-gap:8px;}
  .gh-dot{width:7px;height:7px;border-radius:50%;background:var(--grey);flex-shrink:0;}
  .gh-dot.live{background:var(--accent);box-shadow:0 0 0 0 rgba(255,90,54,.55);animation:ghPulse 1.8s ease-out infinite;}
  @keyframes ghPulse{
    0%{box-shadow:0 0 0 0 rgba(255,90,54,.5);}
    70%{box-shadow:0 0 0 8px rgba(255,90,54,0);}
    100%{box-shadow:0 0 0 0 rgba(255,90,54,0);}
  }
  .gh-eyebrow{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
  .gh-countdown{
    font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;
    letter-spacing:.02em;font-variant-numeric:tabular-nums;
    padding:3px 10px;border-radius:99px;background:rgba(255,90,54,.1);
    margin-left:2px;white-space:nowrap;
  }
  .gh-question{font-family:var(--font-serif);font-size:15.5px;line-height:1.58;color:var(--ink);margin-bottom:18px;letter-spacing:-.002em;position:relative;z-index:1;max-width:34em;}
  /* ---- Golden Hour — a voice reply, once it lands in the feed ---- */
  .home-post-card.gh-answer{
    background:linear-gradient(150deg,#171016 0%,#241a17 55%,#171016 100%);
    border:1px solid rgba(255,177,153,.22);
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
  }
  .home-post-card.gh-answer .home-post-head .who b{color:#ffd9b0;}
  .home-post-card.gh-answer .home-post-head .who span{color:rgba(255,255,255,.4);}
  .home-post-card.gh-answer .home-post-actions{border-top-color:rgba(255,177,153,.15);}
  .home-post-card.gh-answer .home-action-btn{color:rgba(255,255,255,.55);}
  .home-post-card.gh-answer .home-action-btn svg{stroke:rgba(255,255,255,.55);}
  .home-post-card.gh-answer .home-comments{border-top-color:rgba(255,177,153,.15);}
  .home-post-card.gh-answer .home-comment-input{background:#1e1712;border-color:#3a2a1f;color:#eee;}
  .gh-answer-tag{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:4px 10px 4px 4px;
    border-radius:99px;background:rgba(255,154,77,.14);border:1px solid rgba(255,177,153,.3);
    font-family:var(--font-mono);font-size:10px;color:#ffcf9e;text-transform:uppercase;letter-spacing:.06em;
  }
  .gh-answer-tag .gh-ic{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#ff9a4d,var(--accent));display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
  .gh-answer-question{
    font-family:var(--font-serif);font-size:14.5px;font-style:italic;line-height:1.5;color:#f1cba0;
    padding-left:10px;border-left:2px solid rgba(255,177,153,.4);margin-bottom:10px;
  }
  .home-post-card.gh-answer .home-voice-bubble{background:#221812;border:1px solid rgba(255,177,153,.2);}
  .home-post-card.gh-answer .home-voice-bubble b{color:#ffd9b0;}
  .gh-chip-row{position:relative;z-index:1;display:flex;gap:9px;overflow-x:auto;padding:2px 2px 5px;-webkit-overflow-scrolling:touch;}
  .gh-chip{
    flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:7px 15px 7px 7px;
    border-radius:99px;background:#fff;border:1px solid var(--accent-2);
    font-family:var(--font-display);font-weight:500;font-size:12.5px;color:var(--ink);
    box-shadow:0 1px 3px rgba(20,21,26,.05);
    transition:background .15s ease, transform .15s var(--ease-spring), border-color .15s ease, box-shadow .15s ease;
  }
  .gh-chip:hover{background:var(--accent-soft);box-shadow:0 6px 14px -6px rgba(255,90,54,.35);}
  .gh-chip:active{transform:scale(.96);}
  .gh-chip.disabled{opacity:.5;background:#f6f6f4;border-color:var(--line);box-shadow:none;cursor:default;}
  .gh-chip-avatar{
    width:23px;height:23px;border-radius:50%;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:9.5px;
  }
  .gh-chip-avatar img{width:100%;height:100%;object-fit:cover;}
  .gh-testmode{
    position:relative;z-index:1;margin-top:16px;padding:10px 13px;border-radius:12px;background:#14151a;color:#fff;
    font-family:var(--font-mono);font-size:9.5px;line-height:1.5;display:flex;align-items:center;
    justify-content:space-between;gap:8px;
  }
  .gh-testmode button{color:var(--accent-2);font-family:var(--font-mono);font-size:9.5px;text-decoration:underline;flex-shrink:0;}

  /* ---- Latest memory — one featured slot, set apart from the grid
     so the newest addition always gets a moment before the archive starts ---- */
  .gallery-hero{position:relative;z-index:1;margin-top:18px;}
  .gallery-hero-label{
    font-family:var(--font-mono);font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.07em;
    margin-bottom:10px;padding-left:2px;display:flex;align-items:center;gap:6px;
  }
  .gallery-hero-label .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:heroPulse 2s ease-in-out infinite;}
  @keyframes heroPulse{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }
  .gallery-hero-card{
    position:relative;border-radius:24px;overflow:hidden;cursor:pointer;display:block;width:100%;
    aspect-ratio:4/3;background:#f6f6f4;
    box-shadow:0 18px 44px -18px rgba(20,21,26,.32);
    opacity:0;transform:translateY(14px) scale(.98);animation:galleryTileIn .5s var(--ease-spring) forwards;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  }
  .gallery-hero-card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:2;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,90,54,.3) 40%,rgba(124,140,255,.28) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:0;transition:opacity .3s ease;
  }
  @media (min-width:640px){ .gallery-hero-card{aspect-ratio:16/8;} }
  .gallery-hero-card:hover{transform:translateY(-3px);box-shadow:0 24px 52px -16px rgba(20,21,26,.4);}
  .gallery-hero-card:hover::before{opacity:1;}
  .gallery-hero-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease);}
  .gallery-hero-card:hover img{transform:scale(1.04);}
  .gallery-hero-card .overlay{
    position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,12,10,.78) 0%,rgba(15,12,10,.15) 45%,transparent 68%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-align:left;
  }
  .gallery-hero-card .overlay .who{display:flex;align-items:center;gap:8px;}
  .gallery-hero-card .overlay .who .mini{
    width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-family:var(--font-display);font-weight:700;overflow:hidden;flex-shrink:0;
    box-shadow:0 0 0 2px rgba(255,255,255,.5);
  }
  .gallery-hero-card .overlay .who .mini img{width:100%;height:100%;object-fit:cover;}
  .gallery-hero-card .overlay .who span{font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;}
  .gallery-hero-card .overlay .cap{
    font-family:var(--font-serif);font-size:15px;color:#fff;margin-top:8px;line-height:1.4;max-width:34ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .gallery-group{position:relative;z-index:1;margin-top:28px;}
  .gallery-group-label{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-mono);font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.07em;
    margin-bottom:10px;padding-left:2px;
  }
  .gallery-group-label::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,var(--line-strong),transparent);
  }

  /* True reading-order grid — chronological left-to-right, top-to-bottom.
     (CSS column masonry looks fuller but reshuffles photos down their
     column instead of across the row, so "most recent" stops meaning
     top-left; a fixed-ratio grid keeps the order honest on every screen.) */
  .gallery-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden;
  }
  @media (min-width:640px){ .gallery-grid{grid-template-columns:repeat(4,1fr);gap:4px;border-radius:18px;} }

  .gallery-tile{
    position:relative;cursor:pointer;display:block;width:100%;aspect-ratio:1;overflow:hidden;
    background:#f6f6f4;
    opacity:0;transform:scale(.94);animation:galleryTileIn .45s var(--ease-spring) forwards;
  }
  .gallery-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s var(--ease);}
  .gallery-tile:hover img{transform:scale(1.08);}
  .gallery-tile::after{
    content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);
    transform:translateX(-120%);
  }
  .gallery-tile:hover::after{transform:translateX(120%);transition:transform .65s var(--ease);}
  @keyframes galleryTileIn{ to{opacity:1;transform:scale(1);} }

  .gallery-tile .overlay{
    position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(0,0,0,.55) 0%,transparent 42%);
    opacity:0;transition:opacity .18s ease;
  }
  .gallery-tile:hover .overlay,.gallery-tile:focus-visible .overlay{opacity:1;}
  /* a slim always-on scrim + tiny avatar bottom-left, so who-posted-this
     is legible on tap-only devices instead of vanishing without :hover */
  .gallery-tile .who-chip{
    position:absolute;left:6px;bottom:6px;width:18px;height:18px;border-radius:50%;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:8px;font-family:var(--font-display);font-weight:700;overflow:hidden;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.65);
  }
  .gallery-tile .who-chip img{width:100%;height:100%;object-fit:cover;}
  .gallery-tile .overlay-info{
    position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px 28px;color:#fff;
    opacity:0;transition:opacity .18s ease;
  }
  .gallery-tile:hover .overlay-info,.gallery-tile:focus-visible .overlay-info{opacity:1;}
  .gallery-tile .overlay-info span{font-family:var(--font-mono);font-size:8.5px;}
  .gallery-tile .overlay-info .cap{
    font-family:var(--font-serif);font-size:10.5px;margin-top:2px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }

  .gallery-empty{
    position:relative;z-index:1;text-align:center;padding:56px 20px;margin-top:20px;overflow:hidden;
    border:1.5px dashed var(--line-strong);border-radius:22px;
    background:linear-gradient(160deg,var(--accent-soft) 0%,#fff 75%);
  }
  .gallery-empty .ic{
    position:relative;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#fff,#fff5f1);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;box-shadow:0 8px 20px rgba(255,90,54,.16),0 0 0 6px rgba(255,90,54,.06);
    animation:galleryFloat 2.6s ease-in-out infinite;
  }
  @keyframes galleryFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-7px) rotate(-4deg);} }
  .gallery-empty .ic svg{width:23px;height:23px;stroke:var(--accent);}
  .gallery-empty h3{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .gallery-empty p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink-soft);margin-top:6px;max-width:260px;margin-left:auto;margin-right:auto;line-height:1.5;}
  .gallery-empty .gallery-add-btn{margin-top:18px;}

  /* ============================================================
     SCREENSHOT GUARD — deterrent layer for private circles
  ============================================================ */
  body.sg-active{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  body.sg-active input, body.sg-active textarea{-webkit-user-select:text;user-select:text;}
  body.sg-active img, body.sg-active video{-webkit-user-drag:none;}
  @media print{ body.sg-active{display:none!important;} }

  .sg-backdrop{
    position:fixed;inset:0;z-index:600;background:rgba(20,21,26,.62);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;transition:opacity .18s ease;
  }
  .sg-backdrop.show{opacity:1;}
  .sg-card{
    background:#fff;border-radius:22px;padding:28px 22px 20px;max-width:340px;width:100%;text-align:center;
    transform:translateY(14px) scale(.94) rotate(-2deg);
    transition:transform .34s var(--ease-spring);
  }
  .sg-backdrop.show .sg-card{transform:none;}
  .sg-emoji{display:block;font-size:46px;line-height:1;margin-bottom:12px;}
  .sg-card h3{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.01em;}
  .sg-card p{font-family:var(--font-serif);font-size:14.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .sg-btn{
    margin-top:18px;background:var(--accent);color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:11px 22px;border-radius:99px;transition:background .15s ease, transform .1s ease;
  }
  .sg-btn:hover{background:#e64a27;}
  .sg-btn:active{transform:scale(.95);}
  .sg-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

  /* ============================================================
     ANONYMOUS POST NOTICE — shown once before whisper-mode posting
  ============================================================ */
  .anon-notice-icon{width:52px;height:52px;border-radius:50%;background:#14151a;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .anon-notice-icon svg{width:26px;height:26px;}
  .anon-notice-actions{display:flex;gap:8px;margin-top:18px;}
  .anon-notice-actions .sg-btn{margin-top:0;flex:1;white-space:nowrap;}
  .anon-notice-ghost{background:#f1f1ef;color:var(--ink-soft)!important;}
  .anon-notice-ghost:hover{background:#e6e6e3;}

  /* ANON-ACTIVE BANNER — shown inline in the composer while whisper
     mode is on, every time, so it's always clear a post is anonymous
     and will self-delete. */
  .composer-anon-banner{
    display:none;align-items:center;gap:9px;
    padding:9px 12px;margin:10px 0 2px;border-radius:11px;
    background:#14151a;color:#f1f1ef;
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.01em;line-height:1.4;
    animation:riseIn .18s var(--ease);
  }
  .composer-anon-banner.show{display:flex;}
  .composer-anon-banner svg{width:15px;height:15px;flex-shrink:0;}
  .composer-anon-banner b{color:#fff;font-family:var(--font-display);font-weight:600;font-style:normal;}

  /* =========================================================
     VIDEO POSTS — one-tap recorder + autoplaying feed videos
     ========================================================= */

  .home-video{
    position:relative;width:100%;aspect-ratio:4/5;max-height:520px;background:#0e0f13;
    cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  }
  .home-post-media .home-video video{width:100%;height:100%;max-height:none;object-fit:cover;object-position:center 30%;display:block;}
  .hv-badge,.hv-sound,.hv-play{position:absolute;pointer-events:none;}
  .hv-badge{
    top:10px;right:10px;display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;
    background:rgba(20,21,26,.55);color:#fff;font-family:var(--font-mono);font-size:10.5px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .hv-badge svg{width:12px;height:12px;stroke:#fff;fill:none;}
  .hv-sound{
    left:10px;bottom:14px;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
    background:rgba(20,21,26,.62);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .2s ease;
  }
  .hv-sound svg{width:14px;height:14px;stroke:#fff;fill:none;}
  .home-video.unmuted .hv-sound{opacity:0;}
  .hv-play{
    left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
    background:rgba(20,21,26,.55);display:none;align-items:center;justify-content:center;
  }
  .hv-play svg{width:26px;height:26px;fill:#fff;stroke:none;margin-left:3px;}
  .home-video.upaused .hv-play{display:flex;}
  .hv-cover{
    position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    text-align:center;color:#fff;background:rgba(14,15,19,.42);pointer-events:none;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .hv-cover-btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
  .hv-cover-btn svg{width:26px;height:26px;fill:#fff;stroke:none;margin-left:3px;}
  .hv-cover b{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .hv-cover span{font-size:12.5px;opacity:.8;}
  .home-video.hv-once .hv-cover{display:flex;}

  .vr-pending{
    background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;
    animation:riseIn .35s var(--ease) both;
  }

  .vr-pending-media::after{
    content:'';position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--accent);
    animation:vrSlide 1.1s ease-in-out infinite;
  }

  /* ---------- full-screen recorder ---------- */
  .vr-overlay{
    position:fixed;inset:0;z-index:1200;background:#000;display:flex;align-items:center;justify-content:center;
    animation:fadeIn .18s ease;-webkit-tap-highlight-color:transparent;
  }
  .vr-stage{
    position:relative;width:100%;height:100vh;height:100dvh;background:#000;overflow:hidden;color:#fff;

  }
  .vr-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}   /* contain = the whole 3:4 frame, no zoom */

  .vr-review{display:none;}

  .vr-stage[data-state="review"] .vr-cam{display:none;}
  .vr-stage[data-state="nocam"] .vr-cam{display:none;}
  .vr-shade-top,.vr-shade-bot{position:absolute;left:0;right:0;pointer-events:none;z-index:2;}
  .vr-shade-top{top:0;height:130px;background:linear-gradient(rgba(0,0,0,.5),transparent);}
  .vr-shade-bot{bottom:0;height:240px;background:linear-gradient(transparent,rgba(0,0,0,.62));}

  .vr-top{
    position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;
  }
  .vr-x,.vr-side{
    width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .15s var(--ease-spring), background .15s ease;
  }
  .vr-x:active,.vr-side:active{transform:scale(.9);background:rgba(255,255,255,.28);}
  /* live blur over a camera feed is very costly on old GPUs — drop it while the camera is on */
  .vr-stage[data-state="ready"] *,.vr-stage[data-state="recording"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;}
  .vr-stage[data-state="ready"] .vr-x,.vr-stage[data-state="recording"] .vr-x,
  .vr-stage[data-state="ready"] .vr-side,.vr-stage[data-state="recording"] .vr-side{background:rgba(20,21,26,.45);}
  .vr-x svg,.vr-side svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .vr-pill{
    display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;background:rgba(20,21,26,.5);
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.01em;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .vr-pill .rec-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);display:none;animation:micPulse 2.6s ease-in-out infinite;}
  .vr-stage[data-state="recording"] .vr-pill .rec-dot{display:block;}
  .vr-spacer{width:42px;height:42px;}

  .vr-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:5;
    padding:0 20px calc(22px + env(safe-area-inset-bottom,0px));
  }
  .vr-hint{text-align:center;font-size:13px;font-weight:500;color:rgba(255,255,255,.86);margin-bottom:14px;min-height:18px;text-shadow:0 1px 8px rgba(0,0,0,.4);}
  .vr-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;}
  .vr-controls .l{justify-self:start;}
  .vr-controls .r{justify-self:end;}
  .vr-rec{
    position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;
    touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;
  }
  .vr-rec svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .vr-rec svg.ring circle{fill:none;stroke-width:4;}
  .vr-rec .track{stroke:rgba(255,255,255,.9);}
  .vr-rec .prog{stroke:#fff;stroke-linecap:round;opacity:0;}
  .vr-stage[data-state="recording"] .vr-rec .track{stroke:rgba(255,255,255,.35);}
  .vr-stage[data-state="recording"] .vr-rec .prog{opacity:1;}
  .vr-rec .core{
    width:62px;height:62px;border-radius:50%;background:var(--accent);
    transition:transform .2s var(--ease-spring), border-radius .2s var(--ease);
  }
  .vr-rec:active .core{transform:scale(.92);}
  .vr-stage[data-state="recording"] .vr-rec .core{border-radius:14px;transform:scale(.56);}
  .vr-stage[data-state="recording"] .vr-side,
  .vr-stage[data-state="recording"] .vr-x{opacity:0;pointer-events:none;}
  .vr-stage[data-state="recording"] .vr-controls .l,
  .vr-stage[data-state="recording"] .vr-controls .r{visibility:hidden;}
  .vr-side.hidden{visibility:hidden;}

  .vr-review-bar{display:none;}
  .vr-stage[data-state="review"] .vr-review-bar{display:block;}
  .vr-stage[data-state="review"] .vr-rec-wrap,
  .vr-stage[data-state="review"] .vr-hint{display:none;}
  .vr-caption{
    width:100%;border:none;outline:none;border-radius:16px;padding:13px 16px;margin-bottom:12px;
    background:rgba(255,255,255,.16);color:#fff;font-family:var(--font-serif);font-size:15px;
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }

  .vr-review-row{display:flex;gap:10px;}
  .vr-retake{
    height:54px;padding:0 20px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;

  }
  .vr-send{
    flex:1;height:54px;border-radius:99px;background:var(--accent);color:#fff;

    box-shadow:0 10px 26px rgba(255,90,54,.4);transition:transform .12s var(--ease-spring);
  }

  .vr-send svg{width:19px;height:19px;stroke:#fff;fill:none;}

  .vr-nocam{
    position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:32px;text-align:center;background:#14151a;
  }

  .vr-nocam p{font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.8);max-width:280px;}
  .vr-nocam button{padding:13px 22px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;}
  .vr-stage[data-state="nocam"] .vr-rec-wrap,
  .vr-stage[data-state="nocam"] .vr-hint{display:none;}
  .vr-stage[data-state="starting"] .vr-rec{opacity:.45;pointer-events:none;}

  /* ---------- mini self-view recorder (phones) ----------
     A small picture-in-picture window in the top corner; the circle stays
     visible and scrollable underneath so it feels like reacting, not filming. */
  .vr-lock{display:none;}
  .vr-stage[data-mode="comment"] .vr-caption{display:none;}
  @media (max-width:899px){
    .vr-overlay:not(.vr-full){background:transparent;pointer-events:none;align-items:flex-start;justify-content:flex-end;}
    .vr-overlay:not(.vr-full) .vr-stage{
      pointer-events:auto;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;
      width:150px;height:188px;border-radius:20px;overflow:visible;background:transparent;
    }

    .vr-overlay:not(.vr-full) .vr-stage video, .vr-overlay:not(.vr-full) .vr-shade-top, .vr-overlay:not(.vr-full) .vr-shade-bot, .vr-overlay:not(.vr-full) .vr-nocam{border-radius:20px;}

    .vr-overlay:not(.vr-full) .vr-spacer{width:30px;height:30px;}
    .vr-overlay:not(.vr-full) .vr-pill{display:none;}
    .vr-overlay:not(.vr-full) .vr-stage[data-state="recording"] .vr-pill{display:flex;padding:4px 9px;font-size:10.5px;}
    .vr-overlay:not(.vr-full) .vr-bottom{position:static;padding:0;}
    .vr-overlay:not(.vr-full) .vr-hint{position:absolute;left:0;right:0;bottom:70px;margin:0;padding:0 6px;font-size:10.5px;min-height:0;}
    .vr-overlay:not(.vr-full) .vr-controls{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;}
    .vr-overlay:not(.vr-full) .vr-rec{width:56px;height:56px;}

    .vr-overlay:not(.vr-full) .vr-nocam{padding:12px;gap:8px;}
    .vr-overlay:not(.vr-full) .vr-nocam p{font-size:11px;line-height:1.35;}
    .vr-overlay:not(.vr-full) .vr-nocam button{padding:8px 12px;font-size:12px;}
    /* review: the clip loops in the mini window, controls slide up from the bottom */
    .vr-overlay:not(.vr-full) .vr-review-bar{
      position:fixed;left:0;right:0;bottom:0;z-index:1201;pointer-events:auto;
      padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;
      background:rgba(20,21,26,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    }
    .vr-overlay:not(.vr-full) .vr-lock{display:block;font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.66);margin-bottom:10px;text-align:center;}
  }

  /* ---------- "Spark" prompt card + playful recorder bits ----------
     A conversation starter that stays on screen the whole time you record,
     so a blank mind is never a reason to stop. */
  .vr-spark{
    position:absolute;left:14px;right:14px;top:calc(70px + env(safe-area-inset-top,0px));z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  }

    padding:12px 16px;border-radius:18px;background:rgba(20,21,26,.52);text-shadow:0 1px 8px rgba(0,0,0,.35);
    animation:vrSparkIn .35s var(--ease-spring) both;
  }
  .vr-spark-q.nudge{background:var(--accent);animation:vrNudge .55s var(--ease-spring) 1;}

  }
  .vr-chip:active{transform:scale(.92);}

  .vr-expnote{font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;text-align:center;margin:0 0 8px;}
  .vr-expask{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;}
  .vr-expask-card{width:100%;max-width:440px;background:#14151a;color:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;text-align:center;}
  .vr-expask-emoji{font-size:34px;}

  .vr-stage[data-state="recording"] .vr-spark-row,
  .vr-stage[data-state="review"] .vr-spark,

  .vr-quick button:active{transform:scale(.88);}
  @media (max-width:899px){

    .vr-overlay:not(.vr-full) .vr-spark{left:auto;right:0;top:calc(100% + 8px);width:214px;align-items:flex-end;}

  /* ---------- Blur Shield ----------
     The recording itself is never touched: MediaRecorder still gets the raw camera stream,
     so friends see the real you. Only YOUR on-screen view melts into a soft, warm blur
     3 seconds after you start, so there is nobody to watch, judge or overthink. */
  .vr-stage{--vr-blur:30px;--vr-r:0px;}
  .vr-glow{
    position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(120% 90% at 50% 25%,#4a3037 0%,#2a1f2b 55%,#14151a 100%);
  }
  .vr-aura{
    position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;opacity:0;
    background:radial-gradient(70% 55% at 50% 40%,rgba(255,177,153,.30),transparent 70%);
    transition:opacity 3s ease;
  }
  .vr-stage.melted .vr-aura{opacity:1;animation:vrBreathe 4.5s ease-in-out infinite;}
  @keyframes vrBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

    font-family:var(--font-display);font-weight:500;font-size:13px;line-height:1.3;

  /* ---------- video replies ---------- */
  .home-comment-cam{

  /* ============================================================
     GUEST ENTRY — nickname gate, corner chip, sign-up sheet
     ============================================================ */
  .gg{max-width:420px;margin:0 auto;padding:clamp(28px,9vh,84px) 24px 40px;text-align:center;}
  .gg-avatar{
    width:88px;height:88px;border-radius:50%;margin:0 auto 26px;
    display:flex;align-items:center;justify-content:center;

  @keyframes ggPop{0%{transform:scale(.86)}100%{transform:scale(1)}}
  .gg h1{font:500 clamp(30px,8vw,38px)/1.12 var(--font-serif);letter-spacing:-.015em;}

  #ggCaptcha{display:flex;justify-content:center;margin-top:10px;}

  .guest-chip{
    position:fixed;z-index:900;right:12px;top:calc(10px + env(safe-area-inset-top));

    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);

  }
  .guest-chip b{
    background:var(--ink);color:#fff;font-weight:600;padding:6px 12px;border-radius:99px;
  }
  .guest-chip.low{border-color:var(--accent-2);}

  .gs-backdrop{
    position:fixed;inset:0;z-index:1100;background:rgba(20,21,26,.42);

    opacity:0;transition:opacity .22s ease;
  }
  .gs-backdrop.show{opacity:1;}
  .gs-backdrop.wall{background:#fff;align-items:center;}
  .gs{
    width:100%;max-width:440px;background:#fff;padding:30px 24px calc(26px + env(safe-area-inset-bottom));

  .gs-backdrop.show .gs{transform:none;}

  @media (min-width:600px){.gs{border-radius:22px;margin-bottom:5vh;}}
  .gs h2{font:500 28px/1.15 var(--font-serif);letter-spacing:-.01em;}
  .gs p{margin-top:10px;font:400 15.5px/1.5 var(--font-serif);color:var(--ink-soft);}
  .gs label{display:block;margin-top:18px;font:500 12.5px var(--font-display);color:var(--ink-soft);}
  .gs input{
    margin-top:6px;width:100%;padding:13px 14px;border:1.5px solid var(--line-strong);border-radius:12px;
    font:400 16px var(--font-display);color:var(--ink);outline:none;background:#fff;
  }
  .gs input:focus{border-color:var(--accent);}
  .gs-go{margin-top:22px;width:100%;padding:15px 18px;border-radius:99px;background:var(--accent);color:#fff;font:600 15px var(--font-display);}
  .gs-go:hover{background:#e64a2a;}
  .gs-go[disabled]{opacity:.5;cursor:default;}
  .gs-err{min-height:20px;margin-top:10px;font:500 13.5px/1.4 var(--font-display);color:var(--danger);}
  .gs-ok{margin-top:10px;font:500 14px/1.5 var(--font-display);color:var(--ink);}
  .gs-alt{margin-top:14px;text-align:center;font:400 13.5px var(--font-serif);color:var(--grey);}
  .gs-alt a,.gs-alt button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font:inherit;}
  .hv-gone{padding:22px 16px;border-radius:16px;background:var(--accent-soft);color:#c24020;font-size:13.5px;line-height:1.4;text-align:center;font-weight:600;}

  /* =========================================================
     REACTION CAM — a friend's face, a few seconds, seen once
     ========================================================= */
  .hv-react{position:absolute;top:10px;left:10px;z-index:3;display:flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:99px;border:0;cursor:pointer;background:rgba(20,21,26,.55);color:#fff;font-family:var(--font-display);font-weight:600;font-size:11.5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;}
  .hv-react.off{background:rgba(20,21,26,.38);color:rgba(255,255,255,.75);}
  .hv-react.off span{filter:grayscale(1);opacity:.7;}
  .rx-live{position:fixed;right:14px;top:calc(64px + env(safe-area-inset-top));z-index:2600;width:96px;height:96px;border-radius:50%;cursor:pointer;animation:rxPop .25s ease;}
  .rx-live video{width:100%;height:100%;border-radius:50%;object-fit:cover;transform:scaleX(-1);border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35);display:block;background:#111;}
  .rx-live-tag{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:#e0433f;color:#fff;font-family:var(--font-mono);font-size:10px;white-space:nowrap;}
  .rx-live-tag i{width:6px;height:6px;border-radius:50%;background:#fff;animation:rxBlink 1s infinite;}
  @keyframes rxBlink{50%{opacity:.25;}}
  @keyframes rxPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  @keyframes rxFade{from{opacity:0;}to{opacity:1;}}
  .rx-sheet{position:fixed;left:0;right:0;bottom:0;z-index:2600;display:flex;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom));transform:translateY(120%);transition:transform .26s ease;pointer-events:none;}
  .rx-sheet.in{transform:translateY(0);pointer-events:auto;}
  .rx-sheet-card{position:relative;overflow:hidden;width:100%;max-width:460px;background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(20,21,26,.28);padding:14px;display:grid;grid-template-columns:64px 1fr;gap:10px 12px;align-items:center;}
  .rx-sheet-card video{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#111;grid-row:1 / span 2;}
  .rx-sheet-txt{display:flex;flex-direction:column;gap:2px;min-width:0;}

  .rx-x{background:#f0f0ee;color:var(--ink-soft);}
  .rx-go{background:var(--accent);color:#fff;}
  .rx-bar{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform-origin:left;transform:scaleX(1);}
  .rx-intro{position:fixed;inset:0;z-index:2600;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;animation:rxFade .2s ease;}
  .rx-intro-card{width:100%;max-width:460px;background:#fff;border-radius:26px 26px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom));text-align:center;}
  .rx-intro-emoji{font-size:44px;line-height:1;}
  .rx-intro-card h3{margin:10px 0 6px;font-family:var(--font-display);font-size:19px;color:var(--ink);}
  .rx-intro-card p{margin:0 0 10px;font-size:13.5px;line-height:1.45;color:var(--ink-soft);}
  .rx-intro-card ul{list-style:none;margin:0 0 10px;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;}
  .rx-intro-card li{font-size:13px;color:var(--ink);padding-left:22px;position:relative;}

  .rx-intro-card small{display:block;margin:0 0 14px;font-size:11.5px;line-height:1.4;color:var(--grey);}
  .rx-yes{width:100%;border:0;border-radius:99px;padding:14px;background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer;}
  .rx-no{width:100%;border:0;background:none;padding:12px;color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:13px;cursor:pointer;}
  .rx-pill{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:190;display:flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:99px;background:linear-gradient(135deg,#ff5a36,#ff8a3d);color:#fff;font-family:var(--font-display);font-size:13px;cursor:pointer;box-shadow:0 12px 30px rgba(255,90,54,.45);animation:rxPill 2.4s ease-in-out infinite;white-space:nowrap;}
  .rx-pill b{font-weight:700;}
  .rx-pill em{font-style:normal;opacity:.85;font-size:12px;}
  .rx-pill-e{font-size:18px;}
  @keyframes rxPill{50%{transform:translateX(-50%) scale(1.05);}}
  @keyframes rxPillPop{0%{transform:translateX(-50%) scale(.6);}60%{transform:translateX(-50%) scale(1.15);}100%{transform:translateX(-50%) scale(1);}}
  .rx-pill.pop{animation:rxPillPop .5s ease, rxPill 2.4s ease-in-out .5s infinite;}
  .rx-view{position:fixed;inset:0;z-index:2600;background:rgba(10,10,14,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease;}
  .rx-view.in{opacity:1;}
  .rx-view-in{display:flex;flex-direction:column;align-items:center;gap:16px;color:#fff;font-family:var(--font-display);}
  .rx-view-name{font-weight:700;font-size:16px;}
  .rx-view-disc{width:min(74vw,300px);height:min(74vw,300px);border-radius:50%;overflow:hidden;border:4px solid #fff;background:#111;transition:opacity .6s ease,transform .6s ease,filter .6s ease;}
  .rx-view-disc video{width:100%;height:100%;object-fit:cover;display:block;}
  .rx-view-disc.gone{opacity:0;transform:scale(.7);filter:blur(14px);}

  .rx-view-bar{display:block;width:min(74vw,300px);height:3px;border-radius:3px;background:var(--accent);transform-origin:left;transform:scaleX(0);}
  @keyframes rxbar{from{transform:scaleX(1);}to{transform:scaleX(0);}}
</style>
