<body>

<div class="app">
  <main class="main">
    <div class="topbar">
      <a href="/circles" class="topbar-back" aria-label="Back to circles">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Circles
      </a>
      <a href="/" class="wordmark" aria-label="Waater home">waater<span class="dot">.</span></a>
      <span aria-hidden="true"></span>
    </div>

    <div id="pageBody">
      <div class="page-loading" id="pageLoading">Loading circle…</div>
    </div>
  </main>
</div>

<div class="waater-toast" id="waaterToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="waaterToastText"></span>
</div>

<script>
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }

  // ============================================================
  // LOADER — replaces plain "Loading…" text wherever the person is
  // waiting a few seconds (checking an invite, joining a circle, the
  // feed underneath the welcome ceremony). One bold mark, dead center:
  // it breathes with a springy squash-and-stretch, drifts through a
  // warm hue shift, and throws a small burst of light on every beat.
  // Pure CSS — one loop, nothing random, nothing to "play." Purely
  // decorative: it never affects what happens once loading ends.
  // ============================================================
  function renderWaterLoader(label){
    return `
      <div class="water-loader" data-water-loader>
        <div class="wl-stage">
          <div class="wl-halo"></div>
          <div class="wl-spark"></div><div class="wl-spark"></div><div class="wl-spark"></div>
          <div class="wl-spark"></div><div class="wl-spark"></div><div class="wl-spark"></div>
          <div class="wl-mark"></div>
        </div>
        <div class="wl-label">${escapeHtml(label)}<span class="wl-dot">.</span><span class="wl-dot">.</span><span class="wl-dot">.</span></div>
      </div>
    `;
  }
  // The loader is pure CSS (no per-frame JS driving it), so mounting is a
  // no-op kept only so existing call sites don't need to change.
  function mountWaterLoader(){}
  function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
  function timeAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if (s<60) return 'just now';
    if (s<3600) return `${Math.floor(s/60)}m ago`;
    if (s<86400) return `${Math.floor(s/3600)}h ago`;
    if (s<604800) return `${Math.floor(s/86400)}d ago`;
    return new Date(iso).toLocaleDateString();
  }
  function getGreeting(){
    const h = new Date().getHours();
    if (h < 5) return 'Still up';
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUsername = null;
  let currentUserGhChannel = 'unset'; // 'unset' | 'push' | 'email' — Golden Hour reveal notify preference

  function requireAuth(nextPath, reason){
    if (currentUser) return true;
    gateToSignup(nextPath || (window.location.pathname + window.location.search), reason || 'auth_required');
    return false;
  }

  // =========================================================
  // SIGN-UP GATING — shared by the private-invite preview and
  // anonymous browsing of public circles. Both let a visitor see
  // real value with zero friction, then route to sign-up either
  // when they try to act (like/save/post/join/vote) or after a
  // short dwell timeout. `nextPath` is where /auth sends them back.
  // =========================================================
  let previewGateTimer = null;
  let previewGated = false;

  function armPreviewGate(nextPath, timeoutMs){
    previewGated = false;
    clearTimeout(previewGateTimer);
    previewGateTimer = setTimeout(() => gateToSignup(nextPath, 'timeout'), timeoutMs || 25000);
  }

  function disarmPreviewGate(){
    clearTimeout(previewGateTimer);
  }

  function gateToSignup(nextPath, reason){
    if (previewGated) return;
    previewGated = true;
    clearTimeout(previewGateTimer);
    try { posthog.capture('signup_gate_triggered', { reason, next: nextPath }); } catch(_) {}
    window.location.href = `/auth?next=${encodeURIComponent(nextPath)}`;
  }

  // Shows the real feed to an unauthenticated invite visitor — every post,
  // not a stub. The `posts` (albums/memories) vault stays out; that's the
  // one thing still worth signing up for. `preview.posts` should be an
  // array of every circle post; the older single-`post` shape still works
  // as a graceful fallback if the RPC hasn't been upgraded yet (see the
  // note below this function for the backend change that array needs).
  function renderInvitePreview(preview, inviteCode){
    const posts = Array.isArray(preview?.posts) ? preview.posts
      : (preview?.post ? [preview.post] : []);
    const circleName = escapeHtml(preview?.circle_name || 'a private circle');
    const memberCount = preview?.member_count ?? null;
    const next = `/circle?code=${encodeURIComponent(inviteCode)}`;

    if (!posts.length){
      // Nothing to preview yet (brand-new circle) — stalling here has
      // no upside, so go straight to sign-up.
      gateToSignup(next, 'no_preview');
      return;
    }

    try { posthog.capture('invite_preview_shown', { post_count: posts.length }); } catch(_) {}

    const previewPostCard = (post) => `
      <div class="home-post-card">
        <div class="home-post-head">
          <div class="avatar">${initials(post.author_username || 'someone')}</div>
          <div class="who"><b>${escapeHtml(post.author_username || 'someone')}</b>${post.created_at ? `<span>${timeAgo(post.created_at)}</span>` : ''}</div>
        </div>
        <div class="home-post-body">
          ${(post.caption || post.body) ? `<div class="home-post-text">${escapeHtml(post.caption || post.body)}</div>` : ''}
          ${post.media_url ? `<div class="home-post-media">${
              post.media_type === 'video'
                ? (/^https?:\/\//i.test(post.media_url)
                    ? `<video src="${escapeHtml(post.media_url)}" controls></video>`
                    : `<div style="aspect-ratio:4/5;max-height:360px;background:#14151a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:14px;"><span style="font-size:30px;">🎥</span>A video \u2014 join to watch</div>`)
                : `<img src="${escapeHtml(post.media_url)}" loading="lazy" alt="">`
            }</div>` : ''}
        </div>
        <div class="home-post-actions">
          <button class="home-action-btn home-like-btn" data-preview-gate="like">♡ Like${post.likes_count ? ` <span class="home-like-count">${post.likes_count}</span>` : ''}</button>
          <button class="home-action-btn home-us-btn" data-preview-gate="save">+ Add to Us</button>
          <button class="home-action-btn home-comment-toggle" data-preview-gate="reply">💬 Reply${post.comment_count ? ` <span class="home-comment-count">${post.comment_count}</span>` : ''}</button>
        </div>
      </div>`;

    document.getElementById('pageBody').innerHTML = `
      <div class="invite-preview-page">
        <div class="invite-preview-badge">
          A peek inside <b>${circleName}</b>${memberCount ? ` · ${memberCount} ${memberCount === 1 ? 'member' : 'members'}` : ''}
        </div>
        <div class="home-feed">${posts.map(previewPostCard).join('')}</div>
        <button class="btn-primary invite-preview-cta" data-preview-gate="cta">Join ${circleName} →</button>
      </div>`;

    document.querySelectorAll('[data-preview-gate]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        gateToSignup(next, el.getAttribute('data-preview-gate'));
      });
    });

    armPreviewGate(next);
  }
  // BACKEND NOTE: preview_circle_invite currently returns one `post`. For
  // this to actually show the full feed, that Supabase RPC needs to return
  // `posts: [...]` — every row from `posts` for this circle (same columns
  // loadPosts() selects: id, user_id/author info, caption→body, media_url,
  // media_type, created_at, likes_count, comment_count), excluding nothing
  // from circle_memories (the Us vault stays out on purpose). The frontend
  // above already renders whatever array it's given — this is a backend-only
  // change. Ask me for the SQL if you want it drafted.

  let toastTimer = null;
  function showToast(text, type){
    const toast = document.getElementById('waaterToast');
    document.getElementById('waaterToastText').textContent = text;
    toast.classList.remove('error');
    if (type === 'error') toast.classList.add('error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ============================================================
  // PRIVACY / BELONGING HELPERS
  // ============================================================

  // Was this member's join timestamp within the last minute? Used to decide
  // whether to play the welcome ceremony (vs. just navigating back later).
  function justJoined(meRow){
    if (!meRow || !meRow.joined_at) return false;
    return (Date.now() - new Date(meRow.joined_at).getTime()) < 300000; // 5 min window
  }

  // Best-effort fetch of a personal note left by whoever invited this user.
  // Expects an optional `welcome_note` text column on circle_members.
  // If that column doesn't exist yet, this quietly returns null — nothing breaks.
  async function loadMyWelcomeNote(){
    try{
      const { data, error } = await supabaseClient
        .from('circle_members')
        .select('welcome_note, invited_by')
        .eq('circle_id', circleId)
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if (error || !data) return { note: null, inviter: null, media: null };

      let inviter = null, media = null;
      if (data.invited_by){
        const { data: prof } = await supabaseClient
          .from('profiles')
          .select('id, username, avatar_url')
          .eq('id', data.invited_by)
          .maybeSingle();
        inviter = prof || null;
        try{
          const { data: rows } = await supabaseClient
            .from('welcome_media')
            .select('path, media_type')
            .eq('circle_id', circleId)
            .eq('inviter_id', data.invited_by)
            .order('created_at', { ascending: false })
            .limit(1);
          const row = rows && rows[0];
          if (row){
            const { data: signed } = await supabaseClient.storage
              .from('welcome-notes').createSignedUrl(row.path, 3600);
            if (signed && signed.signedUrl) media = { url: signed.signedUrl, type: row.media_type };
          }
        } catch(_){ media = null; }
      }
      return { note: data.welcome_note || null, inviter, media };
    } catch(e){ return { note: null, inviter: null, media: null }; }
  }

  function renderPeopleRow(){
    return `
      <div class="home-people-row">
        ${members.map(m => `
          <div class="home-person">
            <div class="ring"><div class="ring-inner"><div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div></div></div>
            <span>${escapeHtml((m.username||'?').split(' ')[0])}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Full-screen, one-time arrival moment. It is about ONE person: whoever
  // invited this user. Their face, their words, the last thing they posted.
  // It waits for a tap — no auto-dismiss — so the person actually feels it.
  async function playWelcomeCeremony(note, inviter, media){
    // Best-effort: the last thing the inviter posted in this circle.
    let left = null;
    try{
      if (inviter?.id){
        const { data } = await supabaseClient
          .from('posts')
          .select('caption, media_type, is_anonymous')
          .eq('circle_id', circleId)
          .eq('user_id', inviter.id)
          .eq('is_anonymous', false)
          .order('created_at', { ascending: false })
          .limit(1);
        left = (data && data[0]) || null;
      }
    } catch(_){ left = null; }

    return new Promise(resolve => {
      const name = inviter?.username || null;
      const first = name ? name.split(' ')[0] : null;
      const others = Math.max(members.length - 1, 0);
      const kind = left && left.media_type === 'video' ? 'a video'
                 : left && left.media_type === 'voice' ? 'a voice note' : null;
      const leftBody = left && left.caption ? escapeHtml(left.caption)
                     : kind ? `They left ${kind} for the group.` : null;

      const overlay = document.createElement('div');
      overlay.className = 'welcome-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', 'Welcome');
      overlay.innerHTML = `
        <div class="welcome-face">
          <div class="avatar">${inviter?.avatar_url ? `<img src="${escapeHtml(inviter.avatar_url)}" alt="">` : initials(name || '?')}</div>
        </div>
        <h1 class="welcome-title welcome-step">${first ? `${escapeHtml(first)} wanted you in here.` : `Welcome to ${escapeHtml(circle.name)}.`}</h1>
        ${note ? `
          <p class="welcome-note welcome-step">\u201c${escapeHtml(note)}\u201d
            <span class="welcome-note-by">\u2014 ${escapeHtml(first)}</span>
          </p>` : ''}
        ${media ? `
          <div class="welcome-media welcome-step">
            ${media.type === 'video'
              ? `<video src="${escapeHtml(media.url)}" controls playsinline preload="metadata" controlsList="nodownload"></video>`
              : `<audio src="${escapeHtml(media.url)}" controls preload="metadata"></audio>`}
            <span>${escapeHtml(first)} left you ${media.type === 'video' ? 'a video' : 'a voice note'}</span>
          </div>` : ''}
        ${leftBody ? `
          <div class="welcome-left welcome-step">
            <b>${escapeHtml(first)} posted this in ${escapeHtml(circle.name)}</b>
            <p>${leftBody}</p>
          </div>` : ''}
        <p class="welcome-sub welcome-step">${first
          ? `${escapeHtml(first)} put you in a room with ${others} ${others === 1 ? 'person' : 'people'} they trust. Nobody else can see in.`
          : `You're one of ${members.length} people in here. Nobody else can see in.`}</p>
        <button class="welcome-enter welcome-step" type="button">${first ? `Say hi to ${escapeHtml(first)}` : 'Come in'}</button>
        <div class="welcome-privacy-line welcome-step">Screenshots are blocked. What's said here stays here.</div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      const btn = overlay.querySelector('.welcome-enter');
      btn.addEventListener('click', () => {
        overlay.classList.remove('show');
        setTimeout(() => { overlay.remove(); resolve(); }, 450);
      });
      setTimeout(() => { try{ btn.focus({ preventScroll:true }); }catch(_){} }, 3000);
    });
  }

  // Small modal so the person inviting someone can attach a personal note.
  // Resolves to the note string, or null if skipped/closed.
  function openInviteModal(){
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'invite-modal-backdrop';
      modal.innerHTML = `
        <div class="invite-modal">
          <h3>Invite someone to ${escapeHtml(circle.name)}</h3>
          <p>Say something to them. It's the first thing they'll see, so a voice or a face works best.</p>
          <textarea id="inviteNoteInput" maxlength="140" placeholder="e.g. finally got you in here 🎉"></textarea>
          <div class="im-media">
            <button class="im-chip" id="imMic" type="button">🎙 Voice note</button>
            <button class="im-chip" id="imCam" type="button">🎥 Video</button>
            <span class="im-status" id="imStatus"></span>
          </div>
          <input type="file" id="imFile" accept="video/*" capture="user" hidden>
          <div class="invite-modal-row">
            <button class="invite-modal-skip" type="button">Skip</button>
            <button class="invite-modal-send" type="button">Create invite</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));
      const $ = id => modal.querySelector('#' + id);
      const mic = $('imMic'), cam = $('imCam'), file = $('imFile'), status = $('imStatus');
      const send = modal.querySelector('.invite-modal-send');
      const MAX_VOICE = 30, MAX_VIDEO = 30, MAX_BYTES = 50 * 1024 * 1024;
      let media = null, rec = null, stream = null, chunks = [], t0 = 0, timer = null;

      const setStatus = (txt) => {
        status.innerHTML = txt ? `${txt} <button type="button" id="imClear">remove</button>` : '';
        const c = $('imClear'); if (c) c.onclick = () => { media = null; setStatus(''); };
      };
      const stopStream = () => { try{ stream && stream.getTracks().forEach(t => t.stop()); }catch(_){} stream = null; };
      const finishRec = () => { clearTimeout(timer); if (rec && rec.state === 'recording') rec.stop(); };

      mic.addEventListener('click', async () => {
        if (rec && rec.state === 'recording') { finishRec(); return; }
        try{
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch(_){ showToast('Microphone is blocked. Allow it and try again', 'error'); return; }
        chunks = []; media = null; setStatus('');
        rec = new MediaRecorder(stream);
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          stopStream();
          mic.classList.remove('rec'); mic.textContent = '🎙 Voice note'; send.disabled = false;
          media = { type: 'voice', blob, mime: blob.type, seconds: secs };
          setStatus(`Voice note ready (${secs}s)`);
        };
        t0 = Date.now(); rec.start();
        mic.classList.add('rec'); mic.textContent = '⏹ Stop'; send.disabled = true;
        timer = setTimeout(finishRec, MAX_VOICE * 1000);
      });

      cam.addEventListener('click', () => file.click());
      file.addEventListener('change', () => {
        const f = file.files && file.files[0];
        file.value = '';
        if (!f) return;
        if (f.size > MAX_BYTES) { showToast('That video is too big (over 50 MB). Keep it to 30 seconds or less', 'error'); return; }
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.onloadedmetadata = () => {
          const secs = Math.round(v.duration || 0);
          URL.revokeObjectURL(v.src);
          if (secs > MAX_VIDEO) { showToast(`Keep it under ${MAX_VIDEO} seconds`, 'error'); return; }
          media = { type: 'video', blob: f, mime: f.type || 'video/mp4', seconds: secs || null };
          setStatus(`Video ready${secs ? ` (${secs}s)` : ''}`);
        };
        v.onerror = () => { media = { type: 'video', blob: f, mime: f.type || 'video/mp4', seconds: null }; setStatus('Video ready'); };
        v.src = URL.createObjectURL(f);
      });

      const close = (result) => {
        clearTimeout(timer);
        try{ if (rec && rec.state === 'recording') { rec.onstop = null; rec.stop(); } }catch(_){}
        stopStream();
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 220);
        resolve(result);
      };
      modal.querySelector('.invite-modal-skip').addEventListener('click', () => close(null));
      send.addEventListener('click', () => {
        const val = $('inviteNoteInput').value.trim();
        close({ note: val || null, media });
      });
      modal.addEventListener('click', (e) => { if (e.target === modal) close(null); });
    });
  }

  // Uploads the inviter's voice/video note to the private welcome-notes bucket
  // and records it so the invitee's welcome screen can play it.
  async function uploadWelcomeMedia(m){
    const base = (m.mime || '').split(';')[0].trim();
    const ext = m.type === 'voice'
      ? (base.includes('mp4') ? 'm4a' : base.includes('ogg') ? 'ogg' : 'webm')
      : (base.includes('quicktime') ? 'mov' : base.includes('webm') ? 'webm' : 'mp4');
    const path = `${currentUser.id}/${circleId}/${Date.now()}.${ext}`;
    const { error: upErr } = await supabaseClient.storage
      .from('welcome-notes').upload(path, m.blob, { contentType: base || undefined, cacheControl: '3600' });
    if (upErr) throw upErr;
    const { error: insErr } = await supabaseClient.from('welcome_media').insert({
      circle_id: circleId, inviter_id: currentUser.id, path,
      media_type: m.type, duration_seconds: m.seconds || null
    });
    if (insErr) { supabaseClient.storage.from('welcome-notes').remove([path]); throw insErr; }
  }

  // Cold-start nudge: shown to whichever member reaches for "invite" while
  // the circle's feed is still empty — owner or not, since anyone with
  // room left can invite. It's a beat of friction, not a gate — "Invite
  // anyway" always works, it's just no longer the only button in the room.
  // Clicking outside the modal cancels the invite entirely rather than
  // defaulting to either choice.
  function openEmptyCircleNudge(){
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'invite-modal-backdrop';
      modal.innerHTML = `
        <div class="invite-modal en-modal">
          <h3>${escapeHtml(circle.name)} is still empty</h3>
          <p>Whoever you invite next will land on a blank page. A single line from you gives them something to react to — and a much better reason to stick around.</p>

          <div class="en-composer" id="enComposer">
            <textarea id="enText" rows="1" maxlength="2000" placeholder="Write something…" aria-label="Write something"></textarea>
            <div class="en-rec" aria-live="polite">
              <span class="en-dot"></span>
              <span class="en-time" id="enTime">0:00</span>
              <div class="en-wave" aria-hidden="true">${'<i></i>'.repeat(18)}</div>
            </div>
            <div class="en-bar">
              <button class="en-tool" id="enMic" type="button" title="Record a voice post" aria-label="Record a voice post">
                <svg viewBox="0 0 24 24"><path d="M12 1.8a3 3 0 00-3 3v7.4a3 3 0 006 0V4.8a3 3 0 00-3-3z"/><path d="M18.6 10.8v1.4a6.6 6.6 0 01-13.2 0v-1.4"/><path d="M12 18.8v3.4"/></svg>
              </button>
              <button class="en-tool" id="enVideo" type="button" title="Record a video" aria-label="Record a video">
                <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="3.2"/><path d="M17.5 10.3l4-2.4a.6.6 0 0 1 .9.5v7.2a.6.6 0 0 1-.9.5l-4-2.4z"/></svg>
              </button>
              <button class="en-tool en-cancel" id="enCancelRec" type="button" title="Discard recording" aria-label="Discard recording">
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
              </button>
              <button class="en-send" id="enSend" type="button" disabled aria-label="Send">
                <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5.5 11.5L12 5l6.5 6.5"/></svg>
              </button>
            </div>
          </div>

          <div class="en-done" aria-live="polite">
            <div class="en-check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
            <b>It's up</b>
            <span>Now your invite lands on something real.</span>
          </div>

          <div class="en-foot">
            <button class="invite-modal-skip" type="button" id="emptyNudgeInviteAnyway">Invite anyway</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));

      const card = modal.querySelector('.en-modal');
      const composer = modal.querySelector('#enComposer');
      const ta = modal.querySelector('#enText');
      const sendBtn = modal.querySelector('#enSend');
      const micBtn = modal.querySelector('#enMic');
      const videoBtn = modal.querySelector('#enVideo');
      const cancelRecBtn = modal.querySelector('#enCancelRec');
      const timerEl = modal.querySelector('#enTime');
      const SEND_ICON = sendBtn.innerHTML;
      const MAX_SECONDS = 120;

      let recorder = null, recStream = null, recChunks = [], recStart = 0, recTick = null;
      let recording = false, discardRec = false, sending = false, closed = false;

      const close = (choice) => {
        if (closed) return;
        closed = true;
        discardRec = true;
        clearInterval(recTick);
        try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (_) {}
        if (recStream) recStream.getTracks().forEach(t => t.stop());
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 220);
        resolve(choice);
      };

      const refresh = () => {
        const has = !!ta.value.trim() || recording;
        sendBtn.classList.toggle('ready', has && !sending);
        sendBtn.disabled = !has || sending;
      };
      ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
        refresh();
      });
      setTimeout(() => { try { ta.focus({ preventScroll: true }); } catch (_) { ta.focus(); } }, 260);

      const finishPosted = async (kind, extra) => {
        circleHasPosts = true;
        try { posthog.capture('empty_circle_inline_post', { circle_id: circleId, kind, ...(extra || {}) }); } catch (_) {}
        card.classList.add('done');
        try { refreshHomeFeed(); } catch (_) {}
        setTimeout(() => close('posted'), 950);
      };

      const failSend = (msg) => {
        sending = false;
        sendBtn.innerHTML = SEND_ICON;
        refresh();
        showToast(msg, 'error');
      };

      const sendText = async () => {
        const content = ta.value.trim();
        if (!content) return;
        sending = true; refresh();
        sendBtn.innerHTML = '<span class="mini-spinner"></span>';
        try {
          const { error } = await supabaseClient.from('posts').insert({
            circle_id: circleId, user_id: currentUser.id, caption: content, media_url: null, media_type: null,
          });
          if (error) throw error;
          posthog.capture('post_created', { circle_id: circleId, media_type: 'text', caption_length: content.length, source: 'empty_nudge' });
          await finishPosted('text');
        } catch (err) { failSend(err.message || 'Could not post'); }
      };

      const sendVoice = async (blob, mime, seconds) => {
        sending = true; refresh();
        sendBtn.innerHTML = '<span class="mini-spinner"></span>';
        try {
          const ext = mime.includes('mp4') ? 'm4a' : 'webm';
          const path = `${currentUser.id}/${circleId}/${Date.now()}.${ext}`;
          const { error: upErr } = await supabaseClient.storage.from('voice-posts').upload(path, blob, { contentType: mime });
          if (upErr) throw upErr;
          const { error: insErr } = await supabaseClient.from('posts').insert({
            circle_id: circleId, user_id: currentUser.id, caption: ta.value.trim() || null,
            media_url: path, media_type: 'voice', duration_seconds: seconds,
          });
          if (insErr) throw insErr;
          posthog.capture('post_created', { circle_id: circleId, media_type: 'voice', duration_seconds: seconds, source: 'empty_nudge' });
          await finishPosted('voice', { duration_seconds: seconds });
        } catch (err) {
          composer.classList.remove('recording');
          failSend(err.message || 'Could not post voice recording');
        }
      };

      const stopRecordingUI = () => {
        recording = false;
        clearInterval(recTick);
        if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
      };

      const startRecording = async () => {
        if (!requireAuth() || recording || sending) return;
        try {
          recStream = await getVoiceStream();
          recorder = createVoiceRecorder(recStream);
          recChunks = []; discardRec = false;
          recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
          recorder.onstop = () => {
            const seconds = (Date.now() - recStart) / 1000;
            const mime = (recorder && recorder.mimeType) || 'audio/webm';
            const blob = new Blob(recChunks, { type: mime });
            stopRecordingUI();
            if (discardRec || closed) { composer.classList.remove('recording'); refresh(); return; }
            sendVoice(blob, mime, seconds);
          };
          recorder.start();
          recStart = Date.now();
          recording = true;
          timerEl.textContent = '0:00';
          composer.classList.add('recording');
          recTick = setInterval(() => {
            const secs = Math.floor((Date.now() - recStart) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_SECONDS && recorder.state !== 'inactive') recorder.stop();
          }, 250);
          refresh();
        } catch (err) {
          stopRecordingUI();
          showToast('Microphone access denied or unavailable', 'error');
        }
      };

      sendBtn.addEventListener('click', () => {
        if (sending) return;
        if (recording) { discardRec = false; if (recorder.state !== 'inactive') recorder.stop(); return; }
        sendText();
      });
      micBtn.addEventListener('click', startRecording);
      cancelRecBtn.addEventListener('click', () => {
        discardRec = true;
        if (recorder && recorder.state !== 'inactive') recorder.stop(); else stopRecordingUI();
        composer.classList.remove('recording');
        refresh();
      });
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); }
      });

      // Video hands off to the real recorder; whatever was typed rides along as the caption.
      videoBtn.addEventListener('click', () => {
        if (sending) return;
        const main = document.getElementById('homeComposerText');
        if (main && ta.value.trim()) { main.value = ta.value; main.dispatchEvent(new Event('input')); }
        close('video');
      });

      modal.querySelector('#emptyNudgeInviteAnyway').addEventListener('click', () => close('invite'));
      // Outside tap cancels the invite — unless there's something to lose.
      modal.addEventListener('click', (e) => {
        if (e.target !== modal) return;
        if (recording || sending || ta.value.trim()) {
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          return;
        }
        close('cancel');
      });
    });
  }

  // Live "someone just joined" broadcast via Supabase Realtime — makes the
  // circle feel alive and lets everyone currently inside see arrivals happen.
  // Requires Realtime enabled on the circle_members table in Supabase.
  let circleChannel = null;
  function subscribeToCircleActivity(){
    if (circleChannel || !circle?.is_private) return;
    circleChannel = supabaseClient
      .channel(`circle-activity-${circleId}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'circle_members', filter: `circle_id=eq.${circleId}` },
        async (payload) => {
          if (!payload.new || payload.new.user_id === currentUser?.id) return;
          const { data: prof } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', payload.new.user_id).maybeSingle();
          showToast(`${prof?.username || 'someone'} just joined the circle 👋`);
          members = await loadMembers();
          const row = document.querySelector('.home-people-row');
          if (row) row.outerHTML = renderPeopleRow();
        }
      )
      .subscribe();
  }
  window.addEventListener('beforeunload', () => { if (circleChannel) supabaseClient.removeChannel(circleChannel); });

  // Live delivery for Golden Hour questions. Sending previously only put a
  // link on the sender's clipboard — if the recipient was sitting right on
  // this page when it was sent, nothing told them a question had arrived.
  let goldenHourPromptChannel = null;
  function subscribeToGoldenHourPrompts(){
    if (goldenHourPromptChannel || !circle?.is_private || !currentUser) return;
    goldenHourPromptChannel = supabaseClient
      .channel(`gh-prompts-${circleId}-${currentUser.id}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'golden_hour_prompts', filter: `to_user_id=eq.${currentUser.id}` },
        async (payload) => {
          if (!payload.new || payload.new.circle_id !== circleId || payload.new.answered_at) return;
          activePrompt = {
            id: payload.new.id,
            from_user_id: payload.new.from_user_id,
            question: payload.new.question,
            answered_at: payload.new.answered_at,
            created_at: payload.new.created_at,
            is_anonymous: payload.new.is_anonymous,
          };
          revealNotifiedIds.delete(activePrompt.id);
          // Always "Someone" here — who sent it stays hidden until the
          // blur lifts on its own, regardless of the sender's choice.
          showToast('✨ Someone just asked you something');
          switchHomeView('home');
          await refreshGoldenHourReveal();
          document.getElementById('promptPinBanner')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      )
      .subscribe();
  }
  window.addEventListener('beforeunload', () => {
    if (goldenHourPromptChannel) supabaseClient.removeChannel(goldenHourPromptChannel);
    clearInterval(promptRevealTicker);
  });

  async function renderSidebar(){
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    if (!currentUser) return;
    const { data: me } = await supabaseClient.from('profiles').select('username, avatar_url, gh_notify_channel').eq('id', currentUser.id).maybeSingle();
    currentUsername = me?.username || currentUser.email || 'You';
    currentUserGhChannel = me?.gh_notify_channel || 'unset';
    posthog.identify(currentUser.id, { username: currentUsername, email: currentUser.email });
    if (circleId) posthog.group('circle', circleId);
  }

  const params = new URLSearchParams(window.location.search);
  const circleId = params.get('ID');
  const urlSaysPrivate = params.has('private');

  let circle = null;
  let myRole = null;
  let members = [];
  // Whether the private circle's feed currently has any posts — kept in
  // sync by refreshHomeFeed() and read by the invite button's cold-start
  // nudge (see openEmptyCircleNudge).
  let circleHasPosts = false;
  let currentSort = 'hot';

  async function loadCircle(){
    const { data: c, error } = await supabaseClient
      .from('circles')
      .select('id, name, description, is_private, created_at, created_by')
      .eq('id', circleId)
      .maybeSingle();
    if (error || !c) return null;
    return c;
  }

  async function loadMembers(){
    const { data: mem } = await supabaseClient
      .from('circle_members')
      .select('user_id, role, joined_at')
      .eq('circle_id', circleId)
      .order('joined_at', { ascending: true });

    const list = mem || [];
    if (list.length === 0) return [];

    const userIds = list.map(m => m.user_id);
    const { data: profs } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', userIds);

    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });

    return list
      .map(m => {
        const p = profileById[m.user_id];
        if (!p) return null;
        return { ...p, role: m.role, joined_at: m.joined_at };
      })
      .filter(Boolean);
  }

  // How many invites this member has already created for this circle since
  // midnight (local time). Every member gets their own 2/day allowance —
  // this isn't owner-only. Backs the "N/2 today" badge and the client-side
  // disable — the real enforcement lives in the DB trigger on circle_invites,
  // this is just so the button reflects it without a failed request first.
  // Assumes a `circle_invites` table with circle_id, created_by, created_at —
  // rename these to match your actual invites table if it differs.
  async function loadInvitesToday(){
    if (!currentUser) return 0;
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    const { count, error } = await supabaseClient
      .from('circle_invites')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', circleId)
      .eq('created_by', currentUser.id)
      .gte('created_at', startOfDay.toISOString());
    if (error) { console.error('loadInvitesToday failed', error); return 0; }
    return count ?? 0;
  }

  // =========================================================
  // PRIVATE MEDIA — every file lives in a private bucket and is only
  // ever shown through a short-lived signed link. Storage policies
  // (circle membership) decide who is allowed to get a link at all.
  // =========================================================
  const SIGNED_TTL = 600;                           // links live 10 minutes
  const SIGNED_CACHE_MS = (SIGNED_TTL - 120) * 1000; // re-sign 2 min before expiry
  const signedCache = new Map();                    // "bucket/path" -> { url, exp }
  const MEDIA_BUCKETS = ['voice-posts', 'voice-comments', 'album-photos', 'video-posts'];
  const PUBLIC_MARK = '/storage/v1/object/public/';
  const SIGN_MARK = '/storage/v1/object/sign/';

  // =========================================================
  // Voice recording — shared mic + encoder setup.
  // Requesting a plain `{ audio: true }` stream and letting
  // MediaRecorder pick its own (often very low) default bitrate is
  // what caused the crackly/"krkr" playback. This asks for a clean
  // mono signal with echo/noise/gain processing, and forces a real
  // opus/AAC bitrate so voice notes come out clear.
  // =========================================================
  async function getVoiceStream(){
    return navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
        sampleRate: 48000
      }
    });
  }

  function pickVoiceMimeType(){
    const preferred = ['audio/webm;codecs=opus', 'audio/mp4;codecs=mp4a.40.2', 'audio/webm'];
    return preferred.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  function createVoiceRecorder(stream){
    const mimeType = pickVoiceMimeType();
    return new MediaRecorder(stream, mimeType
      ? { mimeType, audioBitsPerSecond: 128000 }
      : { audioBitsPerSecond: 128000 });
  }

  // =========================================================
  // Video recording — shared camera + encoder setup.
  // Prefers MP4 (plays on every friend's phone, incl. iPhones),
  // falls back to WebM. ~2.5 Mbps keeps a 60s clip near 20 MB.
  // =========================================================
  const VIDEO_MAX_SECONDS = 30;   // Waater videos are up to 30 seconds (the DB trigger on public.posts must allow 30 too)
  const VIDEO_COMMENT_MAX_SECONDS = 30;   // video replies stay short and light
  const VIDEO_MIN_SECONDS = 0.8;
  const VIDEO_MAX_BYTES = 50 * 1024 * 1024;

  // Old / weak phones can't encode 1080p live: the encoder falls behind, drops
  // frames and blurs everything (= laggy + low quality). So we pick a profile
  // the phone can actually keep up with.
  const VIDEO_LOW_END = (function(){
    try {
      const cores = navigator.hardwareConcurrency || 4;
      const mem = navigator.deviceMemory || 4;
      return cores <= 4 || mem <= 3;
    } catch (_) { return false; }
  })();

  const VIDEO_PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') ||
    ((navigator.maxTouchPoints || 0) > 1 && window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

  // Flips to true when we MEASURE that this phone can't keep up (camera fps < 22).
  // Remembered across sessions so the next recording starts in the right mode.
  let VIDEO_DEGRADED = false;
  try { VIDEO_DEGRADED = localStorage.getItem('vr_degraded') === '1'; } catch (_) {}
  function markDegraded(){
    VIDEO_DEGRADED = true;
    try { localStorage.setItem('vr_degraded', '1'); } catch (_) {}
  }

  function videoProfile(small){
    // desktop is already great: unchanged. Phones: always 720p+ at a real 30fps with a
    // bitrate that keeps it clean (lower fps/bitrate is what looked laggy + pixelated).
    if (!VIDEO_PHONE)   return { w: 1080, h: 1440, fps: 30, bps: small ? 3000000 : 5000000 };
    // Measured-weak phone: 540p is what its encoder can hold at a steady frame rate.
    // Smooth 540p beats choppy 1080p every time.
    if (VIDEO_DEGRADED) return { w: 540,  h: 720,  fps: 30, bps: small ? 2000000 : 3000000 };
    // Old/weak phone: 720p with a generous bitrate so every frame stays clean.
    if (VIDEO_LOW_END)  return { w: 720,  h: 960,  fps: 30, bps: small ? 3500000 : 5000000 };
    return                     { w: 1080, h: 1440, fps: 30, bps: small ? 3500000 : 6000000 };   // all profiles are 3:4 = the full sensor view, not a zoomed crop
  }

  // Phone cameras expose landscape modes and often silently hand back 640x480 or
  // 15fps (dim light) when asked for a portrait size. So on phones we ask a few
  // different ways, CHECK what we really got, and keep the best one.
  // Ask the camera to zoom all the way out (phones that expose a zoom control often
  // start the front camera slightly zoomed in). Harmless where it isn't supported.
  function vrZoomOut(st){
    try {
      const tr = st.getVideoTracks()[0];
      const caps = tr && tr.getCapabilities && tr.getCapabilities();
      if (caps && caps.zoom && typeof caps.zoom.min === 'number') tr.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(() => {});
    } catch (_) {}
    return st;
  }

  // The old request was a tall 9:16 frame. Phone sensors are 4:3, so 9:16 made the browser
  // CROP the sensor (= the zoomed-in face). We now ask for 3:4 so the whole sensor is used,
  // and we open the camera once; we only retry when the first result is really small.
  async function getVideoStream(facing, small){
    const P = videoProfile(small);
    const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 };
    const face = { ideal: facing || 'user' };
    const gum = (video) => navigator.mediaDevices.getUserMedia({ video, audio });
    const ar = P.w / P.h;
    if (!VIDEO_PHONE){
      return vrZoomOut(await gum({ facingMode: face, width: { ideal: P.w }, height: { ideal: P.h }, aspectRatio: { ideal: ar }, frameRate: { ideal: P.fps } }));
    }
    const tries = [
      { facingMode: face, width: { ideal: P.w }, height: { ideal: P.h }, aspectRatio: { ideal: ar }, frameRate: { ideal: 30 } },
      { facingMode: face, width: { ideal: P.h }, height: { ideal: P.w }, aspectRatio: { ideal: 1 / ar }, frameRate: { ideal: 30 } }
    ];
    const rate = (st) => Math.min(st.width || 0, st.height || 0);
    let best = null, bestScore = -1;
    for (const v of tries){
      let st;
      try { st = await gum(v); }
      catch (e){
        if (e && ['NotAllowedError', 'SecurityError', 'NotFoundError'].includes(e.name)) { if (best) best.getTracks().forEach(t => t.stop()); throw e; }
        continue;
      }
      const set = st.getVideoTracks()[0].getSettings();
      const sc = rate(set);
      if (sc > bestScore){ if (best) best.getTracks().forEach(t => t.stop()); best = st; bestScore = sc; }
      else st.getTracks().forEach(t => t.stop());
      if (bestScore >= 540) break;                      // good enough: no second camera open
      await new Promise(r => setTimeout(r, 120));       // let the camera release before re-opening
    }
    if (best) return vrZoomOut(best);
    return vrZoomOut(await gum({ facingMode: face }));
  }

  function pickVideoMimeType(){
    // Low-end: baseline/main H.264 (hardware encoders on old phones) and VP8
    // before VP9 (VP9 software encoding is what melts old CPUs).
    const preferred = VIDEO_LOW_END ? [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1.4D401F,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'
    ] : [
      'video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1.4D401F,mp4a.40.2',
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4',
      'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'
    ];
    return preferred.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  function createVideoRecorder(stream, small){
    const mimeType = pickVideoMimeType();
    const opts = { videoBitsPerSecond: videoProfile(small).bps, audioBitsPerSecond: 96000 };
    if (mimeType) opts.mimeType = mimeType;
    return new MediaRecorder(stream, opts);
  }

  // What we store in the DB is the object PATH. Rows created before the
  // switch hold a full public URL — we read the path back out of it.
  // Returns null for anything that isn't one of our files (external links).
  function mediaPathFrom(bucket, value){
    if (!value) return null;
    const v = String(value).trim();
    if (!/^https?:\/\//i.test(v)) return v.replace(/^\/+/, '');
    for (const mark of [PUBLIC_MARK, SIGN_MARK]) {
      const i = v.indexOf(mark + bucket + '/');
      if (i !== -1) {
        let p = v.slice(i + mark.length + bucket.length + 1).split('?')[0];
        try { p = decodeURIComponent(p); } catch (_) {}
        return p;
      }
    }
    return null;
  }

  // Turn stored refs into signed URLs (batched + cached). A file that can't
  // be signed (not a member, deleted) comes back as '' — never a fallback URL.
  async function signMedia(bucket, refs){
    const now = Date.now();
    const out = new Array(refs.length);
    const need = new Map();                         // path -> [indexes]
    refs.forEach((ref, i) => {
      const path = mediaPathFrom(bucket, ref);
      if (path === null) { out[i] = ref; return; }  // external link, leave alone
      const hit = signedCache.get(bucket + '/' + path);
      if (hit && hit.exp > now) { out[i] = hit.url; return; }
      if (!need.has(path)) need.set(path, []);
      need.get(path).push(i);
    });
    if (need.size) {
      const { data, error } = await supabaseClient.storage.from(bucket).createSignedUrls([...need.keys()], SIGNED_TTL);
      if (error) console.error('signMedia failed', error);
      (data || []).forEach(row => {
        if (row && row.signedUrl && !row.error) {
          signedCache.set(bucket + '/' + row.path, { url: row.signedUrl, exp: now + SIGNED_CACHE_MS });
          (need.get(row.path) || []).forEach(i => { out[i] = row.signedUrl; });
        }
      });
      need.forEach(idxs => idxs.forEach(i => { if (out[i] === undefined) out[i] = ''; }));
    }
    return out;
  }

  async function hydratePostMedia(list){
    const at = [];
    const vAt = [];
    list.forEach((p, i) => {
      if (!p.media_url) return;
      if (p.media_type === 'voice') at.push(i);
      else if (p.media_type === 'video' && !/^https?:\/\//i.test(p.media_url)) vAt.push(i); // recorded in-app = a storage path
    });
    if (!at.length && !vAt.length) return list;
    const [urls, vUrls] = await Promise.all([
      at.length ? signMedia('voice-posts', at.map(i => list[i].media_url)) : [],
      vAt.length ? signMedia('video-posts', vAt.map(i => list[i].media_url)) : []
    ]);
    at.forEach((li, k) => { list[li] = { ...list[li], media_url: urls[k] }; });
    vAt.forEach((li, k) => { list[li] = { ...list[li], media_url: vUrls[k] }; });
    return list;
  }

  // Video replies live in the video-posts bucket, in the same voice_comments
  // table as voice replies, and are told apart by a `vc-` file name.
  function isVideoCommentPath(p){ return /(^|\/)vc-[^\/]*$/.test(String(p || '')); }

  async function hydrateCommentMedia(list){
    const at = [];
    const vAt = [];
    list.forEach((c, i) => {
      if (!c.audio_url) return;
      if (c.kind === 'voice') at.push(i);
      else if (c.kind === 'video') vAt.push(i);
    });
    if (!at.length && !vAt.length) return list;
    const [urls, vUrls] = await Promise.all([
      at.length ? signMedia('voice-comments', at.map(i => list[i].audio_url)) : [],
      vAt.length ? signMedia('video-posts', vAt.map(i => list[i].audio_url)) : []
    ]);
    at.forEach((li, k) => { list[li] = { ...list[li], audio_url: urls[k] }; });
    vAt.forEach((li, k) => { list[li] = { ...list[li], audio_url: vUrls[k] }; });
    return list;
  }

  async function hydrateAlbumMedia(list){
    if (!list.length) return list;
    const urls = await signMedia('album-photos', list.map(p => p.photo_url));
    return list.map((p, i) => ({ ...p, photo_url: urls[i] }));
  }

  // "Delete" has to mean delete: remember where the file is, drop the row,
  // then erase the file itself from storage.
  async function mediaRefBeforeDelete(table, id){
    try {
      if (table === 'posts') {
        const { data } = await supabaseClient.from('posts').select('media_url, media_type').eq('id', id).maybeSingle();
        if (!data) return null;
        if (data.media_type === 'voice') return { bucket: 'voice-posts', path: mediaPathFrom('voice-posts', data.media_url) };
        if (data.media_type === 'video') return { bucket: 'video-posts', path: mediaPathFrom('video-posts', data.media_url) };
        return null;
      }
      const { data } = await supabaseClient.from('voice_comments').select('audio_url').eq('id', id).maybeSingle();
      if (!data) return null;
      const bucket = isVideoCommentPath(data.audio_url) ? 'video-posts' : 'voice-comments';
      return { bucket, path: mediaPathFrom(bucket, data.audio_url) };
    } catch (_) { return null; }
  }
  async function eraseMedia(ref){
    if (!ref || !ref.path) return;
    signedCache.delete(ref.bucket + '/' + ref.path);
    const { error } = await supabaseClient.storage.from(ref.bucket).remove([ref.path]);
    if (error) console.warn('could not erase file from storage', error);
  }

  // A link that expired while the page stayed open: quietly get a fresh one, once.
  document.addEventListener('error', async (e) => {
    const el = e.target;
    if (!el || !['IMG', 'AUDIO', 'VIDEO'].includes(el.tagName) || el.dataset.resigned) return;
    const src = el.currentSrc || el.src || '';
    const i = src.indexOf(SIGN_MARK);
    if (i === -1) return;
    const rest = src.slice(i + SIGN_MARK.length).split('?')[0];
    const slash = rest.indexOf('/');
    const bucket = rest.slice(0, slash);
    if (!MEDIA_BUCKETS.includes(bucket)) return;
    el.dataset.resigned = '1';
    let path = rest.slice(slash + 1);
    try { path = decodeURIComponent(path); } catch (_) {}
    signedCache.delete(bucket + '/' + path);
    const [fresh] = await signMedia(bucket, [path]);
    if (fresh) el.src = fresh;
  }, true);

  // Never keep links around after sign-out.
  supabaseClient.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') signedCache.clear(); });

  // ---- posts ----
  // posts table columns: id, user_id, caption, media_url, media_type, created_at,
  // circle_id, score, likes_count, comment_count, is_anonymous
  const ANON_POST_TTL_MS = 24 * 60 * 60 * 1000; // anonymous posts live for exactly 24 hours

  // Pop-up that makes the creator pick how long the video lives.
  function vrAskExpiry(onPick){
    const old = document.getElementById('vrExpAsk'); if (old) old.remove();
    const el = document.createElement('div'); el.id = 'vrExpAsk'; el.className = 'vr-expask';
    const choices = [[1,'1 hour'],[6,'6 hours'],[12,'12 hours'],[24,'24 hours']];
    const when = (h) => { const d = new Date(Date.now() + h * 3600000); const t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); return d.toDateString() === new Date().toDateString() ? t : 'tomorrow ' + t; };
    el.innerHTML = '<div class="vr-expask-card"><div class="vr-expask-emoji">\u23f3</div><h3>Your video will disappear</h3><p>Pick how long it stays. After that it is deleted for everyone, even if they have not watched it.</p>' + choices.map(c => '<button type="button" data-h="' + c[0] + '"><b>' + c[1] + '</b><span>gone around ' + when(c[0]) + '</span></button>').join('') + '<button type="button" class="vr-expask-cancel">Back</button></div>';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const b = e.target.closest('button');
      if (b){ const h = b.dataset.h; el.remove(); if (h) onPick(parseInt(h, 10)); }
      else if (e.target === el) el.remove();
    });
    document.body.appendChild(el);
  }

  // First-time explainer: why the person's own view blurs. Honest on purpose — only the
  // on-screen preview blurs; the recording that friends watch is the normal, clear video.
  function vrBlurIntro(onChoose){
    const old = document.getElementById('vrBlurIntro'); if (old) old.remove();
    const el = document.createElement('div'); el.id = 'vrBlurIntro'; el.className = 'vr-expask vr-intro';
    el.style.zIndex = '2600';
    el.innerHTML = '<div class="vr-expask-card">'
      + '<div class="vr-demo" aria-hidden="true"><span>\uD83D\uDE42</span></div>'
      + '<h3>Talk like it\u2019s just you and a friend</h3>'
      + '<p>A few seconds after you start, <b>your own view melts into a soft blur</b> \u2014 so you can\u2019t watch yourself, can\u2019t overthink it, and can just talk. Your circle still gets the real you, and only them.</p>'
      + '<button type="button" class="vr-intro-go" data-a="on"><b>Love it \u2014 let\u2019s go</b></button>'
      + '<button type="button" class="vr-expask-cancel" data-a="off">I\u2019d rather see myself</button>'
      + '</div>';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const b = e.target.closest('button[data-a]');
      if (!b) return;
      el.remove();
      onChoose(b.dataset.a === 'on');
    });
    document.body.appendChild(el);
  }

  // Deletes the signed-in user's own expired video files (the DB job queues them).
  let vrCleanedOnce = false;
  async function vrCleanupExpiredFiles(){
    if (vrCleanedOnce || !currentUser) return;
    vrCleanedOnce = true;
    try {
      const { data } = await supabaseClient.from('expired_files').select('path').eq('user_id', currentUser.id).limit(100);
      if (!data || !data.length) return;
      const paths = data.map(r => r.path);
      const { error } = await supabaseClient.storage.from('video-posts').remove(paths);
      if (!error) await supabaseClient.from('expired_files').delete().in('path', paths);
    } catch (_) {}
  }

  async function loadPosts(sort){
    // Best-effort: sweep any anonymous posts older than 24 hours before
    // we fetch the feed (see cleanup_expired_anon_posts on the backend).
    await cleanupExpiredAnonPosts();
    vrCleanupExpiredFiles();

    let query = supabaseClient
      .from('posts')
      .select('id, user_id, caption, media_url, media_type, duration_seconds, created_at, score, likes_count, comment_count, is_anonymous, gh_question, gh_asker_name, expires_hours')
      .eq('circle_id', circleId);

    if (sort === 'top') query = query.order('score', { ascending: false });
    else query = query.order('created_at', { ascending: false });

    const { data, error } = await query.limit(50);
    if (error) { console.error('loadPosts failed', error); return []; }
    let list = data || [];

    // Safety net: hide any anonymous post past its 24-hour window on the
    // client too, in case the backend sweep hasn't run yet.
    list = list.filter(p => !p.is_anonymous || (Date.now() - new Date(p.created_at).getTime()) < ANON_POST_TTL_MS);
    // Timed videos: hide once the creator's chosen time (1/6/12/24h) is up.
    list = list.filter(p => !p.expires_hours || (Date.now() - new Date(p.created_at).getTime()) < p.expires_hours * 3600000);

    // View-once check and profile lookup run at the same time (they used to run one after the other).
    const vids = currentUser ? list.filter(p => p.media_type === 'video' && p.user_id !== currentUser.id).map(p => p.id) : [];
    const userIds = [...new Set(list.map(p => p.user_id))];
    const [seenRes, profRes] = await Promise.all([
      vids.length ? supabaseClient.from('post_seen').select('post_id').eq('user_id', currentUser.id).in('post_id', vids) : Promise.resolve({ data: null }),
      userIds.length ? supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds) : Promise.resolve({ data: [] })
    ]);
    // A video this person already watched stays gone for them (and only them).
    const seenIds = new Set(((seenRes && seenRes.data) || []).map(r => r.post_id));
    if (seenIds.size) list = list.map(p => seenIds.has(p.id) ? { ...p, media_url: '', _viewed: true } : p);

    if (list.length > 0) {
      const profileById = {};
      ((profRes && profRes.data) || []).forEach(p => { profileById[p.id] = p; });
      list = list.map(p => ({ ...p, profiles: profileById[p.user_id] || null }));
    }

    list = await hydratePostMedia(list);

    if (sort === 'hot') {
      list = list.map(p => ({ ...p, _hot: ((p.score||0) + 0.6*(p.comment_count||0) + 1) / Math.pow((Date.now()-new Date(p.created_at))/3600000 + 2, 1.3) }))
                 .sort((a,b) => b._hot - a._hot);
    }
    return list;
  }

  async function loadMyVotes(postIds){
    if (!currentUser || postIds.length === 0) return {};
    const { data } = await supabaseClient.from('post_votes').select('post_id, value').eq('user_id', currentUser.id).in('post_id', postIds);
    const m = {};
    (data||[]).forEach(v => { m[v.post_id] = v.value; });
    return m;
  }

  async function loadMyLikes(postIds){
    if (!currentUser || postIds.length === 0) return new Set();
    const { data } = await supabaseClient.from('post_likes').select('post_id').eq('user_id', currentUser.id).in('post_id', postIds);
    return new Set((data||[]).map(r => r.post_id));
  }

  // =========================================================
  // US — the circle's shared memory vault. A row here doesn't copy a
  // post, it references one (see circle_memories.post_id) — so its
  // comments and likes stay the same live thread whether you're
  // looking at it in the Feed or in Us.
  // =========================================================
  let memoryByPostId = {}; // post_id -> { id, added_by } — drives the heart icon's state in the Feed

  async function loadMemoryMap(){
    const { data, error } = await supabaseClient
      .from('circle_memories')
      .select('id, post_id, added_by')
      .eq('circle_id', circleId);
    memoryByPostId = {};
    if (error) { console.error('loadMemoryMap failed', error); return; }
    (data || []).forEach(m => { memoryByPostId[m.post_id] = m; });
  }

  async function loadUsMemories(){
    const { data: rows, error } = await supabaseClient
      .from('circle_memories')
      .select('id, post_id, added_by, caption, created_at, posts(id, user_id, caption, media_url, media_type, duration_seconds, created_at, likes_count, comment_count, is_anonymous, gh_question, gh_asker_name)')
      .eq('circle_id', circleId)
      .order('created_at', { ascending: false });
    if (error) { console.error('loadUsMemories failed', error); return []; }

    const list = (rows || []).filter(r => r.posts); // drop rows whose post was hard-deleted
    memoryByPostId = {};
    list.forEach(r => { memoryByPostId[r.post_id] = { id: r.id, added_by: r.added_by }; });
    if (list.length === 0) return [];

    const userIds = [...new Set([...list.map(r => r.added_by), ...list.map(r => r.posts.user_id)])];
    const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });

    let posts = list.map(r => ({
      ...r.posts,
      profiles: profileById[r.posts.user_id] || null,
      _memory: {
        id: r.id,
        added_by: r.added_by,
        added_by_profile: profileById[r.added_by] || null,
        caption: r.caption,
        added_at: r.created_at
      }
    }));
    posts = await hydratePostMedia(posts);

    const myLikes = await loadMyLikes(posts.map(p => p.id));
    return posts.map(p => ({ post: p, isLiked: myLikes.has(p.id) }));
  }

  async function addToUs(postId, caption){
    if (!requireAuth()) return false;
    const { data, error } = await supabaseClient
      .from('circle_memories')
      .insert({
        circle_id: circleId,
        post_id: postId,
        added_by: currentUser.id,
        caption: caption ? caption.trim().slice(0, 300) : null
      })
      .select('id, post_id, added_by')
      .single();
    if (error){
      if (error.code === '23505') { showToast('Already in Us'); return false; } // unique(post_id) — someone beat you to it
      showToast(error.message || 'Could not add to Us', 'error');
      return false;
    }
    memoryByPostId[postId] = { id: data.id, added_by: data.added_by };
    posthog.capture('post_added_to_us', { post_id: postId, circle_id: circleId });
    showToast('Added to Us ✨');
    return true;
  }

  async function removeFromUs(memoryId, postId){
    if (!currentUser) return false;
    const { error } = await supabaseClient
      .from('circle_memories')
      .delete()
      .eq('id', memoryId)
      .eq('added_by', currentUser.id); // belt-and-suspenders alongside the RLS policy
    if (error){
      showToast(error.message || 'Could not remove from Us', 'error');
      return false;
    }
    delete memoryByPostId[postId];
    posthog.capture('post_removed_from_us', { post_id: postId, circle_id: circleId });
    showToast('Removed from Us');
    return true;
  }

  // Shared upload+insert+refresh used by both the mic button and hold-to-talk.
  // `card` is the specific .home-post-card the recording started from — a
  // post can be sitting in both the Feed and Us at once, so we need to know
  // which copy to fully refresh vs. just keep the badge count honest on.
  async function sendVoiceComment(postId, blob, durationSeconds, card){
    const mimeType = blob.type || 'audio/webm';
    const ext = mimeType.includes('mp4') ? 'm4a' : 'webm';
    const path = `${currentUser.id}/${postId}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage
      .from('voice-comments')
      .upload(path, blob, { contentType: mimeType });
    if (uploadError) throw uploadError;

    const { error: insertError } = await supabaseClient.from('voice_comments').insert({
      post_id: postId,
      user_id: currentUser.id,
      audio_url: path,
      duration_seconds: durationSeconds
    });
    if (insertError) throw insertError;
    posthog.capture('comment_added', { post_id: postId, type: 'voice', duration_seconds: durationSeconds });

    const comments = await loadComments(postId);
    syncCommentsEverywhere(postId, comments, card);
  }

  // Video reply: same private bucket + membership rules as video posts, same
  // table as voice replies. Path shape matches video posts (uid/circle/file).
  async function sendVideoComment(postId, blob, mime, durationSeconds, card){
    const baseMime = ((mime || blob.type || 'video/mp4').split(';')[0].trim()) || 'video/mp4';
    const ext = baseMime.includes('mp4') ? 'mp4' : baseMime.includes('quicktime') ? 'mov' : 'webm';
    const path = `${currentUser.id}/${circleId}/vc-${Date.now()}.${ext}`;
    const { error: upErr } = await supabaseClient.storage
      .from('video-posts')
      .upload(path, blob, { contentType: baseMime, cacheControl: '3600' });
    if (upErr) throw upErr;
    const { error: insErr } = await supabaseClient.from('voice_comments').insert({
      post_id: postId,
      user_id: currentUser.id,
      audio_url: path,
      duration_seconds: durationSeconds || null
    });
    if (insErr){
      supabaseClient.storage.from('video-posts').remove([path]); // no orphan file
      throw insErr;
    }
    posthog.capture('comment_added', { post_id: postId, type: 'video', duration_seconds: durationSeconds });
    const comments = await loadComments(postId);
    syncCommentsEverywhere(postId, comments, card);
  }

  // Press and hold a post to record a voice reply; a plain tap opens the thread
  // (text + voice comments), same as tapping the comment icon.
  function attachHoldToTalk(root = document){
    root.querySelectorAll('.home-post-card').forEach(card => {
      const postId = card.dataset.postId;
      const body = card.querySelector('.home-post-body');
      if (!body || body.dataset.holdBound) return;
      body.dataset.holdBound = '1';

      const indicator = document.createElement('div');
      indicator.className = 'hold-record-indicator';
      indicator.innerHTML = `<span class="hri-dot"></span><span>Recording — release to send</span><span class="hri-timer">0:00</span>`;
      body.appendChild(indicator);
      const timerLabel = indicator.querySelector('.hri-timer');

      let pressTimer = null;
      let isRecording = false;
      let releasing = false; // UI already snapped back; recorder is still finishing in the background
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let stream = null;
      let timerInterval = null;
      let startX = 0, startY = 0;
      let activePointerId = null;
      let cancelledByScroll = false;
      const HOLD_MS = 320;
      const MAX_RECORDING_SECONDS = 60;
      const MIN_VALID_SECONDS = 0.6;
      const MOVE_CANCEL_PX = 10; // finger moving this much = scrolling, not holding

      const clearPressTimer = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

      // Snaps the UI back to idle the instant the user lets go. This is
      // intentionally separate from stopping the actual MediaRecorder:
      // on some phones the recorder can take a beat to flush and fire
      // 'onstop', and waiting for that before updating the UI is exactly
      // what made release feel laggy/buggy. The UI now never waits on it.
      const hideRecordingUI = () => {
        clearInterval(timerInterval);
        body.classList.remove('holding-talk');
        indicator.classList.remove('show');
      };

      const stopTracks = () => {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      };

      const beginRecording = async () => {
        if (!requireAuth()) return;
        try {
          stream = await getVoiceStream();
        } catch(err){
          showToast('Microphone access denied or unavailable', 'error');
          return;
        }
        // The user may have already released while the mic permission
        // prompt was pending — don't start recording into a UI that has
        // already snapped back to idle.
        if (releasing){ stream.getTracks().forEach(t => t.stop()); stream = null; return; }

        mediaRecorder = createVoiceRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const durationSeconds = startTime ? (Date.now() - startTime) / 1000 : 0;
          stopTracks();
          isRecording = false;
          releasing = false;
          if (cancelledByScroll){ cancelledByScroll = false; return; }
          if (durationSeconds < MIN_VALID_SECONDS) return;
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          try {
            await sendVoiceComment(postId, blob, durationSeconds);
            showToast('Voice reply sent');
            markVoiceHintSeen();
          } catch (err) {
            showToast(err.message || 'Could not send voice reply', 'error');
          }
        };

        isRecording = true;
        body.classList.add('holding-talk');
        indicator.classList.add('show');
        if (navigator.vibrate) navigator.vibrate(12);
        startTime = Date.now();
        mediaRecorder.start();
        timerInterval = setInterval(() => {
          const secs = Math.floor((Date.now() - startTime) / 1000);
          timerLabel.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_RECORDING_SECONDS) finishRecording(false);
        }, 200);
      };

      // The single exit path for a live recording: hide the UI now,
      // stop the recorder in the background. Called on release, on
      // scroll-cancel, on pointercancel, and on hitting the max length.
      const finishRecording = (cancel) => {
        cancelledByScroll = cancel;
        releasing = true;
        hideRecordingUI();
        if (mediaRecorder && mediaRecorder.state !== 'inactive'){
          mediaRecorder.stop();
        } else {
          stopTracks();
          isRecording = false;
          releasing = false;
        }
      };

      const isInteractiveTarget = (target) =>
        target.closest('.home-post-actions, .home-comments, .home-post-delete, .whisper-reveal, audio, video, a, button');

      // Pointer Events (not separate mouse/touch listeners) so a real touch
      // can't also replay as a synthetic mousedown/mouseup a moment later —
      // that ghost event was what made release feel unreliable, since it
      // could quietly re-arm the press timer or re-open the thread right
      // after a recording had just been sent. setPointerCapture keeps every
      // move/up event routed here even if the finger drifts off this card.
      const onPointerDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (isInteractiveTarget(e.target)) return;
        activePointerId = e.pointerId;
        startX = e.clientX; startY = e.clientY;
        releasing = false;
        clearPressTimer();
        if (body.setPointerCapture){
          try { body.setPointerCapture(e.pointerId); } catch(err){}
        }
        pressTimer = setTimeout(() => { pressTimer = null; beginRecording(); }, HOLD_MS);
      };

      const onPointerMove = (e) => {
        if (e.pointerId !== activePointerId) return;
        if (!pressTimer && !isRecording) return;
        const dx = Math.abs(e.clientX - startX);
        const dy = Math.abs(e.clientY - startY);
        if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX){
          // This is a scroll, not a hold — bail out without sending anything.
          clearPressTimer();
          if (isRecording) finishRecording(true);
        }
      };

      const onPointerUp = (e) => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        if (pressTimer){
          clearPressTimer();
          if (!isInteractiveTarget(e.target)) openComments(postId);
          return;
        }
        if (isRecording) finishRecording(false);
      };

      const onPointerCancel = (e) => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        clearPressTimer();
        if (isRecording) finishRecording(true);
      };

      body.addEventListener('pointerdown', onPointerDown);
      body.addEventListener('pointermove', onPointerMove);
      body.addEventListener('pointerup', onPointerUp);
      body.addEventListener('pointercancel', onPointerCancel);
    });
  }

  // The same post can be on screen twice at once — once in the Feed, once
  // in Us — so anything that touches "the" comment panel for a post needs
  // to know which physical card it's dealing with, not just the post id.
  function postCardsById(postId){
    return document.querySelectorAll(`.home-post-card[data-post-id="${postId}"]`);
  }

  // Keeps the comment count + list correct on every copy of a post at once.
  // The card the user is actually looking at gets its list repainted live;
  // any other copy just gets its count updated and its cached list marked
  // stale, so opening it later pulls the real thing instead of showing
  // what was there before this comment existed.
  function syncCommentsEverywhere(postId, comments, sourceCard){
    postCardsById(postId).forEach(card => {
      const countEl = card.querySelector('.home-comment-toggle .home-comment-count');
      if (countEl) countEl.textContent = comments.length;
      const panel = card.querySelector('.home-comments');
      if (!panel) return;
      if (card === sourceCard){
        const listEl = card.querySelector('.home-comment-list');
        if (listEl) listEl.innerHTML = comments.length
          ? comments.map(renderCommentItem).join('')
          : `<div class="home-comment-empty">No comments yet — be the first.</div>`;
        panel.dataset.loaded = '1';
      } else {
        delete panel.dataset.loaded;
      }
    });
  }

  // Mirrors a like toggle onto every other copy of the same post so the
  // Feed and Us never disagree about whether you've liked something.
  function syncLikeEverywhere(postId, liked, count, sourceBtn){
    document.querySelectorAll(`.home-like-btn[data-post-id="${postId}"]`).forEach(btn => {
      if (btn === sourceBtn) return;
      btn.classList.toggle('liked', liked);
      const countEl = btn.querySelector('.home-like-count');
      if (countEl) countEl.textContent = count;
    });
  }

  // Mirrors the "in Us" heart state onto every other copy of the same post
  // — e.g. removing something from Us should un-highlight it in the Feed
  // too, without waiting for a refresh.
  function syncUsButtonEverywhere(postId, inUs, memoryId, sourceBtn){
    const memRef = memoryByPostId[postId];
    const isMine = inUs && currentUser && memRef && memRef.added_by === currentUser.id;
    document.querySelectorAll(`.home-us-btn[data-post-id="${postId}"]`).forEach(btn => {
      if (btn === sourceBtn) return;
      btn.classList.toggle('in-us', inUs);
      btn.classList.toggle('mine', isMine);
      btn.dataset.memoryId = inUs ? memoryId : '';
      btn.title = !inUs ? 'Add to Us' : (isMine ? 'Remove from Us' : 'Already in Us');
    });
  }

  async function loadComments(postId){
    const [{ data: textRows }, { data: voiceRows }] = await Promise.all([
      supabaseClient.from('post_comments').select('id, user_id, content, created_at').eq('post_id', postId),
      supabaseClient.from('voice_comments').select('id, user_id, audio_url, duration_seconds, created_at').eq('post_id', postId)
    ]);
    const combined = [
      ...(textRows || []).map(c => ({ ...c, kind: 'text' })),
      ...(voiceRows || []).map(c => ({ ...c, kind: isVideoCommentPath(c.audio_url) ? 'video' : 'voice' }))
    ].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    if (combined.length === 0) return [];
    const userIds = [...new Set(combined.map(c => c.user_id))];
    const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });
    const withProfiles = combined.map(c => ({ ...c, profile: profileById[c.user_id] || null }));
    return await hydrateCommentMedia(withProfiles);
  }

  function renderCommentItem(c){
    const name = c.profile?.username || 'someone';
    const avatarHtml = c.profile?.avatar_url ? `<img src="${escapeHtml(c.profile.avatar_url)}" alt="">` : initials(name);
    const isOwnComment = currentUser && c.user_id === currentUser.id;
    const deleteBtn = isOwnComment
      ? `<button class="home-comment-delete" data-comment-id="${c.id}" data-comment-kind="${c.kind}">Delete</button>`
      : '';
    if (c.kind === 'video') {
      return `
        <div class="home-comment-item" data-comment-id="${c.id}">
          <div class="avatar">${avatarHtml}</div>
          <div style="flex:1;min-width:0;">
            <b style="font-family:var(--font-display);font-size:12.5px;font-weight:600;">${escapeHtml(name)}</b>
            <div class="home-vc" role="button" aria-label="Play video reply">
                <video src="${escapeHtml(c.audio_url)}#t=0.1" playsinline preload="metadata" disablepictureinpicture disableremoteplayback controlsList="nodownload noremoteplayback" oncontextmenu="return false;"></video>
                <span class="vc-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
                ${c.duration_seconds ? `<span class="vc-dur">${vrFmt(c.duration_seconds)}</span>` : ''}
              </div>
            <div class="home-comment-time">${timeAgo(c.created_at)}${deleteBtn}</div>
          </div>
        </div>
      `;
    }
    if (c.kind === 'voice') {
      const dur = c.duration_seconds ? `${Math.round(c.duration_seconds)}s` : '';
      return `
        <div class="home-comment-item" data-comment-id="${c.id}">
          <div class="avatar">${avatarHtml}</div>
          <div style="flex:1;min-width:0;">
            <div class="home-voice-bubble">
              <b>${escapeHtml(name)}</b> ${dur ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--grey);">· ${dur}</span>` : ''}
              <audio controls controlsList="nodownload noremoteplayback" oncontextmenu="return false;" src="${escapeHtml(c.audio_url)}"></audio>
            </div>
            <div class="home-comment-time">${timeAgo(c.created_at)}${deleteBtn}</div>
          </div>
        </div>

    return `
      <div class="home-comment-item" data-comment-id="${c.id}">
