<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Circle — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-2:#ffb199;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --nav-w:248px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --pub-up:#ff5a36;
    --pub-down:#7c8cff;
    --pub-bg:#f6f6f4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(98px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}
  img{display:block;max-width:100%;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  /* Modal Overlay & Styles */
  .modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,21,26,.4);
    display:flex;align-items:center;justify-content:center;z-index:1000;
    padding:16px;animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  
  .modal{
    background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(20,21,26,.3);
    padding:32px;max-width:420px;width:100%;animation:slideUp .3s var(--ease);
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  
  .modal h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:12px;}
  .modal p{color:var(--ink-soft);margin-bottom:20px;font-size:15px;line-height:1.5;}
  
  .circle-list-for-removal{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;max-height:300px;overflow-y:auto;}
  .circle-option{
    display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    background:#f7f7f8;border-radius:12px;transition:background .2s ease;
  }
  .circle-option:hover{background:#eaeaec;}
  .circle-option span{font-weight:500;color:var(--ink);}
  .remove-choice{
    padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;
    background:var(--danger);color:#fff;transition:background .2s ease;
  }
  .remove-choice:hover{background:#c9302c;}
  
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;}
  .btn-secondary{padding:10px 16px;border-radius:10px;font-weight:600;background:#f3f3f4;color:var(--ink);transition:background .2s ease;}
  .btn-secondary:hover{background:#eaeaec;}
  .btn-primary{padding:10px 16px;border-radius:10px;font-weight:600;background:var(--accent);color:#fff;transition:background .2s ease;}
  .btn-primary:hover{background:#e64a2a;}

  .app{display:flex;max-width:1180px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* =========================================================
     NAVIGATION — sidebar (desktop) / topbar + dock (mobile)
     ========================================================= */
  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.03em;
    display:inline-flex;align-items:baseline;line-height:1;
  }
  .wordmark .dot{color:var(--accent);display:inline-block;transition:transform .45s var(--ease-spring);}
  a.wordmark:hover .dot{transform:translateY(-3px) scale(1.3);}

  /* ---------- Mobile top bar ---------- */
  .topbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    height:58px;padding:0 14px;
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
    transition:box-shadow .25s ease;
  }
  .topbar.scrolled{box-shadow:0 8px 22px -14px rgba(20,21,26,.28);}
  .topbar-back{
    justify-self:start;display:inline-flex;align-items:center;gap:3px;
    height:34px;padding:0 13px 0 8px;border-radius:99px;
    font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink);
    background:#f3f3f4;-webkit-tap-highlight-color:transparent;
    transition:background .15s ease, transform .15s var(--ease-spring);
  }
  .topbar-back svg{width:17px;height:17px;stroke:currentColor;transition:transform .25s var(--ease);}
  .topbar-back:hover svg{transform:translateX(-2px);}
  .topbar-back:active{transform:scale(.94);background:#eaeaec;}

  /* ---------- Desktop sidebar ---------- */
  .sidebar{
    display:none;width:var(--nav-w);flex-shrink:0;padding:26px 16px 20px;
    flex-direction:column;height:100vh;height:100dvh;position:sticky;top:0;
  }
  .sidebar .brand{align-self:flex-start;font-size:26px;padding:6px 14px;margin-bottom:26px;border-radius:12px;}

  .nav-wrap{position:relative;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;}
  .nav-pill{
    position:absolute;left:0;right:0;top:0;height:46px;border-radius:14px;background:#f3f3f4;
    opacity:0;pointer-events:none;z-index:0;
    transition:transform .38s var(--ease-spring), height .2s var(--ease), opacity .2s ease;
  }
  .nav-pill.on{opacity:1;}
  .nav-pill.snap{transition:opacity .2s ease;}

  .nav-item{
    position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;
    border-radius:14px;font-family:var(--font-display);font-size:15.5px;font-weight:500;letter-spacing:-.005em;
    color:var(--ink-soft);
    transition:color .18s ease, background .18s ease, transform .15s var(--ease-spring);
  }
  .nav-item svg{
    width:22px;height:22px;flex-shrink:0;stroke:currentColor;
    transition:transform .35s var(--ease-spring), stroke .18s ease, fill .18s ease;
  }
  .nav-item:hover{color:var(--ink);}
  .nav-item:hover svg{transform:scale(1.12) rotate(-5deg);}
  .nav-item:active{transform:scale(.97);}
  .nav-item.active{color:var(--ink);font-weight:600;background:var(--accent-soft);}
  .nav-item.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);}
  .nav-item.active::before{
    content:'';position:absolute;left:-6px;top:50%;width:4px;height:20px;border-radius:0 4px 4px 0;
    background:var(--accent);transform:translateY(-50%);
    animation:navBar .45s var(--ease-spring) both;
  }
  @keyframes navBar{ from{transform:translateY(-50%) scaleY(.2);opacity:0;} to{transform:translateY(-50%) scaleY(1);opacity:1;} }
  .nav-item:focus-visible,.sidebar .brand:focus-visible,.nav-create:focus-visible,
  .sidebar-profile:focus-visible,.sidebar-signout:focus-visible,.sidebar-signin:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  .nav-create{
    position:relative;overflow:hidden;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;
    height:48px;border-radius:14px;color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:15px;
    background:linear-gradient(135deg,#ff7d59 0%,var(--accent) 55%,#f2431c 100%);
    box-shadow:0 10px 22px -8px rgba(255,90,54,.6), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .25s var(--ease-spring), box-shadow .25s ease;
  }
  .nav-create svg{width:19px;height:19px;stroke:#fff;transition:transform .4s var(--ease-spring);}
  .nav-create::after{
    content:'';position:absolute;inset:0;transform:translateX(-130%);
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);
    transition:transform .7s var(--ease);
  }
  .nav-create:hover{transform:translateY(-2px);box-shadow:0 16px 28px -8px rgba(255,90,54,.65), inset 0 1px 0 rgba(255,255,255,.3);}
  .nav-create:hover svg{transform:rotate(90deg);}
  .nav-create:hover::after{transform:translateX(130%);}
  .nav-create:active{transform:scale(.97);}

  .sidebar-auth{margin-top:auto;}
  .sidebar-user{
    display:flex;align-items:center;gap:4px;padding:8px;border-radius:18px;
    background:#fff;border:1px solid var(--line);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .sidebar-user:hover{border-color:var(--line-strong);box-shadow:0 8px 22px -14px rgba(20,21,26,.25);}
  .sidebar-profile{
    flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:3px 6px 3px 3px;border-radius:12px;
    transition:background .15s ease;
  }
  .sidebar-profile:hover{background:#f7f7f8;}
  .mini-avatar{
    width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:14px;overflow:hidden;
    box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent-soft);
  }
  .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .sidebar-profile .who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0;}
  .sidebar-profile .who span:first-child{font-family:var(--font-display);font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-profile .who span:last-child{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}
  .sidebar-signout{
    width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;color:var(--grey);
    transition:background .15s ease, color .15s ease, transform .15s var(--ease-spring);
  }
  .sidebar-signout svg{width:17px;height:17px;stroke:currentColor;}
  .sidebar-signout:hover{background:#fdeeed;color:var(--danger);}
  .sidebar-signout:active{transform:scale(.9);}
  .sidebar-signin{
    margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;
    background:var(--ink);color:#fff!important;border-radius:14px;
    font-family:var(--font-display);font-weight:600;font-size:14.5px;
    transition:background .16s ease, transform .2s var(--ease-spring);
  }
  .sidebar-signin:hover{background:#000;transform:translateY(-1px);}
  .sidebar-signin:active{transform:scale(.97);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    .topbar{display:none;}
    .sidebar{display:flex;}
  }

  /* ---------- Mobile floating dock ---------- */
  .bottom-nav{
    position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;height:64px;padding:0 6px;
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    border-radius:24px;z-index:30;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border:1px solid rgba(20,21,26,.06);
    box-shadow:0 14px 34px -10px rgba(20,21,26,.22), 0 2px 8px rgba(20,21,26,.05);
    transition:transform .45s var(--ease), opacity .3s ease;
    will-change:transform;
  }
  .bottom-nav.hidden,
  .bottom-nav.scroll-hide{transform:translateY(calc(100% + 32px));opacity:0;pointer-events:none;}
  .tab{
    position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.005em;
    -webkit-tap-highlight-color:transparent;
    transition:color .2s ease, transform .2s var(--ease-spring);
  }
  .tab-ico{
    width:48px;height:30px;border-radius:99px;display:grid;place-items:center;
    transition:background .25s ease;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;transition:transform .3s var(--ease-spring);}
  .tab:active svg{transform:scale(.82);}
  .tab.active{color:var(--ink);}
  .tab.active .tab-ico{background:var(--accent-soft);}
  .tab.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);animation:tabPop .5s var(--ease-spring);}
  @keyframes tabPop{ 0%{transform:scale(.7);} 100%{transform:scale(1);} }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:18px;}

  .tab-create{overflow:visible;}
  .tab-create .ring{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#ff7d59,var(--accent) 55%,#f2431c);
    transform:translateY(-14px);
    box-shadow:0 0 0 5px #fff, 0 12px 22px -4px rgba(255,90,54,.55), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .3s var(--ease-spring), box-shadow .3s ease;
  }
  .tab-create svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none;transition:transform .35s var(--ease-spring);}
  .tab-create:active .ring{transform:translateY(-12px) scale(.92);}
  .tab-create:active svg{transform:rotate(90deg);}
  .tab-create .tab-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  @media (min-width:900px){ .bottom-nav{display:none;} }

  @keyframes riseIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .mini-spinner{
    width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;flex-shrink:0;
  }

  .page-loading, .page-error{
    padding:80px 22px;text-align:center;
    font-family:var(--font-mono);font-size:12px;color:var(--grey);
  }
  .page-error h2{font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:8px;font-weight:700;}
  .page-error a{color:var(--accent);text-decoration:underline;}

  /* =========================================================
     LOADER — one bold mark, dead center, that lives and breathes.
     Design intent (this is a ~3s wait, not a game to play):
       - ONE focal shape, not a scene — a short wait wants a single
         strong beat, not something busy to parse (busy reads as
         cheap and is what made the old glasses annoying).
       - A squash-and-stretch "breathe" with spring overshoot, so it
         feels tactile and alive rather than a mechanical spin.
       - A slow warm hue drift — colour-shifting reads as faster and
         more likeable than a static/grey spinner.
       - A soft light burst timed to the peak of every breath: a
         small, honest payoff on a short loop, the same beat a
         satisfying tap or a Duolingo ding rides on — not a
         variable/randomised "slot machine" reward, on purpose.
     Pure CSS, one loop, no JS driving it.
     ========================================================= */
  .water-loader{
    padding:56px 22px 40px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:220px;
  }
  .wl-stage{
    position:relative;width:120px;height:120px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .wl-halo{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, rgba(255,90,54,0) 68%);
    opacity:.35;
    animation:wlHalo 1.15s cubic-bezier(.4,0,.2,1) infinite;
  }
  .wl-mark{
    position:relative;width:56px;height:56px;border-radius:20px;
    background:linear-gradient(135deg, #ff7a4a, var(--accent) 60%, #ff3d6e);
    background-size:200% 200%;
    box-shadow:0 8px 24px -6px rgba(255,90,54,.55);
    animation:wlBreathe 1.15s var(--ease-spring) infinite,
              wlHue 3.45s ease-in-out infinite;
  }
  @keyframes wlBreathe{
    0%,100%{ transform:scale(1); border-radius:20px; }
    38%{ transform:scale(1.22); border-radius:32px; }
    55%{ transform:scale(.94); border-radius:16px; }
    72%{ transform:scale(1.04); border-radius:20px; }
  }
  @keyframes wlHalo{
    0%,100%{ transform:scale(.72); opacity:.28; }
    38%{ transform:scale(1.35); opacity:.5; }
    100%{ transform:scale(.72); opacity:.28; }
  }
  @keyframes wlHue{
    0%,100%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
  }

  .wl-spark{
    position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin:-3px 0 0 -3px;opacity:0;
    animation:wlSpark 1.15s cubic-bezier(.2,.8,.3,1) infinite;
  }
  .wl-spark:nth-child(1){ --a:-90deg; animation-delay:.02s; }
  .wl-spark:nth-child(2){ --a:-30deg; animation-delay:.05s; }
  .wl-spark:nth-child(3){ --a:30deg;  animation-delay:.01s; }
  .wl-spark:nth-child(4){ --a:90deg;  animation-delay:.06s; }
  .wl-spark:nth-child(5){ --a:150deg; animation-delay:.03s; }
  .wl-spark:nth-child(6){ --a:-150deg;animation-delay:.04s; }
  @keyframes wlSpark{
    0%,32%{ transform:rotate(var(--a)) translateX(0) scale(0); opacity:0; }
    46%{ transform:rotate(var(--a)) translateX(46px) scale(1); opacity:1; }
    68%,100%{ transform:rotate(var(--a)) translateX(64px) scale(0); opacity:0; }
  }

  .wl-label{
    font-family:var(--font-mono);font-size:12px;color:var(--grey);letter-spacing:.02em;
    display:flex;align-items:center;gap:2px;justify-content:center;
  }
  .wl-label .wl-dot{ animation:wlDot 1.15s ease-in-out infinite; }
  .wl-label .wl-dot:nth-child(2){ animation-delay:.15s; }
  .wl-label .wl-dot:nth-child(3){ animation-delay:.3s; }
  @keyframes wlDot{ 0%,60%,100%{ opacity:.25; } 30%{ opacity:1; } }

  @media (prefers-reduced-motion:reduce){
    .wl-mark, .wl-halo, .wl-spark, .wl-label .wl-dot{ animation:none !important; }
    .wl-spark{ display:none; }
  }

  .home-hero{
    padding:30px 22px 20px;
    background:linear-gradient(180deg, var(--accent-soft), rgba(255,241,236,0) 70%);
    border-bottom:1px solid var(--line);
  }
  .home-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .home-hero h1{
    font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-0.01em;
  }
  .home-hero .home-sub{
    font-family:var(--font-serif);font-size:14px;color:var(--ink-soft);margin-top:5px;
  }
  .home-settings-btn{
    flex-shrink:0;width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line-strong);
    transition:border-color .15s ease, transform .1s ease;
  }
  .home-settings-btn:hover{border-color:var(--accent);}
  .home-settings-btn:active{transform:scale(.94);}
  .home-settings-btn:disabled{opacity:.35;cursor:default;}

  #homeAnonToggle{background:#1a1b1f;}
    #homeAnonToggle:hover{background:#000;}
    #homeAnonToggle.active{background:#000;box-shadow:inset 0 0 0 2px #555;}
  /* voice is dimmed (but still tappable, so it can explain why) while anonymous */
  #homeVoiceBtn.voice-locked{opacity:.4;}


  .home-post-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:9px 18px;border-radius:99px;transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .home-post-btn:hover:not(:disabled){background:#000;}
  .home-post-btn:active:not(:disabled){transform:scale(.96);}
  .home-post-btn:disabled{opacity:.5;cursor:default;}

  .home-composer{
    max-height:600px;
    transition:max-height .32s var(--ease), opacity .22s var(--ease), transform .28s var(--ease),
              margin .32s var(--ease), padding .32s var(--ease), border-color .32s var(--ease);
    overflow:hidden;
  }
  /* Collapse-on-scroll + FAB is a phone-only space-saving pattern.
     Below 900px only: composer tucks away on scroll, a FAB brings it back. */
  @media (max-width:899.98px){
    .home-composer.collapsed{
      max-height:0;
      opacity:0;
      transform:translateY(-8px);
      margin-top:0;
      padding-top:0;
      padding-bottom:0;
      border-color:transparent;
      pointer-events:none;
    }
    .home-composer.overlay{
      position:fixed;
      left:50%;
      top:78px;
      transform:translate(-50%,-14px);
      width:calc(100% - 44px);
      max-width:520px;
      z-index:50;
      box-shadow:0 22px 50px rgba(20,21,26,.2);
      opacity:0;
      pointer-events:none;
    }
    .home-composer.overlay.overlay-open{
      opacity:1;
      transform:translate(-50%,0);
      pointer-events:auto;
    }
  }
  /* Desktop: the composer never hides. It stays pinned in view while you
     scroll the feed, so posting never requires scrolling back up or a refresh. */
  @media (min-width:900px){
    .home-composer{
      position:sticky;
      top:20px;
      z-index:15;
    }
    .home-composer.collapsed{
      max-height:600px;
      opacity:1;
      transform:none;
      pointer-events:auto;
    }
    .home-fab{ display:none; }
  }

  .home-fab{

  .home-fab:hover{ background:#000; }
  .home-fab:active{ transform:scale(.9); }
  .home-fab svg{ width:22px;height:22px;stroke:#fff; }
  @media (min-width:900px){ .home-fab{ bottom:34px; } }

  .home-feed{padding:20px 22px 30px;display:flex;flex-direction:column;gap:16px;}

  .home-empty{

  @keyframes emptyOrbPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
  @keyframes emptyRingExpand{ 0%{transform:scale(.85);opacity:.55;} 100%{transform:scale(1.5);opacity:0;} }

  .home-empty h3{

  .home-empty p{

  .home-empty-cta{
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:12px 24px;border-radius:100px;

  .home-post-card{

  /* WHISPER CARD — a post that was shared "for the backbench only"
     doesn't look like every other post. It reads as held, not shouted:
     dim, blurred until someone actually leans in and taps it open. */
  .home-post-card.whisper{
    background:linear-gradient(165deg,#1a1b1f,#111214);border-color:#26272c;
  }
  .home-post-card.whisper .home-post-head .who b{color:#d6d7db;}
  .home-post-card.whisper .home-post-head .who span{color:#7d7f86;}
  .home-post-card.whisper .home-post-text{color:#eceded;}
  .home-post-card.whisper .home-post-actions{border-top-color:#26272c;}
  .home-post-card.whisper .home-action-btn{color:#9a9ca3;}
  .home-post-card.whisper .home-action-btn svg{stroke:#9a9ca3;}
  .home-post-card.whisper .home-comments{border-top-color:#26272c;}
  .home-post-card.whisper .home-comment-input{background:#1e1f24;border-color:#2e2f35;color:#eee;}
  .home-post-card.whisper:not(.revealed) .home-post-text,
  .home-post-card.whisper:not(.revealed) .home-post-media{

  .home-post-card.whisper:not(.revealed) .home-post-body{cursor:pointer;}
  .whisper-hint{

  }
  .home-post-card.whisper:not(.revealed) .whisper-hint{display:flex;}
  .whisper-hint svg{width:13px;height:13px;stroke:#8a8d94;flex-shrink:0;}
  .home-post-card.whisper.revealed .home-post-text,
  .home-post-card.whisper.revealed .home-post-media{filter:none;}

  .home-post-head .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-post-head .who{display:flex;flex-direction:column;line-height:1.25;}
  .home-post-head .who b{font-family:var(--font-display);font-size:13.5px;font-weight:600;}

  .home-hero .home-eyebrow{

  .home-action-btn:hover svg{stroke:var(--ink);}
  .home-action-btn.liked{color:var(--accent);}

  @keyframes likePop{ 0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);} }

  /* ============================================================
     LIKE BUTTON — universe.io-style heart: fill-in, bounce, a
     checkmark-draw confirmation ring, and a hover tooltip that
     flips the like count from old → new. Scoped to fit inline
     in the post action row rather than a standalone pill button.
  ============================================================ */
  .li-trigger{
    --li-cl:var(--accent);--li-bg:#fff;--li-sz:19px;
    position:relative;
  }
  .li-heart-wrap{position:relative;width:var(--li-sz);height:var(--li-sz);display:flex;align-items:center;justify-content:center;}
  .li-heart-wrap .li-heart{
    width:var(--li-sz);height:var(--li-sz);color:var(--ink-soft);
    transition:transform .15s ease, color .15s ease;
  }
  .li-trigger .li-heart-wrap .li-heart path{fill:currentColor;}
  .li-heart-wrap .li-heart .li-fill{opacity:0;transition:opacity .2s ease;}
  .li-trigger.liked .li-heart-wrap .li-heart{color:var(--li-cl);}
  .li-trigger.liked .li-heart-wrap .li-heart .li-fill{opacity:.35;}

  .li-trigger .li-heart-wrap .li-burst{
    position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--li-cl);opacity:0;pointer-events:none;
    transform:scale(.4);
  }
  .li-trigger.just-liked .li-heart-wrap .li-burst{
    animation:liBurst .5s ease-out forwards;
  }
  @keyframes liBurst{
    0%{opacity:.85;transform:scale(.4);}
    100%{opacity:0;transform:scale(1.9);}
  }

  .home-comments{
    display:none;padding:2px 16px 16px;border-top:1px solid var(--line);
  }
  .home-comments.open{display:block;animation:riseIn .25s var(--ease) forwards;}
  .home-comment-list{display:flex;flex-direction:column;gap:12px;margin:14px 0 12px;}
  .home-comment-item{display:flex;gap:9px;}
  .home-comment-item .avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:10px;overflow:hidden;
  }
  .home-comment-item .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-comment-bubble{background:#f7f7f8;border-radius:14px;padding:8px 13px;flex:1;min-width:0;}
  .home-comment-bubble b{font-family:var(--font-display);font-size:12.5px;font-weight:600;}
  .home-comment-bubble p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink);margin-top:2px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .home-comment-time{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9px;color:var(--grey);margin-top:4px;margin-left:2px;}
  .home-comment-delete{font-family:var(--font-mono);font-size:9px;color:var(--grey);text-decoration:underline;}
  .home-comment-delete:hover{color:var(--danger);}
  .home-comment-empty{font-family:var(--font-mono);font-size:11px;color:var(--grey);text-align:center;padding:8px 0 14px;}
  .home-comment-input-row{display:flex;gap:8px;align-items:center;}
  /* One-time reassurance shown to a freshly-invited member right above the
     reply box on the specific post they were invited to see — the exact
     spot where "wait, who can see this?" hesitation shows up. */
  .invite-reply-nudge{
    display:flex;align-items:center;gap:7px;margin:0 0 10px;padding:8px 12px;
    background:var(--accent-soft);border-radius:12px;

    animation:tipFade .3s ease-out;
  }
  .invite-reply-nudge svg{width:13px;height:13px;stroke:var(--accent);flex-shrink:0;}
  .home-comment-input{
    flex:1;border:1px solid var(--line-strong);border-radius:99px;
    padding:9px 15px;font-family:var(--font-serif);font-size:13.5px;outline:none;
    transition:border-color .15s ease;
  }
  .home-comment-input:focus{border-color:var(--accent);}
  .home-comment-send{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;

  }
  .home-comment-send:hover:not(:disabled){background:#000;}
  .home-comment-send:active:not(:disabled){transform:scale(.92);}
  .home-comment-send:disabled{opacity:.4;}
  .home-comment-send svg{width:14px;height:14px;stroke:#fff;}

  .home-comment-mic{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .home-comment-mic:hover{background:#ffe4d8;}
  .home-comment-mic:active{transform:scale(.92);}
  .home-comment-mic svg{width:16px;height:16px;stroke:#c24020;}
  .home-comment-mic.recording{background:var(--danger);animation:micPulse 1.1s ease-in-out infinite;}
  .home-comment-mic.recording svg{stroke:#fff;}
  @keyframes micPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(224,67,63,.4);} 50%{box-shadow:0 0 0 8px rgba(224,67,63,0);} }
  .home-comment-rec-timer{
    font-family:var(--font-mono);font-size:11px;color:var(--danger);flex-shrink:0;min-width:32px;
  }

  /* Hold-to-talk: press a post to record a voice reply, tap to open the thread */
  .home-post-body{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  .home-post-body.holding-talk{background:rgba(224,67,63,.05);}
  .home-post-body.holding-talk::after{
    content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(224,67,63,.35);animation:holdRing 1s ease-out infinite;
  }
  @keyframes holdRing{
    0%{box-shadow:0 0 0 0 rgba(224,67,63,.35);}
    100%{box-shadow:0 0 0 14px rgba(224,67,63,0);}
  }
  .hold-record-indicator{
    display:flex;position:absolute;left:50%;bottom:10px;transform:translateX(-50%) scale(.85);
    align-items:center;gap:7px;background:var(--danger);color:#fff;border-radius:99px;
    padding:6px 14px;font-family:var(--font-mono);font-size:11px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;z-index:3;
    opacity:0;visibility:hidden;
    transition:opacity .14s ease, transform .14s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .14s;
  }
  .hold-record-indicator.show{
    opacity:1;visibility:visible;transform:translateX(-50%) scale(1);
    transition:opacity .1s ease, transform .1s cubic-bezier(.34,1.56,.64,1), visibility 0s;
  }
  .hri-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:hriBlink 1s ease-in-out infinite;}
  @keyframes hriBlink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .hold-onboarding-tip{

  }
  .hold-onboarding-tip span:last-child{

    border-radius:99px;padding:5px 12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);

  @keyframes tipBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(5px);} }
  @keyframes tipFade{ from{opacity:0;} to{opacity:1;} }
  .home-voice-bubble{
    background:#f7f7f8;border-radius:14px;padding:8px 13px;flex:1;min-width:0;
  }
  .home-voice-bubble b{font-family:var(--font-display);font-size:12.5px;font-weight:600;}

  /* ============================================================
     PUBLIC CIRCLE
     Every public circle gets its own colour, derived from its id.
     --h (hue) and --l (lightness of the on-white colour) are set
     inline on .pc by renderPublicMode().
  ============================================================ */
  .pc{
    --c:hsl(var(--h) 85% 64%);
    --cs:hsl(var(--h) 72% var(--l));
    --cs-soft:hsl(var(--h) 90% 96%);
    --cs-mid:hsl(var(--h) 65% 86%);
    --topbar-h:0px;
    background:#fff;
  }
  @media (max-width:899.98px){ .pc{ --topbar-h:58px; } }
  .pc :focus-visible{outline:2px solid var(--cs);outline-offset:2px;border-radius:8px;}
  .pc button:disabled{cursor:default;}

  .pc-av{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:var(--s,40px);height:var(--s,40px);border-radius:50%;overflow:hidden;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:calc(var(--s,40px) * .4);
  }
  .pc-av img{width:100%;height:100%;object-fit:cover;}
  .pc-av svg{width:58%;height:58%;}
  .pc-av.anon{background:var(--ink);}

  /* ---------- cover ---------- */
  .pc-cover{
    container-type:inline-size;
    position:relative;overflow:hidden;color:#fff;min-height:300px;
    padding:20px 22px 26px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:
      radial-gradient(80% 120% at 80% 35%, hsl(var(--h) 60% 26%) 0%, transparent 65%),
      hsl(var(--h) 48% 12%);
  }
  .pc-tag{
    position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    font-family:var(--font-display);font-weight:500;font-size:13px;color:rgba(255,255,255,.7);
  }
  .pc-tag svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .pc-cover-main{position:relative;z-index:2;max-width:min(56%,460px);margin-top:28px;}
  .pc-name{
    font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5vw,46px);
    line-height:1.02;letter-spacing:-.035em;overflow-wrap:anywhere;
  }
  .pc-desc{
    font-family:var(--font-serif);font-size:16px;line-height:1.5;color:rgba(255,255,255,.78);
    margin-top:10px;max-width:38ch;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .pc-cover-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px 14px;margin-top:20px;}
  .pc-join{
    display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 24px;border-radius:99px;
    background:#fff;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:14px;
    transition:transform .12s var(--ease), background .15s ease;
  }
  .pc-join:hover{background:hsl(var(--h) 100% 96%);}
  .pc-join:active{transform:scale(.96);}
  .pc-join svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .pc-join.joined{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);cursor:default;}
  .pc-join.joined:hover{background:transparent;}
  .pc-icon-btn{
    width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.3);color:#fff;transition:background .15s ease, transform .12s var(--ease);
  }
  .pc-icon-btn:hover{background:rgba(255,255,255,.1);}
  .pc-icon-btn:active{transform:scale(.94);}
  .pc-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pc-cover :focus-visible{outline-color:#fff;}
  .pc-stats{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;font-family:var(--font-display);font-size:13.5px;color:rgba(255,255,255,.72);}
  .pc-stats b{color:#fff;font-weight:700;}
  .pc-pulse{display:inline-flex;align-items:center;gap:7px;}
  .pc-pulse i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px hsla(var(--h),90%,64%,.25);}
  .pc-pulse:empty{display:none;}

  .pc-spin{
    width:14px;height:14px;border-radius:50%;border:2px solid rgba(20,21,26,.2);border-top-color:var(--ink);
    animation:spin .7s linear infinite;flex-shrink:0;
  }

  /* orbit: members sit on rings around the circle's core, founders on the inside */
  .pc-orbit{
    --u:1;
    --D:calc(300px * var(--u));
    position:absolute;z-index:1;top:50%;right:28px;width:var(--D);height:var(--D);
    transform:translateY(-50%);pointer-events:none;
  }
  .pc-ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid hsla(var(--h),90%,78%,.24);}
  .pc-ring.r1{width:34%;height:34%;}
  .pc-ring.r2{width:62%;height:62%;border-color:hsla(var(--h),90%,78%,.18);}
  .pc-ring.r3{width:88%;height:88%;border-color:hsla(var(--h),90%,78%,.13);}
  .pc-ring.r4{width:124%;height:124%;border-color:hsla(var(--h),90%,78%,.08);}
  .pc-core{
    position:absolute;left:50%;top:50%;width:calc(34px * var(--u));height:calc(34px * var(--u));
    transform:translate(-50%,-50%);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:hsla(var(--h),90%,64%,.16);box-shadow:0 0 70px 26px hsla(var(--h),90%,60%,.28);
  }
  .pc-core svg{width:60%;height:60%;stroke:var(--c);fill:none;stroke-width:2;}
  .pc-orb{
    position:absolute;width:calc(var(--s) * var(--u) * 1px);height:calc(var(--s) * var(--u) * 1px);
    margin:calc(var(--s) * var(--u) * -.5px) 0 0 calc(var(--s) * var(--u) * -.5px);
    font-size:calc(var(--s) * var(--u) * .4px);
    box-shadow:0 0 0 2px hsl(var(--h) 48% 12%), 0 8px 18px rgba(0,0,0,.35);
    pointer-events:auto;animation:pcPop .5s var(--ease-spring) both;animation-delay:var(--d);
  }
  .pc-orb.me{box-shadow:0 0 0 2px #fff, 0 8px 18px rgba(0,0,0,.35);}
  .pc-orb.slot{
    background:transparent;border:1.5px dashed rgba(255,255,255,.55);color:#fff;box-shadow:none;cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .pc-orb.slot:hover{background:rgba(255,255,255,.14);border-color:#fff;}
  .pc-orb.slot svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}
  .pc-orb.more{background:rgba(255,255,255,.14);font-family:var(--font-display);font-weight:600;}
  @keyframes pcPop{ from{transform:scale(.3);opacity:0;} to{transform:scale(1);opacity:1;} }

  @container (max-width:759px){
    .pc-orbit{--u:.82;right:calc(var(--D) * -.16);}
    .pc-cover-main{max-width:52%;}
  }
  @container (max-width:519px){
    .pc-orbit{--u:.78;right:calc(var(--D) * -.5);}
    .pc-cover-main{max-width:calc(100% - 120px);}
    .pc-desc{-webkit-line-clamp:2;font-size:15px;}
  }

  /* ---------- body ---------- */
  .pc-body{container:pcb / inline-size;display:flex;gap:40px;align-items:flex-start;padding:0 22px 64px;}
  .pc-col{flex:1;min-width:0;max-width:640px;}
  .pc-rail{
    width:250px;flex-shrink:0;position:sticky;top:20px;padding-top:24px;
    display:flex;flex-direction:column;gap:30px;
  }
  @container pcb (max-width:800px){ .pc-rail{display:none;} }

  .pc-rail h2{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:10px;}
  .pc-rail p{font-family:var(--font-serif);font-size:15px;line-height:1.55;color:var(--ink-soft);}
  .pc-rail .since{font-family:var(--font-display);font-size:12.5px;color:var(--grey);margin-top:8px;}
  .pc-rail h2 .cnt{font-weight:500;color:var(--grey);margin-left:4px;}
  .pc-person{display:flex;align-items:center;gap:10px;padding:5px 0;font-family:var(--font-display);font-size:14px;font-weight:500;}
  .pc-person span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .pc-person em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--cs);background:var(--cs-soft);padding:2px 8px;border-radius:99px;flex-shrink:0;}
  .pc-people-more{margin-top:6px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--cs);padding:4px 0;}
  .pc-people-more:hover{text-decoration:underline;}

  /* ---------- composer ---------- */
  .pc-compose{display:flex;gap:12px;padding:20px 0 18px;border-bottom:1px solid var(--line);}
  .pc-compose-main{flex:1;min-width:0;}
  .pc-compose-ph{
    display:block;width:100%;text-align:left;min-height:40px;
    font-family:var(--font-serif);font-size:18px;color:var(--grey);
  }
  .pc-compose-ph:hover{color:var(--ink-soft);}
  .pc-compose-panel{display:none;}
  .pc-compose.open .pc-compose-ph{display:none;}
  .pc-compose.open .pc-compose-panel{display:block;}
  .pc-compose textarea{
    display:block;width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:var(--font-serif);font-size:18px;line-height:1.55;color:var(--ink);
    min-height:84px;max-height:280px;padding:8px 0 4px;
  }
  .pc-compose textarea::placeholder{color:var(--grey);}
  .pc-media-field[hidden]{display:none;}
  .pc-media-field{margin-top:6px;}
  .pc-media-field input{
    width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;outline:none;
    font-family:var(--font-display);font-size:13.5px;color:var(--ink);background:#fff;
  }
  .pc-media-field input:focus{border-color:var(--cs);}
  .pc-media-preview{margin-top:10px;border-radius:14px;overflow:hidden;background:#f2f2f0;}
  .pc-media-preview:empty{display:none;}
  .pc-media-preview img,.pc-media-preview video{width:100%;max-height:300px;object-fit:cover;}
  .pc-hint{font-family:var(--font-display);font-size:13px;color:var(--grey);padding:12px 14px;}
  .pc-compose-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .pc-spacer{flex:1;}
  .pc-tool,.pc-anon{
    display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:99px;
    font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-soft);
    background:#f5f5f3;transition:background .15s ease, color .15s ease;
  }
  .pc-tool{width:36px;padding:0;justify-content:center;}
  .pc-tool:hover,.pc-anon:hover{background:#ececea;color:var(--ink);}
  .pc-tool.on{background:var(--cs-soft);color:var(--cs);}
  .pc-anon[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .pc-tool svg,.pc-anon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pc-post-go{
    height:36px;padding:0 22px;border-radius:99px;background:var(--cs);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;min-width:76px;
    transition:opacity .15s ease, transform .12s var(--ease);
  }
  .pc-post-go:disabled{opacity:.35;}
  .pc-post-go:active:not(:disabled){transform:scale(.96);}
  .pc-post-go .mini-spinner{width:14px;height:14px;}

  .pc-join-prompt{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:18px 0;border-bottom:1px solid var(--line);
    font-family:var(--font-serif);font-size:15.5px;color:var(--ink-soft);line-height:1.45;
  }
  .pc-join-prompt button{
    height:36px;padding:0 18px;border-radius:99px;background:var(--cs);color:#fff;flex-shrink:0;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;
  }

  /* ---------- sort bar ---------- */
  .pc-bar{
    position:sticky;top:var(--topbar-h);z-index:15;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 -16px;padding:12px 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .pc-seg{position:relative;display:inline-flex;padding:3px;background:#f2f2f0;border-radius:99px;}
  .pc-seg button{
    position:relative;z-index:1;height:32px;padding:0 16px;border-radius:99px;
    font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink-soft);
    transition:color .2s ease;
  }
  .pc-seg button[aria-selected="true"]{color:var(--ink);}
  .pc-seg-thumb{
    position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:99px;background:#fff;
    box-shadow:0 1px 3px rgba(20,21,26,.14);
  }
  .pc-seg.ready .pc-seg-thumb{transition:transform .3s var(--ease), width .3s var(--ease);}
  .pc-new{
    height:32px;padding:0 14px;border-radius:99px;background:var(--cs);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:13px;
    display:none;align-items:center;gap:6px;
  }
  .pc-new.show{display:inline-flex;animation:pcDrop .3s var(--ease-spring);}
  .pc-new svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes pcDrop{ from{transform:translateY(-8px);opacity:0;} to{transform:none;opacity:1;} }
  @media (max-width:899.98px){ .pc-bar{margin:0 -22px;padding:12px 22px;} }

  /* ---------- feed ---------- */
  .pc-feed{transition:opacity .2s ease;}
  .pc-feed.is-loading{opacity:.4;pointer-events:none;}
  .pc-post{display:flex;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--line);}
  .pc-post-main{flex:1;min-width:0;}
  .pc-head{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);min-height:20px;}
  .pc-head b{font-weight:600;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .pc-head b.anon{color:var(--ink-soft);font-weight:500;}
  .pc-head time{font-size:13px;color:var(--grey);flex-shrink:0;}
  .pc-you{font-size:11.5px;font-weight:600;color:var(--grey);border:1px solid var(--line-strong);border-radius:99px;padding:0 7px;flex-shrink:0;}
  .pc-text{
    font-family:var(--font-serif);font-size:17.5px;line-height:1.6;color:var(--ink);margin-top:4px;
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .pc-text.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;}
  .pc-more{margin-top:4px;font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--cs);}
  .pc-more:hover{text-decoration:underline;}
  .pc-media{margin-top:12px;border-radius:16px;overflow:hidden;background:#f2f2f0;}
  .pc-media img,.pc-media video{width:100%;max-height:480px;object-fit:cover;}
  .pc-media audio{width:100%;}
  .pc-media.broken{display:none;}

  .pc-foot{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .pc-vote{display:inline-flex;align-items:center;border-radius:99px;background:#f5f5f3;}
  .pc-v{
    position:relative;width:36px;height:34px;display:flex;align-items:center;justify-content:center;
    border-radius:99px;color:var(--grey);transition:color .15s ease, background .15s ease, transform .1s ease;
  }
  .pc-v:hover{color:var(--ink);background:#ececea;}
  .pc-v:active{transform:scale(.88);}
  .pc-v svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .pc-v.up.on{color:var(--cs);}
  .pc-v.down.on{color:#6470f0;}
  .pc-v.on svg{stroke-width:3.2;}
  .pc-v.up.burst::after{
    content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid var(--cs);
    animation:pcBurst .5s var(--ease) forwards;pointer-events:none;
  }
  @keyframes pcBurst{ from{opacity:.9;transform:scale(.5);} to{opacity:0;transform:scale(1.8);} }
  .pc-score{
    min-width:24px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:14px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .pc-score.pos{color:var(--cs);}
  .pc-score.neg{color:#6470f0;}
  .pc-score.bump{animation:pcBump .32s var(--ease-spring);}
  @keyframes pcBump{ 40%{transform:scale(1.35);} }
  .pc-cbtn{
    display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 12px;border-radius:99px;
    background:#f5f5f3;color:var(--ink-soft);font-family:var(--font-display);font-weight:600;font-size:13.5px;
    transition:background .15s ease, color .15s ease;
  }
  .pc-cbtn:hover{background:#ececea;color:var(--ink);}
  .pc-post.open .pc-cbtn{background:var(--cs-soft);color:var(--cs);}
  .pc-cbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .pc-del{
    margin-left:auto;display:inline-flex;align-items:center;height:34px;padding:0 10px;border-radius:99px;
    color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:13px;transition:color .15s ease, background .15s ease;
  }
  .pc-del:hover{color:var(--danger);}
  .pc-del.armed{color:#fff;background:var(--danger);}
  .pc-del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  .pc-post.spot{
    background:var(--cs-soft);margin:16px -16px 0;padding:20px 16px 16px;border-radius:20px;border-bottom:none;
  }
  .pc-post.spot .pc-text{font-size:21px;line-height:1.5;}
  @media (max-width:520px){ .pc-post.spot .pc-text{font-size:19px;} }
  .pc-post.spot .pc-vote,.pc-post.spot .pc-cbtn{background:#fff;}
  .pc-spot-label{
    display:flex;align-items:center;gap:6px;margin-bottom:8px;
    font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--cs);
  }
  .pc-spot-label svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .pc-post.spot + .pc-post{border-top:none;}

  /* replies open inline, under the post they belong to */
  .pc-thread{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease);}
  .pc-post.open .pc-thread{grid-template-rows:1fr;}
  .pc-thread-clip{overflow:hidden;min-height:0;}
  .pc-thread-in{margin-top:14px;padding-left:14px;border-left:2px solid var(--cs-mid);}
  .pc-c{display:flex;gap:10px;padding:8px 0;}
  .pc-c-main{flex:1;min-width:0;}
  .pc-c-head{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);}
  .pc-c-head b{font-weight:600;font-size:14px;}
  .pc-c-head time{font-size:12.5px;color:var(--grey);}
  .pc-c-del{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--grey);margin-left:auto;}
  .pc-c-del:hover{color:var(--danger);}
  .pc-c-del.armed{color:var(--danger);}
  .pc-c p{font-family:var(--font-serif);font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px;}
  .pc-c audio{width:100%;height:34px;margin-top:6px;}
  .pc-c-empty,.pc-c-loading{font-family:var(--font-serif);font-size:15px;color:var(--grey);padding:6px 0;}
  .pc-cform{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
  .pc-cinput{
    flex:1;min-width:0;height:40px;border-radius:99px;border:1px solid transparent;background:#f5f5f3;padding:0 16px;outline:none;
    font-family:var(--font-serif);font-size:16px;color:var(--ink);
  }
  .pc-cinput:focus{background:#fff;border-color:var(--cs);}
  .pc-csend{
    height:40px;padding:0 18px;border-radius:99px;background:var(--cs);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;transition:opacity .15s ease;
  }
  .pc-csend:disabled{opacity:.35;}
  .pc-cjoin{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--cs);padding:8px 0;}
  .pc-cjoin:hover{text-decoration:underline;}

  .pc-empty{padding:64px 12px;text-align:center;}
  .pc-empty h3{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em;}
  .pc-empty p{font-family:var(--font-serif);font-size:16px;line-height:1.5;color:var(--ink-soft);max-width:34ch;margin:8px auto 18px;}
  .pc-empty button{height:40px;padding:0 22px;border-radius:99px;background:var(--cs);color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;}

  .pc-sk{display:flex;gap:12px;padding:20px 0;border-bottom:1px solid var(--line);}
  .pc-sk .a,.pc-sk .l{background:linear-gradient(90deg,#f1f1ef 0%,#f8f8f6 50%,#f1f1ef 100%);background-size:200% 100%;animation:pcShimmer 1.3s linear infinite;}
  .pc-sk .a{width:40px;height:40px;border-radius:50%;flex-shrink:0;}
  .pc-sk .l{height:13px;border-radius:7px;margin-top:8px;}
  @keyframes pcShimmer{ to{background-position:-200% 0;} }

  .locked-notice{
    display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:#c24020;
    font-family:var(--font-mono);font-size:11.5px;padding:12px 14px;border-radius:12px;margin-bottom:2px;
  }

  .prompt-pin-question{font-family:var(--font-serif);font-size:16px;line-height:1.4;color:var(--ink);margin-bottom:12px;}
  .prompt-pin-answer{
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;
    padding:9px 16px;border-radius:99px;transition:background .15s ease, transform .15s var(--ease-spring);
  }
  .prompt-pin-answer:hover{background:#000;}
  .prompt-pin-answer:active{transform:scale(.96);}
  /* ---- Golden Hour — dramatic blurred reveal card ----
     The question arrives blurred behind glass; tapping "reveal" clears the
     blur with a pop + camera-flash so opening it actually feels like a
     moment, instead of just reading pre-rendered text. Lives at the very
     top of the main feed now — the first thing you see, not something
     buried in a tab. */
  .gh-reveal{
    position:relative;margin:0 0 18px;padding:30px 22px 26px;border-radius:24px;
    overflow:hidden;text-align:center;isolation:isolate;
    background:linear-gradient(150deg,#15100c 0%,#2b1c12 45%,#1c130e 78%,#100b08 100%);
    border:1px solid rgba(255,196,120,.28);
    box-shadow:0 30px 60px -22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    animation:ghRevealIn .55s var(--ease-spring) both;
  }
  @keyframes ghRevealIn{from{opacity:0;transform:translateY(-10px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  /* slow drifting gold shimmer around the border, so the card never sits
     fully still — reads as "something is happening here" at a glance */
  .gh-reveal::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:0;pointer-events:none;
    background:conic-gradient(from var(--gh-a,0deg), transparent 0 20%, rgba(255,196,120,.9) 30%, transparent 45%, rgba(255,90,54,.55) 65%, transparent 80%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:ghBorderSpin 6s linear infinite;
  }
  @keyframes ghBorderSpin{to{--gh-a:360deg;}}
  @property --gh-a{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .gh-reveal-glow{
    position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:260px;height:260px;
    border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle, rgba(255,177,90,.5), rgba(255,90,54,.18) 55%, transparent 75%);
    animation:ghGlowPulse 3.2s ease-in-out infinite;
  }
  @keyframes ghGlowPulse{0%,100%{opacity:.6;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.22);}}
  .gh-reveal-eyebrow{
    position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;justify-content:center;
    font-family:var(--font-mono);font-size:11px;color:#ffcf9e;text-transform:uppercase;
    letter-spacing:.12em;margin-bottom:18px;width:100%;
  }
  .gh-reveal-eyebrow .gh-dot.live{background:#ff9a4d;box-shadow:0 0 0 0 rgba(255,154,77,.55);animation:ghPulse 1.6s ease-out infinite;}
  .gh-reveal-stage{position:relative;z-index:1;min-height:78px;display:flex;align-items:center;justify-content:center;padding:0 6px;}
  .gh-reveal-blur{
    font-family:var(--font-serif);font-size:19px;line-height:1.5;color:#fff;
    filter:blur(11px);opacity:.5;user-select:none;transform:scale(.95);
    transition:filter .9s var(--ease), opacity .9s var(--ease), transform .9s var(--ease-spring);
  }
  .gh-reveal.revealed .gh-reveal-blur{
    filter:blur(0);opacity:1;transform:scale(1);
    animation:ghRevealPop .6s var(--ease-spring);
  }
  @keyframes ghRevealPop{0%{transform:scale(.88);}55%{transform:scale(1.05);}100%{transform:scale(1);}}
  /* Locked badge — replaces the old tap-to-reveal button. Not clickable;
     it just tells you when the blur will lift on its own. */
  .gh-reveal-lock{
    position:absolute;z-index:2;display:inline-flex;align-items:center;gap:8px;
    padding:12px 22px;border-radius:99px;color:#fff;pointer-events:none;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.34);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:.01em;
    animation:ghTapFloat 2.2s ease-in-out infinite;
  }
  @keyframes ghTapFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .gh-reveal.revealed .gh-reveal-lock{display:none;}
  .gh-reveal-from{
    position:relative;z-index:1;font-family:var(--font-mono);font-size:10.5px;color:rgba(255,255,255,.4);
    margin-top:14px;letter-spacing:.03em;
  }
  .gh-reveal .prompt-pin-answer{
    position:relative;z-index:1;display:none;margin-top:20px;align-items:center;gap:8px;
    background:linear-gradient(135deg,#ff9a4d,var(--accent));box-shadow:0 10px 24px -8px rgba(255,90,54,.6);
  }
  .gh-reveal .prompt-pin-answer svg{width:14px;height:14px;stroke:#fff;flex-shrink:0;}
  .gh-reveal .prompt-pin-answer:hover{filter:brightness(1.06);}
  .gh-reveal.revealed .prompt-pin-answer{display:inline-flex;animation:promptPinIn .4s var(--ease-spring) .12s both;}
  /* full-screen flash fired the instant a question is revealed */
  .gh-flash{
    position:fixed;inset:0;z-index:9999;pointer-events:none;background:#fff;
    animation:ghFlashFade .5s ease forwards;
  }
  @keyframes ghFlashFade{from{opacity:.5;}to{opacity:0;}}

  /* ---- Golden Hour — voice reply modal (record → preview → send) ---- */
  .gh-voice-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 6px;}
  .gh-voice-record-btn{
    position:relative;width:80px;height:80px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ff9a4d,var(--accent));color:#fff;
    box-shadow:0 14px 30px -10px rgba(255,90,54,.6);
    transition:transform .15s var(--ease-spring);
  }
  .gh-voice-record-btn svg{width:26px;height:26px;stroke:#fff;position:relative;z-index:1;}
  .gh-voice-record-btn:active{transform:scale(.94);}
  .gh-voice-record-btn.recording{background:linear-gradient(135deg,#ff6a52,var(--danger));animation:ghMicPulse 1.1s ease-in-out infinite;}
  .gh-voice-record-btn .gh-voice-stop-icon{width:22px;height:22px;border-radius:5px;background:#fff;display:none;}
  .gh-voice-record-btn.recording .gh-voice-mic-icon{display:none;}
  .gh-voice-record-btn.recording .gh-voice-stop-icon{display:block;}
  @keyframes ghMicPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,67,63,.45), 0 14px 30px -10px rgba(255,90,54,.6);}50%{box-shadow:0 0 0 14px rgba(224,67,63,0), 0 14px 30px -10px rgba(255,90,54,.6);}}
  .gh-voice-hint{font-family:var(--font-display);font-weight:500;font-size:12.5px;color:var(--ink-soft);}
  .gh-voice-timer{font-family:var(--font-mono);font-size:13px;color:var(--danger);letter-spacing:.02em;}
  .gh-voice-preview{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 4px;}
  .gh-voice-preview audio{width:100%;}
  .gh-voice-rerecord{font-family:var(--font-mono);font-size:11px;color:var(--grey);text-decoration:underline;text-underline-offset:2px;}
  .gh-voice-rerecord:hover{color:var(--ink);}
  #ghVoiceCaption{
    width:100%;margin-top:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    font-family:var(--font-serif);font-size:13.5px;resize:none;min-height:44px;
  }

  .album-modal-pinned-q{
    display:flex;align-items:flex-start;gap:8px;margin:10px 0 14px;padding:11px 13px;
    border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-2);
    font-family:var(--font-serif);font-size:13.5px;line-height:1.4;color:var(--ink);
  }
  .album-modal-pinned-q .pin-ic{flex-shrink:0;}

  /* ---- Golden Hour — feed card (open to everyone, gated to 5-6pm, 1/day) ----
     Redesigned for breathing room: generous padding, the countdown pulled
     out into its own quiet pill instead of being wedged into the eyebrow
     line, and more air between question and chips. */
  .gh-card{
    position:relative;overflow:hidden;margin:0 0 22px;padding:24px 22px 22px;border-radius:22px;
    background:linear-gradient(160deg,#fffaf6 0%,var(--accent-soft) 72%,#fff 100%);
    border:1px solid rgba(255,177,153,.5);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 18px 40px -26px rgba(255,90,54,.4);
    animation:promptPinIn .4s var(--ease-spring) both;
  }
  .gh-card::after{
    content:'';position:absolute;top:-46px;right:-46px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,177,153,.35),transparent 72%);pointer-events:none;
  }
  .gh-head{position:relative;z-index:1;display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap;row-gap:8px;}
  .gh-dot{width:7px;height:7px;border-radius:50%;background:var(--grey);flex-shrink:0;}
  .gh-dot.live{background:var(--accent);box-shadow:0 0 0 0 rgba(255,90,54,.55);animation:ghPulse 1.8s ease-out infinite;}
  @keyframes ghPulse{
    0%{box-shadow:0 0 0 0 rgba(255,90,54,.5);}
    70%{box-shadow:0 0 0 8px rgba(255,90,54,0);}
    100%{box-shadow:0 0 0 0 rgba(255,90,54,0);}
  }
  .gh-eyebrow{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
  .gh-countdown{
    font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;
    letter-spacing:.02em;font-variant-numeric:tabular-nums;
    padding:3px 10px;border-radius:99px;background:rgba(255,90,54,.1);
    margin-left:2px;white-space:nowrap;
  }
  .gh-question{font-family:var(--font-serif);font-size:15.5px;line-height:1.58;color:var(--ink);margin-bottom:18px;letter-spacing:-.002em;position:relative;z-index:1;max-width:34em;}
  /* ---- Golden Hour — a voice reply, once it lands in the feed ---- */
  .home-post-card.gh-answer{
    background:linear-gradient(150deg,#171016 0%,#241a17 55%,#171016 100%);
    border:1px solid rgba(255,177,153,.22);
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
  }
  .home-post-card.gh-answer .home-post-head .who b{color:#ffd9b0;}
  .home-post-card.gh-answer .home-post-head .who span{color:rgba(255,255,255,.4);}
  .home-post-card.gh-answer .home-post-actions{border-top-color:rgba(255,177,153,.15);}
  .home-post-card.gh-answer .home-action-btn{color:rgba(255,255,255,.55);}
  .home-post-card.gh-answer .home-action-btn svg{stroke:rgba(255,255,255,.55);}
  .home-post-card.gh-answer .home-comments{border-top-color:rgba(255,177,153,.15);}
  .home-post-card.gh-answer .home-comment-input{background:#1e1712;border-color:#3a2a1f;color:#eee;}
  .gh-answer-tag{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:4px 10px 4px 4px;
    border-radius:99px;background:rgba(255,154,77,.14);border:1px solid rgba(255,177,153,.3);
    font-family:var(--font-mono);font-size:10px;color:#ffcf9e;text-transform:uppercase;letter-spacing:.06em;
  }
  .gh-answer-tag .gh-ic{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#ff9a4d,var(--accent));display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
  .gh-answer-question{
    font-family:var(--font-serif);font-size:14.5px;font-style:italic;line-height:1.5;color:#f1cba0;
    padding-left:10px;border-left:2px solid rgba(255,177,153,.4);margin-bottom:10px;
  }
  .home-post-card.gh-answer .home-voice-bubble{background:#221812;border:1px solid rgba(255,177,153,.2);}
  .home-post-card.gh-answer .home-voice-bubble b{color:#ffd9b0;}
  .gh-chip-row{position:relative;z-index:1;display:flex;gap:9px;overflow-x:auto;padding:2px 2px 5px;-webkit-overflow-scrolling:touch;}
  .gh-chip{
    flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:7px 15px 7px 7px;
    border-radius:99px;background:#fff;border:1px solid var(--accent-2);
    font-family:var(--font-display);font-weight:500;font-size:12.5px;color:var(--ink);
    box-shadow:0 1px 3px rgba(20,21,26,.05);
    transition:background .15s ease, transform .15s var(--ease-spring), border-color .15s ease, box-shadow .15s ease;
  }
  .gh-chip:hover{background:var(--accent-soft);box-shadow:0 6px 14px -6px rgba(255,90,54,.35);}
  .gh-chip:active{transform:scale(.96);}
  .gh-chip.disabled{opacity:.5;background:#f6f6f4;border-color:var(--line);box-shadow:none;cursor:default;}
  .gh-chip-avatar{
    width:23px;height:23px;border-radius:50%;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:9.5px;
  }
  .gh-chip-avatar img{width:100%;height:100%;object-fit:cover;}
  .gh-testmode{
    position:relative;z-index:1;margin-top:16px;padding:10px 13px;border-radius:12px;background:#14151a;color:#fff;
    font-family:var(--font-mono);font-size:9.5px;line-height:1.5;display:flex;align-items:center;
    justify-content:space-between;gap:8px;
  }
  .gh-testmode button{color:var(--accent-2);font-family:var(--font-mono);font-size:9.5px;text-decoration:underline;flex-shrink:0;}

  /* ---- Latest memory — one featured slot, set apart from the grid
     so the newest addition always gets a moment before the archive starts ---- */
  .gallery-hero{position:relative;z-index:1;margin-top:18px;}
  .gallery-hero-label{
    font-family:var(--font-mono);font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.07em;
    margin-bottom:10px;padding-left:2px;display:flex;align-items:center;gap:6px;
  }
  .gallery-hero-label .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:heroPulse 2s ease-in-out infinite;}
  @keyframes heroPulse{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }
  .gallery-hero-card{
    position:relative;border-radius:24px;overflow:hidden;cursor:pointer;display:block;width:100%;
    aspect-ratio:4/3;background:#f6f6f4;
    box-shadow:0 18px 44px -18px rgba(20,21,26,.32);
    opacity:0;transform:translateY(14px) scale(.98);animation:galleryTileIn .5s var(--ease-spring) forwards;
    transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  }
  .gallery-hero-card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:2;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,90,54,.3) 40%,rgba(124,140,255,.28) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:0;transition:opacity .3s ease;
  }
  @media (min-width:640px){ .gallery-hero-card{aspect-ratio:16/8;} }
  .gallery-hero-card:hover{transform:translateY(-3px);box-shadow:0 24px 52px -16px rgba(20,21,26,.4);}
  .gallery-hero-card:hover::before{opacity:1;}
  .gallery-hero-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease);}
  .gallery-hero-card:hover img{transform:scale(1.04);}
  .gallery-hero-card .overlay{
    position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,12,10,.78) 0%,rgba(15,12,10,.15) 45%,transparent 68%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-align:left;
  }
  .gallery-hero-card .overlay .who{display:flex;align-items:center;gap:8px;}
  .gallery-hero-card .overlay .who .mini{
    width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-family:var(--font-display);font-weight:700;overflow:hidden;flex-shrink:0;
    box-shadow:0 0 0 2px rgba(255,255,255,.5);
  }
  .gallery-hero-card .overlay .who .mini img{width:100%;height:100%;object-fit:cover;}
  .gallery-hero-card .overlay .who span{font-family:var(--font-display);font-weight:600;font-size:13px;color:#fff;}
  .gallery-hero-card .overlay .cap{
    font-family:var(--font-serif);font-size:15px;color:#fff;margin-top:8px;line-height:1.4;max-width:34ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .gallery-group{position:relative;z-index:1;margin-top:28px;}
  .gallery-group-label{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-mono);font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.07em;
    margin-bottom:10px;padding-left:2px;
  }
  .gallery-group-label::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,var(--line-strong),transparent);
  }

  /* True reading-order grid — chronological left-to-right, top-to-bottom.
     (CSS column masonry looks fuller but reshuffles photos down their
     column instead of across the row, so "most recent" stops meaning
     top-left; a fixed-ratio grid keeps the order honest on every screen.) */
  .gallery-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden;
  }
  @media (min-width:640px){ .gallery-grid{grid-template-columns:repeat(4,1fr);gap:4px;border-radius:18px;} }

  .gallery-tile{
    position:relative;cursor:pointer;display:block;width:100%;aspect-ratio:1;overflow:hidden;
    background:#f6f6f4;
    opacity:0;transform:scale(.94);animation:galleryTileIn .45s var(--ease-spring) forwards;
  }
  .gallery-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s var(--ease);}
  .gallery-tile:hover img{transform:scale(1.08);}
  .gallery-tile::after{
    content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);
    transform:translateX(-120%);
  }
  .gallery-tile:hover::after{transform:translateX(120%);transition:transform .65s var(--ease);}
  @keyframes galleryTileIn{ to{opacity:1;transform:scale(1);} }

  .gallery-tile .overlay{
    position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(0,0,0,.55) 0%,transparent 42%);
    opacity:0;transition:opacity .18s ease;
  }
  .gallery-tile:hover .overlay,.gallery-tile:focus-visible .overlay{opacity:1;}
  /* a slim always-on scrim + tiny avatar bottom-left, so who-posted-this
     is legible on tap-only devices instead of vanishing without :hover */
  .gallery-tile .who-chip{
    position:absolute;left:6px;bottom:6px;width:18px;height:18px;border-radius:50%;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:8px;font-family:var(--font-display);font-weight:700;overflow:hidden;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.65);
  }
  .gallery-tile .who-chip img{width:100%;height:100%;object-fit:cover;}
  .gallery-tile .overlay-info{
    position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px 28px;color:#fff;
    opacity:0;transition:opacity .18s ease;
  }
  .gallery-tile:hover .overlay-info,.gallery-tile:focus-visible .overlay-info{opacity:1;}
  .gallery-tile .overlay-info span{font-family:var(--font-mono);font-size:8.5px;}
  .gallery-tile .overlay-info .cap{
    font-family:var(--font-serif);font-size:10.5px;margin-top:2px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }

  .gallery-empty{
    position:relative;z-index:1;text-align:center;padding:56px 20px;margin-top:20px;overflow:hidden;
    border:1.5px dashed var(--line-strong);border-radius:22px;
    background:linear-gradient(160deg,var(--accent-soft) 0%,#fff 75%);
  }
  .gallery-empty .ic{
    position:relative;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#fff,#fff5f1);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;box-shadow:0 8px 20px rgba(255,90,54,.16),0 0 0 6px rgba(255,90,54,.06);
    animation:galleryFloat 2.6s ease-in-out infinite;
  }
  @keyframes galleryFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-7px) rotate(-4deg);} }
  .gallery-empty .ic svg{width:23px;height:23px;stroke:var(--accent);}
  .gallery-empty h3{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .gallery-empty p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink-soft);margin-top:6px;max-width:260px;margin-left:auto;margin-right:auto;line-height:1.5;}
  .gallery-empty .gallery-add-btn{margin-top:18px;}

  /* ============================================================
     SCREENSHOT GUARD — deterrent layer for private circles
  ============================================================ */
  body.sg-active{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  body.sg-active input, body.sg-active textarea{-webkit-user-select:text;user-select:text;}
  body.sg-active img, body.sg-active video{-webkit-user-drag:none;}
  body > *{transition:filter .12s ease;}
  body.sg-hidden > *:not(.sg-backdrop):not(script){filter:blur(22px) saturate(.6);}
  @media print{ body.sg-active{display:none!important;} }

  .sg-backdrop{
    position:fixed;inset:0;z-index:600;background:rgba(20,21,26,.62);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;transition:opacity .18s ease;
  }
  .sg-backdrop.show{opacity:1;}
  .sg-card{
    background:#fff;border-radius:22px;padding:28px 22px 20px;max-width:340px;width:100%;text-align:center;
    transform:translateY(14px) scale(.94) rotate(-2deg);
    transition:transform .34s var(--ease-spring);
  }
  .sg-backdrop.show .sg-card{transform:none;}
  .sg-emoji{display:block;font-size:46px;line-height:1;margin-bottom:12px;}
  .sg-card h3{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.01em;}
  .sg-card p{font-family:var(--font-serif);font-size:14.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .sg-btn{
    margin-top:18px;background:var(--accent);color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:11px 22px;border-radius:99px;transition:background .15s ease, transform .1s ease;
  }
  .sg-btn:hover{background:#e64a27;}
  .sg-btn:active{transform:scale(.95);}
  .sg-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

  /* ============================================================
     ANONYMOUS POST NOTICE — shown once before whisper-mode posting
  ============================================================ */
  .anon-notice-icon{width:52px;height:52px;border-radius:50%;background:#14151a;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .anon-notice-icon svg{width:26px;height:26px;}
  .anon-notice-actions{display:flex;gap:8px;margin-top:18px;}
  .anon-notice-actions .sg-btn{margin-top:0;flex:1;white-space:nowrap;}
  .anon-notice-ghost{background:#f1f1ef;color:var(--ink-soft)!important;}
  .anon-notice-ghost:hover{background:#e6e6e3;}

  /* ANON-ACTIVE BANNER — shown inline in the composer while whisper
     mode is on, every time, so it's always clear a post is anonymous
     and will self-delete. */
  .composer-anon-banner{
    display:none;align-items:center;gap:9px;
    padding:9px 12px;margin:10px 0 2px;border-radius:11px;
    background:#14151a;color:#f1f1ef;
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:.01em;line-height:1.4;
    animation:riseIn .18s var(--ease);
  }
  .composer-anon-banner.show{display:flex;}
  .composer-anon-banner svg{width:15px;height:15px;flex-shrink:0;}
  .composer-anon-banner b{color:#fff;font-family:var(--font-display);font-weight:600;font-style:normal;}
</style>
