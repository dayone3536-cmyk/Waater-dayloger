              <div class="pc-join-prompt">
                <span>Join to start threads and reply. Anyone can vote.</span>
                <button type="button" data-act="join">Join circle</button>
              </div>
            `}

            <div class="pc-bar" id="pcBar">
              <div class="pc-seg" id="pcSeg" role="tablist" aria-label="Sort posts">
                <span class="pc-seg-thumb"></span>
                <button type="button" role="tab" data-sort="hot" aria-selected="${currentSort === 'hot'}">Trending</button>
                <button type="button" role="tab" data-sort="new" aria-selected="${currentSort === 'new'}">Latest</button>
                <button type="button" role="tab" data-sort="top" aria-selected="${currentSort === 'top'}">Top</button>
              </div>
              <button type="button" class="pc-new" id="pcNew">${PC_ICON.arrowUp}<span></span></button>
            </div>

            <div class="pc-feed" id="pcFeed" aria-live="polite">${pcSkeleton()}</div>
          </div>

          <aside class="pc-rail">
            <section>
              <h2>About</h2>
              <p>${desc}</p>
              <div class="since">Started ${since}</div>
            </section>
            <section>
              <h2>People<span class="cnt">${members.length}</span></h2>
              <div id="pcPeople">${rail.map(personRow).join('')}</div>
              ${railRest.length ? `<button type="button" class="pc-people-more" id="pcPeopleMore">Show all</button>` : ''}
            </section>
          </aside>
        </div>
      </div>
    `;

    // ---- wiring (elements are fresh each render) ----
    document.getElementById('pcShare').addEventListener('click', pcShare);
    document.getElementById('pcJoinBtn').addEventListener('click', pcJoin);

    const seg = document.getElementById('pcSeg');
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-sort]');
      if (!b || b.dataset.sort === currentSort) return;
      pcSetSort(b.dataset.sort);
    });
    requestAnimationFrame(() => { pcPositionThumb(); requestAnimationFrame(() => seg.classList.add('ready')); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(pcPositionThumb);
    if (!PC.wired){
      window.addEventListener('resize', pcPositionThumb, { passive: true });
      PC.wired = true;
    }

    const moreBtn = document.getElementById('pcPeopleMore');
    if (moreBtn){
      moreBtn.addEventListener('click', () => {
        document.getElementById('pcPeople').insertAdjacentHTML('beforeend', railRest.map(personRow).join(''));
        moreBtn.remove();
      });
    }

    document.getElementById('pcNew').addEventListener('click', async () => {
      const top = document.getElementById('pcBody').getBoundingClientRect().top + window.scrollY -
        (window.matchMedia('(max-width:899.98px)').matches ? 58 : 0);
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      await refreshPubFeed();
    });

    // one delegated handler for everything inside the feed
    const feed = document.getElementById('pcFeed');
    feed.addEventListener('click', (e) => {
      const t = e.target.closest('[data-act]');
      if (!t) return;
      const article = t.closest('.pc-post');
      switch (t.dataset.act){
        case 'vote':        return pcVote(article, Number(t.dataset.value));
        case 'thread':      return pcToggleThread(article);
        case 'send':        return pcSendComment(article);
        case 'del-post':    return pcDeletePost(article, t);
        case 'del-comment': return pcDeleteComment(article, t);
        case 'join':        return pcJoin();
        case 'compose':     window.scrollTo({ top: 0, behavior: 'smooth' }); return window.pcOpenComposer && window.pcOpenComposer();
        case 'more': {
          const txt = article.querySelector('.pc-text');
          const nowClamped = txt.classList.toggle('clamp');
          t.textContent = nowClamped ? 'Show more' : 'Show less';
          return;
        }
      }
    });
    feed.addEventListener('input', (e) => {
      if (!e.target.classList.contains('pc-cinput')) return;
      const btn = e.target.closest('.pc-post').querySelector('.pc-csend');
      if (btn) btn.disabled = !e.target.value.trim();
    });
    feed.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && e.target.classList.contains('pc-cinput')){
        e.preventDefault();
        pcSendComment(e.target.closest('.pc-post'));
      }
    });
    body.querySelectorAll('.pc-orb.slot').forEach(b => b.addEventListener('click', pcJoin));

    pcWireComposer();
    pcSubscribe();
    await refreshPubFeed();
  }

  function pcUpdatePulse(posts){
    const el = document.getElementById('pcPulse');
    if (!el || currentSort === 'top') return;      // "top" isn't ordered by recency
    const dayAgo = Date.now() - 86400000;
    const n = posts.filter(p => new Date(p.created_at).getTime() > dayAgo).length;
    el.innerHTML = n === 0
      ? ''
      : `<i></i>${n}${posts.length >= 50 ? '+' : ''} ${n === 1 ? 'post' : 'posts'} today`;
  }

  async function refreshPubFeed(){
    const feed = document.getElementById('pcFeed');
    if (!feed) return;
    PC.pending = 0;
    const pill = document.getElementById('pcNew');
    if (pill) pill.classList.remove('show');

    const sortAtStart = currentSort;
    if (feed.querySelector('.pc-post')) feed.classList.add('is-loading');
    const posts = await loadPosts(sortAtStart);
    if (sortAtStart !== currentSort) return;         // a newer sort click won the race
    PC.posts = posts;
    pcUpdatePulse(posts);

    if (!posts.length){
      feed.classList.remove('is-loading');
      feed.innerHTML = `
        <div class="pc-empty">
          <h3>Nothing here yet</h3>
          <p>${myRole !== null ? 'Start the first thread and set the tone for this circle.' : 'Join the circle to start the first thread.'}</p>
          <button type="button" data-act="${myRole !== null ? 'compose' : 'join'}">${myRole !== null ? 'Start a thread' : 'Join circle'}</button>
        </div>`;
      return;
    }

    const votes = await loadMyVotes(posts.map(p => p.id));
    if (sortAtStart !== currentSort) return;

    const first = posts[0];
    const spotId = (sortAtStart === 'hot' && (first.score || 0) >= 3 &&
      Date.now() - new Date(first.created_at).getTime() < 172800000) ? first.id : null;

    feed.innerHTML = posts.map(p => pcPostHtml(p, votes[p.id] || 0, { spot: p.id === spotId })).join('');
    feed.classList.remove('is-loading');
  }

  let composerTimer = null;

  function setupComposerBehavior(){
    const fab = document.getElementById('homeFab');
    const composer = document.getElementById('homeComposer');
    if (!fab || !composer) return;
    const THRESHOLD = 40;
    const isMobile = () => window.matchMedia('(max-width:899.98px)').matches;

    function resetToVisible(){
      // Desktop (or a resize onto desktop): composer is always visible,
      // never collapsed, never in overlay mode. This is the fix — nothing
      // here should ever require a refresh to undo.
      composer.classList.remove('collapsed', 'overlay', 'overlay-open');
      fab.classList.remove('show');
    }

    function onScroll(){
      if (!isMobile()){ resetToVisible(); return; }
      if (composer.classList.contains('overlay-open')) return;

      const y = window.scrollY;
      const isCollapsed = composer.classList.contains('collapsed');

      if (!isCollapsed){
        // how much scroll room would be left once the composer is gone?
        const composerH = composer.offsetHeight + 18; // +18 for its margin-top
        const spare = document.documentElement.scrollHeight - window.innerHeight - composerH;

        // only collapse if there's still plenty of page left to scroll
        if (y > THRESHOLD && spare > THRESHOLD + 60){
          composer.classList.add('collapsed');
          fab.classList.add('show');
        }
      } else if (y < 4){
        // only expand when you're basically at the very top
        composer.classList.remove('collapsed');
        fab.classList.remove('show');
      }
    }


    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll, { passive:true });
    onScroll();

    fab.addEventListener('click', () => {
      composer.classList.remove('collapsed');
      composer.classList.add('overlay', 'overlay-open');
      fab.classList.remove('show');
      document.getElementById('homeComposerText').focus();
      resetComposerTimer();
    });

    document.addEventListener('click', (e) => {
      if (!composer.classList.contains('overlay-open')) return;
      if (composer.contains(e.target) || fab.contains(e.target)) return;
      closeComposerOverlay();
    });
  }

  function resetComposerTimer(){
    clearTimeout(composerTimer);
    composerTimer = setTimeout(() => {
      const text = document.getElementById('homeComposerText').value.trim();
      const media = document.getElementById('homeMediaUrl').value.trim();
      const focused = document.activeElement === document.getElementById('homeComposerText')
        || document.activeElement === document.getElementById('homeMediaUrl');
      // Only auto-close an empty, untouched composer — never cut someone off
      // mid-thought just because they paused for a few seconds.
      if (!text && !media && !focused) closeComposerOverlay();
    }, 15000);
  }

  function closeComposerOverlay(){
    const composer = document.getElementById('homeComposer');
    clearTimeout(composerTimer);
    composer.classList.remove('overlay-open');
    setTimeout(() => composer.classList.remove('overlay'), 260);
    composer.classList.add('collapsed');
    if (window.scrollY > 40) document.getElementById('homeFab')?.classList.add('show');
  }

  // =========================================================
  // SCREENSHOT GUARD — deterrent layer for private circles
  //
  // Be honest with yourself about what this is: a web page can NOT
  // truly block screenshots. Phone screenshots and photos of a screen
  // fire no browser event at all. This layer does what a browser can:
  //   1. blurs the page whenever the tab/window loses focus
  //      (snipping tools, app switcher previews, screen-share pickers)
  //   2. catches desktop screenshot shortcuts and shows the popup
  //   3. blocks print / save-page / right-click + drag on media
  // For real blocking you'd need a native app (Android FLAG_SECURE).
  // =========================================================
  const SG_CAUGHT_LINES = [
    { emoji:'📸', title:'You got caught!',            body:'You can\u2019t screenshot here. Everything stays inside the circle.',            button:'ok, I\u2019m sorry' },
    { emoji:'🚨', title:'The circle police are here.', body:'Whatever you just tried to take out of here \u2014 put it back. This place is for us only.', button:'fine, I\u2019ll behave' },
    { emoji:'🕵️', title:'Nice try, paparazzi.',        body:'Your friends said those things because they trust you. What\u2019s said here stays here.', button:'my bad' },
    { emoji:'🙈', title:'Nope.',                        body:'Screenshots don\u2019t live here. Memories do \u2014 add it to the album instead.',       button:'ok ok' },
  ];

  let sgPopup = null;

  function showCaughtPopup(){
    if (sgPopup) return;
    const line = SG_CAUGHT_LINES[Math.floor(Math.random() * SG_CAUGHT_LINES.length)];
    const el = document.createElement('div');
    el.className = 'sg-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <span class="sg-emoji">${line.emoji}</span>
        <h3>${line.title}</h3>
        <p>${line.body}</p>
        <button class="sg-btn" type="button">${line.button}</button>
      </div>`;
    document.body.appendChild(el);
    sgPopup = el;
    requestAnimationFrame(() => el.classList.add('show'));

    const btn = el.querySelector('.sg-btn');
    const close = () => {
      el.classList.remove('show');
      setTimeout(() => { el.remove(); sgPopup = null; }, 200);
      if (!document.hidden) document.body.classList.remove('sg-hidden');
    };
    btn.addEventListener('click', close);
    btn.focus();
  }

  function enableScreenshotGuard(){
    if (window.__sgOn) return;
    window.__sgOn = true;
    const body = document.body;
    body.classList.add('sg-active');

    // 1. hide everything whenever the page is not actively in front
    const hide = () => body.classList.add('sg-hidden');
    const show = () => { if (!document.hidden && !sgPopup) body.classList.remove('sg-hidden'); };
    window.addEventListener('blur', hide);
    window.addEventListener('focus', show);
    document.addEventListener('visibilitychange', () => (document.hidden ? hide() : show()));

    // 2. desktop screenshot shortcuts (Windows: PrintScreen, Win+Shift+S;
    //    macOS: Cmd+Shift+3/4/5). Best effort: the OS may swallow the keys.
    const isShotShortcut = (e) =>
      e.key === 'PrintScreen' ||
      (e.metaKey && e.shiftKey && ['Digit3', 'Digit4', 'Digit5', 'KeyS'].includes(e.code));

    const onShot = () => {
      hide();
      // Windows puts PrintScreen images on the clipboard; overwrite it.
      // (This replaces whatever the user had copied, only on this shortcut.)
      try { navigator.clipboard.writeText(' ').catch(() => {}); } catch (_) {}
      showCaughtPopup();
    };
    window.addEventListener('keydown', (e) => { if (isShotShortcut(e)) onShot(); });
    window.addEventListener('keyup',   (e) => { if (isShotShortcut(e)) onShot(); });

    // 3. print / save page, right-click and drag on media
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['p', 's'].includes((e.key || '').toLowerCase())){
        e.preventDefault();
        showCaughtPopup();
      }
    });
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest && e.target.closest('img, video')) e.preventDefault();
    });
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

  }

  // =========================================================
  // ANONYMOUS POSTS — pre-post notice, auto-expiry
  //
  // Anonymous ("whisper mode") posts always self-delete exactly 24 hours
  // after they're created — not dependent on who has viewed them.
  //
  // Requires (run once in the Supabase SQL editor):
  //   - the `cleanup_expired_anon_posts` RPC function, which deletes any
  //     row where is_anonymous = true and created_at < now() - 24h.
  // See circle-anon-expiry.sql for the migration.
  // =========================================================
  const ANON_NOTICE_KEY = `anonNoticeSeen_${circleId}`;

  function hasSeenAnonNotice(){
    try { return localStorage.getItem(ANON_NOTICE_KEY) === '1'; } catch(_) { return false; }
  }
  function markAnonNoticeSeen(){
    try { localStorage.setItem(ANON_NOTICE_KEY, '1'); } catch(_) {}
  }

  // Shown once, before someone's first anonymous post, so they know the
  // trade-off up front rather than finding out after the fact.
  function showAnonNoticeModal(onConfirm){
    if (document.querySelector('.anon-notice-backdrop')) return;
    const el = document.createElement('div');
    el.className = 'sg-backdrop anon-notice-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <div class="anon-notice-icon">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <path fill="#fff" d="M16 3C8.8 3 2.9 8.3 1.9 15.2c-.2 1.6 1 3 2.6 3h1.2l-1.5 2.8a1 1 0 001.8.9l1.9-3.7h16.2l1.9 3.7a1 1 0 001.8-.9L26.3 18.2h1.2c1.6 0 2.8-1.4 2.6-3C29.1 8.3 23.2 3 16 3z"/>
            <circle cx="10.5" cy="15.5" r="2.8" fill="#14151a"/>
            <circle cx="21.5" cy="15.5" r="2.8" fill="#14151a"/>
            <rect x="13.5" y="14.5" width="5" height="2" fill="#14151a"/>
          </svg>
        </div>
        <h3>Posting anonymously</h3>
        <p>Your identity will be hidden — no one in the circle, including admins, can tell it's you. This post automatically disappears 24 hours after you post it.</p>
        <div class="anon-notice-actions">
          <button class="sg-btn anon-notice-ghost" type="button" data-choice="cancel">Never mind</button>
          <button class="sg-btn" type="button" data-choice="confirm">Got it, post anonymously</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    const close = (confirmed) => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 200);
      if (confirmed){
        markAnonNoticeSeen();
        onConfirm();
      }
    };
    el.querySelector('[data-choice="confirm"]').addEventListener('click', () => close(true));
    el.querySelector('[data-choice="cancel"]').addEventListener('click', () => close(false));
  }

  // Shown whenever someone tries to post a voice note while anonymous.
  // Voice can't be anonymous (friends know how each other sound), so we
  // nudge them to type instead.
  function showAnonVoiceNotice(){
    if (document.querySelector('.anon-voice-backdrop')) return;
    const el = document.createElement('div');
    el.className = 'sg-backdrop anon-notice-backdrop anon-voice-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <div class="anon-notice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </div>
        <h3>Voice can give you away</h3>
        <p>People know how you sound, so a voice note can't stay anonymous — they'd figure out it's you. Write it instead and it stays unsigned.</p>
        <div class="anon-notice-actions">
          <button class="sg-btn anon-notice-ghost" type="button" data-choice="cancel">Never mind</button>
          <button class="sg-btn" type="button" data-choice="text">Write it instead</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    const close = (goText) => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 200);
      if (goText){
        const ta = document.getElementById('homeComposerText') || document.querySelector('#homeComposer textarea');
        if (ta) ta.focus();
      }
    };
    el.querySelector('[data-choice="text"]').addEventListener('click', () => close(true));
    el.querySelector('[data-choice="cancel"]').addEventListener('click', () => close(false));
  }

  // Gate for turning whisper mode on: shows the one-time notice first,
  // then runs `onEnabled` once the person has acknowledged it.
  function requestWhisperMode(onEnabled){
    if (hasSeenAnonNotice()){ onEnabled(); return; }
    showAnonNoticeModal(onEnabled);
  }

  // Best-effort cleanup, called opportunistically whenever the feed loads.
  // Deletes anonymous posts whose 24-hour window has passed. Safe to call
  // often — it's a no-op when nothing has expired yet.


     async function cleanupExpiredAnonPosts(){
      const { error } = await supabaseClient.rpc('cleanup_expired_anon_posts');
      if (error) console.error('cleanup_expired_anon_posts failed', error);
    }



  // =========================================================
  // MAIN INIT
  // =========================================================
  async function init(){
    await renderSidebar();

      const inviteCode = params.get('code');
      if (inviteCode && !circleId){
        if (!requireAuth(`/circle?code=${encodeURIComponent(inviteCode)}`)) return;
        document.getElementById('pageBody').innerHTML = `<div class="page-loading">Joining circle…</div>`;
        const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: inviteCode });
        if (error || !data?.circle_id){
          document.getElementById('pageBody').innerHTML = `
            <div class="page-error">
              <h2>Invite invalid or expired</h2>
              <p>${error?.message || ''} <a href="/circles">Back to your circles</a></p>
            </div>`;
          return;
        }
        window.location.replace(`/circle?private&ID=${encodeURIComponent(data.circle_id)}`);
        return;


      }

    if (!circleId){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>No circle ID was given. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    circle = await loadCircle();
    if (!circle){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>This circle doesn't exist or was removed. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    if (urlSaysPrivate !== circle.is_private){
      const correctUrl = `/circle?${circle.is_private ? 'private' : 'public'}&ID=${encodeURIComponent(circle.id)}`;
      window.history.replaceState(null, '', correctUrl);
    }

    members = await loadMembers();
    if (currentUser){
      const mine = members.find(m => m.id === currentUser.id);
      myRole = mine ? mine.role : null;
    }

    if (circle.is_private){
      if (!requireAuth()) return;
      if (myRole === null){
        document.getElementById('pageBody').innerHTML = `
          <div class="page-error">
            <h2>This circle is private</h2>
            <p>You need an invite to see what's inside. <a href="/circles">Back to your circles</a></p>
          </div>
        `;
        return;
      }
      enableScreenshotGuard();
      await renderHomeMode();

      const targetPostId = params.get('post');
      if (targetPostId) {
        setTimeout(() => {
          const card = document.querySelector(`[data-post-id="${targetPostId}"]`);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('post-highlight');
            setTimeout(() => card.classList.remove('post-highlight'), 2200);
          }
        }, 300);
      }
    } else {
      await renderPublicMode();
    }
  }



  init();
</script>

<script>
// Navigation behaviour: active link, sliding hover pill, topbar shadow, dock polish
(function(){
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
  var first = '/' + (path.split('/')[1] || '');
  var keyMap = {'/':'home','/home':'home','/index':'home','/create':'create','/circles':'circles','/circle':'circles','/messages':'messages','/profile':'profile'};
  var key = keyMap[path] || keyMap[first];
  if (key){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      var on = el.getAttribute('data-nav') === key && !el.classList.contains('nav-create') && !el.classList.contains('tab-create');
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
  }

  // sliding hover pill (desktop)
  var list = document.querySelector('.nav-list');
  var pill = document.querySelector('.nav-pill');
  if (list && pill){
    var move = function(el){
      var y = el.getBoundingClientRect().top - list.getBoundingClientRect().top;
      pill.style.height = el.offsetHeight + 'px';
      if (!pill.classList.contains('on')){
        pill.classList.add('snap');
        pill.style.transform = 'translateY(' + y + 'px)';
        void pill.offsetWidth;
        pill.classList.remove('snap');
        pill.classList.add('on');
      } else {
        pill.style.transform = 'translateY(' + y + 'px)';
      }
    };
    list.querySelectorAll('.nav-item').forEach(function(a){
      a.addEventListener('mouseenter', function(){ move(a); });
      a.addEventListener('focus', function(){ if (a.matches(':focus-visible')) move(a); });
    });
    list.addEventListener('mouseleave', function(){ pill.classList.remove('on'); });
    list.addEventListener('focusout', function(){ pill.classList.remove('on'); });
  }

  // topbar gets a soft shadow once you scroll
  var tb = document.querySelector('.topbar');
  if (tb){
    var f = function(){ tb.classList.toggle('scrolled', window.scrollY > 4); };
    window.addEventListener('scroll', f, {passive:true}); f();
  }

  // dock: light haptic tap, and tuck away while typing so the keyboard has room
  var dock = document.querySelector('.bottom-nav');
  if (dock){
    dock.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ if (navigator.vibrate) navigator.vibrate(8); });
    });
    var FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]';
    var isField = function(el){ return el && el.matches && el.matches(FIELD); };
    document.addEventListener('focusin', function(e){
      if (isField(e.target) && window.matchMedia('(max-width:899.98px)').matches) dock.classList.add('hidden');
    });
    document.addEventListener('focusout', function(){
      setTimeout(function(){ if (!isField(document.activeElement)) dock.classList.remove('hidden'); }, 60);
    });
  }
})();
</script>

</body>
