<div class="waater-toast" id="waaterToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="waaterToastText"></span>
</div>

<script>
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }

  // ============================================================
  // LOADER — replaces plain "Loading…" text wherever the person is
  // waiting a few seconds (checking an invite, joining a circle, the
  // feed underneath the welcome ceremony). One bold mark, dead center:
  // it breathes with a springy squash-and-stretch, drifts through a
  // warm hue shift, and throws a small burst of light on every beat.
  // Pure CSS — one loop, nothing random, nothing to "play." Purely
  // decorative: it never affects what happens once loading ends.
  // ============================================================
  function renderWaterLoader(label){
    return `
      <div class="water-loader" data-water-loader>
        <div class="wl-stage">
          <div class="wl-halo"></div>
          <div class="wl-spark"></div><div class="wl-spark"></div><div class="wl-spark"></div>
          <div class="wl-spark"></div><div class="wl-spark"></div><div class="wl-spark"></div>
          <div class="wl-mark"></div>
        </div>
        <div class="wl-label">${escapeHtml(label)}<span class="wl-dot">.</span><span class="wl-dot">.</span><span class="wl-dot">.</span></div>
      </div>
    `;
  }
  // The loader is pure CSS (no per-frame JS driving it), so mounting is a
  // no-op kept only so existing call sites don't need to change.
  function mountWaterLoader(){}
  function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
  function timeAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if (s<60) return 'just now';
    if (s<3600) return `${Math.floor(s/60)}m ago`;
    if (s<86400) return `${Math.floor(s/3600)}h ago`;
    if (s<604800) return `${Math.floor(s/86400)}d ago`;
    return new Date(iso).toLocaleDateString();
  }
  function getGreeting(){
    const h = new Date().getHours();
    if (h < 5) return 'Still up';
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUsername = null;
  let currentUserGhChannel = 'unset'; // 'unset' | 'push' | 'email' — Golden Hour reveal notify preference

  function requireAuth(nextPath){
    if (currentUser) return true;
    window.location.href = `/auth?next=${encodeURIComponent(nextPath || window.location.pathname + window.location.search)}`;
    return false;
  }

  let toastTimer = null;
  function showToast(text, type){
    const toast = document.getElementById('waaterToast');
    document.getElementById('waaterToastText').textContent = text;
    toast.classList.remove('error');
    if (type === 'error') toast.classList.add('error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ============================================================
  // PRIVACY / BELONGING HELPERS
  // ============================================================

  // Was this member's join timestamp within the last minute? Used to decide
  // whether to play the welcome ceremony (vs. just navigating back later).
  function justJoined(meRow){
    if (!meRow || !meRow.joined_at) return false;
    return (Date.now() - new Date(meRow.joined_at).getTime()) < 300000; // 5 min window
  }

  // Best-effort fetch of a personal note left by whoever invited this user.
  // Expects an optional `welcome_note` text column on circle_members.
  // If that column doesn't exist yet, this quietly returns null — nothing breaks.
  async function loadMyWelcomeNote(){
    try{
      const { data, error } = await supabaseClient
        .from('circle_members')
        .select('welcome_note, invited_by')
        .eq('circle_id', circleId)
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if (error || !data) return { note: null, inviter: null };

      let inviter = null;
      if (data.invited_by){
        const { data: prof } = await supabaseClient
          .from('profiles')
          .select('username, avatar_url')
          .eq('id', data.invited_by)
          .maybeSingle();
        inviter = prof || null;
      }
      return { note: data.welcome_note || null, inviter };
    } catch(e){ return { note: null, inviter: null }; }
  }

  function renderPeopleRow(){
    return `
      <div class="home-people-row">
        ${members.map(m => `
          <div class="home-person">
            <div class="ring"><div class="ring-inner"><div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div></div></div>
            <span>${escapeHtml((m.username||'?').split(' ')[0])}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Full-screen, one-time "you're in" moment. Plays over the feed while it
  // loads underneath — the moment the person sees the second they land.
  async function playWelcomeCeremony(note, inviter){
    return new Promise(resolve => {
      const inviterName = inviter?.username || null;
      const overlay = document.createElement('div');
      overlay.className = 'welcome-overlay';
      overlay.innerHTML = `
        <div class="welcome-lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        </div>
        <div class="welcome-ring">
          ${members.map((m,i) => `
            <div class="welcome-avatar" style="animation-delay:${(i*0.08).toFixed(2)}s">
              <div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div>
            </div>
          `).join('')}
        </div>
        <div class="welcome-text">
          <div class="welcome-eyebrow">you're special</div>
          <h1 class="welcome-title">${inviterName ? `That's why @${escapeHtml(inviterName)} invited you` : `Welcome to ${escapeHtml(circle.name)}`}</h1>
          <p class="welcome-sub">${inviterName ? `Out of everyone @${escapeHtml(inviterName)} knows, they chose you. You're now one of only ${members.length} people in ${escapeHtml(circle.name)}.` : `You're now one of only ${members.length} people who get to be part of ${escapeHtml(circle.name)}.`}</p>
          ${note ? `
            <div class="welcome-note">
              <b>${inviterName ? `a note from @${escapeHtml(inviterName)}` : 'a note for you'}</b>
              <p>${escapeHtml(note)}</p>
            </div>
          ` : ''}
          <div class="welcome-privacy-line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            No public feed, no usernames, no strangers reading along — just the ${members.length} of you
          </div>
          <div class="welcome-privacy-line" style="margin-top:6px;">
            <span style="font-size:12px;line-height:1;">📸</span>
            Screenshots are blocked in here — whatever's said stays inside ${escapeHtml(circle.name)}
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      const finish = () => {
        overlay.classList.remove('show');
        setTimeout(() => { overlay.remove(); resolve(); }, 350);
      };
      // No button — the ceremony dismisses itself. 3s is enough time to read
      // the headline + note without making the person tap anything to get in.
      setTimeout(finish, 3000);
    });
  }

  // Small modal so the person inviting someone can attach a personal note.
  // Resolves to the note string, or null if skipped/closed.
  function openInviteModal(){
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'invite-modal-backdrop';
      modal.innerHTML = `
        <div class="invite-modal">
          <h3>Invite someone to ${escapeHtml(circle.name)}</h3>
          <p>Add a personal note — it'll be the first thing they see when they arrive.</p>
          <textarea id="inviteNoteInput" maxlength="140" placeholder="e.g. finally got you in here 🎉"></textarea>
          <div class="invite-modal-row">
            <button class="invite-modal-skip" type="button">Skip note</button>
            <button class="invite-modal-send" type="button">Create invite</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));
      const close = (note) => {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 220);
        resolve(note);
      };
      modal.querySelector('.invite-modal-skip').addEventListener('click', () => close(null));
      modal.querySelector('.invite-modal-send').addEventListener('click', () => {
        const val = modal.querySelector('#inviteNoteInput').value.trim();
        close(val || null);
      });
      modal.addEventListener('click', (e) => { if (e.target === modal) close(null); });
    });
  }

  // Cold-start nudge: shown to whichever member reaches for "invite" while
  // the circle's feed is still empty — owner or not, since anyone with
  // room left can invite. It's a beat of friction, not a gate — "Invite
  // anyway" always works, it's just no longer the only button in the room.
  // Clicking outside the modal cancels the invite entirely rather than
  // defaulting to either choice.
  function openEmptyCircleNudge(){
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'invite-modal-backdrop';
      modal.innerHTML = `
        <div class="invite-modal">
          <h3>${escapeHtml(circle.name)} is still empty</h3>
          <p>Whoever you invite next will land on a blank page. A single line from you gives them something to react to — and a much better reason to stick around.</p>
          <div class="invite-modal-row">
            <button class="invite-modal-skip" type="button" id="emptyNudgeInviteAnyway">Invite anyway</button>
            <button class="invite-modal-send" type="button" id="emptyNudgeWrite">Write something first</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));
      const close = (choice) => {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 220);
        resolve(choice);
      };
      modal.querySelector('#emptyNudgeInviteAnyway').addEventListener('click', () => close('invite'));
      modal.querySelector('#emptyNudgeWrite').addEventListener('click', () => close('write'));
      modal.addEventListener('click', (e) => { if (e.target === modal) close('cancel'); });
    });
  }

  // Live "someone just joined" broadcast via Supabase Realtime — makes the
  // circle feel alive and lets everyone currently inside see arrivals happen.
  // Requires Realtime enabled on the circle_members table in Supabase.
  let circleChannel = null;
  function subscribeToCircleActivity(){
    if (circleChannel || !circle?.is_private) return;
    circleChannel = supabaseClient
      .channel(`circle-activity-${circleId}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'circle_members', filter: `circle_id=eq.${circleId}` },
        async (payload) => {
          if (!payload.new || payload.new.user_id === currentUser?.id) return;
          const { data: prof } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', payload.new.user_id).maybeSingle();
          showToast(`${prof?.username || 'someone'} just joined the circle 👋`);
          members = await loadMembers();
          const row = document.querySelector('.home-people-row');
          if (row) row.outerHTML = renderPeopleRow();
        }
      )
      .subscribe();
  }
  window.addEventListener('beforeunload', () => { if (circleChannel) supabaseClient.removeChannel(circleChannel); });

  // Live delivery for Golden Hour questions. Sending previously only put a
  // link on the sender's clipboard — if the recipient was sitting right on
  // this page when it was sent, nothing told them a question had arrived.
  let goldenHourPromptChannel = null;
  function subscribeToGoldenHourPrompts(){
    if (goldenHourPromptChannel || !circle?.is_private || !currentUser) return;
    goldenHourPromptChannel = supabaseClient
      .channel(`gh-prompts-${circleId}-${currentUser.id}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'golden_hour_prompts', filter: `to_user_id=eq.${currentUser.id}` },
        async (payload) => {
          if (!payload.new || payload.new.circle_id !== circleId || payload.new.answered_at) return;
          activePrompt = {
            id: payload.new.id,
            from_user_id: payload.new.from_user_id,
            question: payload.new.question,
            answered_at: payload.new.answered_at,
            created_at: payload.new.created_at,
            is_anonymous: payload.new.is_anonymous,
          };
          revealNotifiedIds.delete(activePrompt.id);
          // Always "Someone" here — who sent it stays hidden until the
          // blur lifts on its own, regardless of the sender's choice.
          showToast('✨ Someone just asked you something');
          switchHomeView('feed');
          await refreshGoldenHourReveal();
          document.getElementById('promptPinBanner')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      )
      .subscribe();
  }
  window.addEventListener('beforeunload', () => {
    if (goldenHourPromptChannel) supabaseClient.removeChannel(goldenHourPromptChannel);
    clearInterval(promptRevealTicker);
  });

  async function renderSidebar(){
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');
    if (!currentUser){
      area.innerHTML = `<a href="/auth" class="sidebar-signin">Sign in</a>`;
      return;
    }
    const { data: me } = await supabaseClient.from('profiles').select('username, avatar_url, gh_notify_channel').eq('id', currentUser.id).maybeSingle();
    currentUsername = me?.username || currentUser.email || 'You';
    currentUserGhChannel = me?.gh_notify_channel || 'unset';
    posthog.identify(currentUser.id, { username: currentUsername, email: currentUser.email });
    posthog.group('circle', circleId);
    const avatarHtml = me?.avatar_url ? `<img src="${escapeHtml(me.avatar_url)}" alt="">` : initials(currentUsername);
    area.innerHTML = `
      <div class="sidebar-user">
        <a href="/profile" class="sidebar-profile">
          <div class="mini-avatar">${avatarHtml}</div>
          <div class="who"><span>${escapeHtml(currentUsername)}</span><span>view profile</span></div>
        </a>
        <button class="sidebar-signout" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      posthog.capture('signed_out');
      posthog.reset();
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });
  }

  const params = new URLSearchParams(window.location.search);
  const circleId = params.get('ID');
  const urlSaysPrivate = params.has('private');

  let circle = null;
  let myRole = null;
  let members = [];
  // Whether the private circle's feed currently has any posts — kept in
  // sync by refreshHomeFeed() and read by the invite button's cold-start
  // nudge (see openEmptyCircleNudge).
  let circleHasPosts = false;
  let currentSort = 'hot';

  async function loadCircle(){
    const { data: c, error } = await supabaseClient
      .from('circles')
      .select('id, name, description, is_private, created_at, created_by')
      .eq('id', circleId)
      .maybeSingle();
    if (error || !c) return null;
    return c;
  }

  async function loadMembers(){
    const { data: mem } = await supabaseClient
      .from('circle_members')
      .select('user_id, role, joined_at')
      .eq('circle_id', circleId)
      .order('joined_at', { ascending: true });

    const list = mem || [];
    if (list.length === 0) return [];

    const userIds = list.map(m => m.user_id);
    const { data: profs } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', userIds);

    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });

    return list
      .map(m => {
        const p = profileById[m.user_id];
        if (!p) return null;
        return { ...p, role: m.role, joined_at: m.joined_at };
      })
      .filter(Boolean);
  }

  // How many invites this member has already created for this circle since
  // midnight (local time). Every member gets their own 2/day allowance —
  // this isn't owner-only. Backs the "N/2 today" badge and the client-side
  // disable — the real enforcement lives in the DB trigger on circle_invites,
  // this is just so the button reflects it without a failed request first.
  // Assumes a `circle_invites` table with circle_id, created_by, created_at —
  // rename these to match your actual invites table if it differs.
  async function loadInvitesToday(){
    if (!currentUser) return 0;
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    const { count, error } = await supabaseClient
      .from('circle_invites')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', circleId)
      .eq('created_by', currentUser.id)
      .gte('created_at', startOfDay.toISOString());
    if (error) { console.error('loadInvitesToday failed', error); return 0; }
    return count ?? 0;
  }

  // =========================================================
  // PRIVATE MEDIA — every file lives in a private bucket and is only
  // ever shown through a short-lived signed link. Storage policies
  // (circle membership) decide who is allowed to get a link at all.
  // =========================================================
  const SIGNED_TTL = 1800;                          // links live 30 minutes
  const SIGNED_CACHE_MS = (SIGNED_TTL - 300) * 1000; // re-sign 5 min before expiry
  const signedCache = new Map();                    // "bucket/path" -> { url, exp }
  const MEDIA_BUCKETS = ['voice-posts', 'voice-comments', 'album-photos'];
  const PUBLIC_MARK = '/storage/v1/object/public/';
  const SIGN_MARK = '/storage/v1/object/sign/';

  // =========================================================
  // Voice recording — shared mic + encoder setup.
  // Requesting a plain `{ audio: true }` stream and letting
  // MediaRecorder pick its own (often very low) default bitrate is
  // what caused the crackly/"krkr" playback. This asks for a clean
  // mono signal with echo/noise/gain processing, and forces a real
  // opus/AAC bitrate so voice notes come out clear.
  // =========================================================
  async function getVoiceStream(){
    return navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1,
        sampleRate: 48000
      }
    });
  }

  function pickVoiceMimeType(){
    const preferred = ['audio/webm;codecs=opus', 'audio/mp4;codecs=mp4a.40.2', 'audio/webm'];
    return preferred.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  function createVoiceRecorder(stream){
    const mimeType = pickVoiceMimeType();
    return new MediaRecorder(stream, mimeType
      ? { mimeType, audioBitsPerSecond: 128000 }
      : { audioBitsPerSecond: 128000 });
  }

  // What we store in the DB is the object PATH. Rows created before the
  // switch hold a full public URL — we read the path back out of it.
  // Returns null for anything that isn't one of our files (external links).
  function mediaPathFrom(bucket, value){
    if (!value) return null;
    const v = String(value).trim();
    if (!/^https?:\/\//i.test(v)) return v.replace(/^\/+/, '');
    for (const mark of [PUBLIC_MARK, SIGN_MARK]) {
      const i = v.indexOf(mark + bucket + '/');
      if (i !== -1) {
        let p = v.slice(i + mark.length + bucket.length + 1).split('?')[0];
        try { p = decodeURIComponent(p); } catch (_) {}
        return p;
      }
    }
    return null;
  }

  // Turn stored refs into signed URLs (batched + cached). A file that can't
  // be signed (not a member, deleted) comes back as '' — never a fallback URL.
  async function signMedia(bucket, refs){
    const now = Date.now();
    const out = new Array(refs.length);
    const need = new Map();                         // path -> [indexes]
    refs.forEach((ref, i) => {
      const path = mediaPathFrom(bucket, ref);
      if (path === null) { out[i] = ref; return; }  // external link, leave alone
      const hit = signedCache.get(bucket + '/' + path);
      if (hit && hit.exp > now) { out[i] = hit.url; return; }
      if (!need.has(path)) need.set(path, []);
      need.get(path).push(i);
    });
    if (need.size) {
      const { data, error } = await supabaseClient.storage.from(bucket).createSignedUrls([...need.keys()], SIGNED_TTL);
      if (error) console.error('signMedia failed', error);
      (data || []).forEach(row => {
        if (row && row.signedUrl && !row.error) {
          signedCache.set(bucket + '/' + row.path, { url: row.signedUrl, exp: now + SIGNED_CACHE_MS });
          (need.get(row.path) || []).forEach(i => { out[i] = row.signedUrl; });
        }
      });
      need.forEach(idxs => idxs.forEach(i => { if (out[i] === undefined) out[i] = ''; }));
    }
    return out;
  }

  async function hydratePostMedia(list){
    const at = [];
    list.forEach((p, i) => { if (p.media_url && p.media_type === 'voice') at.push(i); });
    if (!at.length) return list;
    const urls = await signMedia('voice-posts', at.map(i => list[i].media_url));
    at.forEach((li, k) => { list[li] = { ...list[li], media_url: urls[k] }; });
    return list;
  }

  async function hydrateCommentMedia(list){
    const at = [];
    list.forEach((c, i) => { if (c.kind === 'voice' && c.audio_url) at.push(i); });
    if (!at.length) return list;
    const urls = await signMedia('voice-comments', at.map(i => list[i].audio_url));
    at.forEach((li, k) => { list[li] = { ...list[li], audio_url: urls[k] }; });
    return list;
  }

  async function hydrateAlbumMedia(list){
    if (!list.length) return list;
    const urls = await signMedia('album-photos', list.map(p => p.photo_url));
    return list.map((p, i) => ({ ...p, photo_url: urls[i] }));
  }

  // "Delete" has to mean delete: remember where the file is, drop the row,
  // then erase the file itself from storage.
  async function mediaRefBeforeDelete(table, id){
    try {
      if (table === 'posts') {
        const { data } = await supabaseClient.from('posts').select('media_url, media_type').eq('id', id).maybeSingle();
        if (!data || data.media_type !== 'voice') return null;
        return { bucket: 'voice-posts', path: mediaPathFrom('voice-posts', data.media_url) };
      }
      const { data } = await supabaseClient.from('voice_comments').select('audio_url').eq('id', id).maybeSingle();
      return data ? { bucket: 'voice-comments', path: mediaPathFrom('voice-comments', data.audio_url) } : null;
    } catch (_) { return null; }
  }
  async function eraseMedia(ref){
    if (!ref || !ref.path) return;
    signedCache.delete(ref.bucket + '/' + ref.path);
    const { error } = await supabaseClient.storage.from(ref.bucket).remove([ref.path]);
    if (error) console.warn('could not erase file from storage', error);
  }

  // A link that expired while the page stayed open: quietly get a fresh one, once.
  document.addEventListener('error', async (e) => {
    const el = e.target;
    if (!el || !['IMG', 'AUDIO', 'VIDEO'].includes(el.tagName) || el.dataset.resigned) return;
    const src = el.currentSrc || el.src || '';
    const i = src.indexOf(SIGN_MARK);
    if (i === -1) return;
    const rest = src.slice(i + SIGN_MARK.length).split('?')[0];
    const slash = rest.indexOf('/');
    const bucket = rest.slice(0, slash);
    if (!MEDIA_BUCKETS.includes(bucket)) return;
    el.dataset.resigned = '1';
    let path = rest.slice(slash + 1);
    try { path = decodeURIComponent(path); } catch (_) {}
    signedCache.delete(bucket + '/' + path);
    const [fresh] = await signMedia(bucket, [path]);
    if (fresh) el.src = fresh;
  }, true);

  // Never keep links around after sign-out.
  supabaseClient.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') signedCache.clear(); });

  // ---- posts ----
  // posts table columns: id, user_id, caption, media_url, media_type, created_at,
  // circle_id, score, likes_count, comment_count, is_anonymous
  const ANON_POST_TTL_MS = 24 * 60 * 60 * 1000; // anonymous posts live for exactly 24 hours

  async function loadPosts(sort){
    // Best-effort: sweep any anonymous posts older than 24 hours before
    // we fetch the feed (see cleanup_expired_anon_posts on the backend).
    await cleanupExpiredAnonPosts();

    let query = supabaseClient
      .from('posts')
      .select('id, user_id, caption, media_url, media_type, duration_seconds, created_at, score, likes_count, comment_count, is_anonymous, gh_question, gh_asker_name')
      .eq('circle_id', circleId);

    if (sort === 'top') query = query.order('score', { ascending: false });
    else query = query.order('created_at', { ascending: false });

    const { data, error } = await query.limit(50);
    if (error) { console.error('loadPosts failed', error); return []; }
    let list = data || [];

    // Safety net: hide any anonymous post past its 24-hour window on the
    // client too, in case the backend sweep hasn't run yet.
    list = list.filter(p => !p.is_anonymous || (Date.now() - new Date(p.created_at).getTime()) < ANON_POST_TTL_MS);

    if (list.length > 0) {
      const userIds = [...new Set(list.map(p => p.user_id))];
      const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
      const profileById = {};
      (profs || []).forEach(p => { profileById[p.id] = p; });
      list = list.map(p => ({ ...p, profiles: profileById[p.user_id] || null }));
    }

    list = await hydratePostMedia(list);

    if (sort === 'hot') {
      list = list.map(p => ({ ...p, _hot: ((p.score||0) + 0.6*(p.comment_count||0) + 1) / Math.pow((Date.now()-new Date(p.created_at))/3600000 + 2, 1.3) }))
                 .sort((a,b) => b._hot - a._hot);
    }
    return list;
  }

    const { data } = await supabaseClient.from('post_votes').select('post_id, value').eq('user_id', currentUser.id).in('post_id', postIds);
    const m = {};
    (data||[]).forEach(v => { m[v.post_id] = v.value; });

    return new Set((data||[]).map(r => r.post_id));
  }

  // Shared upload+insert+refresh used by both the mic button and hold-to-talk
  async function sendVoiceComment(postId, blob, durationSeconds){
    const mimeType = blob.type || 'audio/webm';
    const ext = mimeType.includes('mp4') ? 'm4a' : 'webm';
    const path = `${currentUser.id}/${postId}/${Date.now()}.${ext}`;
    const { error: uploadError } = await supabaseClient.storage
      .from('voice-comments')
      .upload(path, blob, { contentType: mimeType });
    if (uploadError) throw uploadError;

    const { error: insertError } = await supabaseClient.from('voice_comments').insert({
      post_id: postId,
      user_id: currentUser.id,
      audio_url: path,
      duration_seconds: durationSeconds
    });
    if (insertError) throw insertError;
    posthog.capture('comment_added', { post_id: postId, type: 'voice', duration_seconds: durationSeconds });

    const listEl = document.getElementById(`home-comment-list-${postId}`);
    const comments = await loadComments(postId);
    listEl.innerHTML = comments.map(renderCommentItem).join('');
    const countEl = document.querySelector(`.home-comment-toggle[data-post-id="${postId}"] .home-comment-count`);
    if (countEl) countEl.textContent = comments.length;
  }

  const HOLD_HINT_KEY = 'waater_hold_hint_seen';
  function markVoiceHintSeen(){
    try { localStorage.setItem(HOLD_HINT_KEY, '1'); } catch(e){}
    document.querySelectorAll('.hold-onboarding-tip').forEach(t => t.remove());
  }
  function maybeShowVoiceOnboardingHint(){
    let seen = false;
    try { seen = !!localStorage.getItem(HOLD_HINT_KEY); } catch(e){}
    if (seen) return;
    const firstBody = document.querySelector('.home-post-card .home-post-body');
    if (!firstBody || firstBody.querySelector('.hold-onboarding-tip')) return;
    const tip = document.createElement('div');
    tip.className = 'hold-onboarding-tip';
    tip.innerHTML = `<span class="hot-arrow">↓</span><span>Press &amp; hold to talk back</span>`;
    firstBody.appendChild(tip);
    setTimeout(() => tip.remove(), 6000);
  }

  // Press and hold a post to record a voice reply; a plain tap opens the thread
  // (text + voice comments), same as tapping the comment icon.
  function attachHoldToTalk(){
    document.querySelectorAll('.home-post-card').forEach(card => {
      const postId = card.dataset.postId;
      const body = card.querySelector('.home-post-body');
      if (!body || body.dataset.holdBound) return;
      body.dataset.holdBound = '1';

      const indicator = document.createElement('div');
      indicator.className = 'hold-record-indicator';
      indicator.innerHTML = `<span class="hri-dot"></span><span>Recording — release to send</span><span class="hri-timer">0:00</span>`;
      body.appendChild(indicator);
      const timerLabel = indicator.querySelector('.hri-timer');

      let pressTimer = null;
      let isRecording = false;
      let releasing = false; // UI already snapped back; recorder is still finishing in the background
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let stream = null;
      let timerInterval = null;
      let startX = 0, startY = 0;
      let activePointerId = null;
      let cancelledByScroll = false;
      const HOLD_MS = 320;
      const MAX_RECORDING_SECONDS = 60;
      const MIN_VALID_SECONDS = 0.6;
      const MOVE_CANCEL_PX = 10; // finger moving this much = scrolling, not holding

      const clearPressTimer = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

      // Snaps the UI back to idle the instant the user lets go. This is
      // intentionally separate from stopping the actual MediaRecorder:
      // on some phones the recorder can take a beat to flush and fire
      // 'onstop', and waiting for that before updating the UI is exactly
      // what made release feel laggy/buggy. The UI now never waits on it.
      const hideRecordingUI = () => {
        clearInterval(timerInterval);
        body.classList.remove('holding-talk');
        indicator.classList.remove('show');
      };

      const stopTracks = () => {
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      };

      const beginRecording = async () => {
        if (!requireAuth()) return;
        try {
          stream = await getVoiceStream();
        } catch(err){
          showToast('Microphone access denied or unavailable', 'error');
          return;
        }
        // The user may have already released while the mic permission
        // prompt was pending — don't start recording into a UI that has
        // already snapped back to idle.
        if (releasing){ stream.getTracks().forEach(t => t.stop()); stream = null; return; }

        mediaRecorder = createVoiceRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const durationSeconds = startTime ? (Date.now() - startTime) / 1000 : 0;
          stopTracks();
          isRecording = false;
          releasing = false;
          if (cancelledByScroll){ cancelledByScroll = false; return; }
          if (durationSeconds < MIN_VALID_SECONDS) return;
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          try {
            await sendVoiceComment(postId, blob, durationSeconds);
            showToast('Voice reply sent');
            markVoiceHintSeen();
          } catch (err) {
            showToast(err.message || 'Could not send voice reply', 'error');
          }
        };

        isRecording = true;
        body.classList.add('holding-talk');
        indicator.classList.add('show');
        if (navigator.vibrate) navigator.vibrate(12);
        startTime = Date.now();
        mediaRecorder.start();
        timerInterval = setInterval(() => {
          const secs = Math.floor((Date.now() - startTime) / 1000);
          timerLabel.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_RECORDING_SECONDS) finishRecording(false);
        }, 200);
      };

      // The single exit path for a live recording: hide the UI now,
      // stop the recorder in the background. Called on release, on
      // scroll-cancel, on pointercancel, and on hitting the max length.
      const finishRecording = (cancel) => {
        cancelledByScroll = cancel;
        releasing = true;
        hideRecordingUI();
        if (mediaRecorder && mediaRecorder.state !== 'inactive'){
          mediaRecorder.stop();
        } else {
          stopTracks();
          isRecording = false;
          releasing = false;
        }
      };

      const isInteractiveTarget = (target) =>
        target.closest('.home-post-actions, .home-comments, .home-post-delete, .whisper-reveal, audio, video, a, button');

      // Pointer Events (not separate mouse/touch listeners) so a real touch
      // can't also replay as a synthetic mousedown/mouseup a moment later —
      // that ghost event was what made release feel unreliable, since it
      // could quietly re-arm the press timer or re-open the thread right
      // after a recording had just been sent. setPointerCapture keeps every
      // move/up event routed here even if the finger drifts off this card.
      const onPointerDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (isInteractiveTarget(e.target)) return;
        activePointerId = e.pointerId;
        startX = e.clientX; startY = e.clientY;
        releasing = false;
        clearPressTimer();
        if (body.setPointerCapture){
          try { body.setPointerCapture(e.pointerId); } catch(err){}
        }
        pressTimer = setTimeout(() => { pressTimer = null; beginRecording(); }, HOLD_MS);
      };

      const onPointerMove = (e) => {
        if (e.pointerId !== activePointerId) return;
        if (!pressTimer && !isRecording) return;
        const dx = Math.abs(e.clientX - startX);
        const dy = Math.abs(e.clientY - startY);
        if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX){
          // This is a scroll, not a hold — bail out without sending anything.
          clearPressTimer();
          if (isRecording) finishRecording(true);
        }
      };

      const onPointerUp = (e) => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        if (pressTimer){
          clearPressTimer();
          if (!isInteractiveTarget(e.target)) openComments(postId);
          return;
        }
        if (isRecording) finishRecording(false);
      };

      const onPointerCancel = (e) => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        clearPressTimer();
        if (isRecording) finishRecording(true);
      };

      body.addEventListener('pointerdown', onPointerDown);
      body.addEventListener('pointermove', onPointerMove);
      body.addEventListener('pointerup', onPointerUp);
      body.addEventListener('pointercancel', onPointerCancel);
    });
  }

  async function loadComments(postId){
    const [{ data: textRows }, { data: voiceRows }] = await Promise.all([
      supabaseClient.from('post_comments').select('id, user_id, content, created_at').eq('post_id', postId),
      supabaseClient.from('voice_comments').select('id, user_id, audio_url, duration_seconds, created_at').eq('post_id', postId)
    ]);
    const combined = [
      ...(textRows || []).map(c => ({ ...c, kind: 'text' })),
      ...(voiceRows || []).map(c => ({ ...c, kind: 'voice' }))
    ].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    if (combined.length === 0) return [];
    const userIds = [...new Set(combined.map(c => c.user_id))];
    const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });
    const withProfiles = combined.map(c => ({ ...c, profile: profileById[c.user_id] || null }));
    return await hydrateCommentMedia(withProfiles);
  }

          if (error) throw error;

        } catch (err) {

    });

    document.querySelectorAll('.home-comment-mic').forEach(btn => {
      const postId = btn.dataset.postId;
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let timerInterval = null;
      const timerEl = document.getElementById(`home-comment-rec-timer-${postId}`);

      btn.addEventListener('click', async () => {
        if (!requireAuth()) return;

        if (btn.classList.contains('recording')) {
          mediaRecorder.stop();
          return;
        }

        try {
          const stream = await getVoiceStream();
          mediaRecorder = createVoiceRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            timerEl.style.display = 'none';
            btn.classList.remove('recording');

            const durationSeconds = (Date.now() - startTime) / 1000;
            const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });

            btn.disabled = true;
            try {
              await sendVoiceComment(postId, blob, durationSeconds);
              showToast('Voice comment posted');
            } catch (err) {
              showToast(err.message || 'Could not post voice comment', 'error');
            } finally {
              btn.disabled = false;
            }
          };

          const MAX_RECORDING_SECONDS = 60;

          mediaRecorder.start();
          startTime = Date.now();
          btn.classList.add('recording');
          timerEl.style.display = 'inline';
          timerInterval = setInterval(() => {
            const secs = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_RECORDING_SECONDS) {
              mediaRecorder.stop();
            }
          }, 250);

        } catch (err) {
          showToast('Microphone access denied or unavailable', 'error');
        }
      });
    });
  }

  async function loadActivePrompt(){
    if (!currentUser) return null;

    // *only* way to see a question. Previously, if the recipient opened the
    // circle normally instead of the exact clipboard link, this returned

        .eq('id', promptId)
        .eq('to_user_id', currentUser.id)
        .is('answered_at', null)
        .maybeSingle();
      if (!error && data) return data;
      // Link was stale, already answered, or wrong — fall through and still
      // check for whatever's actually waiting, instead of showing nothing.
    }

    const { data, error } = await supabaseClient
      .from('golden_hour_prompts')

      .eq('to_user_id', currentUser.id)

  function groupPhotosByMonth(photos){
    const groups = new Map();
    photos.forEach(p => {
      const d = new Date(p.created_at);
      const key = isNaN(d) ? 'Earlier' : d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });

  // =========================================================
  // GOLDEN HOUR — gating (5-6pm, once a day) + the feed card
  // =========================================================
  const GOLDEN_HOUR_START = 17; // 5pm
  const GOLDEN_HOUR_END = 18;   // 6pm
  const GH_OVERRIDE_KEY = 'waater_gh_test_override';

  // Testing helper: visit this page once with ?ghtest=1 in the URL and
  // Golden Hour will stay "live" on this device/browser until you visit
  // with ?ghtest=0 (or clear it from the test banner on the card).
  (function applyGoldenHourTestParam(){
    const v = params.get('ghtest');
    if (v === '1') localStorage.setItem(GH_OVERRIDE_KEY, '1');
    if (v === '0') localStorage.removeItem(GH_OVERRIDE_KEY);
  })();

  function isGoldenHourOverrideOn(){
    return localStorage.getItem(GH_OVERRIDE_KEY) === '1';
  }

  function isGoldenHourNow(){
    if (isGoldenHourOverrideOn()) return true;
    const h = new Date().getHours();
    return h >= GOLDEN_HOUR_START && h < GOLDEN_HOUR_END;
  }

  // A prompt unlocks at 6pm on the day it was sent (prompts can only be
  // sent 5-6pm, so this is always "later today" relative to created_at).
  function goldenHourRevealTime(prompt){
    const d = new Date(prompt.created_at || Date.now());
    d.setHours(GOLDEN_HOUR_END, 0, 0, 0);
    return d.getTime();
  }
  function isPromptRevealed(prompt){
    if (!prompt) return false;
    if (isGoldenHourOverrideOn()) return true; // test mode: skip the wait
    return Date.now() >= goldenHourRevealTime(prompt);
  }

  function msUntilHour(hour){
    const now = new Date();
    const t = new Date(now);
    t.setHours(hour, 0, 0, 0);
    if (t <= now) t.setDate(t.getDate() + 1);
    return t - now;
  }

  function formatCountdown(ms){
    ms = Math.max(0, ms);
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  async function hasSentGoldenHourPromptToday(){

      .from('golden_hour_prompts')

  }

  function startGoldenHourTicker(){
    clearInterval(goldenHourTimer);
    ghLastLiveState = isGoldenHourNow();
    updateGoldenHourCountdownText();
    goldenHourTimer = setInterval(() => {
      const nowLive = isGoldenHourNow();
      if (nowLive !== ghLastLiveState){
        ghLastLiveState = nowLive;
        clearInterval(goldenHourTimer);
        initGoldenHourCard();
        return;
      }
      updateGoldenHourCountdownText();
    }, 1000);
  }

  function updateGoldenHourCountdownText(){
    const target = document.getElementById('ghCountdown');
    if (!target){ clearInterval(goldenHourTimer); return; }
    target.textContent = isGoldenHourNow()
      ? formatCountdown(msUntilHour(GOLDEN_HOUR_END))
      : formatCountdown(msUntilHour(GOLDEN_HOUR_START));
  }

  function openSendPromptModal(toUserId, toUsername){
    const modal = document.createElement('div');
    modal.className = 'invite-modal-backdrop';
    modal.innerHTML = `
      <div class="invite-modal">
        <h3>Ask ${escapeHtml(toUsername)} something</h3>
        <p>They'll see a blurred card waiting for them — it only unlocks once Golden Hour ends.</p>
        <textarea id="promptQuestionInput" maxlength="200" placeholder="What do you want to ask them?"></textarea>
        <div class="gh-send-as" role="radiogroup" aria-label="Send as">
          <label class="gh-send-as-opt">
            <input type="radio" name="ghSendAs" value="anon" checked>
            <span>Send anonymously</span>
          </label>
          <label class="gh-send-as-opt">
            <input type="radio" name="ghSendAs" value="self">
            <span>Send as yourself</span>
          </label>
        </div>
        <p class="gh-send-as-note">Either way, ${escapeHtml(toUsername)} only sees "Someone asked you something" until the blur lifts.</p>
        <div class="invite-modal-row">
          <button class="invite-modal-skip" type="button" id="promptModalCancel">Cancel</button>
          <button class="invite-modal-send" type="button" id="promptModalSend">Send</button>
        </div>
      </div>`;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 220); };
    modal.querySelector('#promptModalCancel').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    modal.querySelector('#promptModalSend').addEventListener('click', async () => {
      const question = modal.querySelector('#promptQuestionInput').value.trim();
      if (!question) return;
      const isAnon = modal.querySelector('input[name="ghSendAs"]:checked')?.value !== 'self';

      if (!isGoldenHourNow()){
        showToast("Golden Hour just closed — try again tomorrow at 5", 'error');
        return;
      }
      if (await hasSentGoldenHourPromptToday()){
        showToast("You've already sent your question for today", 'error');
        return;
      }

      const sendBtn = modal.querySelector('#promptModalSend');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        const { data, error } = await supabaseClient
          .from('golden_hour_prompts')
          .insert({
            circle_id: circleId,
            from_user_id: currentUser.id,
            to_user_id: toUserId,
            question,
            is_anonymous: isAnon,
          })
          .select('id')
          .single();
        if (error) throw error;

        const link = `${window.location.origin}/circle?private&ID=${encodeURIComponent(circleId)}&prompt=${encodeURIComponent(data.id)}`;
        await navigator.clipboard.writeText(link);
        showToast('Question sent — link copied 🔗');
        goldenHourAskedToday = true;
        renderGoldenHourCard();
        close();
      } catch (err) {
        if (err.code === '23505'){
          showToast("You've already sent your question for today", 'error');
          goldenHourAskedToday = true;
          renderGoldenHourCard();
        } else {
          showToast(err.message || 'Could not send question', 'error');
        }
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    });
  }

  function renderAlbumGallery(photos){

        </div>
      `;
    }
    // The newest photo gets one featured slot up top; everything else,
    // including that same photo's neighbours, keeps strict chronological
    // order in the grid below so scrolling still reads like a timeline.
    const [heroPhoto, ...rest] = photos;
    const groups = groupPhotosByMonth(rest);
    let idx = 0;
    const groupsHtml = [...groups.entries()].map(([label, groupPhotos]) => {
      const tiles = groupPhotos.map(ph => {

      return `

  // Fires the pop + flash + notification the moment a pending prompt's

  let promptRevealTicker = null;
  function startPromptRevealTicker(){

      const countdownEl = document.getElementById('ghRevealCountdown');

      if (revealNotifiedIds.has(activePrompt.id) || !isPromptRevealed(activePrompt)) return;

  function triggerPromptReveal(prompt){
    const banner = document.getElementById('promptPinBanner');
    const asker = members.find(m => m.id === prompt.from_user_id);
    const name = prompt.is_anonymous ? 'Anonymous' : (asker?.username || 'Someone');
    if (banner && banner.dataset.promptId === String(prompt.id) && !banner.classList.contains('revealed')){
      banner.classList.add('revealed');
      const eyebrowText = document.getElementById('ghRevealEyebrowText');
      if (eyebrowText) eyebrowText.textContent = `${name} asked you something`;
      document.getElementById('ghRevealLock')?.remove();
      if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
      const flash = document.createElement('div');
      flash.className = 'gh-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 500);
    }
    showToast(`🌇 Golden Hour's over — ${name === 'Anonymous' ? "your question" : name + "'s question"} is revealed`);
    // No local Notification() call here anymore — the golden-hour-notify
    // cron sends a real push (or email) server-side now, so firing one
    // here too would just double-notify anyone with the tab open.
  }

  // =========================================================
  // GOLDEN HOUR — reveal notification preference (push vs. email)
  // Shown once per person, only when they actually have a pending,
  // unrevealed question waiting — not on every page load.
  // =========================================================
  const VAPID_PUBLIC_KEY = 'BCF1ZKxia_XUAstPJrcYUqocuUO85i1gXozMtOoBZxJxqB3y7Sihi5cj0UW2cBtiHUQwZhb2UqYDOk9dzC_B090';

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
  }

  async function registerServiceWorker(){
    if (!('serviceWorker' in navigator)) return null;
    try { return await navigator.serviceWorker.register('/sw.js'); }
    catch (err){ console.error('Service worker registration failed:', err); return null; }
  }

  async function subscribeToPush(){
    if (!('PushManager' in window) || !currentUser) return;
    const registration = await registerServiceWorker();
    if (!registration) return;
    try {
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription){
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      const raw = subscription.toJSON();
      const { error } = await supabaseClient.from('push_subscriptions').upsert(
        { user_id: currentUser.id, endpoint: raw.endpoint, p256dh: raw.keys.p256dh, auth: raw.keys.auth },
        { onConflict: 'endpoint' }
      );
      if (error) throw error;
    } catch (err){ console.error('Push subscription failed:', err); }
  }

  async function setGhNotifyChannel(channel){
    currentUserGhChannel = channel;
    if (!currentUser) return;
    const { error } = await supabaseClient.from('profiles').update({ gh_notify_channel: channel }).eq('id', currentUser.id);
    if (error) console.error('setGhNotifyChannel failed', error);
  }

  // Decides whether to ask, silently reconcile, or do nothing — the actual
  // Yes/No prompt only ever shows when there's a real pending question AND
  // the person hasn't already told us push or email before.
  async function maybePromptGoldenHourNotify(){
    if (!currentUser || !activePrompt || isPromptRevealed(activePrompt)) return;

    if (!('Notification' in window) || !('PushManager' in window)){
      if (currentUserGhChannel !== 'email') await setGhNotifyChannel('email');
      return;
    }
    if (Notification.permission === 'denied'){
      if (currentUserGhChannel !== 'email') await setGhNotifyChannel('email');
      return;
    }
    if (Notification.permission === 'granted'){
      if (currentUserGhChannel !== 'push') await setGhNotifyChannel('push');
      await subscribeToPush();
      return;
    }
    // Notification.permission === 'default' — never decided before.
    if (currentUserGhChannel !== 'unset') return;
    showGoldenHourNotifyOverlay();
  }

  function showGoldenHourNotifyOverlay(){
    if (document.getElementById('ghNotifOverlay')) return;
    const overlay = document.createElement('div');
    overlay.className = 'invite-modal-backdrop';
    overlay.id = 'ghNotifOverlay';
    overlay.innerHTML = `
      <div class="invite-modal">
        <h3>Enable notifications</h3>
        <p>We'll ping you the second Golden Hour ends and your card unblurs. Say no and we'll email you instead — this is just for Golden Hour, your other email settings aren't touched.</p>
        <div class="invite-modal-row">
          <button class="invite-modal-skip" type="button" id="ghNotifNoBtn">No, email me</button>
          <button class="invite-modal-send" type="button" id="ghNotifYesBtn">Yes, notify me</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));
    const close = () => { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 220); };

    overlay.querySelector('#ghNotifNoBtn').addEventListener('click', async () => {
      await setGhNotifyChannel('email');
      showToast("Got it — we'll email you when it unblurs 📧");
      close();
    });
    overlay.querySelector('#ghNotifYesBtn').addEventListener('click', async () => {
      close();
      try {
        const result = await Notification.requestPermission();
        if (result === 'granted'){
          await setGhNotifyChannel('push');
          await subscribeToPush();
          showToast('Notifications on 🔔');
        } else {
          // They said yes here but denied the real browser prompt — fall
          // back to email rather than leaving them with nothing.
          await setGhNotifyChannel('email');
          showToast("No worries — we'll email you instead 📧");
        }
      } catch (err){
        console.error('Notification permission request failed:', err);
        await setGhNotifyChannel('email');
      }
    });
  }

  function openGalleryLightbox(photos, startIndex){
    let idx = startIndex;

    const close = () => {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => overlay.remove(), 200);
    };

    function render(){
      const photo = photos[idx];
      const m = members.find(x => x.id === photo.user_id);
      const name = m?.username || 'Someone';
      overlay.innerHTML = `
        <button class="album-lightbox-close" id="albumLbClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>

            <span>${timeAgo(photo.created_at)}</span>
          </div>
        </div>
      `;
      overlay.querySelector('#albumLbClose').addEventListener('click', close);
      const prevBtn = overlay.querySelector('#albumLbPrev');
      const nextBtn = overlay.querySelector('#albumLbNext');
      if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx - 1 + photos.length) % photos.length; render(); });
      if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx + 1) % photos.length; render(); });
    }

    function onKey(e){
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft' && photos.length > 1){ idx = (idx - 1 + photos.length) % photos.length; render(); }
      else if (e.key === 'ArrowRight' && photos.length > 1){ idx = (idx + 1) % photos.length; render(); }
    }

    render();
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => overlay.classList.add('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  }

        <textarea id="albumCaptionInput" maxlength="140" placeholder="${promptToAnswer ? 'Answer their question... (optional)' : 'Say something about this one... (optional)'}"></textarea>
        <div class="album-modal-row">
          <button class="album-modal-cancel" type="button" id="albumModalCancel">Cancel</button>
          <button class="album-modal-post" type="button" id="albumModalPost" disabled>Post to album</button>
        </div>
      </div>
    `;

    const canvasWrap = modal.querySelector('#albumCanvasWrap');
    const filterRow = modal.querySelector('#albumFilterRow');
    const postBtn = modal.querySelector('#albumModalPost');

    let sourceImg = null;
    let activeFilterId = 'original';
    let canvas = null;

    function drawWithFilter(filterCss){
      if (!sourceImg) return;
      if (!canvas){
        canvas = document.createElement('canvas');
        canvasWrap.innerHTML = '';
        canvasWrap.appendChild(canvas);
      }
      const size = 900;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.filter = filterCss;
      const scale = Math.max(size / sourceImg.width, size / sourceImg.height);
      const w = sourceImg.width * scale, h = sourceImg.height * scale;
      ctx.drawImage(sourceImg, (size - w) / 2, (size - h) / 2, w, h);
    }

    function renderFilterSwatches(){
      filterRow.style.display = 'flex';
      filterRow.innerHTML = ALBUM_FILTERS.map(f => `
        <button class="album-filter-swatch${f.id === activeFilterId ? ' active' : ''}" data-filter="${f.id}" type="button">
          <span class="sw" style="filter:${f.css === 'none' ? '' : f.css};background-image:url('${sourceImg.src}');background-size:cover;background-position:center;"></span>
          <span>${f.label}</span>
        </button>
      `).join('');
      filterRow.querySelectorAll('.album-filter-swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilterId = btn.dataset.filter;
          filterRow.querySelectorAll('.album-filter-swatch').forEach(b => b.classList.toggle('active', b === btn));
          const f = ALBUM_FILTERS.find(x => x.id === activeFilterId);
          drawWithFilter(f.css === 'none' ? 'none' : f.css);
        });
      });
    }

    function handleFile(file){
      if (!file) return;
      canvas = null;
      canvasWrap.innerHTML = `
        <div class="album-canvas-loading">
          <span class="ring"></span>
          <span class="txt">Bringing your photo in…</span>
        </div>`;
      postBtn.disabled = true;
      const reader = new FileReader();
      reader.onerror = () => {
        canvasWrap.innerHTML = `<div class="album-canvas-placeholder">Couldn't read that photo — try again.</div>`;
      };
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => {
          canvasWrap.innerHTML = `<div class="album-canvas-placeholder">Couldn't read that photo — try again.</div>`;
        };
        img.onload = () => {
          sourceImg = img;
          drawWithFilter('none');
          renderFilterSwatches();
          postBtn.disabled = false;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    modal.querySelector('#albumTakePhoto').addEventListener('click', () => modal.querySelector('#albumFileCamera').click());
    modal.querySelector('#albumPickPhoto').addEventListener('click', () => modal.querySelector('#albumFileGallery').click());
    modal.querySelector('#albumFileCamera').addEventListener('change', (e) => handleFile(e.target.files[0]));
    modal.querySelector('#albumFileGallery').addEventListener('change', (e) => handleFile(e.target.files[0]));

    const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 220); };
    modal.querySelector('#albumModalCancel').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    postBtn.addEventListener('click', async () => {
      if (!canvas || !albumId) return;
      const takeBtn = modal.querySelector('#albumTakePhoto');
      const pickBtn = modal.querySelector('#albumPickPhoto');
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span> Posting...`;
      takeBtn.disabled = true;
      pickBtn.disabled = true;
      filterRow.style.pointerEvents = 'none';
      filterRow.style.opacity = '.4';
      captionInput.disabled = true;

      const overlay = document.createElement('div');
      overlay.className = 'album-canvas-uploading';
      overlay.innerHTML = `
        <span class="ring"></span>
        <span class="txt">Saving to the album…</span>
        <span class="sub">Just this circle will ever see it</span>
        <span class="album-upload-bar"></span>
      `;
      canvasWrap.appendChild(overlay);

      const resetControls = () => {
        overlay.remove();
        postBtn.disabled = false;
        postBtn.textContent = 'Post to album';
        takeBtn.disabled = false;
        pickBtn.disabled = false;
        filterRow.style.pointerEvents = '';
        filterRow.style.opacity = '';
        captionInput.disabled = false;
      };

      try {
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
        const path = `${albumId}/${Date.now()}-${currentUser.id}.jpg`;
        const { error: uploadError } = await supabaseClient.storage
          .from('album-photos')
          .upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;

        const { data: newPhoto, error: insertError } = await supabaseClient.from('album_photos').insert({
          album_id: albumId,
          user_id: currentUser.id,
          photo_url: path,
          filter_applied: activeFilterId,
          caption: captionInput.value.trim() || null,
        }).select('id').single();
        if (insertError) throw insertError;
        posthog.capture('album_photo_added', { circle_id: circleId, filter_applied: activeFilterId, answered_prompt: !!promptToAnswer });

        showToast('Added to the album 📸');
        close();
        await refreshAlbumGallery();
      } catch (err) {
        resetControls();
        showToast(err.message || 'Could not post photo', 'error');
      }
    });
  }

  // Golden Hour — reply to a pinned question with a recorded voice note.
  // Records straight into the browser (MediaRecorder, same as the regular
  // voice-post button), lets the person preview/re-record before sending,
  // then posts it to the main feed — tagged with the question it answers.
  function openGoldenHourVoiceReplyModal(promptToAnswer){
    if (!promptToAnswer) return;
    const asker = members.find(m => m.id === promptToAnswer.from_user_id);
    // Respect the sender's anonymity choice here too — this modal only
    // opens once the card is already unblurred, but that reveal shows
    // "Anonymous" for anon sends, so this name has to match.
    const askerName = promptToAnswer.is_anonymous ? 'Anonymous' : (asker?.username || 'Someone');

    const modal = document.createElement('div');
    modal.className = 'album-modal-backdrop';
    modal.innerHTML = `
      <div class="album-modal">
        <h3>Reply with your voice</h3>
        <p class="hint">Only ${escapeHtml(askerName)} will hear this.</p>
        <div class="album-modal-pinned-q">
          <span class="pin-ic">🌇</span>
          <span>${escapeHtml(promptToAnswer.question)}</span>
        </div>
        <div class="gh-voice-stage" id="ghVoiceStage">
          <button class="gh-voice-record-btn" id="ghVoiceRecordBtn" type="button" aria-label="Record">
            <svg class="gh-voice-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            <span class="gh-voice-stop-icon"></span>
          </button>
          <span class="gh-voice-hint" id="ghVoiceHint">Tap to record</span>
          <span class="gh-voice-timer" id="ghVoiceTimer" style="display:none;">0:00</span>
        </div>
        <textarea id="ghVoiceCaption" maxlength="140" placeholder="Add a caption... (optional)" style="display:none;"></textarea>
        <div class="album-modal-row">
          <button class="album-modal-cancel" type="button" id="ghVoiceCancel">Cancel</button>
          <button class="album-modal-post" type="button" id="ghVoiceSend" disabled>Send reply</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const stage = modal.querySelector('#ghVoiceStage');
    const recordBtn = modal.querySelector('#ghVoiceRecordBtn');
    const hint = modal.querySelector('#ghVoiceHint');
    const timerEl = modal.querySelector('#ghVoiceTimer');
    const captionInput = modal.querySelector('#ghVoiceCaption');
    const sendBtn = modal.querySelector('#ghVoiceSend');
    const cancelBtn = modal.querySelector('#ghVoiceCancel');

    const MAX_SECONDS = 90;
    let recorder = null;
    let chunks = [];
    let stream = null;
    let startTime = null;
    let timerInterval = null;
    let recordedBlob = null;
    let durationSeconds = 0;

    const close = () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      clearInterval(timerInterval);
      modal.classList.remove('show');
      setTimeout(() => modal.remove(), 220);
    };
    cancelBtn.addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    function renderPreview(){
      const url = URL.createObjectURL(recordedBlob);
      stage.innerHTML = `
        <div class="gh-voice-preview">
          <audio src="${url}" controls controlsList="nodownload noremoteplayback" oncontextmenu="return false;"></audio>
          <button class="gh-voice-rerecord" type="button" id="ghVoiceRerecord">Re-record</button>
        </div>
      `;
      stage.querySelector('#ghVoiceRerecord').addEventListener('click', () => {
        recordedBlob = null;
        sendBtn.disabled = true;
        renderIdleStage();
      });
      captionInput.style.display = 'block';
      sendBtn.disabled = false;
    }

    function renderIdleStage(){
      stage.innerHTML = `
        <button class="gh-voice-record-btn" id="ghVoiceRecordBtn" type="button" aria-label="Record">
          <svg class="gh-voice-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span class="gh-voice-stop-icon"></span>
        </button>
        <span class="gh-voice-hint" id="ghVoiceHint">Tap to record</span>
        <span class="gh-voice-timer" id="ghVoiceTimer" style="display:none;">0:00</span>
      `;
      wireRecordBtn(stage.querySelector('#ghVoiceRecordBtn'), stage.querySelector('#ghVoiceHint'), stage.querySelector('#ghVoiceTimer'));
    }

    function wireRecordBtn(btn, hintEl, timerEl){
      btn.addEventListener('click', async () => {
        if (btn.classList.contains('recording')){ recorder.stop(); return; }
        try {
          stream = await getVoiceStream();
          recorder = createVoiceRecorder(stream);
          chunks = [];
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            durationSeconds = (Date.now() - startTime) / 1000;
            recordedBlob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
            renderPreview();
          };
          recorder.start();
          startTime = Date.now();
          btn.classList.add('recording');
          hintEl.textContent = 'Recording — tap to stop';
          timerEl.style.display = 'inline';
          if (navigator.vibrate) navigator.vibrate(15);
          timerInterval = setInterval(() => {
            const secs = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_SECONDS) recorder.stop();
          }, 250);
        } catch (err) {
          showToast('Microphone access denied or unavailable', 'error');
        }
      });
    }
    wireRecordBtn(recordBtn, hint, timerEl);

    sendBtn.addEventListener('click', async () => {
      if (!recordedBlob || !currentUser) return;
      sendBtn.disabled = true;
      cancelBtn.disabled = true;
      sendBtn.innerHTML = `<span class="mini-spinner"></span> Sending...`;

      try {
        const ghMimeType = recordedBlob.type || 'audio/webm';
        const ghExt = ghMimeType.includes('mp4') ? 'm4a' : 'webm';
        const path = `${currentUser.id}/${circleId}/${Date.now()}-gh.${ghExt}`;

          .upload(path, recordedBlob, { contentType: ghMimeType });

        const { error: insertError } = await supabaseClient.from('posts').insert({
          circle_id: circleId,
          user_id: currentUser.id,
          caption: captionInput.value.trim() || null,
          media_url: path,
          media_type: 'voice',
          duration_seconds: durationSeconds,
          is_anonymous: false,
          gh_question: promptToAnswer.question,
          gh_asker_name: askerName,
        });
        if (insertError) throw insertError;
        posthog.capture('golden_hour_prompt_answered', { circle_id: circleId, prompt_id: promptToAnswer.id, response_type: 'voice', duration_seconds: durationSeconds });

        await supabaseClient
          .from('golden_hour_prompts')
          .update({ answered_at: new Date().toISOString() })
          .eq('id', promptToAnswer.id);

        revealNotifiedIds.delete(promptToAnswer.id);
        clearInterval(promptRevealTicker);
        activePrompt = null;
        const url = new URL(window.location.href);
        url.searchParams.delete('prompt');
        window.history.replaceState(null, '', url.pathname + url.search);

        showToast('Reply sent 🎤');
        close();
        document.getElementById('ghPinSlot').innerHTML = '';
        await refreshHomeFeed();
      } catch (err) {
        sendBtn.disabled = false;
        cancelBtn.disabled = false;
        sendBtn.textContent = 'Send reply';
        showToast(err.message || 'Could not send your reply', 'error');
      }
    });
  }

    const WHISPER_PROMPTS = [
      "What's the one thing you did but didn't get punished for?",
      "What's a secret you've never told this circle?",
      "What's something you'd only admit anonymously?",
      "What's a lie you told that no one ever found out about?",
