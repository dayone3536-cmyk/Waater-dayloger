    const shuffledPromptOrder = () => {
      const order = WHISPER_PROMPTS.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return order;
    };

    const stopWhisperPrompts = () => {
      if (whisperPromptTimer){ clearInterval(whisperPromptTimer); whisperPromptTimer = null; }
    };
    const startWhisperPrompts = () => {
      stopWhisperPrompts();
      whisperPromptOrder = shuffledPromptOrder();
      whisperPromptIndex = 0;
      textarea.placeholder = WHISPER_PROMPTS[whisperPromptOrder[0]];
      whisperPromptTimer = setInterval(() => {
        // Don't yank the placeholder out from under someone who's typing —
        // it's invisible anyway once there's text, so just keep advancing
        // the index quietly and it'll show the right one if they clear it.
        whisperPromptIndex = (whisperPromptIndex + 1) % whisperPromptOrder.length;
        textarea.placeholder = WHISPER_PROMPTS[whisperPromptOrder[whisperPromptIndex]];
      }, 5000);
    };

    let isAnon = false;
    const setWhisperMode = (on) => {
      isAnon = on;
      anonToggle.classList.toggle('active', on);
      const vb = document.getElementById('homeVoiceBtn');
      if (vb) vb.classList.toggle('voice-locked', on);
      homeAnonBanner.classList.toggle('show', on);
      if (on){
        startWhisperPrompts();
      } else {
        stopWhisperPrompts();
        textarea.placeholder = NORMAL_PLACEHOLDER;
      }
    };
    anonToggle.addEventListener('click', () => {
      if (isAnon){
        setWhisperMode(false);
        showToast('Posting as yourself');
        return;
      }
      // can't go anonymous mid-recording: the voice would give them away
      if (voiceBtn.classList.contains('recording')){ showAnonVoiceNotice(); return; }
      requestWhisperMode(() => {
        setWhisperMode(true);
        posthog.capture('anonymous_mode_enabled', { circle_id: circleId });
        showToast('Whisper mode — this one stays unsigned');
      });
    });

    const voiceBtn = document.getElementById('homeVoiceBtn');
    const voiceTimer = document.getElementById('homeVoiceTimer');
    let voiceRecorder = null;
    let voiceChunks = [];
    let voiceStartTime = null;
    let voiceTimerInterval = null;
    const MAX_VOICE_SECONDS = 120;

    voiceBtn.addEventListener('click', async () => {
      if (!requireAuth()) return;

      // Voice notes can't be anonymous — friends would recognise the voice.
      if (isAnon && !voiceBtn.classList.contains('recording')){ showAnonVoiceNotice(); return; }

      if (voiceBtn.classList.contains('recording')) {
        voiceRecorder.stop();
        return;
      }

      try {
        const stream = await getVoiceStream();
        voiceRecorder = createVoiceRecorder(stream);
        voiceChunks = [];
        voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);

        voiceRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(voiceTimerInterval);
          voiceTimer.style.display = 'none';
          voiceBtn.classList.remove('recording');

          // safety net: never upload a voice recording as an anonymous post
          if (isAnon){ voiceChunks = []; showAnonVoiceNotice(); return; }

          const durationSeconds = (Date.now() - voiceStartTime) / 1000;
          const voiceMimeType = voiceRecorder.mimeType || 'audio/webm';
          const voiceExt = voiceMimeType.includes('mp4') ? 'm4a' : 'webm';
          const blob = new Blob(voiceChunks, { type: voiceMimeType });
          const path = `${currentUser.id}/${circleId}/${Date.now()}.${voiceExt}`;

          voiceBtn.disabled = true;
          try {
            const { error: uploadError } = await supabaseClient.storage
              .from('voice-posts')
              .upload(path, blob, { contentType: voiceMimeType });
            if (uploadError) throw uploadError;

            const { error: insertError } = await supabaseClient.from('posts').insert({
              circle_id: circleId,
              user_id: currentUser.id,
              caption: textarea.value.trim() || null,
              media_url: path,
              media_type: 'voice',
              duration_seconds: durationSeconds,
              is_anonymous: isAnon,
            });
            if (insertError) throw insertError;
            posthog.capture('post_created', { circle_id: circleId, media_type: 'voice', duration_seconds: durationSeconds, is_anonymous: isAnon });

            textarea.value = ''; textarea.style.height = 'auto';
            setWhisperMode(false);
            refreshPostBtn();

            showToast('Voice post shared');
            if (document.getElementById('homeComposer').classList.contains('overlay')) {
              closeComposerOverlay();
            }
            await refreshHomeFeed();
          } catch (err) {
            showToast(err.message || 'Could not post voice recording', 'error');
          } finally {
            voiceBtn.disabled = false;
          }
        };

        voiceRecorder.start();
        voiceStartTime = Date.now();
        voiceBtn.classList.add('recording');
        voiceTimer.style.display = 'inline';
        voiceTimerInterval = setInterval(() => {
          const secs = Math.floor((Date.now() - voiceStartTime) / 1000);
          voiceTimer.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_VOICE_SECONDS) voiceRecorder.stop();
        }, 250);

      } catch (err) {
        showToast('Microphone access denied or unavailable', 'error');
      }
    });

    let isPosting = false;
    postBtn.addEventListener('click', async () => {
      if (!requireAuth() || isPosting) return;
      const content = textarea.value.trim();
      const url = mediaUrl.value.trim();
      if (!content && !url) return;
      isPosting = true;
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span>`;
      const wasWhisper = isAnon;

      try {
        const { error } = await supabaseClient.from('posts').insert({
          circle_id: circleId,
          user_id: currentUser.id,
          caption: content || null,
          media_url: url || null,
          media_type: url ? (url.match(/\.(mp4|mov|webm)(\?|$)/i) ? 'video' : 'photo') : null,
          is_anonymous: wasWhisper,
        });
        if (error) throw error;
        posthog.capture('post_created', {
          circle_id: circleId,
          media_type: url ? (url.match(/\.(mp4|mov|webm)(\?|$)/i) ? 'video' : 'photo') : 'text',
          is_anonymous: wasWhisper,
          caption_length: content.length,
        });

        textarea.value = ''; mediaUrl.value = ''; mediaField.style.display = 'none'; mediaToggle.classList.remove('active');
        setWhisperMode(false);
        textarea.style.height = 'auto';

        showToast(wasWhisper ? 'Posted to the circle — quietly' : 'Posted to the circle');

        if (document.getElementById('homeComposer').classList.contains('overlay')) {
          closeComposerOverlay();
        }

        await refreshHomeFeed();

      } catch (err) {
        showToast(err.message || 'Could not post', 'error');
      } finally {
        isPosting = false;
        postBtn.textContent = 'Post';
        refreshPostBtn();
      }
    });

    const inviteBtn = document.getElementById('homeInviteBtn');
    let invitesUsedToday = invitesToday;
    if (inviteBtn) inviteBtn.addEventListener('click', async () => {
      // Client-side check just for instant feedback — the DB trigger on
      // circle_invites is the real enforcement, this only avoids a round
      // trip when we already know today's quota is spent.
      if (invitesUsedToday >= 2) {
        showToast("You've used both invites for today — try again tomorrow", 'error');
        return;
      }

      // Soft nudge, not a gate: if this circle has zero posts, whoever gets
      // invited next lands on a blank page and bounces. Give whoever's
      // inviting a beat to seed it first — but never block the invite if
      // they'd rather send it anyway. Applies to every member, not just
      // the circle's owner — the invite button and its 2/day quota are
      // already per-member (see loadInvitesToday), not owner-gated.
      if (!circleHasPosts) {
        posthog.capture('empty_circle_invite_nudge_shown', { circle_id: circleId });
        const choice = await openEmptyCircleNudge();
        posthog.capture('empty_circle_invite_nudge_choice', { circle_id: circleId, choice });
        if (choice === 'write') {
          const composer = document.getElementById('homeComposer');
          const composerText = document.getElementById('homeComposerText');
          if (composer) composer.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => composerText && composerText.focus(), 280);
          return;
        }
        if (choice === 'cancel') return;
        // choice === 'invite' falls through to send the invite as normal.
      }

      const note = await openInviteModal();
      try {
        // Try passing the note through to the RPC. If the backend hasn't
        // been updated to accept p_note yet, fall back to the plain call
        // so invites never break because of this feature.
        let rpcResult;
        if (note) {
          rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId, p_note: note });
          if (rpcResult.error) {
            rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
          }
        } else {
          rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
        }
        const { data, error } = rpcResult;
        if (error) throw error;
        posthog.capture('invite_sent', { circle_id: circleId, has_note: !!note, invites_used_today: invitesUsedToday + 1 });

        invitesUsedToday += 1;
        const badge = document.getElementById('inviteCountBadge');
        if (badge) {
          badge.textContent = `${invitesUsedToday}/2 today`;
          badge.style.color = invitesUsedToday >= 2 ? 'var(--danger)' : 'var(--grey)';
        }
        if (invitesUsedToday >= 2) inviteBtn.disabled = true;

        try {

          await navigator.clipboard.writeText(`${window.location.origin}/circle?code=${encodeURIComponent(data.code)}`);
          
          showToast('Invite link copied — works for 10 minutes');
        } catch (e) {
          showToast(`Invite code: ${data.code}`);
        }
      } catch (err) {
        if (err.message?.includes('invite_limit_reached')) {
          showToast("You've used both invites for today — try again tomorrow", 'error');
          invitesUsedToday = 2;
          inviteBtn.disabled = true;
        } else if (err.message?.includes('circle_full')) {
          showToast('This circle is full (max 10 members)', 'error');
        } else {
          showToast(err.message || 'Could not create invite', 'error');
        }
      }
    });

    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => switchHomeView(tab.dataset.view));
    });

    setupComposerBehavior();

    await refreshHomeFeed();
    refreshGoldenHourReveal();
    initAlbum();
    initGoldenHourCard();
    subscribeToCircleActivity();
    subscribeToGoldenHourPrompts();

    // Play the ceremony without blocking the feed load beneath it.
    if (shouldWelcome) playWelcomeCeremony(welcomeNote, welcomeInviter);

    return { shouldWelcome };
  }

  async function refreshHomeFeed(){
    const feed = document.getElementById('homeFeed');

    if (posts.length === 0){
      feed.innerHTML = `

          <div class="home-empty-orb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c4.4 0 8-3.6 8-8a8 8 0 10-8 8z"/><path d="M9 10h.01M15 10h.01"/></svg>

  const PC = { posts: [], channel: null, pending: 0, wired: false };

  const PC_ICON = {

    mask:    '<svg viewBox="0 0 32 32"><path fill="currentColor" stroke="none" d="M16 3C8.8 3 2.9 8.3 1.9 15.2c-.2 1.6 1 3 2.6 3h1.2l-1.5 2.8a1 1 0 001.8.9l1.9-3.7h16.2l1.9 3.7a1 1 0 001.8-.9L26.3 18.2h1.2c1.6 0 2.8-1.4 2.6-3C29.1 8.3 23.2 3 16 3z"/><circle cx="10.5" cy="15.5" r="2.8" fill="#14151a" stroke="none"/><circle cx="21.5" cy="15.5" r="2.8" fill="#14151a" stroke="none"/></svg>',

  // ---- small utilities --------------------------------------------------
  // escapeHtml() above doesn't escape quotes, so it isn't safe inside an
  // attribute like src="..." — these are.
  function pcEsc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // http(s) only. Anything else (javascript:, data:, garbage) returns ''.
  function pcSafeUrl(u){
    try {
      const x = new URL(String(u || '').trim(), window.location.href);
      return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
    } catch(_) { return ''; }
  }
  function pcHash(s){
    let h = 2166136261;
    for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function pcRand(seed){
    let a = seed | 0;
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pcAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    if (s < 604800) return `${Math.floor(s / 86400)}d`;
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function pcAvatar(p, size, cls){
    const name = p?.username || '?';
    const style = `--s:${size}px`;
    const url = p?.avatar_url ? pcSafeUrl(p.avatar_url) : '';
    if (url) return `<span class="pc-av ${cls || ''}" style="${style}"><img src="${pcEsc(url)}" alt="" loading="lazy"></span>`;
    const h = pcHash(name) % 360;
    return `<span class="pc-av ${cls || ''}" style="${style};background:hsl(${h} 52% 46%)">${pcEsc(initials(name))}</span>`;
  }
  function pcAnonAvatar(size, cls){
    return `<span class="pc-av anon ${cls || ''}" style="--s:${size}px">${PC_ICON.mask}</span>`;
  }
  function pcMe(){ return currentUser ? members.find(m => m.id === currentUser.id) : null; }

  // ---- cover: the orbit ---------------------------------------------------
  function pcOrbitHtml(isMember){
    const rand = pcRand(pcHash(String(circle.id)));
    // [radius as fraction of the orbit box, avatar size, capacity]
    const rings = [ { r: .17, s: 42, cap: 3 }, { r: .31, s: 36, cap: 5 }, { r: .44, s: 30, cap: 7 } ];
    const total = rings.reduce((n, r) => n + r.cap, 0);
    const wantsSlot = !isMember;
    const overflow = members.length > total;
    const visible = members.slice(0, wantsSlot || overflow ? total - 1 : total);
    const specials = wantsSlot ? 'slot' : (overflow ? 'more' : null);
    const items = visible.map(m => ({ m }));
    if (specials) items.push({ special: specials });

    let html = `
      <div class="pc-ring r1"></div><div class="pc-ring r2"></div><div class="pc-ring r3"></div><div class="pc-ring r4"></div>
      <div class="pc-core">${PC_ICON.orbit}</div>`;
    let idx = 0;
    rings.forEach(ring => {
      const chunk = items.slice(idx, idx + ring.cap);
      if (!chunk.length) return;
      const base = rand() * Math.PI * 2;
      chunk.forEach((it, i) => {
        const ang = base + (i * Math.PI * 2 / chunk.length) + (rand() - .5) * .3;
        const left = 50 + ring.r * 100 * Math.cos(ang);
        const top  = 50 + ring.r * 100 * Math.sin(ang);
        const pos = `left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;--s:${ring.s};--d:${(.15 + (idx + i) * .07).toFixed(2)}s`;
        if (it.special === 'slot'){
          html += `<button type="button" class="pc-av pc-orb slot" style="${pos}" data-act="join" aria-label="Join this circle">${PC_ICON.plus}</button>`;
        } else if (it.special === 'more'){
          html += `<span class="pc-av pc-orb more" style="${pos}">+${members.length - visible.length}</span>`;
        } else {
          const isMe = currentUser && it.m.id === currentUser.id;
          const p = it.m;
          const h = pcHash(p.username || '?') % 360;
          const url = p.avatar_url ? pcSafeUrl(p.avatar_url) : '';
          html += `<span class="pc-av pc-orb ${isMe ? 'me' : ''}" style="${pos};${url ? '' : `background:hsl(${h} 52% 46%)`}" title="${pcEsc(p.username || '')}">${url ? `<img src="${pcEsc(url)}" alt="">` : pcEsc(initials(p.username))}</span>`;
        }
      });
      idx += chunk.length;
    });
    return html;
  }

  // ---- feed rows ----------------------------------------------------------
  function pcPostHtml(post, myVote, opts){
    opts = opts || {};
    const anon = !!post.is_anonymous;
    const name = anon ? 'Anonymous' : (post.profiles?.username || 'someone');
    const mine = !!(currentUser && post.user_id === currentUser.id);

    const long = caption.length > 420 || caption.split('\n').length > 7;
    const score = post.score || 0;
    const commentCount = post.comment_count || 0;
    const mediaUrl = post.media_url ? pcSafeUrl(post.media_url) : '';

    let media = '';
    if (mediaUrl){
      const inner = post.media_type === 'video'
        ? `<video src="${pcEsc(mediaUrl)}" controls preload="metadata" playsinline></video>`
        : post.media_type === 'audio'
          ? `<audio src="${pcEsc(mediaUrl)}" controls controlsList="nodownload noremoteplayback" oncontextmenu="return false;" preload="none"></audio>`

    }

    return `
      <article class="pc-post ${opts.spot ? 'spot' : ''}" data-post-id="${pcEsc(post.id)}" data-my="${myVote || 0}">

            ${anon && mine ? '<span class="pc-you">you</span>' : ''}
            <time datetime="${pcEsc(post.created_at)}" title="${pcEsc(new Date(post.created_at).toLocaleString())}">${pcAgo(post.created_at)}</time>
          </div>
          ${caption ? `<div class="pc-text ${long ? 'clamp' : ''}">${pcEsc(caption)}</div>` : ''}

          ${media}
          <div class="pc-foot">
            <div class="pc-vote" role="group" aria-label="Vote">
              <button type="button" class="pc-v up ${myVote === 1 ? 'on' : ''}" data-act="vote" data-value="1" aria-pressed="${myVote === 1}" aria-label="Upvote">${PC_ICON.up}</button>
              <span class="pc-score ${score > 0 ? 'pos' : score < 0 ? 'neg' : ''}" data-score="${score}" aria-live="polite">${score}</span>
              <button type="button" class="pc-v down ${myVote === -1 ? 'on' : ''}" data-act="vote" data-value="-1" aria-pressed="${myVote === -1}" aria-label="Downvote">${PC_ICON.down}</button>
            </div>
            <button type="button" class="pc-cbtn" data-act="thread" aria-expanded="false" aria-label="Replies">
              ${PC_ICON.comment}<span class="pc-ccount">${commentCount > 0 ? commentCount : 'Reply'}</span>
            </button>
            ${mine ? `<button type="button" class="pc-del" data-act="del-post" aria-label="Delete post">${PC_ICON.trash}</button>` : ''}
          </div>
          <div class="pc-thread"><div class="pc-thread-clip"><div class="pc-thread-in">
            <div class="pc-clist"></div>
            ${myRole !== null ? `
              <div class="pc-cform">
                <input class="pc-cinput" type="text" maxlength="500" placeholder="Write a reply" aria-label="Write a reply">
                <button type="button" class="pc-csend" data-act="send" disabled>Reply</button>
              </div>` : `<button type="button" class="pc-cjoin" data-act="join">Join the circle to reply</button>`}
          </div></div></div>
        </div>
      </article>`;
  }

  function pcSkeleton(){
    const row = `<div class="pc-sk"><div class="a"></div><div style="flex:1"><div class="l" style="width:30%"></div><div class="l" style="width:92%"></div><div class="l" style="width:64%"></div></div></div>`;

  function pcSetCount(article, n){

  // ---- voting (optimistic, reverts on failure) --------------------------
  function pcApplyVote(article, myVote, score, burst){
    article.dataset.my = myVote;
    const up = article.querySelector('.pc-v.up'), down = article.querySelector('.pc-v.down');
    up.classList.toggle('on', myVote === 1);   up.setAttribute('aria-pressed', myVote === 1);
    down.classList.toggle('on', myVote === -1); down.setAttribute('aria-pressed', myVote === -1);
    const el = article.querySelector('.pc-score');
    const changed = Number(el.dataset.score) !== score;
    el.dataset.score = score;
    el.textContent = score;
    el.classList.toggle('pos', score > 0);
    el.classList.toggle('neg', score < 0);
    if (changed){
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
    if (burst){
      up.classList.remove('burst'); void up.offsetWidth; up.classList.add('burst');
      setTimeout(() => up.classList.remove('burst'), 520);
    }
  }

  async function pcVote(article, value){
    if (!requireAuth()) return;
    if (article.dataset.busy === '1') return;
    const id = article.dataset.postId;
    const prev = Number(article.dataset.my || 0);
    const next = prev === value ? 0 : value;
    const prevScore = Number(article.querySelector('.pc-score').dataset.score);
    pcApplyVote(article, next, prevScore + (next - prev), next === 1);
    article.dataset.busy = '1';
    try {
      const { error } = await supabaseClient.rpc('vote_post', { p_post_id: id, p_value: next });
      if (error) throw error;
      const { data } = await supabaseClient.from('posts').select('score').eq('id', id).maybeSingle();
      if (data && typeof data.score === 'number') pcApplyVote(article, next, data.score, false);
    } catch (err) {
      pcApplyVote(article, prev, prevScore, false);
      showToast(err.message || 'Could not vote', 'error');
    } finally {
      delete article.dataset.busy;
    }
  }

  // ---- replies ------------------------------------------------------------
  function pcCommentHtml(c){

    const name = p?.username || 'someone';
    const mine = !!(currentUser && c.user_id === currentUser.id);
    const body = c.kind === 'voice'
      ? `<audio controls controlsList="nodownload noremoteplayback" oncontextmenu="return false;" preload="none" src="${pcEsc(pcSafeUrl(c.audio_url))}"></audio>`
      : `<p>${pcEsc(c.content)}</p>`;
    return `
      <div class="pc-c" data-cid="${pcEsc(c.id)}" data-kind="${c.kind}">
        ${pcAvatar(p, 28)}
        <div class="pc-c-main">
          <div class="pc-c-head">
            <b>${pcEsc(name)}</b><time>${pcAgo(c.created_at)}</time>
            ${mine ? `<button type="button" class="pc-c-del" data-act="del-comment">Delete</button>` : ''}
          </div>
          ${body}

  async function pcLoadThread(article){
    const id = article.dataset.postId;
    const list = article.querySelector('.pc-clist');
    const comments = await loadComments(id);
    list.innerHTML = comments.length
      ? comments.map(pcCommentHtml).join('')
      : `<div class="pc-c-empty">No replies yet.</div>`;
    article.querySelector('.pc-thread').dataset.loaded = '1';
    pcSetCount(article, comments.length);
  }

  async function pcToggleThread(article){
    const open = article.classList.toggle('open');
    article.querySelector('.pc-cbtn').setAttribute('aria-expanded', open);
    const thread = article.querySelector('.pc-thread');
    if (open && !thread.dataset.loaded){
      article.querySelector('.pc-clist').innerHTML = `<div class="pc-c-loading">Loading replies…</div>`;
      try { await pcLoadThread(article); }
      catch (err) {
        article.querySelector('.pc-clist').innerHTML = `<div class="pc-c-empty">Couldn't load replies. Close and try again.</div>`;
      }
    }
    if (open && window.matchMedia('(min-width:900px)').matches){
      const input = article.querySelector('.pc-cinput');
      if (input) setTimeout(() => input.focus({ preventScroll: true }), 320);
    }
  }

  async function pcSendComment(article){
    if (!requireAuth()) return;
    const input = article.querySelector('.pc-cinput');
    const btn = article.querySelector('.pc-csend');
    if (!input || !btn || btn.disabled) return;
    const text = input.value.trim();
    if (!text) return;
    btn.disabled = true;
    try {
      const { error } = await supabaseClient.from('post_comments').insert({ post_id: article.dataset.postId, user_id: currentUser.id, content: text });
      if (error) throw error;
      input.value = '';
      await pcLoadThread(article);
    } catch (err) {
      showToast(err.message || 'Could not post reply', 'error');
    } finally {
      btn.disabled = !input.value.trim();
    }
  }

  // First click arms the button ("Delete?"), second click within 3s confirms.
  function pcArm(btn, armedLabel, onConfirm){
    if (btn.dataset.armed === '1'){
      clearTimeout(btn._t);
      btn.dataset.armed = '';
      return onConfirm();
    }
    const original = btn.innerHTML;
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = armedLabel;
    btn._t = setTimeout(() => {
      btn.dataset.armed = '';
      btn.classList.remove('armed');
      btn.innerHTML = original;
    }, 3000);
  }

  function pcDeletePost(article, btn){
    if (!currentUser) return;
    pcArm(btn, 'Delete?', async () => {
      btn.disabled = true;
      try {
        const fileRef = await mediaRefBeforeDelete('posts', article.dataset.postId);
        const { error } = await supabaseClient.from('posts').delete().eq('id', article.dataset.postId).eq('user_id', currentUser.id);
        if (error) throw error;
        eraseMedia(fileRef);
        article.remove();
        showToast('Post deleted');
        if (!document.querySelector('#pcFeed .pc-post')) refreshPubFeed();
      } catch (err) {
        btn.disabled = false;
        showToast(err.message || 'Could not delete post', 'error');
      }
    });
  }

  function pcDeleteComment(article, btn){
    if (!currentUser) return;
    const row = btn.closest('.pc-c');
    pcArm(btn, 'Delete?', async () => {
      btn.disabled = true;
      try {
        const table = row.dataset.kind === 'voice' ? 'voice_comments' : 'post_comments';
        const fileRef = row.dataset.kind === 'voice' ? await mediaRefBeforeDelete('voice_comments', row.dataset.cid) : null;
        const { error } = await supabaseClient.from(table).delete().eq('id', row.dataset.cid).eq('user_id', currentUser.id);
        if (error) throw error;
        eraseMedia(fileRef);
        row.remove();
        const list = article.querySelector('.pc-clist');
        const n = list.querySelectorAll('.pc-c').length;
        if (!n) list.innerHTML = `<div class="pc-c-empty">No replies yet.</div>`;
        pcSetCount(article, n);
      } catch (err) {
        btn.disabled = false;
        showToast(err.message || 'Could not delete reply', 'error');
      }
    });
  }

    const btn = document.getElementById('pcJoinBtn');
    if (btn){ btn.disabled = true; btn.innerHTML = `<span class="pc-spin"></span>`; }

  async function pcShare(){
    const url = `${window.location.origin}/circle?public&ID=${encodeURIComponent(circleId)}`;
    try {
      if (navigator.share){
        await navigator.share({ title: circle.name, text: `Join ${circle.name} on Waater`, url });
        return;

    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); showToast('Circle link copied'); }

  function pcSubscribe(){
    if (PC.channel) return;
    PC.channel = supabaseClient
      .channel(`pub-posts-${circleId}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'posts', filter: `circle_id=eq.${circleId}` },
        (payload) => {

          PC.pending += 1;

  // ---- composer -------------------------------------------------------------------
  function pcRenderPreview(raw){
    const box = document.getElementById('pcMediaPreview');
    if (!box) return;
    box.innerHTML = '';
    const safe = pcSafeUrl(raw);
    if (!raw.trim() || !safe) return;
    const isVideo = /\.(mp4|mov|webm)(\?|$)/i.test(safe);
    const el = document.createElement(isVideo ? 'video' : 'img');
    el.src = safe;
    if (isVideo){ el.controls = true; el.muted = true; el.preload = 'metadata'; el.playsInline = true; }
    else { el.alt = ''; }
    el.addEventListener('error', () => {
      box.innerHTML = `<p class="pc-hint">Can't preview this link. Use a direct link to an image or video.</p>`;
    });
    box.appendChild(el);
  }

  function pcWireComposer(){
    const wrap = document.getElementById('pcCompose');
    if (!wrap) return;
    const ph = document.getElementById('pcComposePh');
    const text = document.getElementById('pcText');
    const mediaBtn = document.getElementById('pcMediaBtn');
    const mediaField = document.getElementById('pcMediaField');
    const mediaUrl = document.getElementById('pcMediaUrl');
    const anonBtn = document.getElementById('pcAnon');
    const anonBanner = document.getElementById('pcAnonBanner');
    const postBtn = document.getElementById('pcPost');
    const avSlot = document.getElementById('pcComposeAv');
    const me = pcMe();
    let isAnon = false;

    const open = () => { wrap.classList.add('open'); text.focus(); };
    ph.addEventListener('click', open);
    window.pcOpenComposer = open;

    const refresh = () => {
      const hasUrl = !!mediaUrl.value.trim();
      postBtn.disabled = !text.value.trim() && !hasUrl;
    };
    text.addEventListener('input', () => {
      text.style.height = 'auto';
      text.style.height = Math.min(text.scrollHeight, 280) + 'px';
      refresh();
    });

    mediaBtn.addEventListener('click', () => {
      const showing = mediaField.hidden;
      mediaField.hidden = !showing;
      mediaBtn.classList.toggle('on', showing);
      mediaBtn.setAttribute('aria-pressed', showing);
      if (showing) mediaUrl.focus();
    });
    mediaUrl.addEventListener('input', () => { pcRenderPreview(mediaUrl.value); refresh(); });

    anonBtn.addEventListener('click', () => {
      isAnon = !isAnon;
      anonBtn.setAttribute('aria-pressed', isAnon);
      anonBtn.querySelector('span').textContent = isAnon ? 'Posting anonymously' : 'Anonymous';
      avSlot.innerHTML = isAnon ? pcAnonAvatar(40) : pcAvatar(me, 40);
      anonBanner.classList.toggle('show', isAnon);
    });

    let posting = false;
    postBtn.addEventListener('click', async () => {
      if (posting) return;
      const content = text.value.trim();
      const rawUrl = mediaUrl.value.trim();
      const url = rawUrl ? pcSafeUrl(rawUrl) : '';
      if (rawUrl && !url){ showToast('Media link must start with http:// or https://', 'error'); return; }
      if (!content && !url) return;
      posting = true;
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span>`;
      try {
        const { error } = await supabaseClient.from('posts').insert({
          circle_id: circleId,
          user_id: currentUser.id,
          caption: content || null,
          media_url: url || null,
          media_type: url ? (/\.(mp4|mov|webm)(\?|$)/i.test(url) ? 'video' : 'photo') : null,
          is_anonymous: isAnon
        });
        if (error) throw error;
        text.value = ''; mediaUrl.value = '';
        text.style.height = 'auto';
        pcRenderPreview('');
        mediaField.hidden = true; mediaBtn.classList.remove('on');
        if (isAnon){ anonBtn.click(); }
        wrap.classList.remove('open');
        showToast('Posted');
        pcSetSort('new');
      } catch (err) {
        showToast(err.message || 'Could not post', 'error');
      } finally {
        posting = false;
        postBtn.textContent = 'Post';
        refresh();
      }
    });
  }

  function pcUpdatePulse(posts){
    const el = document.getElementById('pcPulse');
    if (!el || currentSort === 'top') return;      // "top" isn't ordered by recency
    const dayAgo = Date.now() - 86400000;
    const n = posts.filter(p => new Date(p.created_at).getTime() > dayAgo).length;
    el.innerHTML = n === 0
      ? ''
      : `<i></i>${n}${posts.length >= 50 ? '+' : ''} ${n === 1 ? 'post' : 'posts'} today`;
  }

  async function refreshPubFeed(){
    const feed = document.getElementById('pcFeed');
    if (!feed) return;
    PC.pending = 0;
    const pill = document.getElementById('pcNew');
    if (pill) pill.classList.remove('show');

    const sortAtStart = currentSort;
    if (feed.querySelector('.pc-post')) feed.classList.add('is-loading');
    const posts = await loadPosts(sortAtStart);
    if (sortAtStart !== currentSort) return;         // a newer sort click won the race
    PC.posts = posts;
    pcUpdatePulse(posts);

    if (!posts.length){
      feed.classList.remove('is-loading');
      feed.innerHTML = `
        <div class="pc-empty">
          <h3>Nothing here yet</h3>
          <p>${myRole !== null ? 'Start the first thread and set the tone for this circle.' : 'Join the circle to start the first thread.'}</p>
          <button type="button" data-act="${myRole !== null ? 'compose' : 'join'}">${myRole !== null ? 'Start a thread' : 'Join circle'}</button>
        </div>`;
      return;
    }

    const votes = await loadMyVotes(posts.map(p => p.id));
    if (sortAtStart !== currentSort) return;

    const first = posts[0];
    const spotId = (sortAtStart === 'hot' && (first.score || 0) >= 3 &&
      Date.now() - new Date(first.created_at).getTime() < 172800000) ? first.id : null;

    feed.innerHTML = posts.map(p => pcPostHtml(p, votes[p.id] || 0, { spot: p.id === spotId })).join('');
    feed.classList.remove('is-loading');
  }

  let composerTimer = null;

  function setupComposerBehavior(){
    const fab = document.getElementById('homeFab');
    const composer = document.getElementById('homeComposer');
    if (!fab || !composer) return;
    const THRESHOLD = 40;
    const isMobile = () => window.matchMedia('(max-width:899.98px)').matches;

    function resetToVisible(){
      // Desktop (or a resize onto desktop): composer is always visible,
      // never collapsed, never in overlay mode. This is the fix — nothing
      // here should ever require a refresh to undo.
      composer.classList.remove('collapsed', 'overlay', 'overlay-open');
      fab.classList.remove('show');
    }

    function onScroll(){
      if (!isMobile()){ resetToVisible(); return; }
      if (composer.classList.contains('overlay-open')) return;

      const y = window.scrollY;
      const isCollapsed = composer.classList.contains('collapsed');

      if (!isCollapsed){
        // how much scroll room would be left once the composer is gone?
        const composerH = composer.offsetHeight + 18; // +18 for its margin-top
        const spare = document.documentElement.scrollHeight - window.innerHeight - composerH;

        // only collapse if there's still plenty of page left to scroll
        if (y > THRESHOLD && spare > THRESHOLD + 60){
          composer.classList.add('collapsed');
          fab.classList.add('show');
        }
      } else if (y < 4){
        // only expand when you're basically at the very top
        composer.classList.remove('collapsed');
        fab.classList.remove('show');
      }
    }


    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll, { passive:true });
    onScroll();

    fab.addEventListener('click', () => {
      composer.classList.remove('collapsed');
      composer.classList.add('overlay', 'overlay-open');
      fab.classList.remove('show');
      document.getElementById('homeComposerText').focus();
      resetComposerTimer();
    });

    document.addEventListener('click', (e) => {
      if (!composer.classList.contains('overlay-open')) return;
      if (composer.contains(e.target) || fab.contains(e.target)) return;
      closeComposerOverlay();
    });
  }

  function resetComposerTimer(){
    clearTimeout(composerTimer);
    composerTimer = setTimeout(() => {
      const text = document.getElementById('homeComposerText').value.trim();
      const media = document.getElementById('homeMediaUrl').value.trim();
      const focused = document.activeElement === document.getElementById('homeComposerText')
        || document.activeElement === document.getElementById('homeMediaUrl');
      // Only auto-close an empty, untouched composer — never cut someone off
      // mid-thought just because they paused for a few seconds.
      if (!text && !media && !focused) closeComposerOverlay();
    }, 15000);
  }

  function closeComposerOverlay(){
    const composer = document.getElementById('homeComposer');
    clearTimeout(composerTimer);
    composer.classList.remove('overlay-open');
    setTimeout(() => composer.classList.remove('overlay'), 260);
    composer.classList.add('collapsed');
    if (window.scrollY > 40) document.getElementById('homeFab')?.classList.add('show');
  }

  // =========================================================
  // SCREENSHOT GUARD — deterrent layer for private circles
  //
  // Be honest with yourself about what this is: a web page can NOT
  // truly block screenshots. Phone screenshots and photos of a screen
  // fire no browser event at all. This layer does what a browser can:
  //   1. blurs the page whenever the tab/window loses focus
  //      (snipping tools, app switcher previews, screen-share pickers)
  //   2. catches desktop screenshot shortcuts and shows the popup
  //   3. blocks print / save-page / right-click + drag on media
  // For real blocking you'd need a native app (Android FLAG_SECURE).
  // =========================================================
  const SG_CAUGHT_LINES = [
    { emoji:'📸', title:'You got caught!',            body:'You can\u2019t screenshot here. Everything stays inside the circle.',            button:'ok, I\u2019m sorry' },
    { emoji:'🚨', title:'The circle police are here.', body:'Whatever you just tried to take out of here \u2014 put it back. This place is for us only.', button:'fine, I\u2019ll behave' },
    { emoji:'🕵️', title:'Nice try, paparazzi.',        body:'Your friends said those things because they trust you. What\u2019s said here stays here.', button:'my bad' },
    { emoji:'🙈', title:'Nope.',                        body:'Screenshots don\u2019t live here. Memories do \u2014 add it to the album instead.',       button:'ok ok' },
  ];

  let sgPopup = null;

  function showCaughtPopup(){
    if (sgPopup) return;
    const line = SG_CAUGHT_LINES[Math.floor(Math.random() * SG_CAUGHT_LINES.length)];
    const el = document.createElement('div');
    el.className = 'sg-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <span class="sg-emoji">${line.emoji}</span>
        <h3>${line.title}</h3>
        <p>${line.body}</p>
        <button class="sg-btn" type="button">${line.button}</button>
      </div>`;
    document.body.appendChild(el);
    sgPopup = el;
    requestAnimationFrame(() => el.classList.add('show'));

    const btn = el.querySelector('.sg-btn');
    const close = () => {
      el.classList.remove('show');
      setTimeout(() => { el.remove(); sgPopup = null; }, 200);
      if (!document.hidden) document.body.classList.remove('sg-hidden');
    };
    btn.addEventListener('click', close);
    btn.focus();
  }

  function enableScreenshotGuard(){
    if (window.__sgOn) return;
    window.__sgOn = true;
    const body = document.body;
    body.classList.add('sg-active');

    // 1. hide everything whenever the page is not actively in front
    const hide = () => body.classList.add('sg-hidden');
    const show = () => { if (!document.hidden && !sgPopup) body.classList.remove('sg-hidden'); };
    window.addEventListener('blur', hide);
    window.addEventListener('focus', show);
    document.addEventListener('visibilitychange', () => (document.hidden ? hide() : show()));

    // 2. desktop screenshot shortcuts (Windows: PrintScreen, Win+Shift+S;
    //    macOS: Cmd+Shift+3/4/5). Best effort: the OS may swallow the keys.
    const isShotShortcut = (e) =>
      e.key === 'PrintScreen' ||
      (e.metaKey && e.shiftKey && ['Digit3', 'Digit4', 'Digit5', 'KeyS'].includes(e.code));

    const onShot = () => {
      hide();
      // Windows puts PrintScreen images on the clipboard; overwrite it.
      // (This replaces whatever the user had copied, only on this shortcut.)
      try { navigator.clipboard.writeText(' ').catch(() => {}); } catch (_) {}
      showCaughtPopup();
    };
    window.addEventListener('keydown', (e) => { if (isShotShortcut(e)) onShot(); });
    window.addEventListener('keyup',   (e) => { if (isShotShortcut(e)) onShot(); });

    // 3. print / save page, right-click and drag on media
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['p', 's'].includes((e.key || '').toLowerCase())){
        e.preventDefault();
        showCaughtPopup();
      }
    });
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest && e.target.closest('img, video')) e.preventDefault();
    });
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

  }

  // =========================================================
  // ANONYMOUS POSTS — pre-post notice, auto-expiry
  //
  // Anonymous ("whisper mode") posts always self-delete exactly 24 hours
  // after they're created — not dependent on who has viewed them.
  //
  // Requires (run once in the Supabase SQL editor):
  //   - the `cleanup_expired_anon_posts` RPC function, which deletes any
  //     row where is_anonymous = true and created_at < now() - 24h.
  // See circle-anon-expiry.sql for the migration.
  // =========================================================
  const ANON_NOTICE_KEY = `anonNoticeSeen_${circleId}`;

  function hasSeenAnonNotice(){
    try { return localStorage.getItem(ANON_NOTICE_KEY) === '1'; } catch(_) { return false; }
  }
  function markAnonNoticeSeen(){
    try { localStorage.setItem(ANON_NOTICE_KEY, '1'); } catch(_) {}
  }

  // Shown once, before someone's first anonymous post, so they know the
  // trade-off up front rather than finding out after the fact.
  function showAnonNoticeModal(onConfirm){
    if (document.querySelector('.anon-notice-backdrop')) return;
    const el = document.createElement('div');
    el.className = 'sg-backdrop anon-notice-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <div class="anon-notice-icon">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <path fill="#fff" d="M16 3C8.8 3 2.9 8.3 1.9 15.2c-.2 1.6 1 3 2.6 3h1.2l-1.5 2.8a1 1 0 001.8.9l1.9-3.7h16.2l1.9 3.7a1 1 0 001.8-.9L26.3 18.2h1.2c1.6 0 2.8-1.4 2.6-3C29.1 8.3 23.2 3 16 3z"/>
            <circle cx="10.5" cy="15.5" r="2.8" fill="#14151a"/>
            <circle cx="21.5" cy="15.5" r="2.8" fill="#14151a"/>
            <rect x="13.5" y="14.5" width="5" height="2" fill="#14151a"/>
          </svg>
        </div>
        <h3>Posting anonymously</h3>
        <p>Your identity will be hidden — no one in the circle, including admins, can tell it's you. This post automatically disappears 24 hours after you post it.</p>
        <div class="anon-notice-actions">
          <button class="sg-btn anon-notice-ghost" type="button" data-choice="cancel">Never mind</button>
          <button class="sg-btn" type="button" data-choice="confirm">Got it, post anonymously</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    const close = (confirmed) => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 200);
      if (confirmed){
        markAnonNoticeSeen();
        onConfirm();
      }
    };
    el.querySelector('[data-choice="confirm"]').addEventListener('click', () => close(true));
    el.querySelector('[data-choice="cancel"]').addEventListener('click', () => close(false));
  }

  // Shown whenever someone tries to post a voice note while anonymous.
  // Voice can't be anonymous (friends know how each other sound), so we
  // nudge them to type instead.
  function showAnonVoiceNotice(){
    if (document.querySelector('.anon-voice-backdrop')) return;
    const el = document.createElement('div');
    el.className = 'sg-backdrop anon-notice-backdrop anon-voice-backdrop';
    el.setAttribute('role', 'alertdialog');
    el.setAttribute('aria-modal', 'true');
    // static strings only (no user input), so innerHTML is safe here
    el.innerHTML = `
      <div class="sg-card">
        <div class="anon-notice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </div>
        <h3>Voice can give you away</h3>
        <p>People know how you sound, so a voice note can't stay anonymous — they'd figure out it's you. Write it instead and it stays unsigned.</p>
        <div class="anon-notice-actions">
          <button class="sg-btn anon-notice-ghost" type="button" data-choice="cancel">Never mind</button>
          <button class="sg-btn" type="button" data-choice="text">Write it instead</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    const close = (goText) => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 200);
      if (goText){
        const ta = document.getElementById('homeComposerText') || document.querySelector('#homeComposer textarea');
        if (ta) ta.focus();
      }
    };
    el.querySelector('[data-choice="text"]').addEventListener('click', () => close(true));
    el.querySelector('[data-choice="cancel"]').addEventListener('click', () => close(false));
  }

  // Gate for turning whisper mode on: shows the one-time notice first,
  // then runs `onEnabled` once the person has acknowledged it.
  function requestWhisperMode(onEnabled){
    if (hasSeenAnonNotice()){ onEnabled(); return; }
    showAnonNoticeModal(onEnabled);
  }

  // Best-effort cleanup, called opportunistically whenever the feed loads.
  // Deletes anonymous posts whose 24-hour window has passed. Safe to call
  // often — it's a no-op when nothing has expired yet.


     async function cleanupExpiredAnonPosts(){
      const { error } = await supabaseClient.rpc('cleanup_expired_anon_posts');
      if (error) console.error('cleanup_expired_anon_posts failed', error);
    }



  // =========================================================
  // CIRCLE LIMIT MANAGEMENT
  // =========================================================
  const MAX_CIRCLES = 4;

  // Get user's current PRIVATE circles count (public circles are unlimited
  // and must never count against MAX_CIRCLES).
  async function getUserCircleCount(){
    if (!currentUser) return 0;
    const { data, error } = await supabaseClient
      .from('circle_members')
      .select('circle_id, circles!inner(is_private)', { count: 'exact' })
      .eq('user_id', currentUser.id)
      .eq('circles.is_private', true);
    return !error ? (data?.length || 0) : 0;
  }

  // Get user's PRIVATE circles for the "leave one to join this one" modal —
  // public circles should never show up here since they're unlimited.
  async function getUserCircles(){
    if (!currentUser) return [];
    const { data, error } = await supabaseClient
      .from('circle_members')
      .select('circle_id, circles!inner(id, name, is_private)')
      .eq('user_id', currentUser.id)
      .eq('circles.is_private', true);
    return !error ? (data || []) : [];
  }

  // Show modal to select circle to remove
  function showRemoveCircleModal(circlesToRemove, onConfirm){
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal modal-compact" role="dialog" aria-labelledby="modal-title">
        <h2 id="modal-title">Circle Limit Reached</h2>
        <p>You've reached the maximum of ${MAX_CIRCLES} circles. Select a circle to leave to join this new one:</p>
        <div class="circle-list-for-removal">
          ${circlesToRemove.map(c => `
            <div class="circle-option" data-circle-id="${c.circle_id}">
              <span>${c.circles?.name || 'Circle'}</span>
              <button type="button" class="remove-choice">Leave</button>
            </div>
          `).join('')}
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-choice="cancel">Cancel</button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);
    
    const handleCircleSelect = (circleId) => {
      modal.remove();
      onConfirm(circleId);
    };

    modal.querySelectorAll('.remove-choice').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const circleId = e.target.closest('.circle-option').dataset.circleId;
        handleCircleSelect(circleId);
      });
    });

    modal.querySelector('[data-choice="cancel"]').addEventListener('click', () => {
      modal.remove();
    });
  }

  // =========================================================
  // MAIN INIT
  // =========================================================
  async function init(){
    // Swap the static "Loading circle…" label for the water loader the
    // instant scripts run — covers every visit, joiners included.
    document.getElementById('pageBody').innerHTML = renderWaterLoader('Loading circle…');
    mountWaterLoader();

    await renderSidebar();

      const inviteCode = params.get('code');
      if (inviteCode && !circleId){
        // Check if user is signed in
        if (!currentUser){
          // Not signed in - show sign-in prompt with invite preserved
          document.getElementById('pageBody').innerHTML = `
            <div class="page-error">
              <h2>Sign in to join circle</h2>
              <p>You need to sign in to accept this circle invitation.</p>
              <button class="btn btn-primary" onclick="document.querySelector('.sidebar-signin').click()">Sign In</button>
              <p style="margin-top: 12px; font-size: 14px; color: var(--grey);">Your invite code is preserved. After signing in, you'll be able to join the circle.</p>
            </div>`;
          return;
        }

        document.getElementById('pageBody').innerHTML = renderWaterLoader('Checking circle access…');
        mountWaterLoader();
        
        // Check current circle count
        const circleCount = await getUserCircleCount();
        
        if (circleCount >= MAX_CIRCLES){
          // User is at max capacity
          document.getElementById('pageBody').innerHTML = renderWaterLoader('Loading your circles…');
          mountWaterLoader();
          const userCircles = await getUserCircles();
          
          showRemoveCircleModal(userCircles, async (circleToRemove) => {
            // Remove user from selected circle
            const { error: removeError } = await supabaseClient
              .from('circle_members')
              .delete()
              .eq('user_id', currentUser.id)
              .eq('circle_id', circleToRemove);
            
            if (removeError){
              document.getElementById('pageBody').innerHTML = `
                <div class="page-error">
                  <h2>Error leaving circle</h2>
                  <p>${removeError.message} <a href="/circles">Back to your circles</a></p>
                </div>`;
              return;
            }

            // Now redeem the invite
            document.getElementById('pageBody').innerHTML = renderWaterLoader('Joining circle…');
            mountWaterLoader();
            const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: inviteCode });
            if (error || !data?.circle_id){
              document.getElementById('pageBody').innerHTML = `
                <div class="page-error">
                  <h2>Invite invalid or expired</h2>
                  <p>${error?.message || 'Could not join circle.'} <a href="/circles">Back to your circles</a></p>
                </div>`;
              return;
            }
            window.location.replace(`/circle?private&ID=${encodeURIComponent(data.circle_id)}`);
          });
          return;
        }

        // User has space, proceed with invite redemption
        document.getElementById('pageBody').innerHTML = renderWaterLoader('Joining circle…');
        mountWaterLoader();
        const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: inviteCode });
        if (error || !data?.circle_id){
          const errorMsg = error?.message || 'Could not join circle.';
          document.getElementById('pageBody').innerHTML = `
            <div class="page-error">
              <h2>Cannot join circle</h2>
              <p>${errorMsg} <a href="/circles">Back to your circles</a></p>
            </div>`;
          return;
        }
        window.location.replace(`/circle?private&ID=${encodeURIComponent(data.circle_id)}`);
        return;


      }

    if (!circleId){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>No circle ID was given. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    circle = await loadCircle();
    if (!circle){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>This circle doesn't exist or was removed. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    if (urlSaysPrivate !== circle.is_private){
      const correctUrl = `/circle?${circle.is_private ? 'private' : 'public'}&ID=${encodeURIComponent(circle.id)}`;
      window.history.replaceState(null, '', correctUrl);
    }

    members = await loadMembers();
    if (currentUser){
      const mine = members.find(m => m.id === currentUser.id);
      myRole = mine ? mine.role : null;
    }

    if (circle.is_private){
      if (!requireAuth()) return;
      if (myRole === null){
        document.getElementById('pageBody').innerHTML = `
          <div class="page-error">
            <h2>This circle is private</h2>
            <p>You need an invite to see what's inside. <a href="/circles">Back to your circles</a></p>
          </div>
        `;
        return;
      }
      enableScreenshotGuard();
      const homeState = await renderHomeMode();

      const targetPostId = params.get('post');
      if (targetPostId) {
        setTimeout(() => {
          const card = document.querySelector(`[data-post-id="${targetPostId}"]`);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('post-highlight');
            setTimeout(() => card.classList.remove('post-highlight'), 2200);
            // Landing straight on the post they were invited to see is
            // exactly when a brand-new member needs the reassurance most.
            if (homeState?.shouldWelcome) showInviteReplyNudge(targetPostId);
          }
        }, 300);
      }
    } else {
      await renderPublicMode();
    }
  }



  init();
</script>

<script>
// Navigation behaviour: active link, sliding hover pill, topbar shadow, dock polish
(function(){
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
  var first = '/' + (path.split('/')[1] || '');
  var keyMap = {'/':'home','/home':'home','/index':'home','/create':'create','/circles':'circles','/circle':'circles','/messages':'messages','/profile':'profile'};
  var key = keyMap[path] || keyMap[first];
  if (key){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      var on = el.getAttribute('data-nav') === key && !el.classList.contains('nav-create') && !el.classList.contains('tab-create');
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
  }

  // sliding hover pill (desktop)
  var list = document.querySelector('.nav-list');
  var pill = document.querySelector('.nav-pill');
  if (list && pill){
    var move = function(el){
      var y = el.getBoundingClientRect().top - list.getBoundingClientRect().top;
      pill.style.height = el.offsetHeight + 'px';
      if (!pill.classList.contains('on')){
        pill.classList.add('snap');
        pill.style.transform = 'translateY(' + y + 'px)';
        void pill.offsetWidth;
        pill.classList.remove('snap');
        pill.classList.add('on');
      } else {
        pill.style.transform = 'translateY(' + y + 'px)';
      }
    };
    list.querySelectorAll('.nav-item').forEach(function(a){
      a.addEventListener('mouseenter', function(){ move(a); });
      a.addEventListener('focus', function(){ if (a.matches(':focus-visible')) move(a); });
    });
    list.addEventListener('mouseleave', function(){ pill.classList.remove('on'); });
    list.addEventListener('focusout', function(){ pill.classList.remove('on'); });
  }

  // topbar gets a soft shadow once you scroll
  var tb = document.querySelector('.topbar');
  if (tb){
    var f = function(){ tb.classList.toggle('scrolled', window.scrollY > 4); };
    window.addEventListener('scroll', f, {passive:true}); f();
  }

  // dock: light haptic tap, tuck away while typing so the keyboard has room,
  // and melt out of the way while scrolling so reading isn't fought over
  var dock = document.querySelector('.bottom-nav');
  if (dock){
    dock.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ if (navigator.vibrate) navigator.vibrate(8); });
    });
    var FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]';
    var isField = function(el){ return el && el.matches && el.matches(FIELD); };
    document.addEventListener('focusin', function(e){
      if (isField(e.target) && window.matchMedia('(max-width:899.98px)').matches) dock.classList.add('hidden');
    });
    document.addEventListener('focusout', function(){
      setTimeout(function(){ if (!isField(document.activeElement)) dock.classList.remove('hidden'); }, 60);
    });

    // scroll-aware reveal: hide on the way down, bring it back on the way up,
    // and always settle it back in once scrolling stops
    var mobileMQ = window.matchMedia('(max-width:899.98px)');
    var lastY = Math.max(window.scrollY, 0);
    var idleTimer = null;
    var ticking = false;
    var THRESHOLD = 8;      // ignore tiny jitters
    var TOP_ZONE = 32;      // always show near the very top
    var IDLE_MS = 650;      // settle back in once the thumb stops

    var settle = function(){ dock.classList.remove('scroll-hide'); };

    var evaluate = function(){
      ticking = false;
      if (!mobileMQ.matches){ settle(); return; }
      var y = Math.max(window.scrollY, 0);
      var delta = y - lastY;

      if (y <= TOP_ZONE){
        settle();
      } else if (delta > THRESHOLD){
        dock.classList.add('scroll-hide');     // scrolling down -> get out of the way
      } else if (delta < -THRESHOLD){
        settle();                              // scrolling up -> reader wants the nav back
      }

      lastY = y;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(settle, IDLE_MS);
    };

    window.addEventListener('scroll', function(){
      if (!ticking){ ticking = true; requestAnimationFrame(evaluate); }
    }, {passive:true});

    mobileMQ.addEventListener ? mobileMQ.addEventListener('change', settle) : mobileMQ.addListener(settle);
  }
})();
</script>
