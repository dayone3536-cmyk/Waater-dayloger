<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-2:#ffb199;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --pub-up:#ff5a36;
    --pub-down:#7c8cff;
    --pub-bg:#f6f6f4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}
  img{display:block;max-width:100%;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  }

  /* Modal Overlay & Styles */
  .modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,21,26,.4);
    display:flex;align-items:center;justify-content:center;z-index:1000;
    padding:16px;animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  
  .modal{
    background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(20,21,26,.3);
    padding:32px;max-width:420px;width:100%;animation:slideUp .3s var(--ease);
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  
  .modal h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:12px;}
  .modal p{color:var(--ink-soft);margin-bottom:20px;font-size:15px;line-height:1.5;}
  
  .circle-list-for-removal{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;max-height:300px;overflow-y:auto;}
  .circle-option{
    display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    background:#f7f7f8;border-radius:12px;transition:background .2s ease;
  }
  .circle-option:hover{background:#eaeaec;}
  .circle-option span{font-weight:500;color:var(--ink);}
  .remove-choice{
    padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;
    background:var(--danger);color:#fff;transition:background .2s ease;
  }
  .remove-choice:hover{background:#c9302c;}
  
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;}
  .btn-secondary{padding:10px 16px;border-radius:10px;font-weight:600;background:#f3f3f4;color:var(--ink);transition:background .2s ease;}
  .btn-secondary:hover{background:#eaeaec;}
  .btn-primary{padding:10px 16px;border-radius:10px;font-weight:600;background:var(--accent);color:#fff;transition:background .2s ease;}
  .btn-primary:hover{background:#e64a2a;}

  .app{display:flex;max-width:932px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* =========================================================
     NAVIGATION — topbar (mobile)
     ========================================================= */
  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.03em;
    display:inline-flex;align-items:baseline;line-height:1;
  }
  .wordmark .dot{color:var(--accent);display:inline-block;transition:transform .45s var(--ease-spring);}
  a.wordmark:hover .dot{transform:translateY(-3px) scale(1.3);}

  /* ---------- Mobile top bar ---------- */
  .topbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    height:58px;padding:0 14px;
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
    transition:box-shadow .25s ease, transform .32s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }
  .topbar.scrolled{box-shadow:0 8px 22px -14px rgba(20,21,26,.28);}
  .topbar.nav-hide{transform:translateY(-100%);}
  .topbar-back{
    justify-self:start;display:inline-flex;align-items:center;gap:3px;
    height:34px;padding:0 13px 0 8px;border-radius:99px;
    font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink);
    background:#f3f3f4;-webkit-tap-highlight-color:transparent;
    transition:background .15s ease, transform .15s var(--ease-spring);
  }
  .topbar-back svg{width:17px;height:17px;stroke:currentColor;transition:transform .25s var(--ease);}
  .topbar-back:hover svg{transform:translateX(-2px);}
  .topbar-back:active{transform:scale(.94);background:#eaeaec;}

  @media (min-width:900px){
    body{padding-bottom:0;}
    .topbar{display:none;}
  }

  @keyframes riseIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .mini-spinner{
    width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;flex-shrink:0;
  }

  .page-loading, .page-error{
    padding:80px 22px;text-align:center;
    font-family:var(--font-mono);font-size:12px;color:var(--grey);
  }
  .page-error h2{font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:8px;font-weight:700;}
  .page-error a{color:var(--accent);text-decoration:underline;}

  /* =========================================================
     LOADER — one bold mark, dead center, that lives and breathes.
     Design intent (this is a ~3s wait, not a game to play):
       - ONE focal shape, not a scene — a short wait wants a single
         strong beat, not something busy to parse (busy reads as
         cheap and is what made the old glasses annoying).
       - A squash-and-stretch "breathe" with spring overshoot, so it
         feels tactile and alive rather than a mechanical spin.
       - A slow warm hue drift — colour-shifting reads as faster and
         more likeable than a static/grey spinner.
       - A soft light burst timed to the peak of every breath: a
         small, honest payoff on a short loop, the same beat a
         satisfying tap or a Duolingo ding rides on — not a
         variable/randomised "slot machine" reward, on purpose.
     Pure CSS, one loop, no JS driving it.
     ========================================================= */
  .water-loader{
    padding:56px 22px 40px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:220px;
  }
  .wl-stage{
    position:relative;width:120px;height:120px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .wl-halo{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, rgba(255,90,54,0) 68%);
    opacity:.35;
    animation:wlHalo 1.15s cubic-bezier(.4,0,.2,1) infinite;
  }
  .wl-mark{
    position:relative;width:56px;height:56px;border-radius:20px;
    background:linear-gradient(135deg, #ff7a4a, var(--accent) 60%, #ff3d6e);
    background-size:200% 200%;
    box-shadow:0 8px 24px -6px rgba(255,90,54,.55);
    animation:wlBreathe 1.15s var(--ease-spring) infinite,
              wlHue 3.45s ease-in-out infinite;
  }
  @keyframes wlBreathe{
    0%,100%{ transform:scale(1); border-radius:20px; }
    38%{ transform:scale(1.22); border-radius:32px; }
    55%{ transform:scale(.94); border-radius:16px; }
    72%{ transform:scale(1.04); border-radius:20px; }
  }
  @keyframes wlHalo{
    0%,100%{ transform:scale(.72); opacity:.28; }
    38%{ transform:scale(1.35); opacity:.5; }
    100%{ transform:scale(.72); opacity:.28; }
  }
  @keyframes wlHue{
    0%,100%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
  }

  .wl-spark{
    position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin:-3px 0 0 -3px;opacity:0;
    animation:wlSpark 1.15s cubic-bezier(.2,.8,.3,1) infinite;
  }
  .wl-spark:nth-child(1){ --a:-90deg; animation-delay:.02s; }
  .wl-spark:nth-child(2){ --a:-30deg; animation-delay:.05s; }
  .wl-spark:nth-child(3){ --a:30deg;  animation-delay:.01s; }
  .wl-spark:nth-child(4){ --a:90deg;  animation-delay:.06s; }
  .wl-spark:nth-child(5){ --a:150deg; animation-delay:.03s; }
  .wl-spark:nth-child(6){ --a:-150deg;animation-delay:.04s; }
  @keyframes wlSpark{
    0%,32%{ transform:rotate(var(--a)) translateX(0) scale(0); opacity:0; }
    46%{ transform:rotate(var(--a)) translateX(46px) scale(1); opacity:1; }
    68%,100%{ transform:rotate(var(--a)) translateX(64px) scale(0); opacity:0; }
  }

  .wl-label{
    font-family:var(--font-mono);font-size:12px;color:var(--grey);letter-spacing:.02em;
    display:flex;align-items:center;gap:2px;justify-content:center;
  }
  .wl-label .wl-dot{ animation:wlDot 1.15s ease-in-out infinite; }
  .wl-label .wl-dot:nth-child(2){ animation-delay:.15s; }
  .wl-label .wl-dot:nth-child(3){ animation-delay:.3s; }
  @keyframes wlDot{ 0%,60%,100%{ opacity:.25; } 30%{ opacity:1; } }

  @media (prefers-reduced-motion:reduce){
    .wl-mark, .wl-halo, .wl-spark, .wl-label .wl-dot{ animation:none !important; }
    .wl-spark{ display:none; }
  }

  .home-hero{
    padding:30px 22px 20px;
    background:linear-gradient(180deg, var(--accent-soft), rgba(255,241,236,0) 70%);
    border-bottom:1px solid var(--line);
  }
  .home-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .home-hero h1{
    font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-0.01em;
  }
  .home-hero .home-sub{
    font-family:var(--font-serif);font-size:14px;color:var(--ink-soft);margin-top:5px;
  }
  .home-settings-btn{
    flex-shrink:0;width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line-strong);
    transition:border-color .15s ease, transform .1s ease;
  }
  .home-settings-btn:hover{border-color:var(--accent);}
  .home-settings-btn:active{transform:scale(.94);}
  .home-settings-btn:disabled{opacity:.35;cursor:default;}
  .home-settings-btn:disabled:hover{border-color:var(--line-strong);}
  .home-settings-btn svg{width:16px;height:16px;stroke:var(--ink-soft);}

  .home-people-row{
    display:flex;gap:14px;margin-top:20px;overflow-x:auto;padding-bottom:4px;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .home-people-row::-webkit-scrollbar{display:none;}
  .home-person{
    display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:56px;
  }
  .home-person .ring{
    width:52px;height:52px;border-radius:50%;padding:2.5px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    display:flex;align-items:center;justify-content:center;
  }
  .home-person .ring-inner{
    width:100%;height:100%;border-radius:50%;background:#fff;padding:2px;
  }
  .home-person .avatar{
    width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:15px;overflow:hidden;
  }
  .home-person .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-person span{
    font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);
    max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .home-composer{
    margin:18px 22px 0;
    background:#fff;border:1px solid var(--line-strong);border-radius:20px;
    padding:16px;
  }
  .home-composer textarea{
    width:100%;border:none;resize:none;outline:none;
    font-family:var(--font-serif);font-size:15px;color:var(--ink);
    min-height:44px;max-height:180px;line-height:1.5;
  }
  .home-composer textarea::placeholder{color:var(--grey);}
  .home-composer-input{display:flex;align-items:flex-start;gap:12px;}
  .home-composer-input textarea{flex:1 1 auto;min-width:0;padding:10px 0 0;}
  .home-cam-inside{
    flex:0 0 46px;width:46px;height:46px;border-radius:16px;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px -6px rgba(255,90,54,.55);
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s var(--ease-spring), box-shadow .15s ease;
  }
  .home-cam-inside svg{width:24px;height:24px;fill:#fff;stroke:none;}
  .home-cam-inside:hover{transform:scale(1.06);}
  .home-cam-inside:active{transform:scale(.9);}
  .home-composer-media{margin-top:8px;}
  .home-composer-media input{
    width:100%;border:1px dashed var(--line-strong);border-radius:12px;
    padding:9px 12px;font-family:var(--font-mono);font-size:11px;outline:none;
    transition:border-color .15s ease;
  }
  .home-composer-media input:focus{border-color:var(--accent);}
  .home-composer-row{
    display:flex;align-items:center;justify-content:space-between;margin-top:12px;
  }
  .home-composer-tools{display:flex;gap:6px;}
  .home-composer-tool{
    width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);transition:background .15s ease, transform .1s ease;
  }
  .home-composer-tool:hover{background:#ffe4d8;}
  .home-composer-tool:active{transform:scale(.92);}
  .home-composer-tool svg{width:16px;height:16px;stroke:#c24020;}
  .home-composer-tool.active{background:var(--accent);}
  .home-composer-tool.active svg{stroke:#fff;}
  .home-composer-tool.recording{background:var(--danger);animation:micPulse 1.1s ease-in-out infinite;}
  .home-composer-tool.recording svg{stroke:#fff;}



  .home-post-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;
    padding:9px 18px;border-radius:99px;transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .home-post-btn:hover:not(:disabled){background:#000;}
  .home-post-btn:active:not(:disabled){transform:scale(.96);}
  .home-post-btn:disabled{opacity:.5;cursor:default;}

  .home-composer{
    max-height:600px;
    transition:max-height .32s var(--ease), opacity .22s var(--ease), transform .28s var(--ease),
              margin .32s var(--ease), padding .32s var(--ease), border-color .32s var(--ease);
    overflow:hidden;
  }
  /* Collapse-on-scroll + FAB is a phone-only space-saving pattern.
     Below 900px only: composer tucks away on scroll, a FAB brings it back. */
  @media (max-width:899.98px){
    .home-composer.collapsed{
      max-height:0;
      opacity:0;
      transform:translateY(-8px);
      margin-top:0;
      padding-top:0;
      padding-bottom:0;
      border-color:transparent;
      pointer-events:none;
    }
    .home-composer.overlay{
      position:fixed;
      left:50%;
      top:78px;
      transform:translate(-50%,-14px);
      width:calc(100% - 44px);
      max-width:520px;
      z-index:50;
      box-shadow:0 22px 50px rgba(20,21,26,.2);
      opacity:0;
      pointer-events:none;
    }
    .home-composer.overlay.overlay-open{
      opacity:1;
      transform:translate(-50%,0);
      pointer-events:auto;
    }
  }
  /* Desktop: the composer never hides. It stays pinned in view while you
     scroll the feed, so posting never requires scrolling back up or a refresh. */
  @media (min-width:900px){
    .home-composer{
      position:sticky;
      top:20px;
      z-index:15;
    }
    .home-composer.collapsed{
      max-height:600px;
      opacity:1;
      transform:none;
      pointer-events:auto;
    }
    .home-fab{ display:none; }
  }

  .home-fab{
    position:fixed;
    right:20px;
    bottom:96px;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 26px rgba(20,21,26,.28);
    z-index:40;
    opacity:0;
    transform:translateY(16px) scale(.8);
    pointer-events:none;
    transition:opacity .22s var(--ease), transform .3s var(--ease-spring), background .15s ease;
  }
  .home-fab.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .home-fab:hover{ background:#000; }
  .home-fab:active{ transform:scale(.9); }
  .home-fab svg{ width:22px;height:22px;stroke:#fff; }
  @media (min-width:900px){ .home-fab{ bottom:34px; } }

  .home-feed{padding:20px 22px 30px;display:flex;flex-direction:column;gap:16px;}

  .home-empty{
    text-align:center;padding:64px 24px 54px;
    opacity:0;animation:riseIn .5s var(--ease) forwards;
  }
  .home-empty-orb{
    width:60px;height:60px;margin:0 auto 24px;border-radius:50%;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent));
    animation:emptyOrbPulse 3.2s ease-in-out infinite;
  }
  .home-empty-orb::before,
  .home-empty-orb::after{
    content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--accent-2);
    animation:emptyRingExpand 3.2s ease-out infinite;
  }
  .home-empty-orb::after{ animation-delay:1.1s; }
  .home-empty-orb svg{width:24px;height:24px;stroke:#fff;stroke-width:2;position:relative;z-index:1;}
  @keyframes emptyOrbPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
  @keyframes emptyRingExpand{ 0%{transform:scale(.85);opacity:.55;} 100%{transform:scale(1.5);opacity:0;} }

  .home-empty h3{
    font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.01em;
    margin-bottom:9px;
  }
  .home-empty p{
    font-family:var(--font-serif);font-size:14.5px;color:var(--ink-soft);
    max-width:300px;margin:0 auto 26px;line-height:1.6;
  }
  .home-empty-cta{
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:12px 24px;border-radius:100px;
    transition:transform .12s var(--ease), background .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 16px rgba(20,21,26,.12);
  }
  .home-empty-cta:hover{ background:#000; box-shadow:0 8px 20px rgba(20,21,26,.18); }
  .home-empty-cta:active{ transform:scale(.96); }

  .home-post-card{
    background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
    opacity:0;animation:riseIn .4s var(--ease) forwards;
    transition:box-shadow .18s ease, border-color .18s ease;
  }
  .home-post-card:hover{box-shadow:0 8px 26px rgba(20,21,26,.06);border-color:var(--line-strong);}
  .home-post-head{
    display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  }
  .home-post-head .avatar{
    width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:12.5px;overflow:hidden;flex-shrink:0;
  }
  .home-post-head .avatar.anon-avatar{background:linear-gradient(135deg,#3a3d47,#1a1b1f);}

  /* WHISPER CARD — a post that was shared "for the backbench only"
     doesn't look like every other post. It reads as held, not shouted:
     dim, blurred until someone actually leans in and taps it open. */
  .home-post-card.whisper{
    background:linear-gradient(165deg,#1a1b1f,#111214);border-color:#26272c;
  }
  .home-post-card.whisper .home-post-head .who b{color:#d6d7db;}
  .home-post-card.whisper .home-post-head .who span{color:#7d7f86;}
  .home-post-card.whisper .home-post-text{color:#eceded;}
  .home-post-card.whisper .home-post-actions{border-top-color:#26272c;}
  .home-post-card.whisper .home-action-btn{color:#9a9ca3;}
  .home-post-card.whisper .home-action-btn svg{stroke:#9a9ca3;}
  .home-post-card.whisper .home-comments{border-top-color:#26272c;}
  .home-post-card.whisper .home-comment-input{background:#1e1f24;border-color:#2e2f35;color:#eee;}
  .home-post-card.whisper:not(.revealed) .home-post-text,
  .home-post-card.whisper:not(.revealed) .home-post-media{
    filter:blur(9px);user-select:none;transition:filter .4s var(--ease);
  }
  .home-post-card.whisper:not(.revealed) .home-post-body{cursor:pointer;}
  .whisper-hint{
    display:none;align-items:center;gap:6px;margin:0 16px 14px;
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;color:#8a8d94;cursor:pointer;
  }
  .home-post-card.whisper:not(.revealed) .whisper-hint{display:flex;}
  .whisper-hint svg{width:13px;height:13px;stroke:#8a8d94;flex-shrink:0;}
  .home-post-card.whisper.revealed .home-post-text,
  .home-post-card.whisper.revealed .home-post-media{filter:none;}

  .home-post-head .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-post-head .who{display:flex;flex-direction:column;line-height:1.25;}
  .home-post-head .who b{font-family:var(--font-display);font-size:13.5px;font-weight:600;}
  .home-post-head .who span{font-family:var(--font-mono);font-size:10px;color:var(--grey);}
  .home-post-delete{
    margin-left:auto;flex-shrink:0;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--grey);
    transition:background .15s ease,color .15s ease;
  }
  .home-post-delete:hover{background:#fdecea;color:var(--danger);}
  .home-post-delete svg{width:16px;height:16px;stroke:currentColor;fill:none;}
  .home-post-body{padding:0 16px 14px;}
  .home-post-text{font-family:var(--font-serif);font-size:15px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}
  .home-post-media{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .home-post-media img, .home-post-media video{width:100%;max-height:420px;object-fit:cover;display:block;}

  .home-hero .home-eyebrow{
    font-family:var(--font-mono);font-size:10.5px;color:var(--accent);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;font-weight:500;
  }

  .home-post-actions{
    display:flex;align-items:center;gap:18px;
    padding:10px 16px 12px;border-top:1px solid var(--line);margin-top:2px;
  }
  .home-action-btn{
    display:flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);
    transition:color .15s ease;
  }
  .home-action-btn svg{width:18px;height:18px;stroke:var(--ink-soft);fill:none;transition:fill .15s ease, stroke .15s ease;}
  .home-action-btn:hover{color:var(--ink);}
  .home-action-btn:hover svg{stroke:var(--ink);}
  .home-action-btn.liked{color:var(--accent);}
  .home-action-btn.liked svg{fill:var(--accent);stroke:var(--accent);}
  .home-like-btn.pop svg{animation:likePop .35s var(--ease-spring);}
  @keyframes likePop{ 0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);} }

  /* ============================================================
     LIKE BUTTON — universe.io-style heart: fill-in, bounce, a
     checkmark-draw confirmation ring, and a hover tooltip that
     flips the like count from old → new. Scoped to fit inline
     in the post action row rather than a standalone pill button.
  ============================================================ */
  .li-trigger{
    --li-cl:var(--accent);--li-bg:#fff;--li-sz:19px;
    position:relative;
  }
  .li-heart-wrap{position:relative;width:var(--li-sz);height:var(--li-sz);display:flex;align-items:center;justify-content:center;}
  .li-heart-wrap .li-heart{
    width:var(--li-sz);height:var(--li-sz);color:var(--ink-soft);
    transition:transform .15s ease, color .15s ease;
  }
  .li-trigger .li-heart-wrap .li-heart path{fill:currentColor;}
  .li-heart-wrap .li-heart .li-fill{opacity:0;transition:opacity .2s ease;}
  .li-trigger.liked .li-heart-wrap .li-heart{color:var(--li-cl);}
  .li-trigger.liked .li-heart-wrap .li-heart .li-fill{opacity:.35;}

  .li-trigger .li-heart-wrap .li-burst{
    position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--li-cl);opacity:0;pointer-events:none;
    transform:scale(.4);
  }
  .li-trigger.just-liked .li-heart-wrap .li-burst{
    animation:liBurst .5s ease-out forwards;
  }
  @keyframes liBurst{
    0%{opacity:.85;transform:scale(.4);}
    100%{opacity:0;transform:scale(1.9);}
  }

  /* ============================================================
     ADD TO US — heart-in-a-box toggle living in the post actions row.
     Three states: default (not saved), in-us + mine (saved by me,
     tap removes), in-us + not-mine (saved by someone else, inert).
  ============================================================ */
  .home-us-btn svg{transition:transform .3s var(--ease-spring), fill .15s ease, stroke .15s ease;}
  .home-us-btn:active svg{transform:scale(.88);}
  .home-us-btn.in-us{color:var(--accent);}
  .home-us-btn.in-us svg{stroke:var(--accent);fill:var(--accent);}
  .home-us-btn.in-us.just-added svg{animation:usPop .4s var(--ease-spring);}
  @keyframes usPop{ 0%{transform:scale(1);} 45%{transform:scale(1.3) rotate(-6deg);} 100%{transform:scale(1);} }
  .home-us-btn.in-us:not(.mine){cursor:default;}
  .home-us-btn.in-us:not(.mine):hover{color:var(--accent);}
  .home-us-btn.in-us:not(.mine):hover svg{stroke:var(--accent);}

  .memory-meta{
    display:flex;flex-direction:column;gap:6px;
    margin:0 16px 12px;padding:10px 13px;border-radius:12px;
    background:var(--accent-soft);
  }
  .memory-meta-who{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
  .memory-meta-who .avatar.mini{
    width:20px;height:20px;border-radius:50%;flex-shrink:0;overflow:hidden;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:8.5px;
  }
  .memory-meta-who .avatar.mini img{width:100%;height:100%;object-fit:cover;}
  .memory-meta-who b{color:var(--ink);font-weight:600;}
  .memory-meta-caption{font-family:var(--font-serif);font-size:13.5px;color:var(--ink);line-height:1.45;white-space:pre-wrap;word-break:break-word;}

  .us-hero{
    margin:20px 22px 0;padding:16px 18px;border-radius:16px;
    background:linear-gradient(135deg, var(--accent-soft), #fff);
    border:1px solid var(--line);
    display:flex;align-items:center;gap:14px;
  }
  .us-hero-avatars{display:flex;flex-shrink:0;}
  .us-hero-avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:#fff;font-family:var(--font-display);font-size:12px;font-weight:600;
    border:2px solid #fff;margin-left:-10px;
  }
  .us-hero-avatar:first-child{margin-left:0;}
  .us-hero-avatar img{width:100%;height:100%;object-fit:cover;}
  .us-hero-copy h3{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px;}
  .us-hero-copy p{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}

  .us-caption-input{
    width:100%;border:1px solid var(--line-strong);border-radius:12px;
    padding:11px 13px;font-family:var(--font-serif);font-size:14.5px;
    color:var(--ink);resize:vertical;min-height:70px;transition:border-color .15s ease;
  }
  .us-caption-input:focus{outline:none;border-color:var(--accent);}

  .home-comments{
    display:none;padding:2px 16px 16px;border-top:1px solid var(--line);
  }
  .home-comments.open{display:block;animation:riseIn .25s var(--ease) forwards;}
  .home-comment-list{display:flex;flex-direction:column;gap:12px;margin:14px 0 12px;}
  .home-comment-item{display:flex;gap:9px;}
  .home-comment-item .avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:10px;overflow:hidden;
  }
  .home-comment-item .avatar img{width:100%;height:100%;object-fit:cover;}
  .home-comment-bubble{background:#f7f7f8;border-radius:14px;padding:8px 13px;flex:1;min-width:0;}
  .home-comment-bubble b{font-family:var(--font-display);font-size:12.5px;font-weight:600;}
  .home-comment-bubble p{font-family:var(--font-serif);font-size:13.5px;color:var(--ink);margin-top:2px;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .home-comment-time{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9px;color:var(--grey);margin-top:4px;margin-left:2px;}
  .home-comment-delete{font-family:var(--font-mono);font-size:9px;color:var(--grey);text-decoration:underline;}
  .home-comment-delete:hover{color:var(--danger);}
  .home-comment-empty{font-family:var(--font-mono);font-size:11px;color:var(--grey);text-align:center;padding:8px 0 14px;}
  .home-comment-input-row{display:flex;gap:8px;align-items:center;}
  /* One-time reassurance shown to a freshly-invited member right above the
     reply box on the specific post they were invited to see — the exact
     spot where "wait, who can see this?" hesitation shows up. */
  .invite-reply-nudge{
    display:flex;align-items:center;gap:7px;margin:0 0 10px;padding:8px 12px;
    background:var(--accent-soft);border-radius:12px;
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.01em;color:var(--ink-soft);
    animation:tipFade .3s ease-out;
  }
  .invite-reply-nudge svg{width:13px;height:13px;stroke:var(--accent);flex-shrink:0;}
  .home-comment-input{
    flex:1;border:1px solid var(--line-strong);border-radius:99px;
    padding:9px 15px;font-family:var(--font-serif);font-size:13.5px;outline:none;
    transition:border-color .15s ease;
  }
  .home-comment-input:focus{border-color:var(--accent);}
  .home-comment-send{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--ink);display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .home-comment-send:hover:not(:disabled){background:#000;}
  .home-comment-send:active:not(:disabled){transform:scale(.92);}
  .home-comment-send:disabled{opacity:.4;}
  .home-comment-send svg{width:14px;height:14px;stroke:#fff;}

  .home-comment-mic{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .home-comment-mic:hover{background:#ffe4d8;}
  .home-comment-mic:active{transform:scale(.92);}
  .home-comment-mic svg{width:16px;height:16px;stroke:#c24020;}
  .home-comment-mic.recording{background:var(--danger);animation:micPulse 1.1s ease-in-out infinite;}
  .home-comment-mic.recording svg{stroke:#fff;}
  @keyframes micPulse{ 0%,100%{box-shadow:0 0 0 0 rgba(224,67,63,.4);} 50%{box-shadow:0 0 0 8px rgba(224,67,63,0);} }
  .home-comment-rec-timer{
    font-family:var(--font-mono);font-size:11px;color:var(--danger);flex-shrink:0;min-width:32px;
  }

  /* Hold-to-talk: press a post to record a voice reply, tap to open the thread */
  .home-post-body{position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  .home-post-body.holding-talk{background:rgba(224,67,63,.05);}
  .home-post-body.holding-talk::after{
    content:'';position:absolute;inset:0;border-radius:14px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(224,67,63,.35);animation:holdRing 1s ease-out infinite;
  }
  @keyframes holdRing{
    0%{box-shadow:0 0 0 0 rgba(224,67,63,.35);}
    100%{box-shadow:0 0 0 14px rgba(224,67,63,0);}
  }
  .hold-record-indicator{
    display:flex;position:absolute;left:50%;bottom:10px;transform:translateX(-50%) scale(.85);
    align-items:center;gap:7px;background:var(--danger);color:#fff;border-radius:99px;
    padding:6px 14px;font-family:var(--font-mono);font-size:11px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;z-index:3;
    opacity:0;visibility:hidden;
    transition:opacity .14s ease, transform .14s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .14s;
  }
  .hold-record-indicator.show{
    opacity:1;visibility:visible;transform:translateX(-50%) scale(1);
    transition:opacity .1s ease, transform .1s cubic-bezier(.34,1.56,.64,1), visibility 0s;
  }
  .hri-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:hriBlink 1s ease-in-out infinite;}
  @keyframes hriBlink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  .hold-onboarding-tip{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    pointer-events:none;z-index:3;animation:tipFade .35s ease-out;
  }
  .hold-onboarding-tip span:last-child{
    background:var(--ink);color:#fff;font-family:var(--font-mono);font-size:10.5px;
    border-radius:99px;padding:5px 12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .hot-arrow{font-size:16px;color:var(--ink);animation:tipBounce 1s ease-in-out infinite;}
  @keyframes tipBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(5px);} }
  @keyframes tipFade{ from{opacity:0;} to{opacity:1;} }
  .home-voice-bubble{
    background:#f7f7f8;border-radius:14px;padding:8px 13px;flex:1;min-width:0;
  }
  .home-voice-bubble b{font-family:var(--font-display);font-size:12.5px;font-weight:600;}
  .home-voice-bubble audio{width:100%;margin-top:6px;height:32px;}

  /* ============================================================
     PUBLIC CIRCLE
     Every public circle gets its own colour, derived from its id.
     --h (hue) and --l (lightness of the on-white colour) are set
     inline on .pc by renderPublicMode().
  ============================================================ */
  .pc{
    --c:hsl(var(--h) 85% 64%);
    --cs:hsl(var(--h) 72% var(--l));
    --cs-soft:hsl(var(--h) 90% 96%);
    --cs-mid:hsl(var(--h) 65% 86%);
    --topbar-h:0px;
    background:#fff;
  }
  @media (max-width:899.98px){ .pc{ --topbar-h:58px; } }
  .pc :focus-visible{outline:2px solid var(--cs);outline-offset:2px;border-radius:8px;}
  .pc button:disabled{cursor:default;}

  .pc-av{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:var(--s,40px);height:var(--s,40px);border-radius:50%;overflow:hidden;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:calc(var(--s,40px) * .4);
  }
  .pc-av img{width:100%;height:100%;object-fit:cover;}
  .pc-av svg{width:58%;height:58%;}
  .pc-av.anon{background:var(--ink);}

  /* ---------- cover ---------- */
  .pc-cover{
    container-type:inline-size;
    position:relative;overflow:hidden;color:#fff;min-height:300px;
    padding:20px 22px 26px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:
      radial-gradient(80% 120% at 80% 35%, hsl(var(--h) 60% 26%) 0%, transparent 65%),
      hsl(var(--h) 48% 12%);
  }
  .pc-tag{
    position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    font-family:var(--font-display);font-weight:500;font-size:13px;color:rgba(255,255,255,.7);
  }
  .pc-tag svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .pc-cover-main{position:relative;z-index:2;max-width:min(56%,460px);margin-top:28px;}
  .pc-name{
    font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5vw,46px);
    line-height:1.02;letter-spacing:-.035em;overflow-wrap:anywhere;
  }
  .pc-desc{
    font-family:var(--font-serif);font-size:16px;line-height:1.5;color:rgba(255,255,255,.78);
    margin-top:10px;max-width:38ch;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .pc-cover-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px 14px;margin-top:20px;}
  .pc-join{
    display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 24px;border-radius:99px;
    background:#fff;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:14px;
    transition:transform .12s var(--ease), background .15s ease;
  }
  .pc-join:hover{background:hsl(var(--h) 100% 96%);}
  .pc-join:active{transform:scale(.96);}
  .pc-join svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .pc-join.joined{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);cursor:default;}
  .pc-join.joined:hover{background:transparent;}
  .pc-icon-btn{
    width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.3);color:#fff;transition:background .15s ease, transform .12s var(--ease);
  }
  .pc-icon-btn:hover{background:rgba(255,255,255,.1);}
  .pc-icon-btn:active{transform:scale(.94);}
  .pc-icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pc-cover :focus-visible{outline-color:#fff;}
  .pc-stats{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;font-family:var(--font-display);font-size:13.5px;color:rgba(255,255,255,.72);}
  .pc-stats b{color:#fff;font-weight:700;}
  .pc-pulse{display:inline-flex;align-items:center;gap:7px;}
  .pc-pulse i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px hsla(var(--h),90%,64%,.25);}
  .pc-pulse:empty{display:none;}

  .pc-spin{
    width:14px;height:14px;border-radius:50%;border:2px solid rgba(20,21,26,.2);border-top-color:var(--ink);
    animation:spin .7s linear infinite;flex-shrink:0;
  }

  /* orbit: members sit on rings around the circle's core, founders on the inside */
  .pc-orbit{
    --u:1;
    --D:calc(300px * var(--u));
    position:absolute;z-index:1;top:50%;right:28px;width:var(--D);height:var(--D);
    transform:translateY(-50%);pointer-events:none;
  }
  .pc-ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid hsla(var(--h),90%,78%,.24);}
  .pc-ring.r1{width:34%;height:34%;}
  .pc-ring.r2{width:62%;height:62%;border-color:hsla(var(--h),90%,78%,.18);}
  .pc-ring.r3{width:88%;height:88%;border-color:hsla(var(--h),90%,78%,.13);}
  .pc-ring.r4{width:124%;height:124%;border-color:hsla(var(--h),90%,78%,.08);}
  .pc-core{
    position:absolute;left:50%;top:50%;width:calc(34px * var(--u));height:calc(34px * var(--u));
    transform:translate(-50%,-50%);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:hsla(var(--h),90%,64%,.16);box-shadow:0 0 70px 26px hsla(var(--h),90%,60%,.28);
  }
  .pc-core svg{width:60%;height:60%;stroke:var(--c);fill:none;stroke-width:2;}
  .pc-orb{
    position:absolute;width:calc(var(--s) * var(--u) * 1px);height:calc(var(--s) * var(--u) * 1px);
    margin:calc(var(--s) * var(--u) * -.5px) 0 0 calc(var(--s) * var(--u) * -.5px);
    font-size:calc(var(--s) * var(--u) * .4px);
    box-shadow:0 0 0 2px hsl(var(--h) 48% 12%), 0 8px 18px rgba(0,0,0,.35);
    pointer-events:auto;animation:pcPop .5s var(--ease-spring) both;animation-delay:var(--d);
  }
  .pc-orb.me{box-shadow:0 0 0 2px #fff, 0 8px 18px rgba(0,0,0,.35);}
  .pc-orb.slot{
    background:transparent;border:1.5px dashed rgba(255,255,255,.55);color:#fff;box-shadow:none;cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .pc-orb.slot:hover{background:rgba(255,255,255,.14);border-color:#fff;}
  .pc-orb.slot svg{width:46%;height:46%;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}
  .pc-orb.more{background:rgba(255,255,255,.14);font-family:var(--font-display);font-weight:600;}
  @keyframes pcPop{ from{transform:scale(.3);opacity:0;} to{transform:scale(1);opacity:1;} }

  @container (max-width:759px){
    .pc-orbit{--u:.82;right:calc(var(--D) * -.16);}
    .pc-cover-main{max-width:52%;}
  }
  @container (max-width:519px){
    .pc-orbit{--u:.78;right:calc(var(--D) * -.5);}
    .pc-cover-main{max-width:calc(100% - 120px);}
    .pc-desc{-webkit-line-clamp:2;font-size:15px;}
  }

  /* ---------- facepile (social proof under the desc, mobile hero) ---------- */
  .pc-facepile{display:none;align-items:center;justify-content:center;gap:9px;margin-top:16px;}
  .pc-facepile .stack{display:flex;}
  .pc-facepile .stack .pc-av{
    margin-left:-10px;box-shadow:0 0 0 2.5px hsl(var(--h) 48% 12%);
    animation:pcPop .45s var(--ease-spring) both;
  }
  .pc-facepile .stack .pc-av:first-child{margin-left:0;}
  .pc-facepile .copy{font-family:var(--font-display);font-size:12.5px;color:rgba(255,255,255,.75);text-align:left;}
  .pc-facepile .copy b{color:#fff;font-weight:700;}

  /* ============================================================
     MOBILE HERO REDESIGN
     Below 600px the orbit leaves the desktop's absolute overlay
     and becomes the centered, celebratory focal point of a
     vertically-stacked hero — built to feel like an invitation
     into a room full of people, not a cramped sidebar graphic.
  ============================================================ */
  @media (max-width:599.98px){
    .pc-cover{
      min-height:0;padding:30px 20px 28px;gap:0;
      align-items:center;text-align:center;
    }
    .pc-tag{order:-1;align-self:center;}
    .pc-orbit{
      order:0;position:relative;inset:auto;top:auto;right:auto;left:auto;
      transform:none;width:min(58vw,206px);height:min(58vw,206px);
      margin:18px 0 2px;pointer-events:auto;
    }
    .pc-core{box-shadow:0 0 60px 22px hsla(var(--h),90%,60%,.32);}
    .pc-cover-main{order:1;max-width:100%;margin-top:6px;}
    .pc-name{font-size:clamp(27px,8.2vw,34px);text-align:center;}
    .pc-desc{
      margin:10px auto 0;max-width:32ch;text-align:center;
      -webkit-line-clamp:3;font-size:15px;
    }
    .pc-cover-row{justify-content:center;margin-top:20px;}
    .pc-join{min-height:50px;padding:0 30px;font-size:15.5px;box-shadow:0 12px 26px -8px rgba(0,0,0,.4);}
    .pc-icon-btn{width:44px;height:44px;}
    .pc-stats{order:2;width:100%;justify-content:center;margin-top:2px;}
  }

  /* ---------- mobile sticky join bar — floats at the bottom ---------- */
  .pc-sticky-cta{
    position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;z-index:29;
    display:flex;align-items:center;gap:12px;
    padding:9px 9px 9px 17px;border-radius:20px;
    background:var(--ink);color:#fff;
    box-shadow:0 16px 36px -10px rgba(20,21,26,.4),0 2px 10px rgba(20,21,26,.14);
    animation:pcCtaRise .4s var(--ease-spring) both;
  }
  .pc-sticky-cta .txt{flex:1;min-width:0;}
  .pc-sticky-cta .txt b{display:block;font-family:var(--font-display);font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pc-sticky-cta .txt span{display:block;font-family:var(--font-serif);font-size:12px;color:rgba(255,255,255,.65);margin-top:1px;}
  .pc-sticky-cta button{
    flex-shrink:0;height:38px;padding:0 20px;border-radius:99px;
    background:var(--cs);color:#fff;font-family:var(--font-display);font-weight:700;font-size:13.5px;
    transition:transform .12s var(--ease);
  }
  .pc-sticky-cta button:active{transform:scale(.94);}
  @keyframes pcCtaRise{ from{transform:translateY(18px);opacity:0;} to{transform:none;opacity:1;} }
  @media (min-width:900px){ .pc-sticky-cta{display:none;} }
  body.pc-has-cta{padding-bottom:calc(96px + env(safe-area-inset-bottom));}
  @media (min-width:900px){ body.pc-has-cta{padding-bottom:0;} }

  /* ---------- body ---------- */
  .pc-body{container:pcb / inline-size;display:flex;gap:40px;align-items:flex-start;padding:0 22px 64px;}
  .pc-col{flex:1;min-width:0;max-width:640px;}
  .pc-rail{
    width:250px;flex-shrink:0;position:sticky;top:20px;padding-top:24px;
    display:flex;flex-direction:column;gap:30px;
  }
  @container pcb (max-width:800px){ .pc-rail{display:none;} }

  .pc-rail h2{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:10px;}
  .pc-rail p{font-family:var(--font-serif);font-size:15px;line-height:1.55;color:var(--ink-soft);}
  .pc-rail .since{font-family:var(--font-display);font-size:12.5px;color:var(--grey);margin-top:8px;}
  .pc-rail h2 .cnt{font-weight:500;color:var(--grey);margin-left:4px;}
  .pc-person{display:flex;align-items:center;gap:10px;padding:5px 0;font-family:var(--font-display);font-size:14px;font-weight:500;}
  .pc-person span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .pc-person em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--cs);background:var(--cs-soft);padding:2px 8px;border-radius:99px;flex-shrink:0;}
  .pc-people-more{margin-top:6px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--cs);padding:4px 0;}
  .pc-people-more:hover{text-decoration:underline;}

  /* ---------- composer ---------- */
  .pc-compose{display:flex;gap:12px;padding:20px 0 18px;border-bottom:1px solid var(--line);}
  .pc-compose-main{flex:1;min-width:0;}
  .pc-compose-ph{
    display:block;width:100%;text-align:left;min-height:40px;
    font-family:var(--font-serif);font-size:18px;color:var(--grey);
  }
  .pc-compose-ph:hover{color:var(--ink-soft);}
  .pc-compose-panel{display:none;}
  .pc-compose.open .pc-compose-ph{display:none;}
  .pc-compose.open .pc-compose-panel{display:block;}
  .pc-compose textarea{
    display:block;width:100%;border:none;outline:none;resize:none;background:transparent;
    font-family:var(--font-serif);font-size:18px;line-height:1.55;color:var(--ink);
    min-height:84px;max-height:280px;padding:8px 0 4px;
  }
  .pc-compose textarea::placeholder{color:var(--grey);}
  .pc-media-field[hidden]{display:none;}
  .pc-media-field{margin-top:6px;}
  .pc-media-field input{
    width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;outline:none;
    font-family:var(--font-display);font-size:13.5px;color:var(--ink);background:#fff;
  }
  .pc-media-field input:focus{border-color:var(--cs);}
  .pc-media-preview{margin-top:10px;border-radius:14px;overflow:hidden;background:#f2f2f0;}
  .pc-media-preview:empty{display:none;}
  .pc-media-preview img,.pc-media-preview video{width:100%;max-height:300px;object-fit:cover;}
  .pc-hint{font-family:var(--font-display);font-size:13px;color:var(--grey);padding:12px 14px;}
  .pc-compose-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .pc-spacer{flex:1;}
  .pc-tool,.pc-anon{
    display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:99px;
    font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--ink-soft);
    background:#f5f5f3;transition:background .15s ease, color .15s ease;
  }
  .pc-tool{width:36px;padding:0;justify-content:center;}
  .pc-tool:hover,.pc-anon:hover{background:#ececea;color:var(--ink);}
  .pc-tool.on{background:var(--cs-soft);color:var(--cs);}
  .pc-anon[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .pc-tool svg,.pc-anon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pc-post-go{
    height:36px;padding:0 22px;border-radius:99px;background:var(--cs);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;min-width:76px;
    transition:opacity .15s ease, transform .12s var(--ease);
  }
  .pc-post-go:disabled{opacity:.35;}
  .pc-post-go:active:not(:disabled){transform:scale(.96);}
  .pc-post-go .mini-spinner{width:14px;height:14px;}

  .pc-join-prompt{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:18px 0;border-bottom:1px solid var(--line);
    font-family:var(--font-serif);font-size:15.5px;color:var(--ink-soft);line-height:1.45;
  }
  .pc-join-prompt button{
    height:36px;padding:0 18px;border-radius:99px;background:var(--cs);color:#fff;flex-shrink:0;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;
  }
  @media (max-width:599.98px){
    .pc-join-prompt{
      flex-direction:column;align-items:stretch;text-align:center;gap:12px;
      margin-top:16px;padding:20px 18px;border:1px solid var(--line);border-radius:18px;
      background:var(--cs-soft);
    }
    .pc-join-prompt span{color:var(--ink);font-size:15px;}
    .pc-join-prompt button{height:44px;font-size:14.5px;}
  }

  /* ---------- sort bar ---------- */
  .pc-bar{
    position:sticky;top:var(--topbar-h);z-index:15;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 -16px;padding:12px 16px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .pc-seg{position:relative;display:inline-flex;padding:3px;background:#f2f2f0;border-radius:99px;}
  .pc-seg button{
    position:relative;z-index:1;height:32px;padding:0 16px;border-radius:99px;
    font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink-soft);
    transition:color .2s ease;
  }
  .pc-seg button[aria-selected="true"]{color:var(--ink);}
  .pc-seg-thumb{
    position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:99px;background:#fff;
    box-shadow:0 1px 3px rgba(20,21,26,.14);
  }
  .pc-seg.ready .pc-seg-thumb{transition:transform .3s var(--ease), width .3s var(--ease);}
  .pc-new{
    height:32px;padding:0 14px;border-radius:99px;background:var(--cs);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:13px;
    display:none;align-items:center;gap:6px;
  }
  .pc-new.show{display:inline-flex;animation:pcDrop .3s var(--ease-spring);}
  .pc-new svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes pcDrop{ from{transform:translateY(-8px);opacity:0;} to{transform:none;opacity:1;} }
  @media (max-width:899.98px){ .pc-bar{margin:0 -22px;padding:12px 22px;} }

  /* ---------- feed ---------- */
  .pc-feed{transition:opacity .2s ease;}
  .pc-feed.is-loading{opacity:.4;pointer-events:none;}
  .pc-post{display:flex;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--line);}
  .pc-post-main{flex:1;min-width:0;}
  .pc-head{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);min-height:20px;}
  .pc-head b{font-weight:600;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .pc-head b.anon{color:var(--ink-soft);font-weight:500;}
  .pc-head time{font-size:13px;color:var(--grey);flex-shrink:0;}
  .pc-you{font-size:11.5px;font-weight:600;color:var(--grey);border:1px solid var(--line-strong);border-radius:99px;padding:0 7px;flex-shrink:0;}
  .pc-text{
    font-family:var(--font-serif);font-size:17.5px;line-height:1.6;color:var(--ink);margin-top:4px;
    white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .pc-text.clamp{display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;}
  .pc-more{margin-top:4px;font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--cs);}
  .pc-more:hover{text-decoration:underline;}
  .pc-media{margin-top:12px;border-radius:16px;overflow:hidden;background:#f2f2f0;}
  .pc-media img,.pc-media video{width:100%;max-height:480px;object-fit:cover;}
  .pc-media audio{width:100%;}
  .pc-media.broken{display:none;}

  .pc-foot{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .pc-vote{display:inline-flex;align-items:center;border-radius:99px;background:#f5f5f3;}
  .pc-v{
    position:relative;width:36px;height:34px;display:flex;align-items:center;justify-content:center;
    border-radius:99px;color:var(--grey);transition:color .15s ease, background .15s ease, transform .1s ease;
  }
  .pc-v:hover{color:var(--ink);background:#ececea;}
  .pc-v:active{transform:scale(.88);}
  .pc-v svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .pc-v.up.on{color:var(--cs);}
  .pc-v.down.on{color:#6470f0;}
  .pc-v.on svg{stroke-width:3.2;}
  .pc-v.up.burst::after{
    content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid var(--cs);
    animation:pcBurst .5s var(--ease) forwards;pointer-events:none;
  }
  @keyframes pcBurst{ from{opacity:.9;transform:scale(.5);} to{opacity:0;transform:scale(1.8);} }
  .pc-score{
    min-width:24px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:14px;
    color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .pc-score.pos{color:var(--cs);}
  .pc-score.neg{color:#6470f0;}
  .pc-score.bump{animation:pcBump .32s var(--ease-spring);}
  @keyframes pcBump{ 40%{transform:scale(1.35);} }
  .pc-cbtn{
    display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 12px;border-radius:99px;
    background:#f5f5f3;color:var(--ink-soft);font-family:var(--font-display);font-weight:600;font-size:13.5px;
    transition:background .15s ease, color .15s ease;
  }
  .pc-cbtn:hover{background:#ececea;color:var(--ink);}
  .pc-post.open .pc-cbtn{background:var(--cs-soft);color:var(--cs);}
  .pc-cbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .pc-del{
    margin-left:auto;display:inline-flex;align-items:center;height:34px;padding:0 10px;border-radius:99px;
    color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:13px;transition:color .15s ease, background .15s ease;
  }
  .pc-del:hover{color:var(--danger);}
  .pc-del.armed{color:#fff;background:var(--danger);}
  .pc-del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  .pc-post.spot{
    background:var(--cs-soft);margin:16px -16px 0;padding:20px 16px 16px;border-radius:20px;border-bottom:none;
  }
  .pc-post.spot .pc-text{font-size:21px;line-height:1.5;}
  @media (max-width:520px){ .pc-post.spot .pc-text{font-size:19px;} }
  .pc-post.spot .pc-vote,.pc-post.spot .pc-cbtn{background:#fff;}
  .pc-spot-label{
    display:flex;align-items:center;gap:6px;margin-bottom:8px;
    font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--cs);
  }
  .pc-spot-label svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .pc-post.spot + .pc-post{border-top:none;}

  /* replies open inline, under the post they belong to */
  .pc-thread{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease);}
  .pc-post.open .pc-thread{grid-template-rows:1fr;}
  .pc-thread-clip{overflow:hidden;min-height:0;}
  .pc-thread-in{margin-top:14px;padding-left:14px;border-left:2px solid var(--cs-mid);}
  .pc-c{display:flex;gap:10px;padding:8px 0;}
  .pc-c-main{flex:1;min-width:0;}
  .pc-c-head{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);}
  .pc-c-head b{font-weight:600;font-size:14px;}
  .pc-c-head time{font-size:12.5px;color:var(--grey);}
  .pc-c-del{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--grey);margin-left:auto;}
  .pc-c-del:hover{color:var(--danger);}
  .pc-c-del.armed{color:var(--danger);}
  .pc-c p{font-family:var(--font-serif);font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px;}
  .pc-c audio{width:100%;height:34px;margin-top:6px;}
  .pc-c-empty,.pc-c-loading{font-family:var(--font-serif);font-size:15px;color:var(--grey);padding:6px 0;}
  .pc-cform{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
  .pc-cinput{
    flex:1;min-width:0;height:40px;border-radius:99px;border:1px solid transparent;background:#f5f5f3;padding:0 16px;outline:none;
    font-family:var(--font-serif);font-size:16px;color:var(--ink);
  }
  .pc-cinput:focus{background:#fff;border-color:var(--cs);}
  .pc-csend{
    height:40px;padding:0 18px;border-radius:99px;background:var(--cs);color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:13.5px;transition:opacity .15s ease;
  }
  .pc-csend:disabled{opacity:.35;}
  .pc-cjoin{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--cs);padding:8px 0;}
  .pc-cjoin:hover{text-decoration:underline;}

  .pc-empty{padding:64px 12px;text-align:center;}
  .pc-empty h3{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em;}
  .pc-empty p{font-family:var(--font-serif);font-size:16px;line-height:1.5;color:var(--ink-soft);max-width:34ch;margin:8px auto 18px;}
  .pc-empty button{height:40px;padding:0 22px;border-radius:99px;background:var(--cs);color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;}

  .pc-sk{display:flex;gap:12px;padding:20px 0;border-bottom:1px solid var(--line);}
  .pc-sk .a,.pc-sk .l{background:linear-gradient(90deg,#f1f1ef 0%,#f8f8f6 50%,#f1f1ef 100%);background-size:200% 100%;animation:pcShimmer 1.3s linear infinite;}
  .pc-sk .a{width:40px;height:40px;border-radius:50%;flex-shrink:0;}
  .pc-sk .l{height:13px;border-radius:7px;margin-top:8px;}
  @keyframes pcShimmer{ to{background-position:-200% 0;} }

  .locked-notice{
    display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:#c24020;
    font-family:var(--font-mono);font-size:11.5px;padding:12px 14px;border-radius:12px;margin-bottom:2px;
  }
  .locked-notice svg{width:15px;height:15px;stroke:#c24020;flex-shrink:0;}

  .waater-toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
    background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;
    padding:11px 18px;border-radius:99px;box-shadow:0 12px 30px rgba(20,21,26,.25);
    display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;z-index:200;
    transition:opacity .2s ease, transform .2s ease;white-space:nowrap;max-width:90vw;
  }
  .waater-toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .waater-toast.show{opacity:1;transform:translate(-50%,0);}
  .waater-toast.error{background:var(--danger);}
  .waater-toast svg{width:15px;height:15px;stroke:#fff;flex-shrink:0;}
  @media (min-width:900px){ .waater-toast{bottom:34px;} }

  /* ============================================================
     PRIVACY BADGE — always-visible reassurance in the circle header
  ============================================================ */
  .privacy-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line-strong);
    padding:6px 11px 6px 9px;border-radius:99px;margin-top:11px;
  }
  .privacy-badge svg{width:12px;height:12px;stroke:var(--accent);flex-shrink:0;}
  .privacy-badge span{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);}
  .privacy-badge b{color:var(--ink);font-family:var(--font-display);font-weight:600;font-style:normal;}

  /* ============================================================
     WELCOME CEREMONY — first-time entry into a private circle
  ============================================================ */
  .welcome-overlay{
    position:fixed;inset:0;z-index:500;overflow-y:auto;
    background:radial-gradient(circle at 50% 28%, rgba(255,90,54,.28), transparent 58%), var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(32px,env(safe-area-inset-top)) 28px max(28px,env(safe-area-inset-bottom));
    text-align:center;opacity:0;transition:opacity .5s var(--ease);
  }
  .welcome-overlay.show{opacity:1;}
  .welcome-face{
    position:relative;width:116px;height:116px;border-radius:50%;flex-shrink:0;
    opacity:0;transform:scale(.7);animation:welcomePop .7s var(--ease-spring) .1s forwards;
  }
  .welcome-face::after{
    content:"";position:absolute;inset:-9px;border-radius:50%;
    border:1.5px solid rgba(255,177,153,.55);animation:welcomeBreathe 2.8s ease-in-out 1s infinite;
  }
  .welcome-face .avatar{
    width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:46px;
  }
  .welcome-face .avatar img{width:100%;height:100%;object-fit:cover;}
  @keyframes welcomePop{to{opacity:1;transform:scale(1);}}
  @keyframes welcomeBreathe{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.07);opacity:.25;}}
  @keyframes welcomeRise{to{opacity:1;transform:translateY(0);}}
  .welcome-step{opacity:0;transform:translateY(14px);animation:welcomeRise .7s var(--ease) forwards;}
  .welcome-title{
    font-family:var(--font-display);font-weight:700;color:#fff;
    font-size:clamp(30px,8vw,42px);line-height:1.1;letter-spacing:-.02em;
    margin-top:28px;max-width:440px;animation-delay:.7s;
  }
  .welcome-note{
    margin-top:22px;max-width:420px;animation-delay:1.5s;
    font-family:var(--font-serif);font-weight:500;color:#fff;
    font-size:clamp(21px,5.6vw,26px);line-height:1.38;
  }
  .welcome-note-by{
    display:block;margin-top:10px;font-family:var(--font-display);font-weight:500;
    font-size:13.5px;color:var(--accent-2);
  }
  .welcome-left{
    margin-top:22px;max-width:380px;width:100%;animation-delay:2.2s;text-align:left;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    border-radius:18px;padding:14px 16px;
  }
  .welcome-left b{display:block;font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--accent-2);}
  .welcome-left p{
    margin-top:6px;font-family:var(--font-serif);font-size:15px;line-height:1.5;color:rgba(255,255,255,.9);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .welcome-sub{
    margin-top:20px;max-width:380px;animation-delay:2.2s;
    font-family:var(--font-serif);font-size:15px;line-height:1.55;color:rgba(255,255,255,.7);
  }
  .welcome-enter{
    margin-top:28px;background:var(--accent);color:#fff;font-family:var(--font-display);
    font-weight:600;font-size:15px;padding:15px 34px;border-radius:99px;
    animation-delay:2.9s;transition:transform .15s var(--ease), background .15s ease;
  }
  .welcome-enter:hover{background:#e64a27;}
  .welcome-enter:active{transform:scale(.95);}
  .welcome-enter:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  .welcome-privacy-line{
    margin-top:18px;animation-delay:3.2s;
    font-family:var(--font-serif);font-size:12.5px;color:rgba(255,255,255,.5);
  }

  .im-media{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .im-chip{font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink);background:#fff;}
  .im-chip:hover{background:#f7f7f8;}
  .im-chip.rec{background:var(--danger);border-color:var(--danger);color:#fff;}
  .im-status{font-family:var(--font-serif);font-size:12.5px;color:var(--ink-soft);}
  .im-status button{color:var(--danger);font-weight:600;margin-left:6px;}
  .welcome-media{margin-top:22px;max-width:380px;width:100%;animation-delay:1.9s;}
  .welcome-media video{width:100%;max-height:46vh;border-radius:18px;background:#000;object-fit:cover;}
  .welcome-media audio{width:100%;}
  .welcome-media span{display:block;margin-top:8px;font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--accent-2);}

  .post-highlight{
  animation: postHighlightPulse 2.2s ease;
}
@keyframes postHighlightPulse{
  0%{ box-shadow:0 0 0 3px var(--accent); border-radius:16px; }
  100%{ box-shadow:0 0 0 0px transparent; }
}

  /* ============================================================
     INVITE PREVIEW — unauthenticated peek before sign-up.
     Shows the real feed (everything except the Us/memories vault),
     full width, so it reads exactly like being inside the circle.
  ============================================================ */
  .invite-preview-page{max-width:640px;margin:0 auto;}
  .invite-preview-badge{
    font-family:var(--font-display);font-weight:600;font-size:12.5px;
    background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:99px;margin:20px 22px 4px;
  }
  .invite-preview-badge b{font-weight:700;}
  .invite-preview-cta{
    display:block;width:calc(100% - 44px);margin:6px auto 40px;padding:15px 16px;
    font-family:var(--font-display);font-weight:600;font-size:15px;border-radius:14px;
  }

  /* ============================================================
     INVITE MODAL — personal note attached to an invite link
  ============================================================ */
  .invite-modal-backdrop{
    position:fixed;inset:0;z-index:400;background:rgba(20,21,26,.5);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;transition:opacity .2s ease;
  }
  .invite-modal-backdrop.show{opacity:1;}
  .invite-modal{
    background:#fff;border-radius:20px;padding:22px;max-width:360px;width:100%;
    transform:translateY(10px) scale(.97);transition:transform .22s var(--ease-spring);
  }
  .invite-modal-backdrop.show .invite-modal{transform:translateY(0) scale(1);}
  .invite-modal h3{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .invite-modal p{font-family:var(--font-serif);font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.45;}
  .invite-modal textarea{
    width:100%;margin-top:12px;border:1px solid var(--line-strong);border-radius:12px;
    padding:10px 12px;font-family:var(--font-serif);font-size:13.5px;resize:none;min-height:64px;outline:none;
    transition:border-color .15s ease;
  }
  .invite-modal textarea:focus{border-color:var(--accent);}
  .gh-send-as{display:flex;gap:8px;margin-top:12px;}
  .gh-send-as-opt{
    flex:1;display:flex;align-items:center;gap:7px;padding:10px 12px;border-radius:12px;
    border:1px solid var(--line,#e6e3dd);cursor:pointer;font-family:var(--font-display);font-size:12.5px;font-weight:600;
    transition:border-color .15s ease,background .15s ease;
  }
  .gh-send-as-opt:has(input:checked){border-color:var(--accent);background:rgba(255,90,54,.06);}
  .gh-send-as-opt input{accent-color:var(--accent);}
  .gh-send-as-note{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .invite-modal-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .invite-modal-skip{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:9px 14px;border-radius:99px;}
  .invite-modal-skip:hover{background:#f7f7f8;}
  .invite-modal-send{background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:99px;}
  .invite-modal-send:hover{background:#000;}

  /* ---- Empty-circle nudge: write the first post right inside the popup ---- */
  .invite-modal.en-modal{max-width:380px;overflow:hidden;position:relative;}
  .en-composer{
    margin-top:16px;border:1px solid var(--line-strong);border-radius:18px;background:#fafafa;
    padding:10px 10px 8px;transition:border-color .18s ease,background .18s ease,box-shadow .18s ease;
  }
  .en-composer:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(255,90,54,.10);}
  .invite-modal .en-composer textarea{
    display:block;margin:0;border:0;background:transparent;border-radius:0;
    padding:4px 6px;min-height:46px;max-height:140px;font-size:15px;line-height:1.45;
  }
  .invite-modal .en-composer textarea:focus{border:0;}
  .en-bar{display:flex;align-items:center;gap:2px;margin-top:4px;}
  .en-tool{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft);
    transition:background .15s ease,color .15s ease,transform .15s var(--ease-spring);
  }
  .en-tool:hover{background:rgba(20,21,26,.06);color:var(--ink);}
  .en-tool:active{transform:scale(.92);}
  .en-tool svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .en-send{
    margin-left:auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:#e4e4e7;color:#fff;cursor:default;
    transition:background .2s ease,transform .2s var(--ease-spring),box-shadow .2s ease;
  }
  .en-send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .en-send.ready{background:var(--accent);cursor:pointer;box-shadow:0 6px 16px rgba(255,90,54,.35);transform:scale(1.04);}
  .en-send.ready:hover{transform:scale(1.1);}
  .en-send.ready:active{transform:scale(.94);}
  .en-send:disabled:not(.ready){pointer-events:none;}
  .en-send .mini-spinner{width:16px;height:16px;}

  /* recording strip replaces the textarea while the mic is live */
  .en-rec{display:none;align-items:center;gap:10px;min-height:46px;padding:4px 6px;}
  .en-composer.recording .en-rec{display:flex;}
  .en-composer.recording textarea,
  .en-composer.recording .en-tool:not(.en-cancel){display:none;}
  .en-composer.recording .en-cancel{display:grid;}
  .en-cancel{display:none;}
  .en-dot{width:9px;height:9px;border-radius:50%;background:var(--danger,#e5484d);animation:enPulse 1.1s ease-in-out infinite;flex-shrink:0;}
  .en-time{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);min-width:34px;}
  .en-wave{flex:1;display:flex;align-items:center;gap:3px;height:26px;}
  .en-wave i{flex:1;max-width:4px;height:6px;border-radius:3px;background:var(--accent);opacity:.85;animation:enWave 1s ease-in-out infinite;}
  .en-wave i:nth-child(3n){animation-delay:-.25s}
  .en-wave i:nth-child(3n+1){animation-delay:-.55s}
  .en-wave i:nth-child(4n){animation-duration:.8s}
  .en-wave i:nth-child(5n){animation-duration:1.3s}
  @keyframes enWave{0%,100%{height:5px}50%{height:24px}}
  @keyframes enPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  @keyframes enShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .invite-modal.en-modal.shake{animation:enShake .28s ease;}

  .en-foot{display:flex;justify-content:center;margin-top:10px;}
  .en-foot .invite-modal-skip{font-size:12.5px;}

  /* success beat */
  .en-done{display:none;flex-direction:column;align-items:center;gap:10px;padding:22px 0 8px;text-align:center;}
  .invite-modal.en-modal.done .en-composer,
  .invite-modal.en-modal.done .en-foot{display:none;}
  .invite-modal.en-modal.done .en-done{display:flex;}
  .en-check{width:46px;height:46px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:enPop .45s var(--ease-spring) both;}
  .en-check svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .en-done b{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .en-done span{font-family:var(--font-serif);font-size:13px;color:var(--ink-soft);}
  @keyframes enPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

  /* ---- Circle Album (capture modal — the gallery itself lives in the
     Album tab, styled further down) ---- */
  .album-modal-backdrop{
    position:fixed;inset:0;background:rgba(20,21,26,.6);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s ease;
  }
  @media (min-width:640px){ .album-modal-backdrop{align-items:center;} }
  .album-modal-backdrop.show{opacity:1;}
  .album-modal{
    background:#fff;border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;
    transform:translateY(16px);transition:transform .24s var(--ease-spring);
  }
  @media (min-width:640px){ .album-modal{border-radius:22px;} }
  .album-modal-backdrop.show .album-modal{transform:translateY(0);}
  .album-modal h3{font-family:var(--font-display);font-weight:700;font-size:16px;margin-bottom:4px;}
  .album-modal p.hint{font-family:var(--font-serif);font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .album-canvas-wrap{
    width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#111;
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;
  }
  .album-canvas-wrap canvas{width:100%;height:100%;object-fit:cover;}
  .album-canvas-placeholder{color:#7c7f88;font-family:var(--font-mono);font-size:11px;text-align:center;padding:20px;}

  .album-canvas-loading{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:11px;color:#fff;z-index:2;animation:riseIn .25s ease both;
  }
  .album-canvas-loading .ring{
    width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent-2);
    animation:spin .8s linear infinite;
  }
  .album-canvas-loading .txt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;color:rgba(255,255,255,.75);}

  .album-canvas-uploading{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;background:rgba(10,10,12,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3;
    animation:promptPinIn .25s var(--ease-spring) both;
  }
  .album-canvas-uploading .ring{
    width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.22);border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  .album-canvas-uploading .txt{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:#fff;}
  .album-canvas-uploading .sub{font-family:var(--font-mono);font-size:9.5px;color:rgba(255,255,255,.65);margin-top:-3px;}
  .album-upload-bar{width:110px;height:3px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:2px;}
  .album-upload-bar::after{
    content:'';display:block;width:36%;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    animation:ghBarSlide 1.1s ease-in-out infinite;
  }
  @keyframes ghBarSlide{ 0%{transform:translateX(-120%);} 100%{transform:translateX(390%);} }
  .album-pick-btn:disabled{opacity:.4;}
  .album-pick-row{display:flex;gap:8px;margin-bottom:14px;}
  .album-pick-btn{
    flex:1;border:1px solid var(--line-strong);border-radius:12px;padding:10px;
    font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .album-pick-btn svg{width:15px;height:15px;}
  .album-filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-ms-overflow-style:none;scrollbar-width:none;}
  .album-filter-row::-webkit-scrollbar{display:none;}
  .album-filter-swatch{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .album-filter-swatch .sw{width:46px;height:46px;border-radius:50%;border:2px solid transparent;overflow:hidden;background:#eee;}
  .album-filter-swatch.active .sw{border-color:var(--accent);}
  .album-filter-swatch span{font-family:var(--font-mono);font-size:8.5px;color:var(--ink-soft);}
  .album-modal textarea{
    width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;
    font-family:var(--font-serif);font-size:13.5px;resize:none;min-height:52px;outline:none;margin-bottom:14px;
  }
  .album-modal-row{display:flex;justify-content:flex-end;gap:8px;}
  .album-modal-cancel{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:9px 14px;border-radius:99px;}
  .album-modal-cancel:hover{background:#f7f7f8;}
  .album-modal-post{background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:9px 18px;border-radius:99px;display:flex;align-items:center;gap:6px;}
  .album-modal-post:disabled{opacity:.5;}
  .album-modal-post:hover:not(:disabled){background:#000;}

  .album-lightbox-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:210;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease;
  }
  .album-lightbox-backdrop.show{opacity:1;}
  .album-lightbox{max-width:min(92vw,480px);width:100%;position:relative;}
  .album-lightbox img{width:100%;border-radius:14px;display:block;}
  .album-lightbox-info{color:#fff;padding:12px 4px 0;font-family:var(--font-mono);font-size:11px;display:flex;justify-content:space-between;align-items:center;}
  .album-lightbox-close{position:absolute;top:18px;right:18px;color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .album-lightbox-close svg{width:22px;height:22px;stroke:#fff;}
  .album-lightbox-nav{
    position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
    z-index:3;transition:background .15s ease, transform .15s ease;
  }
  .album-lightbox-nav:hover{background:rgba(0,0,0,.6);}
  .album-lightbox-nav:active{transform:translateY(-50%) scale(.88);}
  .album-lightbox-nav svg{width:19px;height:19px;stroke:#fff;}
  .album-lightbox-prev{left:10px;}
  .album-lightbox-next{right:10px;}

  /* ============================================================
     VIEW TABS — Home / Camera / Us switcher, lives inside the circle page
     (no route change — just swaps which panel is visible)
  ============================================================ */
  .view-tabs{
    display:flex;gap:4px;margin:16px 22px 0;padding:4px;
    background:#f3f3f1;border-radius:14px;position:relative;z-index:5;
  }
  .view-tab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 10px;border-radius:11px;font-family:var(--font-display);font-weight:600;font-size:13px;
    color:var(--ink-soft);transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);
  }
  .view-tab svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0;}

  .solar-mark{

}

}

@keyframes solarSpin{ to{ transform:rotate(360deg); } }

  .gallery-sub{font-family:var(--font-serif);font-size:14px;color:var(--ink-soft);margin-top:6px;}

  /* ---- Golden Hour — ask someone a question ---- */
  .ask-strip{margin-top:18px;}

  /* ---- Golden Hour — pinned prompt banner + in-modal question ---- */
  .prompt-pin{
    position:relative;margin:0 0 18px;padding:16px 18px;border-radius:16px;
    background:linear-gradient(135deg,var(--accent-soft) 0%,#fff 100%);

  @keyframes promptPinIn{ from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:translateY(0);} }
  .prompt-pin-label{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .prompt-pin-question{font-family:var(--font-serif);font-size:16px;line-height:1.4;color:var(--ink);margin-bottom:12px;}
