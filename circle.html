<script>
  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }
  function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
  function timeAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if (s<60) return 'just now';
    if (s<3600) return `${Math.floor(s/60)}m ago`;
    if (s<86400) return `${Math.floor(s/3600)}h ago`;
    if (s<604800) return `${Math.floor(s/86400)}d ago`;
    return new Date(iso).toLocaleDateString();
  }
  function getGreeting(){
    const h = new Date().getHours();
    if (h < 5) return 'Still up';
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentUsername = null;

  function requireAuth(nextPath){
    if (currentUser) return true;
    window.location.href = `/auth?next=${encodeURIComponent(nextPath || window.location.pathname + window.location.search)}`;
    return false;
  }

  let toastTimer = null;
  function showToast(text, type){
    const toast = document.getElementById('waaterToast');
    document.getElementById('waaterToastText').textContent = text;
    toast.classList.remove('error');
    if (type === 'error') toast.classList.add('error');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ============================================================
  // PRIVACY / BELONGING HELPERS
  // ============================================================

  // Was this member's join timestamp within the last minute? Used to decide
  // whether to play the welcome ceremony (vs. just navigating back later).
  function justJoined(meRow){
    if (!meRow || !meRow.joined_at) return false;
    return (Date.now() - new Date(meRow.joined_at).getTime()) < 300000; // 5 min window
  }

  // Best-effort fetch of a personal note left by whoever invited this user.
  // Expects an optional `welcome_note` text column on circle_members.
  // If that column doesn't exist yet, this quietly returns null — nothing breaks.
  async function loadMyWelcomeNote(){
    try{
      const { data, error } = await supabaseClient
        .from('circle_members')
        .select('welcome_note, invited_by')
        .eq('circle_id', circleId)
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if (error || !data) return { note: null, inviter: null };

      let inviter = null;
      if (data.invited_by){
        const { data: prof } = await supabaseClient
          .from('profiles')
          .select('username, avatar_url')
          .eq('id', data.invited_by)
          .maybeSingle();
        inviter = prof || null;
      }
      return { note: data.welcome_note || null, inviter };
    } catch(e){ return { note: null, inviter: null }; }
  }

  function renderPeopleRow(){
    return `
      <div class="home-people-row">
        ${members.map(m => `
          <div class="home-person">
            <div class="ring"><div class="ring-inner"><div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div></div></div>
            <span>${escapeHtml((m.username||'?').split(' ')[0])}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // Full-screen, one-time "you're in" moment. Plays over the feed while it
  // loads underneath — the moment the person sees the second they land.
  async function playWelcomeCeremony(note, inviter){
    return new Promise(resolve => {
      const inviterName = inviter?.username || null;
      const overlay = document.createElement('div');
      overlay.className = 'welcome-overlay';
      overlay.innerHTML = `
        <div class="welcome-lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        </div>
        <div class="welcome-ring">
          ${members.map((m,i) => `
            <div class="welcome-avatar" style="animation-delay:${(i*0.08).toFixed(2)}s">
              <div class="avatar">${m.avatar_url ? `<img src="${escapeHtml(m.avatar_url)}" alt="">` : initials(m.username||'?')}</div>
            </div>
          `).join('')}
        </div>
        <div class="welcome-text">
          <div class="welcome-eyebrow">you're special</div>
          <h1 class="welcome-title">${inviterName ? `That's why @${escapeHtml(inviterName)} invited you` : `Welcome to ${escapeHtml(circle.name)}`}</h1>
          <p class="welcome-sub">${inviterName ? `Out of everyone @${escapeHtml(inviterName)} knows, they chose you. You're now one of only ${members.length} people in ${escapeHtml(circle.name)}.` : `You're now one of only ${members.length} people who get to be part of ${escapeHtml(circle.name)}.`}</p>
          ${note ? `
            <div class="welcome-note">
              <b>${inviterName ? `a note from @${escapeHtml(inviterName)}` : 'a note for you'}</b>
              <p>${escapeHtml(note)}</p>
            </div>
          ` : ''}
          <div class="welcome-privacy-line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            A space just for the ${members.length} of you — nothing shared here ever leaves this circle
          </div>
        </div>
        <button class="welcome-enter">I'm in</button>
      `;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      const finish = () => {
        overlay.classList.remove('show');
        setTimeout(() => { overlay.remove(); resolve(); }, 350);
      };
      overlay.querySelector('.welcome-enter').addEventListener('click', finish);
    });
  }

  // Small modal so the person inviting someone can attach a personal note.
  // Resolves to the note string, or null if skipped/closed.
  function openInviteModal(){
    return new Promise(resolve => {
      const modal = document.createElement('div');
      modal.className = 'invite-modal-backdrop';
      modal.innerHTML = `
        <div class="invite-modal">
          <h3>Invite someone to ${escapeHtml(circle.name)}</h3>
          <p>Add a personal note — it'll be the first thing they see when they arrive.</p>
          <textarea id="inviteNoteInput" maxlength="140" placeholder="e.g. finally got you in here 🎉"></textarea>
          <div class="invite-modal-row">
            <button class="invite-modal-skip" type="button">Skip note</button>
            <button class="invite-modal-send" type="button">Create invite</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      requestAnimationFrame(() => modal.classList.add('show'));
      const close = (note) => {
        modal.classList.remove('show');
        setTimeout(() => modal.remove(), 220);
        resolve(note);
      };
      modal.querySelector('.invite-modal-skip').addEventListener('click', () => close(null));
      modal.querySelector('.invite-modal-send').addEventListener('click', () => {
        const val = modal.querySelector('#inviteNoteInput').value.trim();
        close(val || null);
      });
      modal.addEventListener('click', (e) => { if (e.target === modal) close(null); });
    });
  }

  // Live "someone just joined" broadcast via Supabase Realtime — makes the
  // circle feel alive and lets everyone currently inside see arrivals happen.
  // Requires Realtime enabled on the circle_members table in Supabase.
  let circleChannel = null;
  function subscribeToCircleActivity(){
    if (circleChannel || !circle?.is_private) return;
    circleChannel = supabaseClient
      .channel(`circle-activity-${circleId}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'circle_members', filter: `circle_id=eq.${circleId}` },
        async (payload) => {
          if (!payload.new || payload.new.user_id === currentUser?.id) return;
          const { data: prof } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', payload.new.user_id).maybeSingle();
          showToast(`${prof?.username || 'someone'} just joined the circle 👋`);
          members = await loadMembers();
          const row = document.querySelector('.home-people-row');
          if (row) row.outerHTML = renderPeopleRow();
        }
      )
      .subscribe();
  }
  window.addEventListener('beforeunload', () => { if (circleChannel) supabaseClient.removeChannel(circleChannel); });

  async function renderSidebar(){
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');
    if (!currentUser){
      area.innerHTML = `<a href="/auth" class="sidebar-signin">Sign in</a>`;
      return;
    }
    const { data: me } = await supabaseClient.from('profiles').select('username, avatar_url').eq('id', currentUser.id).maybeSingle();
    currentUsername = me?.username || currentUser.email || 'You';
    const avatarHtml = me?.avatar_url ? `<img src="${escapeHtml(me.avatar_url)}" alt="">` : initials(currentUsername);
    area.innerHTML = `
      <div class="sidebar-user">
        <a href="/profile" class="sidebar-profile">
          <div class="mini-avatar">${avatarHtml}</div>
          <div class="who"><span>${escapeHtml(currentUsername)}</span><span>view profile</span></div>
        </a>
        <button class="sidebar-signout" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });
  }

  const params = new URLSearchParams(window.location.search);
  const circleId = params.get('ID');
  const urlSaysPrivate = params.has('private');

  let circle = null;
  let myRole = null;
  let members = [];
  let currentSort = 'hot';

  async function loadCircle(){
    const { data: c, error } = await supabaseClient
      .from('circles')
      .select('id, name, description, is_private, created_at, created_by')
      .eq('id', circleId)
      .maybeSingle();
    if (error || !c) return null;
    return c;
  }

  async function loadMembers(){
    const { data: mem } = await supabaseClient
      .from('circle_members')
      .select('user_id, role, joined_at')
      .eq('circle_id', circleId)
      .order('joined_at', { ascending: true });

    const list = mem || [];
    if (list.length === 0) return [];

    const userIds = list.map(m => m.user_id);
    const { data: profs } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .in('id', userIds);

    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });

    return list
      .map(m => {
        const p = profileById[m.user_id];
        if (!p) return null;
        return { ...p, role: m.role, joined_at: m.joined_at };
      })
      .filter(Boolean);
  }

  // How many invites this owner has already created for this circle since
  // midnight (local time). Backs the "N/2 today" badge and the client-side
  // disable — the real enforcement lives in the DB trigger on circle_invites,
  // this is just so the button reflects it without a failed request first.
  // Assumes a `circle_invites` table with circle_id, created_by, created_at —
  // rename these to match your actual invites table if it differs.
  async function loadInvitesToday(){
    if (!currentUser) return 0;
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    const { count, error } = await supabaseClient
      .from('circle_invites')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', circleId)
      .eq('created_by', currentUser.id)
      .gte('created_at', startOfDay.toISOString());
    if (error) { console.error('loadInvitesToday failed', error); return 0; }
    return count ?? 0;
  }

  // =========================================================
  // PRIVATE MEDIA — every file lives in a private bucket and is only
  // ever shown through a short-lived signed link. Storage policies
  // (circle membership) decide who is allowed to get a link at all.
  // =========================================================
  const SIGNED_TTL = 1800;                          // links live 30 minutes
  const SIGNED_CACHE_MS = (SIGNED_TTL - 300) * 1000; // re-sign 5 min before expiry
  const signedCache = new Map();                    // "bucket/path" -> { url, exp }
  const MEDIA_BUCKETS = ['voice-posts', 'voice-comments', 'album-photos'];
  const PUBLIC_MARK = '/storage/v1/object/public/';
  const SIGN_MARK = '/storage/v1/object/sign/';

  // What we store in the DB is the object PATH. Rows created before the
  // switch hold a full public URL — we read the path back out of it.
  // Returns null for anything that isn't one of our files (external links).
  function mediaPathFrom(bucket, value){
    if (!value) return null;
    const v = String(value).trim();
    if (!/^https?:\/\//i.test(v)) return v.replace(/^\/+/, '');
    for (const mark of [PUBLIC_MARK, SIGN_MARK]) {
      const i = v.indexOf(mark + bucket + '/');
      if (i !== -1) {
        let p = v.slice(i + mark.length + bucket.length + 1).split('?')[0];
        try { p = decodeURIComponent(p); } catch (_) {}
        return p;
      }
    }
    return null;
  }

  // Turn stored refs into signed URLs (batched + cached). A file that can't
  // be signed (not a member, deleted) comes back as '' — never a fallback URL.
  async function signMedia(bucket, refs){
    const now = Date.now();
    const out = new Array(refs.length);
    const need = new Map();                         // path -> [indexes]
    refs.forEach((ref, i) => {
      const path = mediaPathFrom(bucket, ref);
      if (path === null) { out[i] = ref; return; }  // external link, leave alone
      const hit = signedCache.get(bucket + '/' + path);
      if (hit && hit.exp > now) { out[i] = hit.url; return; }
      if (!need.has(path)) need.set(path, []);
      need.get(path).push(i);
    });
    if (need.size) {
      const { data, error } = await supabaseClient.storage.from(bucket).createSignedUrls([...need.keys()], SIGNED_TTL);
      if (error) console.error('signMedia failed', error);
      (data || []).forEach(row => {
        if (row && row.signedUrl && !row.error) {
          signedCache.set(bucket + '/' + row.path, { url: row.signedUrl, exp: now + SIGNED_CACHE_MS });
          (need.get(row.path) || []).forEach(i => { out[i] = row.signedUrl; });
        }
      });
      need.forEach(idxs => idxs.forEach(i => { if (out[i] === undefined) out[i] = ''; }));
    }
    return out;
  }

  async function hydratePostMedia(list){
    const at = [];
    list.forEach((p, i) => { if (p.media_url && p.media_type === 'voice') at.push(i); });
    if (!at.length) return list;
    const urls = await signMedia('voice-posts', at.map(i => list[i].media_url));
    at.forEach((li, k) => { list[li] = { ...list[li], media_url: urls[k] }; });
    return list;
  }

  async function hydrateCommentMedia(list){
    const at = [];
    list.forEach((c, i) => { if (c.kind === 'voice' && c.audio_url) at.push(i); });
    if (!at.length) return list;
    const urls = await signMedia('voice-comments', at.map(i => list[i].audio_url));
    at.forEach((li, k) => { list[li] = { ...list[li], audio_url: urls[k] }; });
    return list;
  }

  async function hydrateAlbumMedia(list){
    if (!list.length) return list;
    const urls = await signMedia('album-photos', list.map(p => p.photo_url));
    return list.map((p, i) => ({ ...p, photo_url: urls[i] }));
  }

  // "Delete" has to mean delete: remember where the file is, drop the row,
  // then erase the file itself from storage.
  async function mediaRefBeforeDelete(table, id){
    try {
      if (table === 'posts') {
        const { data } = await supabaseClient.from('posts').select('media_url, media_type').eq('id', id).maybeSingle();
        if (!data || data.media_type !== 'voice') return null;
        return { bucket: 'voice-posts', path: mediaPathFrom('voice-posts', data.media_url) };
      }
      const { data } = await supabaseClient.from('voice_comments').select('audio_url').eq('id', id).maybeSingle();
      return data ? { bucket: 'voice-comments', path: mediaPathFrom('voice-comments', data.audio_url) } : null;
    } catch (_) { return null; }
  }
  async function eraseMedia(ref){
    if (!ref || !ref.path) return;
    signedCache.delete(ref.bucket + '/' + ref.path);
    const { error } = await supabaseClient.storage.from(ref.bucket).remove([ref.path]);
    if (error) console.warn('could not erase file from storage', error);
  }

  // A link that expired while the page stayed open: quietly get a fresh one, once.
  document.addEventListener('error', async (e) => {
    const el = e.target;
    if (!el || !['IMG', 'AUDIO', 'VIDEO'].includes(el.tagName) || el.dataset.resigned) return;
    const src = el.currentSrc || el.src || '';
    const i = src.indexOf(SIGN_MARK);
    if (i === -1) return;
    const rest = src.slice(i + SIGN_MARK.length).split('?')[0];
    const slash = rest.indexOf('/');
    const bucket = rest.slice(0, slash);
    if (!MEDIA_BUCKETS.includes(bucket)) return;
    el.dataset.resigned = '1';
    let path = rest.slice(slash + 1);
    try { path = decodeURIComponent(path); } catch (_) {}
    signedCache.delete(bucket + '/' + path);
    const [fresh] = await signMedia(bucket, [path]);
    if (fresh) el.src = fresh;
  }, true);

  // Never keep links around after sign-out.
  supabaseClient.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') signedCache.clear(); });

  // ---- posts ----
  // posts table columns: id, user_id, caption, media_url, media_type, created_at,
  // circle_id, score, likes_count, comment_count, is_anonymous
  const ANON_POST_TTL_MS = 24 * 60 * 60 * 1000; // anonymous posts live for exactly 24 hours

  async function loadPosts(sort){
    // Best-effort: sweep any anonymous posts older than 24 hours before
    // we fetch the feed (see cleanup_expired_anon_posts on the backend).
    await cleanupExpiredAnonPosts();

    let query = supabaseClient
      .from('posts')
      .select('id, user_id, caption, media_url, media_type, duration_seconds, created_at, score, likes_count, comment_count, is_anonymous')
      .eq('circle_id', circleId);

    if (sort === 'top') query = query.order('score', { ascending: false });
    else query = query.order('created_at', { ascending: false });

    const { data, error } = await query.limit(50);
    if (error) { console.error('loadPosts failed', error); return []; }
    let list = data || [];

    // Safety net: hide any anonymous post past its 24-hour window on the
    // client too, in case the backend sweep hasn't run yet.
    list = list.filter(p => !p.is_anonymous || (Date.now() - new Date(p.created_at).getTime()) < ANON_POST_TTL_MS);

    if (list.length > 0) {
      const userIds = [...new Set(list.map(p => p.user_id))];
      const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
      const profileById = {};
      (profs || []).forEach(p => { profileById[p.id] = p; });
      list = list.map(p => ({ ...p, profiles: profileById[p.user_id] || null }));
    }

    list = await hydratePostMedia(list);

    if (sort === 'hot') {
      list = list.map(p => ({ ...p, _hot: ((p.score||0) + 0.6*(p.comment_count||0) + 1) / Math.pow((Date.now()-new Date(p.created_at))/3600000 + 2, 1.3) }))
                 .sort((a,b) => b._hot - a._hot);
    }
    return list;
  }

  // Shared upload+insert+refresh used by both the mic button and hold-to-talk
  async function sendVoiceComment(postId, blob, durationSeconds){
    const path = `${currentUser.id}/${postId}/${Date.now()}.webm`;
    const { error: uploadError } = await supabaseClient.storage
      .from('voice-comments')
      .upload(path, blob, { contentType: 'audio/webm' });
    if (uploadError) throw uploadError;

    const { error: insertError } = await supabaseClient.from('voice_comments').insert({
      post_id: postId,
      user_id: currentUser.id,
      audio_url: path,
      duration_seconds: durationSeconds
    });
    if (insertError) throw insertError;

    const listEl = document.getElementById(`home-comment-list-${postId}`);
    const comments = await loadComments(postId);
    listEl.innerHTML = comments.map(renderCommentItem).join('');
    const countEl = document.querySelector(`.home-comment-toggle[data-post-id="${postId}"] .home-comment-count`);
    if (countEl) countEl.textContent = comments.length;
  }

  const HOLD_HINT_KEY = 'waater_hold_hint_seen';
  function markVoiceHintSeen(){

  function maybeShowVoiceOnboardingHint(){

  // Press and hold a post to record a voice reply; a plain tap opens the thread
  // (text + voice comments), same as tapping the comment icon.
  function attachHoldToTalk(){
    document.querySelectorAll('.home-post-card').forEach(card => {
      const postId = card.dataset.postId;
      const body = card.querySelector('.home-post-body');
      if (!body || body.dataset.holdBound) return;
      body.dataset.holdBound = '1';

      const indicator = document.createElement('div');
      indicator.className = 'hold-record-indicator';
      indicator.innerHTML = `<span class="hri-dot"></span><span>Recording — release to send</span><span class="hri-timer">0:00</span>`;
      body.appendChild(indicator);
      const timerLabel = indicator.querySelector('.hri-timer');

      let pressTimer = null;
      let isRecording = false;
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let stream = null;
      let timerInterval = null;
      let startX = 0, startY = 0;
      let cancelledByScroll = false;
      const HOLD_MS = 320;
      const MAX_RECORDING_SECONDS = 60;
      const MIN_VALID_SECONDS = 0.6;
      const MOVE_CANCEL_PX = 10; // finger moving this much = scrolling, not holding

      const clearPressTimer = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

      const teardown = () => {
        clearInterval(timerInterval);
        body.classList.remove('holding-talk');
        indicator.classList.remove('show');
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        isRecording = false;
      };

      const beginRecording = async () => {
        if (!requireAuth()) return;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch(err){
          showToast('Microphone access denied or unavailable', 'error');
          return;
        }
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const durationSeconds = (Date.now() - startTime) / 1000;
          teardown();
          if (cancelledByScroll){ cancelledByScroll = false; return; }
          if (durationSeconds < MIN_VALID_SECONDS) return;
          const blob = new Blob(chunks, { type: 'audio/webm' });
          try {
            await sendVoiceComment(postId, blob, durationSeconds);
            showToast('Voice reply sent');
            markVoiceHintSeen();
          } catch (err) {
            showToast(err.message || 'Could not send voice reply', 'error');
          }
        };

        isRecording = true;
        body.classList.add('holding-talk');
        indicator.classList.add('show');
        startTime = Date.now();
        mediaRecorder.start();
        timerInterval = setInterval(() => {
          const secs = Math.floor((Date.now() - startTime) / 1000);
          timerLabel.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_RECORDING_SECONDS) mediaRecorder.stop();
        }, 200);
      };

      const isInteractiveTarget = (target) =>
        target.closest('.home-post-actions, .home-comments, .home-post-delete, .whisper-reveal, audio, video, a, button');

      const pointOf = (e) => (e.touches && e.touches[0]) ? e.touches[0] : e;

      const onDown = (e) => {
        if (isInteractiveTarget(e.target)) return;
        const p = pointOf(e);
        startX = p.clientX; startY = p.clientY;
        clearPressTimer();
        pressTimer = setTimeout(() => { pressTimer = null; beginRecording(); }, HOLD_MS);
      };

      const onMove = (e) => {
        if (!pressTimer && !isRecording) return;
        const p = pointOf(e);
        const dx = Math.abs(p.clientX - startX);
        const dy = Math.abs(p.clientY - startY);
        if (dx > MOVE_CANCEL_PX || dy > MOVE_CANCEL_PX){
          // This is a scroll, not a hold — bail out without sending anything.
          clearPressTimer();
          if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive'){
            // Discard rather than send: onstop still fires, but we mark it as
            // a cancel so the recording is thrown away instead of posted.
            cancelledByScroll = true;
            mediaRecorder.stop();
          }
        }
      };

      const onUp = (e) => {
        if (pressTimer){
          clearPressTimer();
          if (!isInteractiveTarget(e.target)) openComments(postId);
          return;
        }
        if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      };

      const onCancel = () => {
        clearPressTimer();
        if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      };

      body.addEventListener('mousedown', onDown);
      body.addEventListener('touchstart', onDown, { passive: true });
      body.addEventListener('mousemove', onMove);
      body.addEventListener('touchmove', onMove, { passive: true });
      body.addEventListener('mouseup', onUp);
      body.addEventListener('touchend', onUp);
      body.addEventListener('mouseleave', onCancel);
      body.addEventListener('touchcancel', onCancel);
    });
  }

  async function loadComments(postId){
    const [{ data: textRows }, { data: voiceRows }] = await Promise.all([
      supabaseClient.from('post_comments').select('id, user_id, content, created_at').eq('post_id', postId),
      supabaseClient.from('voice_comments').select('id, user_id, audio_url, duration_seconds, created_at').eq('post_id', postId)
    ]);
    const combined = [
      ...(textRows || []).map(c => ({ ...c, kind: 'text' })),
      ...(voiceRows || []).map(c => ({ ...c, kind: 'voice' }))
    ].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

    if (combined.length === 0) return [];
    const userIds = [...new Set(combined.map(c => c.user_id))];
    const { data: profs } = await supabaseClient.from('profiles').select('id, username, avatar_url').in('id', userIds);
    const profileById = {};
    (profs || []).forEach(p => { profileById[p.id] = p; });
    const withProfiles = combined.map(c => ({ ...c, profile: profileById[c.user_id] || null }));
    return await hydrateCommentMedia(withProfiles);
  }

  function renderCommentItem(c){
    const name = c.profile?.username || 'someone';
    const avatarHtml = c.profile?.avatar_url ? `<img src="${escapeHtml(c.profile.avatar_url)}" alt="">` : initials(name);
    const isOwnComment = currentUser && c.user_id === currentUser.id;
    const deleteBtn = isOwnComment
      ? `<button class="home-comment-delete" data-comment-id="${c.id}" data-comment-kind="${c.kind}">Delete</button>`
      : '';
    if (c.kind === 'voice') {
      const dur = c.duration_seconds ? `${Math.round(c.duration_seconds)}s` : '';
      return `
        <div class="home-comment-item" data-comment-id="${c.id}">
          <div class="avatar">${avatarHtml}</div>
          <div style="flex:1;min-width:0;">
            <div class="home-voice-bubble">
              <b>${escapeHtml(name)}</b> ${dur ? `<span style="font-family:var(--font-mono);font-size:10px;color:var(--grey);">· ${dur}</span>` : ''}
              <audio controls controlsList="nodownload noremoteplayback" oncontextmenu="return false;" src="${escapeHtml(c.audio_url)}"></audio>
            </div>
            <div class="home-comment-time">${timeAgo(c.created_at)}${deleteBtn}</div>
          </div>
        </div>
      `;
    }
    return `
      <div class="home-comment-item" data-comment-id="${c.id}">
        <div class="avatar">${avatarHtml}</div>
        <div>
          <div class="home-comment-bubble"><b>${escapeHtml(name)}</b><p>${escapeHtml(c.content)}</p></div>
          <div class="home-comment-time">${timeAgo(c.created_at)}${deleteBtn}</div>
        </div>
      </div>
    `;
  }

  async function openComments(postId){
    const panel = document.getElementById(`home-comments-${postId}`);
    const listEl = document.getElementById(`home-comment-list-${postId}`);
    const wasOpen = panel.classList.contains('open');
    if (wasOpen){ panel.classList.remove('open'); return; }
    panel.classList.add('open');
    if (!panel.dataset.loaded){
      listEl.innerHTML = `<div class="home-comment-empty">Loading…</div>`;
      const comments = await loadComments(postId);
      listEl.innerHTML = comments.length
        ? comments.map(renderCommentItem).join('')
        : `<div class="home-comment-empty">No comments yet — be the first.</div>`;
      panel.dataset.loaded = '1';
    }
  }

  document.addEventListener('click', async (e) => {
    const delBtn = e.target.closest('.home-comment-delete');
    if (!delBtn) return;
    e.stopPropagation();
    if (!currentUser) return;
    const commentId = delBtn.dataset.commentId;
    const kind = delBtn.dataset.commentKind;
    const item = delBtn.closest('.home-comment-item');
    const postCard = delBtn.closest('.home-post-card');
    const postId = postCard ? postCard.dataset.postId : null;
    if (!window.confirm('Delete this comment?')) return;
    delBtn.disabled = true;
    try {
      const table = kind === 'voice' ? 'voice_comments' : 'post_comments';
      const fileRef = kind === 'voice' ? await mediaRefBeforeDelete('voice_comments', commentId) : null;
      const { error } = await supabaseClient
        .from(table)
        .delete()
        .eq('id', commentId)
        .eq('user_id', currentUser.id);
      if (error) throw error;
      eraseMedia(fileRef);
      if (item) item.remove();
      if (postId) {
        const countEl = document.querySelector(`.home-comment-toggle[data-post-id="${postId}"] .home-comment-count`);
        if (countEl) countEl.textContent = Math.max(0, Number(countEl.textContent) - 1);
        const listEl = document.getElementById(`home-comment-list-${postId}`);
        if (listEl && !listEl.children.length) {
          listEl.innerHTML = `<div class="home-comment-empty">No comments yet — be the first.</div>`;
        }
      }
      showToast('Comment deleted');
    } catch (err) {
      delBtn.disabled = false;
      showToast(err.message || 'Could not delete comment', 'error');
    }
  });

  function wireHomeActions(){
    attachHoldToTalk();
    maybeShowVoiceOnboardingHint();

    document.querySelectorAll('.whisper-reveal').forEach(el => {
      el.addEventListener('click', () => {
        const card = el.closest('.home-post-card');
        if (card) card.classList.add('revealed');
      });
    });

    document.querySelectorAll('.home-like-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!requireAuth()) return;
        if (btn.dataset.busy) return;
        btn.dataset.busy = '1';
        const postId = btn.dataset.postId;
        const countEl = btn.querySelector('.home-like-count');
        const wasLiked = btn.classList.contains('liked');
        try {
          if (wasLiked){
            const { error } = await supabaseClient.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
            if (error) throw error;
            btn.classList.remove('liked');
            countEl.textContent = Math.max(0, Number(countEl.textContent) - 1);
          } else {
            const { error } = await supabaseClient.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
            if (error) throw error;
            btn.classList.add('liked');
            btn.classList.add('pop', 'just-liked');
            setTimeout(() => btn.classList.remove('pop', 'just-liked'), 550);
            countEl.textContent = Number(countEl.textContent) + 1;
          }
        } catch (err) {
          showToast(err.message || 'Could not update like', 'error');
        } finally {
          delete btn.dataset.busy;
        }
      });
    });

    document.querySelectorAll('.home-comment-toggle').forEach(btn => {
      btn.addEventListener('click', () => openComments(btn.dataset.postId));
    });

    document.querySelectorAll('.home-post-delete').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!currentUser) return;
        const postId = btn.dataset.postId;
        if (!window.confirm('Delete this post? This can\'t be undone.')) return;
        btn.disabled = true;
        try {
          const fileRef = await mediaRefBeforeDelete('posts', postId);
          const { error } = await supabaseClient
            .from('posts')
            .delete()
            .eq('id', postId)
            .eq('user_id', currentUser.id);
          if (error) throw error;
          eraseMedia(fileRef);
          const card = document.querySelector(`.home-post-card[data-post-id="${postId}"]`);
          if (card) card.remove();
          showToast('Post deleted');
        } catch (err) {
          btn.disabled = false;
          showToast(err.message || 'Could not delete post', 'error');
        }
      });
    });

    document.querySelectorAll('.home-comment-input').forEach(input => {
      const postId = input.id.replace('home-comment-input-', '');
      const sendBtn = document.getElementById(`home-comment-send-${postId}`);
      input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim(); });
      const submit = async () => {
        if (!requireAuth()) return;
        const text = input.value.trim();
        if (!text || sendBtn.disabled) return;
        sendBtn.disabled = true;
        try {
          const { error } = await supabaseClient.from('post_comments').insert({ post_id: postId, user_id: currentUser.id, content: text });
          if (error) throw error;
          input.value = '';
          const listEl = document.getElementById(`home-comment-list-${postId}`);
          const comments = await loadComments(postId);
          listEl.innerHTML = comments.map(renderCommentItem).join('');

          const countEl = document.querySelector(`.home-comment-toggle[data-post-id="${postId}"] .home-comment-count`);


          if (countEl) countEl.textContent = comments.length;

          
        } catch (err) {
          showToast(err.message || 'Could not post comment', 'error');
        } finally {
          sendBtn.disabled = !input.value.trim();
        }
      };
      sendBtn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } });
    });

    document.querySelectorAll('.home-comment-mic').forEach(btn => {
      const postId = btn.dataset.postId;
      let mediaRecorder = null;
      let chunks = [];
      let startTime = null;
      let timerInterval = null;
      const timerEl = document.getElementById(`home-comment-rec-timer-${postId}`);

      btn.addEventListener('click', async () => {
        if (!requireAuth()) return;

        if (btn.classList.contains('recording')) {
          mediaRecorder.stop();
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            timerEl.style.display = 'none';
            btn.classList.remove('recording');

            const durationSeconds = (Date.now() - startTime) / 1000;
            const blob = new Blob(chunks, { type: 'audio/webm' });

            btn.disabled = true;
            try {
              await sendVoiceComment(postId, blob, durationSeconds);
              showToast('Voice comment posted');
            } catch (err) {
              showToast(err.message || 'Could not post voice comment', 'error');
            } finally {
              btn.disabled = false;
            }
          };

          const MAX_RECORDING_SECONDS = 60;

          mediaRecorder.start();
          startTime = Date.now();
          btn.classList.add('recording');
          timerEl.style.display = 'inline';
          timerInterval = setInterval(() => {
            const secs = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
            if (secs >= MAX_RECORDING_SECONDS) {
              mediaRecorder.stop();
            }
          }, 250);

        } catch (err) {
          showToast('Microphone access denied or unavailable', 'error');
        }
      });
    });
  }

    { id: 'mono',     label: 'Mono',     css: 'grayscale(1) contrast(1.1)' },
    { id: 'vintage',  label: 'Vintage',  css: 'sepia(.35) saturate(.85) contrast(.95) brightness(1.05)' },
    { id: 'vivid',    label: 'Vivid',    css: 'saturate(1.6) contrast(1.12)' },
    { id: 'fade',     label: 'Fade',     css: 'saturate(.6) contrast(.9) brightness(1.08)' },

  function groupPhotosByMonth(photos){
    const groups = new Map();
    photos.forEach(p => {
      const d = new Date(p.created_at);
      const key = isNaN(d) ? 'Earlier' : d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    return groups;
  }

  function renderAlbumGallery(photos){
    if (photos.length === 0){
      return `
        <div class="gallery-glow"></div>
        ${renderGalleryHeader(photos)}
        <div class="gallery-empty">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
          <h3>No memories yet</h3>
          <p>Be the first to drop a photo into this circle's private album.</p>
        </div>
      `;
    }
    // The newest photo gets one featured slot up top; everything else,
    // including that same photo's neighbours, keeps strict chronological
    // order in the grid below so scrolling still reads like a timeline.
    const [heroPhoto, ...rest] = photos;
    const groups = groupPhotosByMonth(rest);
    let idx = 0;
    const groupsHtml = [...groups.entries()].map(([label, groupPhotos]) => {
      const tiles = groupPhotos.map(ph => {
        const html = renderGalleryTile(ph, idx);
        idx++;
        return html;
      }).join('');
      return `
        <div class="gallery-group">
          <div class="gallery-group-label">${label}</div>
          <div class="gallery-grid">${tiles}</div>
        </div>
      `;
    }).join('');
    return `
      <div class="gallery-glow"></div>
      ${renderGalleryHeader(photos)}
      ${renderGalleryHero(heroPhoto)}
      ${groupsHtml}
    `;
  }

  function openGalleryLightbox(photos, startIndex){
    let idx = startIndex;
    const overlay = document.createElement('div');

    const close = () => {
      overlay.classList.remove('show');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => overlay.remove(), 200);
    };

    function render(){
      const photo = photos[idx];
      const m = members.find(x => x.id === photo.user_id);
      const name = m?.username || 'Someone';
      overlay.innerHTML = `
        <button class="album-lightbox-close" id="albumLbClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="album-lightbox">
          ${photos.length > 1 ? `
          <button class="album-lightbox-nav album-lightbox-prev" id="albumLbPrev" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="album-lightbox-nav album-lightbox-next" id="albumLbNext" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>

      overlay.querySelector('#albumLbClose').addEventListener('click', close);
      const prevBtn = overlay.querySelector('#albumLbPrev');
      const nextBtn = overlay.querySelector('#albumLbNext');
      if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx - 1 + photos.length) % photos.length; render(); });
      if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); idx = (idx + 1) % photos.length; render(); });
    }

    function onKey(e){
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft' && photos.length > 1){ idx = (idx - 1 + photos.length) % photos.length; render(); }
      else if (e.key === 'ArrowRight' && photos.length > 1){ idx = (idx + 1) % photos.length; render(); }
    }

    render();
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    requestAnimationFrame(() => overlay.classList.add('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

  function openAlbumCaptureModal(promptToAnswer){
    const modal = document.createElement('div');
    modal.className = 'album-modal-backdrop';
    modal.innerHTML = `
      <div class="album-modal">
        <h3>Add to the album</h3>
        <p class="hint">Stays private to this circle, forever.</p>
        ${promptToAnswer ? `
        <div class="album-modal-pinned-q">
          <span class="pin-ic">📌</span>
          <span>${escapeHtml(promptToAnswer.question)}</span>
        </div>` : ''}
        <div class="album-canvas-wrap" id="albumCanvasWrap">
          <div class="album-canvas-placeholder">Take a photo or choose one from your gallery</div>
        </div>
        <div class="album-pick-row">
          <button class="album-pick-btn" id="albumTakePhoto" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>
            Camera

            Gallery
          </button>
        </div>
        <input type="file" accept="image/*" capture="environment" id="albumFileCamera" style="display:none;">
        <input type="file" accept="image/*" id="albumFileGallery" style="display:none;">
        <div class="album-filter-row" id="albumFilterRow" style="display:none;"></div>
        <textarea id="albumCaptionInput" maxlength="140" placeholder="${promptToAnswer ? 'Answer their question... (optional)' : 'Say something about this one... (optional)'}"></textarea>
        <div class="album-modal-row">
          <button class="album-modal-cancel" type="button" id="albumModalCancel">Cancel</button>
          <button class="album-modal-post" type="button" id="albumModalPost" disabled>Post to album</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const canvasWrap = modal.querySelector('#albumCanvasWrap');
    const filterRow = modal.querySelector('#albumFilterRow');
    const postBtn = modal.querySelector('#albumModalPost');
    const captionInput = modal.querySelector('#albumCaptionInput');
    let sourceImg = null;
    let activeFilterId = 'original';
    let canvas = null;

    function drawWithFilter(filterCss){
      if (!sourceImg) return;
      if (!canvas){
        canvas = document.createElement('canvas');
        canvasWrap.innerHTML = '';
        canvasWrap.appendChild(canvas);
      }
      const size = 900;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.filter = filterCss;
      const scale = Math.max(size / sourceImg.width, size / sourceImg.height);
      const w = sourceImg.width * scale, h = sourceImg.height * scale;
      ctx.drawImage(sourceImg, (size - w) / 2, (size - h) / 2, w, h);
    }

    function renderFilterSwatches(){
      filterRow.style.display = 'flex';
      filterRow.innerHTML = ALBUM_FILTERS.map(f => `
        <button class="album-filter-swatch${f.id === activeFilterId ? ' active' : ''}" data-filter="${f.id}" type="button">
          <span class="sw" style="filter:${f.css === 'none' ? '' : f.css};background-image:url('${sourceImg.src}');background-size:cover;background-position:center;"></span>
          <span>${f.label}</span>
        </button>
      `).join('');
      filterRow.querySelectorAll('.album-filter-swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilterId = btn.dataset.filter;
          filterRow.querySelectorAll('.album-filter-swatch').forEach(b => b.classList.toggle('active', b === btn));
          const f = ALBUM_FILTERS.find(x => x.id === activeFilterId);
          drawWithFilter(f.css === 'none' ? 'none' : f.css);
        });
      });
    }

    function handleFile(file){
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          sourceImg = img;
          drawWithFilter('none');
          renderFilterSwatches();
          postBtn.disabled = false;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    modal.querySelector('#albumTakePhoto').addEventListener('click', () => modal.querySelector('#albumFileCamera').click());
    modal.querySelector('#albumPickPhoto').addEventListener('click', () => modal.querySelector('#albumFileGallery').click());
    modal.querySelector('#albumFileCamera').addEventListener('change', (e) => handleFile(e.target.files[0]));
    modal.querySelector('#albumFileGallery').addEventListener('change', (e) => handleFile(e.target.files[0]));

    const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 220); };
    modal.querySelector('#albumModalCancel').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    postBtn.addEventListener('click', async () => {
      if (!canvas || !albumId) return;
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span> Posting...`;
      try {
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
        const path = `${albumId}/${Date.now()}-${currentUser.id}.jpg`;
        const { error: uploadError } = await supabaseClient.storage
          .from('album-photos')
          .upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;

        const { data: newPhoto, error: insertError } = await supabaseClient.from('album_photos').insert({
          album_id: albumId,
          user_id: currentUser.id,
          photo_url: path,
          filter_applied: activeFilterId,
          caption: captionInput.value.trim() || null,
        }).select('id').single();
        if (insertError) throw insertError;

        if (promptToAnswer){
          await supabaseClient
            .from('golden_hour_prompts')
            .update({ answered_at: new Date().toISOString(), answered_photo_id: newPhoto?.id })
            .eq('id', promptToAnswer.id);
          activePrompt = null;
          const url = new URL(window.location.href);
          url.searchParams.delete('prompt');
          window.history.replaceState(null, '', url.pathname + url.search);
        }

        showToast('Added to the album 📸');
        close();
        await refreshAlbumGallery();
      } catch (err) {
        showToast(err.message || 'Could not post photo', 'error');
        postBtn.disabled = false;
        postBtn.textContent = 'Post to album';
      }
    });
  }

    const textarea = document.getElementById('homeComposerText');

      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';

      mediaField.style.display = show ? 'block' : 'none';
      mediaToggle.classList.toggle('active', show);
      if (show) mediaUrl.focus();

    mediaUrl.addEventListener('input', resetComposerTimer);
    textarea.addEventListener('focus', resetComposerTimer);

    const anonToggle = document.getElementById('homeAnonToggle');
    const homeComposerEl = document.getElementById('homeComposer');
    const homeAnonBanner = document.getElementById('homeAnonBanner');
    const NORMAL_PLACEHOLDER = "Tell your circle about your day — just between you all...";

    // Rotating prompts shown (as the placeholder) only while whisper/anon
    // mode is on — a new one swaps in every 5s. Every entry here is a real
    // prompt (never the plain "normal mode" filler line), and the order is
    // reshuffled each time whisper mode turns on so it doesn't feel static.
    const WHISPER_PROMPTS = [
      "What's the one thing you did but didn't get punished for?",
      "What's a secret you've never told this circle?",
      "What's something you'd only admit anonymously?",
      "What's a lie you told that no one ever found out about?",
      "What's the pettiest thing you've done recently?",
      "What's on your mind that you can't say out loud?",
      "What's something you're proud of but too embarrassed to share?",
      "What's a thought you've had that surprised even you?",
    ];
    let whisperPromptTimer = null;
    let whisperPromptIndex = 0;
    let whisperPromptOrder = [];

    const shuffledPromptOrder = () => {
      const order = WHISPER_PROMPTS.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      return order;
    };

    const stopWhisperPrompts = () => {
      if (whisperPromptTimer){ clearInterval(whisperPromptTimer); whisperPromptTimer = null; }
    };
    const startWhisperPrompts = () => {
      stopWhisperPrompts();
      whisperPromptOrder = shuffledPromptOrder();
      whisperPromptIndex = 0;
      textarea.placeholder = WHISPER_PROMPTS[whisperPromptOrder[0]];
      whisperPromptTimer = setInterval(() => {
        // Don't yank the placeholder out from under someone who's typing —
        // it's invisible anyway once there's text, so just keep advancing
        // the index quietly and it'll show the right one if they clear it.
        whisperPromptIndex = (whisperPromptIndex + 1) % whisperPromptOrder.length;
        textarea.placeholder = WHISPER_PROMPTS[whisperPromptOrder[whisperPromptIndex]];
      }, 5000);
    };

    let isAnon = false;
    const setWhisperMode = (on) => {
      isAnon = on;
      anonToggle.classList.toggle('active', on);
      const vb = document.getElementById('homeVoiceBtn');
      if (vb) vb.classList.toggle('voice-locked', on);
      homeAnonBanner.classList.toggle('show', on);
      if (on){
        startWhisperPrompts();
      } else {
        stopWhisperPrompts();
        textarea.placeholder = NORMAL_PLACEHOLDER;
      }
    };
    anonToggle.addEventListener('click', () => {
      if (isAnon){
        setWhisperMode(false);
        showToast('Posting as yourself');
        return;
      }
      // can't go anonymous mid-recording: the voice would give them away
      if (voiceBtn.classList.contains('recording')){ showAnonVoiceNotice(); return; }
      requestWhisperMode(() => {
        setWhisperMode(true);
        showToast('Whisper mode — this one stays unsigned');
      });
    });

    const voiceBtn = document.getElementById('homeVoiceBtn');
    const voiceTimer = document.getElementById('homeVoiceTimer');
    let voiceRecorder = null;
    let voiceChunks = [];
    let voiceStartTime = null;
    let voiceTimerInterval = null;
    const MAX_VOICE_SECONDS = 120;

    voiceBtn.addEventListener('click', async () => {
      if (!requireAuth()) return;

      // Voice notes can't be anonymous — friends would recognise the voice.
      if (isAnon && !voiceBtn.classList.contains('recording')){ showAnonVoiceNotice(); return; }

      if (voiceBtn.classList.contains('recording')) {
        voiceRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        voiceRecorder = new MediaRecorder(stream);
        voiceChunks = [];
        voiceRecorder.ondataavailable = (e) => voiceChunks.push(e.data);

        voiceRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(voiceTimerInterval);
          voiceTimer.style.display = 'none';
          voiceBtn.classList.remove('recording');

          // safety net: never upload a voice recording as an anonymous post
          if (isAnon){ voiceChunks = []; showAnonVoiceNotice(); return; }

          const durationSeconds = (Date.now() - voiceStartTime) / 1000;
          const blob = new Blob(voiceChunks, { type: 'audio/webm' });
          const path = `${currentUser.id}/${circleId}/${Date.now()}.webm`;

          voiceBtn.disabled = true;
          try {
            const { error: uploadError } = await supabaseClient.storage
              .from('voice-posts')
              .upload(path, blob, { contentType: 'audio/webm' });
            if (uploadError) throw uploadError;

            const { error: insertError } = await supabaseClient.from('posts').insert({
              circle_id: circleId,
              user_id: currentUser.id,
              caption: textarea.value.trim() || null,
              media_url: path,
              media_type: 'voice',
              duration_seconds: durationSeconds,
              is_anonymous: isAnon,
            });
            if (insertError) throw insertError;

            textarea.value = ''; textarea.style.height = 'auto';
            setWhisperMode(false);
            refreshPostBtn();

            showToast('Voice post shared');
            if (document.getElementById('homeComposer').classList.contains('overlay')) {
              closeComposerOverlay();
            }
            await refreshHomeFeed();
          } catch (err) {
            showToast(err.message || 'Could not post voice recording', 'error');
          } finally {
            voiceBtn.disabled = false;
          }
        };

        voiceRecorder.start();
        voiceStartTime = Date.now();
        voiceBtn.classList.add('recording');
        voiceTimer.style.display = 'inline';
        voiceTimerInterval = setInterval(() => {
          const secs = Math.floor((Date.now() - voiceStartTime) / 1000);
          voiceTimer.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_VOICE_SECONDS) voiceRecorder.stop();
        }, 250);

      } catch (err) {
        showToast('Microphone access denied or unavailable', 'error');
      }
    });

    let isPosting = false;
    postBtn.addEventListener('click', async () => {
      if (!requireAuth() || isPosting) return;
      const content = textarea.value.trim();
      const url = mediaUrl.value.trim();
      if (!content && !url) return;
      isPosting = true;
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span>`;
      const wasWhisper = isAnon;

      try {
        const { error } = await supabaseClient.from('posts').insert({
          circle_id: circleId,
          user_id: currentUser.id,
          caption: content || null,
          media_url: url || null,
          media_type: url ? (url.match(/\.(mp4|mov|webm)(\?|$)/i) ? 'video' : 'photo') : null,
          is_anonymous: wasWhisper,
        });
        if (error) throw error;

        textarea.value = ''; mediaUrl.value = ''; mediaField.style.display = 'none'; mediaToggle.classList.remove('active');
        setWhisperMode(false);
        textarea.style.height = 'auto';

        showToast(wasWhisper ? 'Posted to the circle — quietly' : 'Posted to the circle');

        if (document.getElementById('homeComposer').classList.contains('overlay')) {
          closeComposerOverlay();
        }

        await refreshHomeFeed();

      } catch (err) {
        showToast(err.message || 'Could not post', 'error');
      } finally {
        isPosting = false;
        postBtn.textContent = 'Post';
        refreshPostBtn();
      }
    });

    const inviteBtn = document.getElementById('homeInviteBtn');
    let invitesUsedToday = invitesToday;
    if (inviteBtn) inviteBtn.addEventListener('click', async () => {
      // Client-side check just for instant feedback — the DB trigger on
      // circle_invites is the real enforcement, this only avoids a round
      // trip when we already know today's quota is spent.
      if (invitesUsedToday >= 2) {
        showToast("You've used both invites for today — try again tomorrow", 'error');
        return;
      }
      const note = await openInviteModal();
      try {
        // Try passing the note through to the RPC. If the backend hasn't
        // been updated to accept p_note yet, fall back to the plain call
        // so invites never break because of this feature.
        let rpcResult;
        if (note) {
          rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId, p_note: note });
          if (rpcResult.error) {
            rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
          }
        } else {
          rpcResult = await supabaseClient.rpc('create_circle_invite', { p_circle_id: circleId });
        }
        const { data, error } = rpcResult;
        if (error) throw error;

        invitesUsedToday += 1;
        const badge = document.getElementById('inviteCountBadge');
        if (badge) {
          badge.textContent = `${invitesUsedToday}/2 today`;
          badge.style.color = invitesUsedToday >= 2 ? 'var(--danger)' : 'var(--grey)';
        }
        if (invitesUsedToday >= 2) inviteBtn.disabled = true;

        try {

          await navigator.clipboard.writeText(`${window.location.origin}/circle?code=${encodeURIComponent(data.code)}`);
          
          showToast('Invite link copied — works for 10 minutes');
        } catch (e) {
          showToast(`Invite code: ${data.code}`);
        }
      } catch (err) {
        if (err.message?.includes('invite_limit_reached')) {
          showToast("You've used both invites for today — try again tomorrow", 'error');
          invitesUsedToday = 2;
          inviteBtn.disabled = true;
        } else if (err.message?.includes('circle_full')) {
          showToast('This circle is full (max 10 members)', 'error');
        } else {
          showToast(err.message || 'Could not create invite', 'error');
        }
      }
    });

    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => switchHomeView(tab.dataset.view));
    });

    setupComposerBehavior();

    await refreshHomeFeed();
    initAlbum();
    subscribeToCircleActivity();

    // Play the ceremony without blocking the feed load beneath it.
    if (shouldWelcome) playWelcomeCeremony(welcomeNote, welcomeInviter);
  }

  // ---- small utilities --------------------------------------------------
  // escapeHtml() above doesn't escape quotes, so it isn't safe inside an
  // attribute like src="..." — these are.
  function pcEsc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // http(s) only. Anything else (javascript:, data:, garbage) returns ''.
  function pcSafeUrl(u){
    try {
      const x = new URL(String(u || '').trim(), window.location.href);
      return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
    } catch(_) { return ''; }
  }
  function pcHash(s){
    let h = 2166136261;
    for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function pcRand(seed){
    let a = seed | 0;
    return function(){
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pcAgo(iso){
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    if (s < 604800) return `${Math.floor(s / 86400)}d`;
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function pcAvatar(p, size, cls){
    const name = p?.username || '?';
    const style = `--s:${size}px`;
    const url = p?.avatar_url ? pcSafeUrl(p.avatar_url) : '';
    if (url) return `<span class="pc-av ${cls || ''}" style="${style}"><img src="${pcEsc(url)}" alt="" loading="lazy"></span>`;
    const h = pcHash(name) % 360;
    return `<span class="pc-av ${cls || ''}" style="${style};background:hsl(${h} 52% 46%)">${pcEsc(initials(name))}</span>`;
  }
  function pcAnonAvatar(size, cls){
    return `<span class="pc-av anon ${cls || ''}" style="--s:${size}px">${PC_ICON.mask}</span>`;
  }

  // ---- cover: the orbit ---------------------------------------------------
  function pcOrbitHtml(isMember){
    const rand = pcRand(pcHash(String(circle.id)));
    // [radius as fraction of the orbit box, avatar size, capacity]
    const rings = [ { r: .17, s: 42, cap: 3 }, { r: .31, s: 36, cap: 5 }, { r: .44, s: 30, cap: 7 } ];
    const total = rings.reduce((n, r) => n + r.cap, 0);
    const wantsSlot = !isMember;
    const overflow = members.length > total;
    const visible = members.slice(0, wantsSlot || overflow ? total - 1 : total);
    const specials = wantsSlot ? 'slot' : (overflow ? 'more' : null);
    const items = visible.map(m => ({ m }));
    if (specials) items.push({ special: specials });

    let html = `
      <div class="pc-ring r1"></div><div class="pc-ring r2"></div><div class="pc-ring r3"></div><div class="pc-ring r4"></div>
      <div class="pc-core">${PC_ICON.orbit}</div>`;
    let idx = 0;
    rings.forEach(ring => {
      const chunk = items.slice(idx, idx + ring.cap);
      if (!chunk.length) return;
      const base = rand() * Math.PI * 2;
      chunk.forEach((it, i) => {
        const ang = base + (i * Math.PI * 2 / chunk.length) + (rand() - .5) * .3;
        const left = 50 + ring.r * 100 * Math.cos(ang);
        const top  = 50 + ring.r * 100 * Math.sin(ang);
        const pos = `left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;--s:${ring.s};--d:${(.15 + (idx + i) * .07).toFixed(2)}s`;
        if (it.special === 'slot'){
          html += `<button type="button" class="pc-av pc-orb slot" style="${pos}" data-act="join" aria-label="Join this circle">${PC_ICON.plus}</button>`;
        } else if (it.special === 'more'){
          html += `<span class="pc-av pc-orb more" style="${pos}">+${members.length - visible.length}</span>`;
        } else {
          const isMe = currentUser && it.m.id === currentUser.id;
          const p = it.m;
          const h = pcHash(p.username || '?') % 360;
          const url = p.avatar_url ? pcSafeUrl(p.avatar_url) : '';
          html += `<span class="pc-av pc-orb ${isMe ? 'me' : ''}" style="${pos};${url ? '' : `background:hsl(${h} 52% 46%)`}" title="${pcEsc(p.username || '')}">${url ? `<img src="${pcEsc(url)}" alt="">` : pcEsc(initials(p.username))}</span>`;
        }
      });
      idx += chunk.length;
    });
    return html;
  }

  // ---- voting (optimistic, reverts on failure) --------------------------
  function pcApplyVote(article, myVote, score, burst){
    article.dataset.my = myVote;
    const up = article.querySelector('.pc-v.up'), down = article.querySelector('.pc-v.down');
    up.classList.toggle('on', myVote === 1);   up.setAttribute('aria-pressed', myVote === 1);
    down.classList.toggle('on', myVote === -1); down.setAttribute('aria-pressed', myVote === -1);
    const el = article.querySelector('.pc-score');
    const changed = Number(el.dataset.score) !== score;
    el.dataset.score = score;
    el.textContent = score;
    el.classList.toggle('pos', score > 0);
    el.classList.toggle('neg', score < 0);
    if (changed){
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
    if (burst){
      up.classList.remove('burst'); void up.offsetWidth; up.classList.add('burst');
      setTimeout(() => up.classList.remove('burst'), 520);
    }
  }

  async function pcVote(article, value){
    if (!requireAuth()) return;
    if (article.dataset.busy === '1') return;
    const id = article.dataset.postId;
    const prev = Number(article.dataset.my || 0);
    const next = prev === value ? 0 : value;
    const prevScore = Number(article.querySelector('.pc-score').dataset.score);
    pcApplyVote(article, next, prevScore + (next - prev), next === 1);
    article.dataset.busy = '1';
    try {
      const { error } = await supabaseClient.rpc('vote_post', { p_post_id: id, p_value: next });
      if (error) throw error;
      const { data } = await supabaseClient.from('posts').select('score').eq('id', id).maybeSingle();
      if (data && typeof data.score === 'number') pcApplyVote(article, next, data.score, false);
    } catch (err) {
      pcApplyVote(article, prev, prevScore, false);
      showToast(err.message || 'Could not vote', 'error');
    } finally {
      delete article.dataset.busy;
    }
  }

  async function pcToggleThread(article){
    const open = article.classList.toggle('open');
    article.querySelector('.pc-cbtn').setAttribute('aria-expanded', open);
    const thread = article.querySelector('.pc-thread');
    if (open && !thread.dataset.loaded){

      catch (err) {

  async function pcSendComment(article){
    if (!requireAuth()) return;
    const input = article.querySelector('.pc-cinput');
    const btn = article.querySelector('.pc-csend');
    if (!input || !btn || btn.disabled) return;
    const text = input.value.trim();
    if (!text) return;
    btn.disabled = true;
    try {
      const { error } = await supabaseClient.from('post_comments').insert({ post_id: article.dataset.postId, user_id: currentUser.id, content: text });
      if (error) throw error;
      input.value = '';
      await pcLoadThread(article);
    } catch (err) {
      showToast(err.message || 'Could not post reply', 'error');
    } finally {
      btn.disabled = !input.value.trim();
    }
  }

  // First click arms the button ("Delete?"), second click within 3s confirms.
  function pcArm(btn, armedLabel, onConfirm){
    if (btn.dataset.armed === '1'){
      clearTimeout(btn._t);
      btn.dataset.armed = '';
      return onConfirm();
    }
    const original = btn.innerHTML;
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    btn.textContent = armedLabel;
    btn._t = setTimeout(() => {
      btn.dataset.armed = '';
      btn.classList.remove('armed');
      btn.innerHTML = original;
    }, 3000);
  }

  function pcDeletePost(article, btn){
    if (!currentUser) return;
    pcArm(btn, 'Delete?', async () => {
      btn.disabled = true;
      try {
        const fileRef = await mediaRefBeforeDelete('posts', article.dataset.postId);
        const { error } = await supabaseClient.from('posts').delete().eq('id', article.dataset.postId).eq('user_id', currentUser.id);
        if (error) throw error;
        eraseMedia(fileRef);
        article.remove();
        showToast('Post deleted');
        if (!document.querySelector('#pcFeed .pc-post')) refreshPubFeed();
      } catch (err) {
        btn.disabled = false;
        showToast(err.message || 'Could not delete post', 'error');
      }
    });
  }

  function pcDeleteComment(article, btn){
    if (!currentUser) return;
    const row = btn.closest('.pc-c');
    pcArm(btn, 'Delete?', async () => {
      btn.disabled = true;
      try {
        const table = row.dataset.kind === 'voice' ? 'voice_comments' : 'post_comments';
        const fileRef = row.dataset.kind === 'voice' ? await mediaRefBeforeDelete('voice_comments', row.dataset.cid) : null;
        const { error } = await supabaseClient.from(table).delete().eq('id', row.dataset.cid).eq('user_id', currentUser.id);

  async function pcShare(){

        { event: 'INSERT', schema: 'public', table: 'posts', filter: `circle_id=eq.${circleId}` },

  // ---- composer -------------------------------------------------------------------
  function pcRenderPreview(raw){
    const box = document.getElementById('pcMediaPreview');
    if (!box) return;
    box.innerHTML = '';
    const safe = pcSafeUrl(raw);
    if (!raw.trim() || !safe) return;
    const isVideo = /\.(mp4|mov|webm)(\?|$)/i.test(safe);
    const el = document.createElement(isVideo ? 'video' : 'img');
    el.src = safe;
    if (isVideo){ el.controls = true; el.muted = true; el.preload = 'metadata'; el.playsInline = true; }
    else { el.alt = ''; }
    el.addEventListener('error', () => {
      box.innerHTML = `<p class="pc-hint">Can't preview this link. Use a direct link to an image or video.</p>`;
    });
    box.appendChild(el);
  }

  function pcWireComposer(){
    const wrap = document.getElementById('pcCompose');
    if (!wrap) return;
    const ph = document.getElementById('pcComposePh');
    const text = document.getElementById('pcText');
    const mediaBtn = document.getElementById('pcMediaBtn');
    const mediaField = document.getElementById('pcMediaField');
    const mediaUrl = document.getElementById('pcMediaUrl');
    const anonBtn = document.getElementById('pcAnon');
    const anonBanner = document.getElementById('pcAnonBanner');
    const postBtn = document.getElementById('pcPost');
    const avSlot = document.getElementById('pcComposeAv');
    const me = pcMe();
    let isAnon = false;

    const open = () => { wrap.classList.add('open'); text.focus(); };
    ph.addEventListener('click', open);
    window.pcOpenComposer = open;

    const refresh = () => {
      const hasUrl = !!mediaUrl.value.trim();
      postBtn.disabled = !text.value.trim() && !hasUrl;
    };
    text.addEventListener('input', () => {
      text.style.height = 'auto';
      text.style.height = Math.min(text.scrollHeight, 280) + 'px';
      refresh();
    });

    mediaBtn.addEventListener('click', () => {
      const showing = mediaField.hidden;
      mediaField.hidden = !showing;
      mediaBtn.classList.toggle('on', showing);
      mediaBtn.setAttribute('aria-pressed', showing);
      if (showing) mediaUrl.focus();
    });
    mediaUrl.addEventListener('input', () => { pcRenderPreview(mediaUrl.value); refresh(); });

    anonBtn.addEventListener('click', () => {
      isAnon = !isAnon;
      anonBtn.setAttribute('aria-pressed', isAnon);
      anonBtn.querySelector('span').textContent = isAnon ? 'Posting anonymously' : 'Anonymous';
      avSlot.innerHTML = isAnon ? pcAnonAvatar(40) : pcAvatar(me, 40);
      anonBanner.classList.toggle('show', isAnon);
    });

    let posting = false;
    postBtn.addEventListener('click', async () => {
      if (posting) return;
      const content = text.value.trim();
      const rawUrl = mediaUrl.value.trim();
      const url = rawUrl ? pcSafeUrl(rawUrl) : '';
      if (rawUrl && !url){ showToast('Media link must start with http:// or https://', 'error'); return; }
      if (!content && !url) return;
      posting = true;
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span>`;
      try {
        const { error } = await supabaseClient.from('posts').insert({
          circle_id: circleId,
          user_id: currentUser.id,
          caption: content || null,
          media_url: url || null,
          media_type: url ? (/\.(mp4|mov|webm)(\?|$)/i.test(url) ? 'video' : 'photo') : null,
          is_anonymous: isAnon
        });

        text.value = ''; mediaUrl.value = '';
        text.style.height = 'auto';

        mediaField.hidden = true; mediaBtn.classList.remove('on');
        if (isAnon){ anonBtn.click(); }
        wrap.classList.remove('open');
        showToast('Posted');
        pcSetSort('new');
      } catch (err) {
        showToast(err.message || 'Could not post', 'error');
      } finally {
        posting = false;
        postBtn.textContent = 'Post';
        refresh();
      }
    });
  }
