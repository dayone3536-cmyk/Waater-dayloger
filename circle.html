        <textarea id="albumCaptionInput" maxlength="140" placeholder="Say something about this one... (optional)"></textarea>
        <div class="album-modal-row">
          <button class="album-modal-cancel" type="button" id="albumModalCancel">Cancel</button>
          <button class="album-modal-post" type="button" id="albumModalPost" disabled>Post to album</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    requestAnimationFrame(() => modal.classList.add('show'));

    const canvasWrap = modal.querySelector('#albumCanvasWrap');
    const filterRow = modal.querySelector('#albumFilterRow');
    const postBtn = modal.querySelector('#albumModalPost');
    const captionInput = modal.querySelector('#albumCaptionInput');
    let sourceImg = null;
    let activeFilterId = 'original';
    let canvas = null;

    function drawWithFilter(filterCss){
      if (!sourceImg) return;
      if (!canvas){
        canvas = document.createElement('canvas');
        canvasWrap.innerHTML = '';
        canvasWrap.appendChild(canvas);
      }
      const size = 900;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.filter = filterCss;
      const scale = Math.max(size / sourceImg.width, size / sourceImg.height);
      const w = sourceImg.width * scale, h = sourceImg.height * scale;
      ctx.drawImage(sourceImg, (size - w) / 2, (size - h) / 2, w, h);
    }

    function renderFilterSwatches(){
      filterRow.style.display = 'flex';
      filterRow.innerHTML = ALBUM_FILTERS.map(f => `
        <button class="album-filter-swatch${f.id === activeFilterId ? ' active' : ''}" data-filter="${f.id}" type="button">
          <span class="sw" style="filter:${f.css === 'none' ? '' : f.css};background-image:url('${sourceImg.src}');background-size:cover;background-position:center;"></span>
          <span>${f.label}</span>
        </button>
      `).join('');
      filterRow.querySelectorAll('.album-filter-swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilterId = btn.dataset.filter;
          filterRow.querySelectorAll('.album-filter-swatch').forEach(b => b.classList.toggle('active', b === btn));
          const f = ALBUM_FILTERS.find(x => x.id === activeFilterId);
          drawWithFilter(f.css === 'none' ? 'none' : f.css);
        });
      });
    }

    function handleFile(file){
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          sourceImg = img;
          drawWithFilter('none');
          renderFilterSwatches();
          postBtn.disabled = false;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    modal.querySelector('#albumTakePhoto').addEventListener('click', () => modal.querySelector('#albumFileCamera').click());
    modal.querySelector('#albumPickPhoto').addEventListener('click', () => modal.querySelector('#albumFileGallery').click());
    modal.querySelector('#albumFileCamera').addEventListener('change', (e) => handleFile(e.target.files[0]));
    modal.querySelector('#albumFileGallery').addEventListener('change', (e) => handleFile(e.target.files[0]));

    const close = () => { modal.classList.remove('show'); setTimeout(() => modal.remove(), 220); };
    modal.querySelector('#albumModalCancel').addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });

    postBtn.addEventListener('click', async () => {
      if (!canvas || !albumId) return;
      postBtn.disabled = true;
      postBtn.innerHTML = `<span class="mini-spinner"></span> Posting...`;
      try {
        const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
        const path = `${albumId}/${Date.now()}-${currentUser.id}.jpg`;
        const { error: uploadError } = await supabaseClient.storage
          .from('album-photos')
          .upload(path, blob, { contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;

        const { data: { publicUrl } } = supabaseClient.storage.from('album-photos').getPublicUrl(path);

        const { error: insertError } = await supabaseClient.from('album_photos').insert({
          album_id: albumId,
          user_id: currentUser.id,
          photo_url: publicUrl,
          filter_applied: activeFilterId,
          caption: captionInput.value.trim() || null,
        });
        if (insertError) throw insertError;

        showToast('Added to the album 📸');
        close();
        await refreshAlbumGallery();
      } catch (err) {
        showToast(err.message || 'Could not post photo', 'error');
        postBtn.disabled = false;
        postBtn.textContent = 'Post to album';
      }
    });
  }

        voiceRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(voiceTimerInterval);
          voiceTimer.style.display = 'none';
          voiceBtn.classList.remove('recording');

          const durationSeconds = (Date.now() - voiceStartTime) / 1000;

          } catch (err) {
            showToast(err.message || 'Could not post voice recording', 'error');
          } finally {
            voiceBtn.disabled = false;
          }
        };

        voiceRecorder.start();
        voiceStartTime = Date.now();
        voiceBtn.classList.add('recording');
        voiceTimer.style.display = 'inline';
        voiceTimerInterval = setInterval(() => {
          const secs = Math.floor((Date.now() - voiceStartTime) / 1000);
          voiceTimer.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
          if (secs >= MAX_VOICE_SECONDS) voiceRecorder.stop();

        showToast('Microphone access denied or unavailable', 'error');

        const wasActive = btn.classList.contains('active');

        try {

          card.querySelectorAll('.pub-vote-btn').forEach(b => b.classList.remove('active'));

          card.querySelector('.pub-vote-score').textContent = data?.score ?? 0;
        } catch (err) {
          showToast(err.message || 'Could not vote', 'error');

      });

              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    document.querySelectorAll('.pub-sort-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        currentSort = btn.dataset.sort;
        document.querySelectorAll('.pub-sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        await refreshPubFeed();
      });
    });

    const joinBtn = document.getElementById('pubJoinBtn');
    joinBtn.addEventListener('click', async () => {
      if (!requireAuth()) return;
      if (isMember) return;
      joinBtn.disabled = true;
      joinBtn.innerHTML = `<span class="mini-spinner"></span>`;
      try {
        const { error } = await supabaseClient.from('circle_members').insert({ circle_id: circleId, user_id: currentUser.id, role: 'member' });
        if (error) throw error;
        showToast('Joined the circle');
        myRole = 'member';
        members = await loadMembers();
        await renderPublicMode();
      } catch (err) {
        showToast(err.message || 'Could not join', 'error');
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join circle';
      }
    });

    const pubTextarea = document.getElementById('pubComposerText');

    if (pubTextarea){
      const pubPostBtn = document.getElementById('pubPostBtn');
      const pubMediaUrl = document.getElementById('pubMediaUrl');
      const refresh = () => { pubPostBtn.disabled = !pubTextarea.value.trim() && !pubMediaUrl.value.trim(); };

      pubTextarea.addEventListener('input', () => {
        pubTextarea.style.height = 'auto';
        pubTextarea.style.height = Math.min(pubTextarea.scrollHeight, 160) + 'px';
        refresh();
      });

      const pubAnonToggle = document.getElementById('pubAnonToggle');
      let pubIsAnon = false;
      pubAnonToggle.addEventListener('click', () => {
        pubIsAnon = !pubIsAnon;

        pubAnonToggle.style.background = pubIsAnon ? '#000' : '#1a1b1f';
        pubAnonToggle.style.color = '#fff';

        pubAnonToggle.textContent = pubIsAnon ? 'Anon ✓' : 'Anon';
      });

      pubMediaUrl.addEventListener('input', refresh);

      let isPosting = false;
      pubPostBtn.addEventListener('click', async () => {
        if (isPosting) return;
        const content = pubTextarea.value.trim();
        const url = pubMediaUrl.value.trim();
        if (!content && !url) return;
        isPosting = true;
        pubPostBtn.disabled = true;
        pubPostBtn.innerHTML = `<span class="mini-spinner"></span>`;

        try {
          const { error } = await supabaseClient.from('posts').insert({
            circle_id: circleId,
            user_id: currentUser.id,
            caption: content || null,
            media_url: url || null,
            media_type: url ? (url.match(/\.(mp4|mov|webm)(\?|$)/i) ? 'video' : 'image') : null,
            is_anonymous: pubIsAnon,
          });

          if (error) throw error;
          pubTextarea.value = ''; pubMediaUrl.value = '';
          pubIsAnon = false;

          pubAnonToggle.style.background = '#1a1b1f';

          pubAnonToggle.style.color = '#fff';


          pubAnonToggle.textContent = 'Anon';
          pubTextarea.style.height = 'auto';
          showToast('Posted');
          await refreshPubFeed();
        } catch (err) {
          showToast(err.message || 'Could not post', 'error');
        } finally {
          isPosting = false;
          pubPostBtn.textContent = 'Post';
          refresh();
        }
      });
    }

    await refreshPubFeed();
  }

  async function refreshPubFeed(){
    const feed = document.getElementById('pubFeed');
    const posts = await loadPosts(currentSort);
    if (posts.length === 0){
      feed.innerHTML = `
        <div class="home-empty">
          <h3>No posts yet</h3>
          <p>Nothing has been shared here — check back soon, or be first.</p>
        </div>
      `;
      return;
    }
    const myVotes = await loadMyVotes(posts.map(p => p.id));
    feed.innerHTML = posts.map(p => renderPubPostCard(p, myVotes[p.id])).join('');
    wirePubVotes();
  }

  let composerTimer = null;

  function setupComposerBehavior(){
    const fab = document.getElementById('homeFab');
    const composer = document.getElementById('homeComposer');
    if (!fab || !composer) return;
    const THRESHOLD = 40;
    const isMobile = () => window.matchMedia('(max-width:899.98px)').matches;

    function resetToVisible(){
      // Desktop (or a resize onto desktop): composer is always visible,
      // never collapsed, never in overlay mode. This is the fix — nothing
      // here should ever require a refresh to undo.
      composer.classList.remove('collapsed', 'overlay', 'overlay-open');
      fab.classList.remove('show');
    }

    function onScroll(){
      if (!isMobile()){ resetToVisible(); return; }
      if (composer.classList.contains('overlay-open')) return;
      const scrolled = window.scrollY > THRESHOLD;
      composer.classList.toggle('collapsed', scrolled);
      fab.classList.toggle('show', scrolled);
    }
    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll, { passive:true });
    onScroll();

    fab.addEventListener('click', () => {
      composer.classList.remove('collapsed');
      composer.classList.add('overlay', 'overlay-open');
      fab.classList.remove('show');
      document.getElementById('homeComposerText').focus();
      resetComposerTimer();
    });

    document.addEventListener('click', (e) => {
      if (!composer.classList.contains('overlay-open')) return;
      if (composer.contains(e.target) || fab.contains(e.target)) return;
      closeComposerOverlay();
    });
  }

  function resetComposerTimer(){
    clearTimeout(composerTimer);
    composerTimer = setTimeout(() => {
      const text = document.getElementById('homeComposerText').value.trim();
      const media = document.getElementById('homeMediaUrl').value.trim();
      const focused = document.activeElement === document.getElementById('homeComposerText')
        || document.activeElement === document.getElementById('homeMediaUrl');
      // Only auto-close an empty, untouched composer — never cut someone off
      // mid-thought just because they paused for a few seconds.
      if (!text && !media && !focused) closeComposerOverlay();
    }, 15000);
  }

  function closeComposerOverlay(){
    const composer = document.getElementById('homeComposer');
    clearTimeout(composerTimer);
    composer.classList.remove('overlay-open');
    setTimeout(() => composer.classList.remove('overlay'), 260);
    composer.classList.add('collapsed');
    if (window.scrollY > 40) document.getElementById('homeFab')?.classList.add('show');
  }

  // =========================================================
  // MAIN INIT
  // =========================================================
  async function init(){
    await renderSidebar();

      const inviteCode = params.get('code');
      if (inviteCode && !circleId){
        if (!requireAuth(`/circle?code=${encodeURIComponent(inviteCode)}`)) return;
        document.getElementById('pageBody').innerHTML = `<div class="page-loading">Joining circle…</div>`;
        const { data, error } = await supabaseClient.rpc('redeem_circle_invite', { p_code: inviteCode });
        if (error || !data?.circle_id){
          document.getElementById('pageBody').innerHTML = `
            <div class="page-error">
              <h2>Invite invalid or expired</h2>
              <p>${error?.message || ''} <a href="/circles">Back to your circles</a></p>
            </div>`;
          return;
        }
        window.location.replace(`/circle?private&ID=${encodeURIComponent(data.circle_id)}`);
        return;
      }

    if (!circleId){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>No circle ID was given. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    circle = await loadCircle();
    if (!circle){
      document.getElementById('pageBody').innerHTML = `
        <div class="page-error">
          <h2>Circle not found</h2>
          <p>This circle doesn't exist or was removed. <a href="/circles">Back to your circles</a></p>
        </div>
      `;
      return;
    }

    if (urlSaysPrivate !== circle.is_private){
      const correctUrl = `/circle?${circle.is_private ? 'private' : 'public'}&ID=${encodeURIComponent(circle.id)}`;
      window.history.replaceState(null, '', correctUrl);
    }

    members = await loadMembers();
    if (currentUser){
      const mine = members.find(m => m.id === currentUser.id);
      myRole = mine ? mine.role : null;
    }

    if (circle.is_private){
      if (!requireAuth()) return;
      if (myRole === null){
        document.getElementById('pageBody').innerHTML = `
          <div class="page-error">
            <h2>This circle is private</h2>
            <p>You need an invite to see what's inside. <a href="/circles">Back to your circles</a></p>
          </div>
        `;
        return;
      }
      await renderHomeMode();
    } else {
      await renderPublicMode();
    }
  }

  init();
</script>
