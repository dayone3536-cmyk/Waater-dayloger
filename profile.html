<!DOCTYPE html>
<html lang="en">
<head>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Profile — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-2:#ffb199;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --nav-w:248px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(98px + env(safe-area-inset-bottom));
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}

  /* ---------- shared shell ---------- */
  .app{display:flex;max-width:1180px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  /* =========================================================
     NAVIGATION — sidebar (desktop) / topbar + dock (mobile)
     ========================================================= */
  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-0.03em;
    display:inline-flex;align-items:baseline;line-height:1;
  }
  .wordmark .dot{color:var(--accent);display:inline-block;transition:transform .45s var(--ease-spring);}
  a.wordmark:hover .dot{transform:translateY(-3px) scale(1.3);}

  /* ---------- Mobile top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    height:58px;padding:0 18px;
    position:sticky;top:0;z-index:20;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
    transition:box-shadow .25s ease;
  }
  .topbar.scrolled{box-shadow:0 8px 22px -14px rgba(20,21,26,.28);}

  /* ---------- Desktop sidebar ---------- */
  .sidebar{
    display:none;width:var(--nav-w);flex-shrink:0;padding:26px 16px 20px;
    flex-direction:column;height:100vh;height:100dvh;position:sticky;top:0;
  }
  .sidebar .brand{align-self:flex-start;font-size:26px;padding:6px 14px;margin-bottom:26px;border-radius:12px;}

  .nav-wrap{position:relative;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;}
  .nav-pill{
    position:absolute;left:0;right:0;top:0;height:46px;border-radius:14px;background:#f3f3f4;
    opacity:0;pointer-events:none;z-index:0;
    transition:transform .38s var(--ease-spring), height .2s var(--ease), opacity .2s ease;
  }
  .nav-pill.on{opacity:1;}
  .nav-pill.snap{transition:opacity .2s ease;}

  .nav-item{
    position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 14px;
    border-radius:14px;font-family:var(--font-display);font-size:15.5px;font-weight:500;letter-spacing:-.005em;
    color:var(--ink-soft);
    transition:color .18s ease, background .18s ease, transform .15s var(--ease-spring);
  }
  .nav-item svg{
    width:22px;height:22px;flex-shrink:0;stroke:currentColor;
    transition:transform .35s var(--ease-spring), stroke .18s ease, fill .18s ease;
  }
  .nav-item:hover{color:var(--ink);}
  .nav-item:hover svg{transform:scale(1.12) rotate(-5deg);}
  .nav-item:active{transform:scale(.97);}
  .nav-item.active{color:var(--ink);font-weight:600;background:var(--accent-soft);}
  .nav-item.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);}
  .nav-item.active::before{
    content:'';position:absolute;left:-6px;top:50%;width:4px;height:20px;border-radius:0 4px 4px 0;
    background:var(--accent);transform:translateY(-50%);
    animation:navBar .45s var(--ease-spring) both;
  }
  @keyframes navBar{ from{transform:translateY(-50%) scaleY(.2);opacity:0;} to{transform:translateY(-50%) scaleY(1);opacity:1;} }
  .nav-item:focus-visible,.sidebar .brand:focus-visible,.nav-create:focus-visible,
  .sidebar-profile:focus-visible,.sidebar-signout:focus-visible,.sidebar-signin:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  .nav-create{
    position:relative;overflow:hidden;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:9px;
    height:48px;border-radius:14px;color:#fff;
    font-family:var(--font-display);font-weight:600;font-size:15px;
    background:linear-gradient(135deg,#ff7d59 0%,var(--accent) 55%,#f2431c 100%);
    box-shadow:0 10px 22px -8px rgba(255,90,54,.6), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .25s var(--ease-spring), box-shadow .25s ease;
  }
  .nav-create svg{width:19px;height:19px;stroke:#fff;transition:transform .4s var(--ease-spring);}
  .nav-create::after{
    content:'';position:absolute;inset:0;transform:translateX(-130%);
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);
    transition:transform .7s var(--ease);
  }
  .nav-create:hover{transform:translateY(-2px);box-shadow:0 16px 28px -8px rgba(255,90,54,.65), inset 0 1px 0 rgba(255,255,255,.3);}
  .nav-create:hover svg{transform:rotate(90deg);}
  .nav-create:hover::after{transform:translateX(130%);}
  .nav-create:active{transform:scale(.97);}

  .sidebar-auth{margin-top:auto;}
  .sidebar-user{
    display:flex;align-items:center;gap:4px;padding:8px;border-radius:18px;
    background:#fff;border:1px solid var(--line);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .sidebar-user:hover{border-color:var(--line-strong);box-shadow:0 8px 22px -14px rgba(20,21,26,.25);}
  .sidebar-profile{
    flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:3px 6px 3px 3px;border-radius:12px;
    transition:background .15s ease;
  }
  .sidebar-profile:hover{background:#f7f7f8;}
  .mini-avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));
    flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-display);font-weight:700;font-size:14px;overflow:hidden;
  }
  .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .sidebar-user .mini-avatar{width:38px;height:38px;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent-soft);}
  .sidebar-profile .who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0;}
  .sidebar-profile .who span:first-child{font-family:var(--font-display);font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-profile .who span:last-child{font-family:var(--font-mono);font-size:10.5px;color:var(--grey);}
  .sidebar-signout{
    width:34px;height:34px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;color:var(--grey);
    transition:background .15s ease, color .15s ease, transform .15s var(--ease-spring);
  }
  .sidebar-signout svg{width:17px;height:17px;stroke:currentColor;}
  .sidebar-signout:hover{background:#fdeeed;color:var(--danger);}
  .sidebar-signout:active{transform:scale(.9);}
  .sidebar-signin{
    margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;
    background:var(--ink);color:#fff!important;border-radius:14px;
    font-family:var(--font-display);font-weight:600;font-size:14.5px;
    transition:background .16s ease, transform .2s var(--ease-spring);
  }
  .sidebar-signin:hover{background:#000;transform:translateY(-1px);}
  .sidebar-signin:active{transform:scale(.97);}

  @media (min-width:900px){
    body{padding-bottom:0;}
    .topbar{display:none;}
    .sidebar{display:flex;}
  }

  /* ---------- Mobile floating dock ---------- */
  .bottom-nav{
    position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;height:64px;padding:0 6px;
    display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
    border-radius:24px;z-index:30;
    background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border:1px solid rgba(20,21,26,.06);
    box-shadow:0 14px 34px -10px rgba(20,21,26,.22), 0 2px 8px rgba(20,21,26,.05);
    transition:transform .4s var(--ease), opacity .25s ease;
  }
  .bottom-nav.hidden{transform:translateY(calc(100% + 32px));opacity:0;pointer-events:none;}
  .tab{
    position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--grey);font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.005em;
    -webkit-tap-highlight-color:transparent;
    transition:color .2s ease, transform .2s var(--ease-spring);
  }
  .tab-ico{
    width:48px;height:30px;border-radius:99px;display:grid;place-items:center;
    transition:background .25s ease;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;transition:transform .3s var(--ease-spring);}
  .tab:active svg{transform:scale(.82);}
  .tab.active{color:var(--ink);}
  .tab.active .tab-ico{background:var(--accent-soft);}
  .tab.active svg{stroke:var(--accent);fill:rgba(255,90,54,.16);animation:tabPop .5s var(--ease-spring);}
  @keyframes tabPop{ 0%{transform:scale(.7);} 100%{transform:scale(1);} }
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:18px;}

  .tab-create{overflow:visible;}
  .tab-create .ring{
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,#ff7d59,var(--accent) 55%,#f2431c);
    transform:translateY(-14px);
    box-shadow:0 0 0 5px #fff, 0 12px 22px -4px rgba(255,90,54,.55), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .3s var(--ease-spring), box-shadow .3s ease;
  }
  .tab-create svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;fill:none;transition:transform .35s var(--ease-spring);}
  .tab-create:active .ring{transform:translateY(-12px) scale(.92);}
  .tab-create:active svg{transform:rotate(90deg);}
  .tab-create .tab-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  @media (min-width:900px){ .bottom-nav{display:none;} }

  /* ============================================================
     PROFILE — the actual page
     ============================================================ */
  .profile-loading{
    padding:80px 22px;text-align:center;
    font-family:var(--font-mono);font-size:12px;color:var(--grey);
  }

  .profile-wrap{
    padding:40px 22px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* --- avatar with signature rotating gradient ring --- */
  .avatar-stage{
    position:relative;
    width:132px;height:132px;
    margin-bottom:18px;
  }
  .avatar-ring{
    position:absolute;inset:0;
    border-radius:50%;
    padding:4px;
    background:conic-gradient(from 0deg, var(--accent), var(--accent-2), #ffe3d6, var(--accent-2), var(--accent));
    animation:spin 8s linear infinite;
  }
  @media (prefers-reduced-motion:reduce){ .avatar-ring{animation:none;} }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar-ring-inner{
    width:100%;height:100%;border-radius:50%;
    background:var(--white);
    padding:4px;
  }
  .avatar-photo{
    width:100%;height:100%;border-radius:50%;
    overflow:hidden;
    background:linear-gradient(135deg,#ffd8c9,var(--accent));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:42px;
    position:relative;
  }
  .avatar-photo img{width:100%;height:100%;object-fit:cover;}

  .avatar-edit-btn{
    position:absolute;
    bottom:2px;right:2px;
    width:36px;height:36px;
    border-radius:50%;
    background:var(--ink);
    border:3px solid var(--white);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .15s ease;
    z-index:5;
  }
  .avatar-edit-btn:hover{background:#000;transform:scale(1.08);}
  .avatar-edit-btn svg{width:15px;height:15px;stroke:#fff;}
  .avatar-edit-btn input{display:none;}

  .avatar-uploading{
    position:absolute;inset:4px;border-radius:50%;
    background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-mono);font-size:10px;
  }

  .profile-username{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .profile-sub{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--grey);
    margin-top:4px;
    letter-spacing:.02em;
  }

  /* --- stats row --- */
  .stats-row{
    display:flex;
    align-items:center;
    gap:0;
    margin-top:22px;
    border:1px solid var(--line-strong);
    border-radius:16px;
    overflow:hidden;
  }
  .stat{
    padding:14px 26px;
    text-align:center;
    cursor:default;
  }
  .stat.clickable{cursor:pointer;transition:background .15s ease;}
  .stat.clickable:hover{background:#f7f7f8;}
  .stat + .stat{border-left:1px solid var(--line-strong);}
  .stat .num{
    display:block;
    font-family:var(--font-display);
    font-weight:700;
    font-size:18px;
    color:var(--ink);
  }
  .stat .label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:.04em;
    color:var(--grey);
    text-transform:uppercase;
    margin-top:2px;
    display:block;
  }

  /* --- friend action button --- */

  .friend-action{

    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }



  .friend-btn{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13.5px;
    padding:11px 22px;
    border-radius:99px;
    display:flex;align-items:center;gap:8px;
    transition:background .15s ease, opacity .15s ease, transform .1s ease;
  }
  .friend-btn svg{width:15px;height:15px;}
  .friend-btn.primary{background:var(--ink);color:#fff;}
  .friend-btn.primary:hover{background:#000;}
  .friend-btn.ghost{background:var(--accent-soft);color:#c24020;}
  .friend-btn.ghost:hover{opacity:.85;}
  .friend-btn.outline{border:1px solid var(--line-strong);color:var(--ink-soft);}
  .friend-btn.outline:hover{border-color:var(--ink);color:var(--ink);}
  .friend-btn.danger{background:#fdeceb;color:var(--danger);}
  .friend-btn:disabled{opacity:.5;cursor:default;}
  .friend-btn:active{transform:scale(.97);}

  /* --- friend requests panel (own profile only) --- */
  .section{
    width:100%;
    max-width:520px;
    margin-top:36px;
  }
  .section-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    letter-spacing:.01em;
    color:var(--ink);
    padding:0 22px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title .badge{
    background:var(--accent);
    color:#fff;
    font-family:var(--font-mono);
    font-size:10px;
    padding:1px 7px;
    border-radius:99px;
  }

  .request-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 22px;
    border-bottom:1px solid var(--line);
  }
  .request-row .mini-avatar{width:38px;height:38px;font-size:14px;}
  .request-row .req-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    flex:1;
  }
  .req-actions{display:flex;gap:8px;}
  .req-actions button{
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s ease;
  }
  .req-actions button:active{transform:scale(.92);}
  .req-accept{background:var(--ink);}
  .req-accept svg{width:14px;height:14px;stroke:#fff;}
  .req-decline{background:#f2f2f3;}
  .req-decline svg{width:14px;height:14px;stroke:var(--ink-soft);}

  .empty-note{
    padding:20px 22px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--grey);
    text-align:center;
  }

  /* --- posts grid --- */
  .grid-head{
    width:100%;
    max-width:820px;
    padding:0 22px;
    margin-top:40px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .grid-head svg{width:16px;height:16px;stroke:var(--ink);}
  .grid-head span{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
  }

  @keyframes bf-pop {

    0% { transform: scale(.85); opacity:0; }
    60% { transform: scale(1.05); opacity:1; }
    100% { transform: scale(1); }
  }

  .bf-btn{

    position:relative;
    font-family:var(--font-display);
    font-weight:700;
    font-size:13.5px;

    padding:11px 24px 11px 18px;
    border-radius:99px;
    display:flex;align-items:center;gap:8px;
    color:#fff;

    background:linear-gradient(90deg, #ff5a36, #ffd23f, #ff5a36);
    background-size:200% auto;

    animation: bf-glow 2.4s ease-in-out infinite, bf-shine 3.5s linear infinite, bf-pop .4s cubic-bezier(.34,1.56,.64,1);
    transition: transform .12s ease;
    overflow:hidden;

    box-shadow:0 4px 14px rgba(255,90,54,.3);
    
  }
  .bf-btn:hover{ transform: translateY(-2px) scale(1.04); }




  .posts-grid{
    width:100%;
    max-width:820px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:3px;
    padding:0 22px 40px;
  }
  .grid-cell{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:linear-gradient(160deg,var(--g1,#ffe3d6),var(--g2,#ffb199));
    cursor:pointer;
  }
  .grid-cell img,
  .grid-cell video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  }
  .grid-cell .video-tag{
    position:absolute;top:6px;right:6px;
    width:18px;height:18px;
  }
  .grid-cell .video-tag svg{width:100%;height:100%;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
  .grid-cell .cap-peek{
    position:absolute;inset:0;
    display:flex;align-items:flex-end;
    padding:8px;
    background:linear-gradient(to top, rgba(0,0,0,.35), transparent 55%);
    color:#fff;
    font-family:var(--font-serif);
    font-style:italic;
    font-size:11px;
    line-height:1.3;
    opacity:0;
    transition:opacity .15s ease;
  }
  .grid-cell:hover .cap-peek{opacity:1;}

    /* ---------- BEST FRIEND ---------- */
  @keyframes bf-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,90,54,.5), 0 4px 16px rgba(255,90,54,.35); }
    50% { box-shadow: 0 0 0 8px rgba(255,90,54,0), 0 4px 20px rgba(255,90,54,.5); }
  }
  @keyframes bf-shine {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .bf-btn{
    position:relative;
    font-family:var(--font-display);
    font-weight:700;
    font-size:13.5px;
    padding:11px 22px 11px 18px;
    border-radius:99px;
    display:flex;align-items:center;gap:8px;
    color:#fff;
    background:linear-gradient(90deg, #ff5a36, #ffb199, #ff5a36);
    background-size:200% auto;
    animation: bf-glow 2.4s ease-in-out infinite, bf-shine 3.5s linear infinite;
    transition: transform .12s ease;
    overflow:hidden;
  }
  .bf-btn:hover{ transform: translateY(-1px) scale(1.03); }
  .bf-btn:active{ transform: scale(.96); }
  .bf-btn svg{ width:16px;height:16px; fill:#fff; }
  .bf-btn.pending{
    background:#f2f2f3; color:var(--ink-soft); animation:none; box-shadow:none;
  }
  .bf-btn.pending svg{ fill:var(--ink-soft); }
  .bf-btn.accepted{
    background:var(--ink); animation:none;
    box-shadow:0 4px 14px rgba(20,21,26,.25);
  }
  .bf-btn.locked{
    background:#fdeceb; color:var(--danger); animation:none; box-shadow:none;
  }
  .bf-btn.locked svg{ fill:var(--danger); }
  .bf-btn:disabled{ opacity:.6; cursor:default; }

  .bf-crown-mini{ width:16px;height:16px; flex-shrink:0; }
  .bf-crown-badge{
    position:absolute; top:-6px; right:-6px;
    width:22px;height:22px; border-radius:50%;
    background:linear-gradient(135deg,#ffd23f,#ff9d00);
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--white);
    box-shadow:0 2px 6px rgba(255,157,0,.5);
  }
  .bf-crown-badge svg{ width:11px;height:11px; fill:#fff; }
  .mini-avatar.is-bf{ position:relative; }

  /* ---------- MODAL ---------- */
  .bf-modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,21,26,.55);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .bf-modal-overlay.show{ opacity:1; pointer-events:auto; }
  .bf-modal{
    background:#fff; border-radius:24px; max-width:380px; width:100%;
    padding:32px 26px 26px; text-align:center;
    transform:scale(.9) translateY(10px); transition:transform .25s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 30px 60px rgba(0,0,0,.3);
  }
  .bf-modal-overlay.show .bf-modal{ transform:scale(1) translateY(0); }
  .bf-modal-icon{
    width:64px;height:64px; margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffd23f,#ff5a36);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(255,90,54,.4);
  }
  .bf-modal-icon svg{ width:30px;height:30px; fill:#fff; }
  .bf-modal h3{
    font-family:var(--font-display); font-weight:700; font-size:18px;
    margin-bottom:10px; letter-spacing:-.01em;
  }
  .bf-modal p{
    font-family:var(--font-serif); font-size:14.5px; color:var(--ink-soft);
    line-height:1.5; margin-bottom:6px;
  }
  .bf-modal .warn-strip{
    margin-top:14px; padding:11px 14px; border-radius:12px;
    background:#fff1ec; color:#c24020;
    font-family:var(--font-mono); font-size:11px; line-height:1.5; text-align:left;
    display:flex; gap:8px; align-items:flex-start;
  }
  .bf-modal .warn-strip svg{ width:15px;height:15px; flex-shrink:0; margin-top:1px; stroke:#c24020; }
  .bf-modal-actions{ display:flex; gap:10px; margin-top:22px; }
  .bf-modal-actions button{
    flex:1; padding:13px; border-radius:14px; font-family:var(--font-display); font-weight:600; font-size:14px;
    transition:transform .1s ease, opacity .15s ease;
  }
  .bf-modal-actions button:active{ transform:scale(.96); }
  .bf-modal-cancel{ background:#f2f2f3; color:var(--ink-soft); }
  .bf-modal-confirm{
    background:linear-gradient(90deg,#ff5a36,#ff7d52); color:#fff;
    box-shadow:0 6px 16px rgba(255,90,54,.35);
  }
  .bf-modal-confirm:disabled{ opacity:.6; }

  /* countdown pill for cooldown */
  .bf-cooldown-pill{
    font-family:var(--font-mono); font-size:10px; color:var(--grey);
    margin-top:8px; text-align:center;
  }




  @media (min-width:900px){
    .profile-wrap{padding-top:56px;}
  }

  .status-msg{
    margin-top:14px;font-family:var(--font-mono);font-size:11.5px;
    padding:10px 12px;border-radius:8px;display:none;max-width:320px;text-align:center;
  }
  .status-msg.show{display:block;}
  .status-msg.error{background:#fdeceb;color:var(--danger);}
</style>
</head>

<script>
  const GRADIENTS = [
    ['#ffe3d6', '#ff9d76'], ['#dcefff', '#7fb8ff'],
    ['#eaffe0', '#a3e88f'], ['#f3e3ff', '#c79dff'],
  ];

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
  function initials(name) {
    return (name || '?').trim().slice(0, 1).toUpperCase();
  }

  // ============================================================
  // SUPABASE CONFIG — same project as the rest of the app.
  // ============================================================
  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  emailjs.init("BTDnE087BXwzjnfK3"); // same public key you used in post.html



  let currentUser = null;      // signed-in visitor (or null)
  let currentUsername = null;
  let targetProfile = null;    // the profile.id/username/avatar_url being viewed
  let isOwnProfile = false;

  function requireAuth(nextPath) {
    if (currentUser) return true;
    window.location.href = `/auth?next=${encodeURIComponent(nextPath || window.location.pathname + window.location.search)}`;
    return false;
  }

  // ---- sidebar auth widget (shared look with index.html) ----
  async function renderSidebar() {
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;
    const area = document.getElementById('sidebarAuthArea');

    if (!currentUser) {
      area.innerHTML = `<a href="/auth" class="sidebar-signin">Sign in</a>`;
      return;
    }

    const { data: me } = await supabaseClient
      .from('profiles')
      .select('username, avatar_url')
      .eq('id', currentUser.id)
      .maybeSingle();

    currentUsername = me?.username || currentUser.email || 'You';
    const avatarHtml = me?.avatar_url
      ? `<img src="${escapeHtml(me.avatar_url)}" alt="">`
      : initials(currentUsername);

    area.innerHTML = `
      <div class="sidebar-user">
        <a href="/profile" class="sidebar-profile">
          <div class="mini-avatar">${avatarHtml}</div>
          <div class="who"><span>${escapeHtml(currentUsername)}</span><span>view profile</span></div>
        </a>
        <button class="sidebar-signout" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    `;
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });
  }

  // ---- figure out whose profile we're looking at ----
  async function resolveTarget() {
    const params = new URLSearchParams(window.location.search);
    const requestedUsername = params.get('u');

    if (requestedUsername) {
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('id, username, avatar_url')
        .eq('username', requestedUsername)
        .maybeSingle();
      if (error || !profile) return null;
      targetProfile = profile;
      isOwnProfile = currentUser && currentUser.id === profile.id;
      return profile;
    }

    // No ?u= — this is "my profile". Must be signed in.
    if (!requireAuth('/profile')) return null;

    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('id, username, avatar_url')
      .eq('id', currentUser.id)
      .maybeSingle();
    if (error || !profile) return null;
    targetProfile = profile;
    isOwnProfile = true;
    return profile;
  }

  // ---- stats: post count + friend count ----
  async function loadStats(userId) {
    const [{ count: postCount }, { count: friendCount }] = await Promise.all([
      supabaseClient.from('posts').select('id', { count: 'exact', head: true }).eq('user_id', userId),
      supabaseClient.from('friendships').select('id', { count: 'exact', head: true })
        .eq('status', 'accepted').or(`requester_id.eq.${userId},addressee_id.eq.${userId}`)
    ]);
    return { postCount: postCount || 0, friendCount: friendCount || 0 };
  }

  // ---- friendship state between currentUser and targetProfile ----
  async function loadFriendshipState() {
    if (!currentUser || isOwnProfile) return null;
    const { data } = await supabaseClient
      .from('friendships')
      .select('*')
      .or(`and(requester_id.eq.${currentUser.id},addressee_id.eq.${targetProfile.id}),and(requester_id.eq.${targetProfile.id},addressee_id.eq.${currentUser.id})`)
      .maybeSingle();
    return data || null;
  }

  function friendButtonHtml(friendship) {
    if (!currentUser) {
      return `<button class="friend-btn primary" id="friendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Add friend
      </button>`;
    }

    if (!friendship) {
      return `<button class="friend-btn primary" id="friendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Add friend
      </button>`;
    }

    if (friendship.status === 'accepted') {

      return `
        <button class="friend-btn outline" id="friendBtn" data-action="unfriend">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          Friends
        </button>

        <a href="/messages?with=${targetProfile.id}" class="friend-btn primary">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Message

        </a>
      `;
    }



    if (friendship.requester_id === currentUser.id) {
      return `<button class="friend-btn outline" id="friendBtn" data-action="cancel">Request sent</button>`;
    }
    return `
      <button class="friend-btn primary" id="acceptBtn">Accept</button>
      <button class="friend-btn ghost" id="declineBtn">Decline</button>
    `;
  }

  async function wireFriendButton(friendship) {
  const btn = document.getElementById('friendBtn');
  if (btn) {
    btn.addEventListener('click', async () => {
      if (!requireAuth()) return;
      btn.disabled = true;
      const action = btn.dataset.action;

      try {
        if (!friendship) {
          await supabaseClient.from('friendships').insert({
            requester_id: currentUser.id, addressee_id: targetProfile.id, status: 'pending'
          });
          // notify the target by email
          const { data: targetEmailProfile } = await supabaseClient
            .from('profiles')
            .select('email, username')
            .eq('id', targetProfile.id)
            .maybeSingle();
          if (targetEmailProfile?.email) {
            emailjs.send("service_pgfqmti", "template_ceepy7m", {

              to_email: targetEmailProfile.email,
              to_name: targetEmailProfile.username,
              requester_name: currentUsername || 'Someone',
              profile_url: `${window.location.origin}/profile?u=${encodeURIComponent(currentUsername || '')}`,
            }).catch(err => console.error('Friend request email failed:', err));
          }
        } else if (action === 'cancel') {
          await supabaseClient.from('friendships').delete().eq('id', friendship.id);
        } else if (action === 'unfriend') {
          await supabaseClient.from('friendships').delete().eq('id', friendship.id);
        }
        renderPage();
      } catch (err) {
        console.error('Friend action failed:', err);
        btn.disabled = false;
      }
    });
  }

  const acceptBtn = document.getElementById('acceptBtn');
  const declineBtn = document.getElementById('declineBtn');
  if (acceptBtn) acceptBtn.addEventListener('click', async () => {
    acceptBtn.disabled = true;
    await supabaseClient.from('friendships').update({ status: 'accepted' }).eq('id', friendship.id);
    renderPage();
  });
  if (declineBtn) declineBtn.addEventListener('click', async () => {
    declineBtn.disabled = true;
    await supabaseClient.from('friendships').delete().eq('id', friendship.id);
    renderPage();
  });
}




  // ---- pending requests panel (own profile only) ----
  async function loadPendingRequests() {
    const { data } = await supabaseClient
      .from('friendships')
      .select('id, requester_id, profiles!friendships_requester_id_fkey(username, avatar_url)')
      .eq('addressee_id', currentUser.id)
      .eq('status', 'pending')
      .order('created_at', { ascending: false });
    return data || [];
  }

  function renderRequestRow(req) {
    const name = req.profiles?.username || 'Someone';
    const avatar = req.profiles?.avatar_url
      ? `<img src="${escapeHtml(req.profiles.avatar_url)}" alt="">`
      : initials(name);
    return `
      <div class="request-row" data-req-id="${req.id}">
        <div class="mini-avatar">${avatar}</div>
        <span class="req-name">${escapeHtml(name)}</span>
        <div class="req-actions">
          <button class="req-accept" data-req="${req.id}" data-act="accept">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <button class="req-decline" data-req="${req.id}" data-act="decline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    `;
  }

  // ---- avatar upload ----
  async function handleAvatarUpload(file) {
    if (!file || !currentUser) return;
    const stage = document.getElementById('avatarStage');
    const overlay = document.createElement('div');
    overlay.className = 'avatar-uploading';
    overlay.textContent = 'uploading…';
    stage.appendChild(overlay);

    try {
      const ext = file.name.split('.').pop();
      const path = `${currentUser.id}/avatar.${ext}`;

      const { error: uploadError } = await supabaseClient.storage
        .from('avatars')
        .upload(path, file, { cacheControl: '3600', upsert: true });
      if (uploadError) throw uploadError;

      const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(path);
      // cache-bust so the new photo shows immediately
      const avatarUrl = `${publicUrlData.publicUrl}?t=${Date.now()}`;

      const { error: updateError } = await supabaseClient
        .from('profiles')
        .update({ avatar_url: avatarUrl })
        .eq('id', currentUser.id);
      if (updateError) throw updateError;

      targetProfile.avatar_url = avatarUrl;
      renderPage();
    } catch (err) {
      console.error('Avatar upload failed:', err);
      overlay.remove();
      const statusEl = document.getElementById('avatarStatus');
      if (statusEl) {
        statusEl.textContent = err.message || 'Upload failed. Try a smaller image.';
        statusEl.className = 'status-msg show error';
      }
    }
  }

  // ---- posts grid ----
  async function loadPosts(userId) {
    const { data } = await supabaseClient
      .from('posts')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false });
    return data || [];
  }

  function renderGridCell(post, index) {
    const [g1, g2] = GRADIENTS[index % GRADIENTS.length];
    let mediaHtml = '';
    if (post.media_type === 'video' && post.media_url) {
      mediaHtml = `
        <video src="${escapeHtml(post.media_url)}" muted playsinline preload="metadata"></video>
        <div class="video-tag"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      `;
    } else if (post.media_type === 'photo' && post.media_url) {
      mediaHtml = `<img src="${escapeHtml(post.media_url)}" alt="" loading="lazy">`;
    }
    return `
      <div class="grid-cell" style="--g1:${g1};--g2:${g2};">
        ${mediaHtml}
        ${post.caption ? `<div class="cap-peek">${escapeHtml(post.caption)}</div>` : ''}
      </div>
    `;
  }

  function wireRequestRows() {
    document.querySelectorAll('.req-accept[data-req]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { error } = await supabaseClient
          .from('friendships')
          .update({ status: 'accepted' })
          .eq('id', btn.dataset.req);
        if (error) { console.error('Accept failed:', error); btn.disabled = false; return; }
        renderPage();
      });
    });

    document.querySelectorAll('.req-decline[data-req]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { error } = await supabaseClient
          .from('friendships')
          .delete()
          .eq('id', btn.dataset.req);
        if (error) { console.error('Decline failed:', error); btn.disabled = false; return; }
        renderPage();
      });
    });
  }

  function wireBestFriendRequestRow() {
    const acceptBtn = document.getElementById('bfAcceptBtn');
    const declineBtn = document.getElementById('bfDeclineBtn');

    if (acceptBtn) {
      acceptBtn.addEventListener('click', async () => {
        acceptBtn.disabled = true;
        const { error } = await supabaseClient
          .from('best_friends')
          .update({ status: 'accepted' })
          .eq('id', acceptBtn.dataset.id);
        if (error) { console.error('BF accept failed:', error); acceptBtn.disabled = false; return; }
        renderPage();
      });
    }

    if (declineBtn) {
      declineBtn.addEventListener('click', async () => {
        declineBtn.disabled = true;
        const { error } = await supabaseClient
          .from('best_friends')
          .delete()
          .eq('id', declineBtn.dataset.id);
        if (error) { console.error('BF decline failed:', error); declineBtn.disabled = false; return; }
        renderPage();
      });
    }
  }



  // ---- main render ----

  async function renderPage() {
    const body = document.getElementById('pageBody');

    const profile = await resolveTarget();
    if (!profile) {
      body.innerHTML = `<div class="profile-loading">Couldn't find that profile.</div>`;
      return;
    }

    const [{ postCount, friendCount }, friendship, posts] = await Promise.all([
      loadStats(profile.id),
      loadFriendshipState(),
      loadPosts(profile.id),
    ]);

    const bf = !isOwnProfile ? await loadBestFriendState() : null;

    const avatarHtml = profile.avatar_url
      ? `<img src="${escapeHtml(profile.avatar_url)}" alt="">`
      : initials(profile.username);

    let requestsHtml = '';
    if (isOwnProfile) {
      const requests = await loadPendingRequests();
      if (requests.length > 0) {
        requestsHtml = `
          <div class="section">
            <div class="section-title">Friend requests <span class="badge">${requests.length}</span></div>
            ${requests.map(renderRequestRow).join('')}
          </div>
        `;
      }
    }

    let bfRequestHtml = '';
    if (isOwnProfile) {
      const bfIncoming = await loadIncomingBestFriendRequest();
      if (bfIncoming) {
        const name = bfIncoming.profiles?.username || 'Someone';
        const avatar = bfIncoming.profiles?.avatar_url
          ? `<img src="${escapeHtml(bfIncoming.profiles.avatar_url)}" alt="">`
          : initials(name);
        bfRequestHtml = `
          <div class="section">
            <div class="section-title">👑 Best friend request</div>
            <div class="request-row">
              <div class="mini-avatar">${avatar}</div>
              <span class="req-name">${escapeHtml(name)} wants you as their Best Friend</span>
              <div class="req-actions">
                <button class="req-accept" id="bfAcceptBtn" data-id="${bfIncoming.id}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>

  async function init() {
    await renderSidebar();
    await renderPage();
  }

  init();

    const CROWN_SVG = `<svg viewBox="0 0 24 24"><path d="M3 18h18v2H3v-2zM5 16l-2-9 5 3 4-6 4 6 5-3-2 9H5z"/></svg>`;

  // ---- load current best-friend relationship between viewer & target ----
  async function loadBestFriendState() {
    if (!currentUser || isOwnProfile) return null;
    const { data } = await supabaseClient
      .from('best_friends')
      .select('*')
      .or(`and(requester_id.eq.${currentUser.id},target_id.eq.${targetProfile.id}),and(requester_id.eq.${targetProfile.id},target_id.eq.${currentUser.id})`)
      .in('status', ['pending', 'accepted'])
      .maybeSingle();
    return data || null;
  }

  function cooldownRemaining(acceptedAt) {
    const unlockAt = new Date(acceptedAt).getTime() + 7 * 24 * 60 * 60 * 1000;
    const msLeft = unlockAt - Date.now();
    if (msLeft <= 0) return null;
    const days = Math.floor(msLeft / 86400000);
    const hours = Math.floor((msLeft % 86400000) / 3600000);
    return `${days}d ${hours}h left in cooldown`;
  }

  function bestFriendButtonHtml(bf) {
    if (!currentUser) {
      return `<button class="bf-btn" id="bfBtn">${CROWN_SVG}Best Friend</button>`;
    }
    if (!bf) {
      return `<button class="bf-btn" id="bfBtn">${CROWN_SVG}Best Friend</button>`;
    }
    if (bf.status === 'pending' && bf.requester_id === currentUser.id) {
      return `<button class="bf-btn pending" id="bfBtn" data-action="cancel" data-id="${bf.id}">${CROWN_SVG}Request sent</button>`;
    }
    if (bf.status === 'pending' && bf.target_id === currentUser.id) {
      return `<button class="bf-btn" id="bfBtn" data-action="accept-inline" data-id="${bf.id}">${CROWN_SVG}Accept as Best Friend</button>`;
    }
    if (bf.status === 'accepted') {
      const isRequester = bf.requester_id === currentUser.id;
      const remaining = isRequester ? cooldownRemaining(bf.accepted_at) : null;
      if (remaining) {
        return `
          <div>
            <button class="bf-btn locked" id="bfBtn" disabled>${CROWN_SVG}Best Friends 👑</button>
            <div class="bf-cooldown-pill">🔒 ${remaining}</div>
          </div>`;
      }
      return `<button class="bf-btn accepted" id="bfBtn" data-action="remove" data-id="${bf.id}">${CROWN_SVG}Best Friends 👑</button>`;
    }
    return `<button class="bf-btn" id="bfBtn">${CROWN_SVG}Best Friend</button>`;
  }

  // ---- the insanely great warning modal ----
  function openBestFriendModal({ title, message, warning, confirmLabel, onConfirm }) {
    const overlay = document.createElement('div');
    overlay.className = 'bf-modal-overlay';
    overlay.innerHTML = `
      <div class="bf-modal">
        <div class="bf-modal-icon">${CROWN_SVG}</div>
        <h3>${escapeHtml(title)}</h3>
        <p>${message}</p>
        ${warning ? `
          <div class="warn-strip">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.4 14.5A1.5 1.5 0 003.16 21h17.68a1.5 1.5 0 001.27-2.64l-8.4-14.5a1.5 1.5 0 00-2.62 0z"/></svg>
            <span>${warning}</span>
          </div>` : ''}
        <div class="bf-modal-actions">
          <button class="bf-modal-cancel" id="bfModalCancel">Cancel</button>
          <button class="bf-modal-confirm" id="bfModalConfirm">${confirmLabel}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('show'));

    const close = () => {
      overlay.classList.remove('show');
      setTimeout(() => overlay.remove(), 200);
    };
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    overlay.querySelector('#bfModalCancel').addEventListener('click', close);
    overlay.querySelector('#bfModalConfirm').addEventListener('click', async () => {
      const btn = overlay.querySelector('#bfModalConfirm');
      btn.disabled = true;
      btn.textContent = 'Working…';
      try {
        await onConfirm();
        close();
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = confirmLabel;
        btn.parentElement.insertAdjacentHTML('beforebegin',
          `<p style="color:var(--danger);font-family:var(--font-mono);font-size:11px;margin-top:8px;">${escapeHtml(err.message || 'Something went wrong')}</p>`);
      }
    });
  }

  // ---- wire the best friend button ----
  async function wireBestFriendButton(bf) {
    const btn = document.getElementById('bfBtn');
    if (!btn) return;

    btn.addEventListener('click', async () => {
      if (!requireAuth()) return;
      const action = btn.dataset.action;

      if (!action) {
        // sending a fresh best friend request
        openBestFriendModal({
          title: `Add @${targetProfile.username} as Best Friend?`,
          message: `You're about to send <b>${escapeHtml(targetProfile.username)}</b> a Best Friend request. This is the one — you can only have one Best Friend at a time.`,
          warning: `If they accept, you can't un-best-friend them without a 7-day cooldown period.`,
          confirmLabel: 'Send request',
          onConfirm: async () => {
            const { error } = await supabaseClient.from('best_friends').insert({
              requester_id: currentUser.id,
              target_id: targetProfile.id,
              status: 'pending'
            });
            if (error) throw new Error(error.code === '23505'
              ? 'You already have an active best friend or pending request.'
              : error.message);
            renderPage();
          }
        });
      } else if (action === 'accept-inline') {
        openBestFriendModal({
          title: `Accept @${targetProfile.username} as your Best Friend?`,
          message: `You'll both be locked in as Best Friends.`,
          warning: `Once accepted, whoever sent the request can't remove it for 7 days.`,
          confirmLabel: 'Accept',
          onConfirm: async () => {
            const { error } = await supabaseClient.from('best_friends')
              .update({ status: 'accepted' }).eq('id', btn.dataset.id);
            if (error) throw error;
            renderPage();
          }
        });
      } else if (action === 'cancel') {
        const { error } = await supabaseClient.from('best_friends').delete().eq('id', btn.dataset.id);
        if (!error) renderPage();
      } else if (action === 'remove') {
        openBestFriendModal({
          title: `Remove Best Friend?`,
          message: `Are you sure you want to un-Best-Friend @${escapeHtml(targetProfile.username)}?`,
          warning: null,
          confirmLabel: 'Remove',
          onConfirm: async () => {
            const { error } = await supabaseClient.from('best_friends').delete().eq('id', btn.dataset.id);
            if (error) throw new Error(error.message.includes('Cooldown') ? error.message : 'Could not remove right now.');
            renderPage();
          }
        });
      }
    });
  }

  // ---- incoming best friend request for own profile ----
  async function loadIncomingBestFriendRequest() {
    const { data } = await supabaseClient
      .from('best_friends')
      .select('id, requester_id, profiles!best_friends_requester_id_fkey(username, avatar_url)')
      .eq('target_id', currentUser.id)
      .eq('status', 'pending')
      .maybeSingle();
    return data || null;
  }
</script>

<script>
// Navigation behaviour: active link, sliding hover pill, topbar shadow, dock polish
(function(){
  var path = location.pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
  var first = '/' + (path.split('/')[1] || '');
  var keyMap = {'/':'home','/home':'home','/index':'home','/create':'create','/circles':'circles','/circle':'circles','/messages':'messages','/profile':'profile'};
  var key = keyMap[path] || keyMap[first];
  if (key){
    document.querySelectorAll('[data-nav]').forEach(function(el){
      var on = el.getAttribute('data-nav') === key && !el.classList.contains('nav-create') && !el.classList.contains('tab-create');
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
    });
  }

  // sliding hover pill (desktop)
  var list = document.querySelector('.nav-list');
  var pill = document.querySelector('.nav-pill');
  if (list && pill){
    var move = function(el){
      var y = el.getBoundingClientRect().top - list.getBoundingClientRect().top;
      pill.style.height = el.offsetHeight + 'px';
      if (!pill.classList.contains('on')){
        pill.classList.add('snap');
        pill.style.transform = 'translateY(' + y + 'px)';
        void pill.offsetWidth;
        pill.classList.remove('snap');
        pill.classList.add('on');
      } else {
        pill.style.transform = 'translateY(' + y + 'px)';
      }
    };
    list.querySelectorAll('.nav-item').forEach(function(a){
      a.addEventListener('mouseenter', function(){ move(a); });
      a.addEventListener('focus', function(){ if (a.matches(':focus-visible')) move(a); });
    });
    list.addEventListener('mouseleave', function(){ pill.classList.remove('on'); });
    list.addEventListener('focusout', function(){ pill.classList.remove('on'); });
  }

  // topbar gets a soft shadow once you scroll
  var tb = document.querySelector('.topbar');
  if (tb){
    var f = function(){ tb.classList.toggle('scrolled', window.scrollY > 4); };
    window.addEventListener('scroll', f, {passive:true}); f();
  }

  // dock: light haptic tap, and tuck away while typing so the keyboard has room
  var dock = document.querySelector('.bottom-nav');
  if (dock){
    dock.querySelectorAll('.tab').forEach(function(t){
      t.addEventListener('click', function(){ if (navigator.vibrate) navigator.vibrate(8); });
    });
    var FIELD = 'input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]';
    var isField = function(el){ return el && el.matches && el.matches(FIELD); };
    document.addEventListener('focusin', function(e){
      if (isField(e.target) && window.matchMedia('(max-width:899.98px)').matches) dock.classList.add('hidden');
    });
    document.addEventListener('focusout', function(){
      setTimeout(function(){ if (!isField(document.activeElement)) dock.classList.remove('hidden'); }, 60);
    });
  }
})();
</script>
