<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create — Waater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --white:#ffffff;
    --ink:#14151a;
    --ink-soft:#4a4d55;
    --grey:#8a8d94;
    --line:#ececec;
    --line-strong:#e0e0e0;
    --accent:#ff5a36;
    --accent-soft:#fff1ec;
    --danger:#e0433f;
    --success:#1c9c62;
    --success-soft:#eafbf2;
    --nav-w:248px;
    --font-display:'Space Grotesk', sans-serif;
    --font-serif:'Newsreader', serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:var(--font-serif);
    -webkit-font-smoothing:antialiased;
    padding-bottom:78px;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}
  ::selection{background:var(--accent-soft);color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important;scroll-behavior:auto!important;}
  }

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  /* ---------- layout shell (shared with index) ---------- */
  .app{display:flex;max-width:1180px;margin:0 auto;}
  .main{flex:1;min-width:0;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 14px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);z-index:20;
  }
  .wordmark{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:2px;}
  .wordmark .dot{color:var(--accent);}

  .sidebar{
    display:none;width:var(--nav-w);flex-shrink:0;padding:28px 18px;
    flex-direction:column;height:100vh;position:sticky;top:0;
  }
  .sidebar .wordmark{font-size:24px;padding:0 10px;margin-bottom:36px;}
  .nav-list{list-style:none;display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:12px;
    font-family:var(--font-display);font-size:15.5px;font-weight:500;
    color:var(--ink-soft);transition:background .18s var(--ease), color .18s var(--ease), transform .15s var(--ease);
  }
  .nav-item svg{width:22px;height:22px;flex-shrink:0;transition:stroke .18s var(--ease);}
  .nav-item:hover{background:#f7f7f8;color:var(--ink);transform:translateX(2px);}
  .nav-item.active{color:var(--ink);}
  .nav-item.active svg{stroke:var(--accent);}
  .nav-create{margin-top:14px;background:var(--ink);color:var(--white)!important;justify-content:center;font-weight:600;padding:13px 12px;}
  .nav-create:hover{background:#000;transform:none;}
  .nav-create:active{transform:scale(.97);}
  .nav-create svg{stroke:var(--white);}

  .sidebar-profile{
    margin-top:auto;display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:12px;border:1px solid var(--line);
    transition:border-color .18s var(--ease), transform .15s var(--ease);
  }
  .sidebar-profile:hover{border-color:var(--line-strong);transform:translateY(-1px);}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ffd8c9,var(--accent));flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:14px;
  }
  .sidebar-profile .who{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
  .sidebar-profile .who span:first-child{font-family:var(--font-display);font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-profile .who span:last-child{font-family:var(--font-mono);font-size:11px;color:var(--grey);}

  /* ---------- create page ---------- */
  .create-head{padding:26px 22px 6px;opacity:0;animation:riseIn .5s var(--ease) .05s forwards;}
  .create-head h1{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--ink);}
  .create-head p{font-family:var(--font-mono);font-size:11.5px;color:var(--grey);margin-top:4px;}

  .create-body{padding:20px 22px 40px;}

  /* ---------- sticky action bar ---------- */
  .action-bar{
    position:sticky;
    bottom:76px;
    z-index:25;
    margin:22px -6px 0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 -6px 24px rgba(20,21,26,.06), 0 4px 18px rgba(20,21,26,.05);
    opacity:0;transform:translateY(14px);
    animation:barSlideIn .4s var(--ease) .1s forwards;
  }
  @keyframes barSlideIn{
    to{opacity:1;transform:translateY(0);}
  }

  @media (min-width:900px){
    .action-bar{bottom:20px;}
  }

  @keyframes riseIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- session check skeleton ---------- */
  .skeleton-wrap{padding:4px 0;}
  .skel{
    border-radius:16px;background:linear-gradient(100deg,#f2f2f3 30%,#fafafa 50%,#f2f2f3 70%);
    background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:180% 0;}
    100%{background-position:-20% 0;}
  }
  .skel-uploader{width:100%;aspect-ratio:9/13;max-height:560px;}
  .skel-line{height:14px;border-radius:7px;margin-top:16px;}
  .skel-line.w60{width:60%;}
  .skel-line.w40{width:40%;}

  /* ---------- sign-in gate ---------- */
  .signin-gate{
    padding:64px 22px;
    text-align:center;
    opacity:0;animation:riseIn .5s var(--ease) forwards;
  }
  .signin-gate .lock-icon{
    width:44px;height:44px;margin:0 auto 18px;color:var(--grey);
    animation:softFloat 3.2s ease-in-out infinite;
  }
  @keyframes softFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  .signin-gate p{
    font-family:var(--font-serif);font-style:italic;font-size:15px;
    color:var(--ink-soft);margin-bottom:18px;
  }
  .signin-gate a{
    display:inline-block;
    background:var(--ink);color:#fff;font-family:var(--font-display);
    font-weight:600;font-size:13.5px;padding:12px 24px;border-radius:99px;
    transition:background .18s var(--ease), transform .12s var(--ease), box-shadow .18s var(--ease);
  }
  .signin-gate a:hover{background:#000;box-shadow:0 8px 20px rgba(0,0,0,.18);transform:translateY(-1px);}
  .signin-gate a:active{transform:scale(.96);}

  /* ---------- create form entrance ---------- */
  #createForm{opacity:0;animation:riseIn .55s var(--ease) forwards;}
  #createForm .uploader{animation:riseIn .55s var(--ease) .05s backwards;}
  #createForm .caption-field{animation:riseIn .55s var(--ease) .12s backwards;}

  /* dropzone / uploader, styled like the .clip card on index */
  .uploader{
    position:relative;
    width:100%;
    aspect-ratio:9/13;
    max-height:560px;
    border-radius:16px;
    overflow:hidden;
    background:linear-gradient(160deg,#ffe3d6,#ffb199);
    background-size:220% 220%;
    animation:gradientDrift 9s ease-in-out infinite, riseIn .55s var(--ease) .05s backwards;
    border:1.5px dashed rgba(255,255,255,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .2s var(--ease), transform .18s var(--ease), box-shadow .2s var(--ease);
  }
  @keyframes gradientDrift{
    0%,100%{background-position:0% 30%;}
    50%{background-position:100% 70%;}
  }
  .uploader:hover{border-color:var(--white);box-shadow:0 14px 34px rgba(255,90,54,.18);transform:translateY(-2px);}
  .uploader:active{transform:scale(.995);}
  .uploader.dragover{border-color:var(--white);transform:scale(1.01);box-shadow:0 18px 40px rgba(255,90,54,.28);}
  .uploader.has-media{background:#0d0d0f;animation:riseIn .55s var(--ease) .05s backwards;border-style:solid;border-color:var(--line);}

  .uploader input[type="file"]{display:none;}

  .uploader-empty{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:#fff;text-align:center;padding:24px;
    transition:transform .2s var(--ease), opacity .2s var(--ease);
  }
  .uploader:hover .uploader-empty{transform:scale(1.03);}
  .uploader-empty svg{width:36px;height:36px;stroke:#fff;opacity:.9;animation:iconPulse 2.6s ease-in-out infinite;}
  @keyframes iconPulse{
    0%,100%{transform:translateY(0) scale(1);opacity:.9;}
    50%{transform:translateY(-4px) scale(1.06);opacity:1;}
  }
  .uploader-empty .big{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .uploader-empty .small{font-family:var(--font-mono);font-size:11px;opacity:.85;}
  .uploader-empty .small.drag-hint{opacity:0;max-height:0;transition:opacity .2s var(--ease);}
  .uploader.dragover .uploader-empty .small{opacity:0;}
  .uploader.dragover .uploader-empty .big{opacity:0;}
  .uploader.dragover .uploader-empty::after{
    content:'Drop it here';
    position:absolute;font-family:var(--font-display);font-weight:600;font-size:16px;color:#fff;
  }

  .uploader-preview{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:mediaIn .4s var(--ease-spring) forwards;}
  @keyframes mediaIn{
    from{opacity:0;transform:scale(1.04);}
    to{opacity:1;transform:scale(1);}
  }
  .uploader-preview img,
  .uploader-preview video{width:100%;height:100%;object-fit:cover;}

  .uploader-clear{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    z-index:5;transition:background .16s var(--ease), transform .16s var(--ease-spring);
  }
  .uploader-clear:hover{background:rgba(0,0,0,.75);transform:rotate(90deg);}
  .uploader-clear:active{transform:rotate(90deg) scale(.88);}
  .uploader-clear svg{width:16px;height:16px;stroke:#fff;}

  .uploader-filetag{
    position:absolute;top:12px;left:12px;
    font-family:var(--font-mono);font-size:10.5px;color:#fff;
    background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;
    z-index:5;letter-spacing:.03em;
  }

  .uploader-mute{
    position:absolute;bottom:12px;right:12px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
    z-index:5;transition:background .16s var(--ease), transform .12s var(--ease);
  }
  .uploader-mute:hover{background:rgba(0,0,0,.7);}
  .uploader-mute:active{transform:scale(.88);}
  .uploader-mute svg{width:15px;height:15px;stroke:#fff;}

  /* caption */
  .caption-field{margin-top:20px;}
  .caption-field label{
    display:block;font-family:var(--font-mono);font-size:11px;
    letter-spacing:.02em;color:var(--grey);margin-bottom:8px;
  }
  .caption-field textarea{
    width:100%;min-height:96px;resize:none;overflow:hidden;
    border:1px solid var(--line-strong);border-radius:12px;
    padding:14px;font-family:var(--font-serif);font-style:italic;
    font-size:15.5px;color:var(--ink);line-height:1.5;
    outline:none;transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .caption-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .char-count{
    text-align:right;font-family:var(--font-mono);font-size:10.5px;
    color:var(--grey);margin-top:6px;transition:color .18s var(--ease);
  }
  .char-count.near-limit{color:var(--accent);}
  .char-count.near-limit span{animation:tickShake .35s var(--ease);}
  @keyframes tickShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-1.5px);}
    75%{transform:translateX(1.5px);}
  }

  /* submit + status */
  .create-actions{display:flex;align-items:center;gap:14px;}
  .post-btn{
    flex:1;background:var(--ink);color:#fff;font-family:var(--font-display);
    font-weight:600;font-size:14.5px;padding:15px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .18s var(--ease), opacity .18s var(--ease), transform .12s var(--ease), box-shadow .2s var(--ease);
    position:relative;overflow:hidden;
  }
  .post-btn:hover:not(:disabled){background:#000;box-shadow:0 10px 24px rgba(0,0,0,.2);transform:translateY(-1px);}
  .post-btn:active:not(:disabled){transform:scale(.97);}
  .post-btn:disabled{opacity:.72;cursor:not-allowed;}
  .post-btn svg{width:17px;height:17px;stroke:#fff;transition:transform .2s var(--ease-spring);}
  .post-btn:hover:not(:disabled) svg{transform:translate(1px,-1px);}

  .post-btn.is-success{background:var(--success);}

  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .check-pop{width:17px;height:17px;flex-shrink:0;}
  .check-pop path{
    stroke-dasharray:20;stroke-dashoffset:20;
    animation:drawCheck .35s var(--ease) forwards;
  }
  @keyframes drawCheck{to{stroke-dashoffset:0;}}

  .status-msg{
    margin-bottom:12px;font-family:var(--font-mono);font-size:11.5px;
    padding:10px 12px;border-radius:8px;display:none;
  }
  .status-msg.show{display:flex;align-items:center;gap:8px;animation:statusIn .3s var(--ease);}
  @keyframes statusIn{
    from{opacity:0;transform:translateY(-4px);}
    to{opacity:1;transform:translateY(0);}
  }
  .status-msg.error{background:#fdeceb;color:var(--danger);}
  .status-msg.error.shake{animation:statusIn .3s var(--ease), shakeX .4s var(--ease);}
  @keyframes shakeX{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-4px);}
    40%{transform:translateX(4px);}
    60%{transform:translateX(-3px);}
    80%{transform:translateX(3px);}
  }
  .status-msg.success{background:var(--success-soft);color:var(--success);}

  .upload-progress{
    margin-bottom:10px;height:5px;border-radius:99px;background:var(--line);
    overflow:hidden;display:none;position:relative;
  }
  .upload-progress.show{display:block;}
  .upload-progress .bar{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#ff8a5c);
    transition:width .4s var(--ease);position:relative;
  }
  .upload-progress .bar::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    background-size:60px 100%;animation:barShine 1.1s linear infinite;
  }
  @keyframes barShine{
    from{background-position:-60px 0;}
    to{background-position:220px 0;}
  }

  /* success takeover */
  .success-splash{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:70px 20px;text-align:center;opacity:0;
    animation:riseIn .4s var(--ease) forwards;
  }
  .success-ring{
    width:64px;height:64px;border-radius:50%;background:var(--success-soft);
    display:flex;align-items:center;justify-content:center;
    animation:ringPop .45s var(--ease-spring);
  }
  @keyframes ringPop{
    0%{transform:scale(.4);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  .success-ring svg{width:30px;height:30px;stroke:var(--success);}
  .success-ring svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:drawCheck .4s .1s var(--ease) forwards;}
  .success-splash p{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink);}
  .success-splash span{font-family:var(--font-mono);font-size:11px;color:var(--grey);}

  /* ---------- bottom nav (mobile, shared) ---------- */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:64px;
    background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-around;z-index:30;
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--grey);font-family:var(--font-mono);font-size:9.5px;letter-spacing:.02em;padding:6px 10px;transition:color .16s var(--ease), transform .12s var(--ease);}
  .tab:active{transform:scale(.92);}
  .tab svg{width:22px;height:22px;stroke:var(--grey);transition:stroke .16s var(--ease);}
  .tab.active{color:var(--ink);}
  .tab.active svg{stroke:var(--ink);}
  .tab-create{position:relative;top:-20px;}
  .tab-create .ring{width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,90,54,.4);transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease);}
  .tab-create:active .ring{transform:scale(.9);}
  .tab-create svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;}
  .tab-create span{display:none;}

  .prompt-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--accent-soft);
    color:var(--accent);
    font-family:var(--font-mono);
    font-size:12px;
    padding:8px 14px;
    border-radius:99px;
    margin-bottom:10px;
    max-width:100%;
    transition:background .16s var(--ease), transform .12s var(--ease);
  }
  .prompt-chip:hover{background:#ffe6dc;}
  .prompt-chip:active{transform:scale(.97);}
  .prompt-chip span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .prompt-shuffle{
    width:13px;height:13px;flex-shrink:0;
    transition:transform .3s var(--ease-spring);
  }
  .prompt-chip:hover .prompt-shuffle{transform:rotate(180deg);}
  .prompt-chip.cycling span{animation:promptSwap .28s var(--ease);}
  @keyframes promptSwap{
    0%{opacity:0;transform:translateY(3px);}
    100%{opacity:1;transform:translateY(0);}
  }



  @media (min-width:900px){
    body{padding-bottom:0;}
    .topbar{display:none;}
    .bottom-nav{display:none;}
    .sidebar{display:flex;}
    .create-head{padding-top:32px;}
    .create-body{padding-left:32px;padding-right:32px;max-width:460px;}
    .uploader{max-width:380px;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="wordmark">waater<span class="dot">.</span></div>
    <ul class="nav-list">
      <li><a href="/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        Home</a></li>



      <li><a href="/create" class="nav-item nav-create active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Create</a></li>
      <li><a href="/inbox" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Inbox</a></li>
      <li><a href="/profile" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Profile</a></li>
    </ul>
    <div id="sidebarAuthArea"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="wordmark">waater<span class="dot">.</span></div>
    </div>

    <div class="create-head">
      <h1>Log today</h1>

    

    </div>

    <div class="create-body" id="createBody">
      <div class="skeleton-wrap">
        <div class="skel skel-uploader"></div>
        <div class="skel skel-line w60"></div>
        <div class="skel skel-line w40"></div>
      </div>
    </div>
  </main>
</div>

<nav class="bottom-nav">
  <a href="/" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    home
  </a>



  <a href="/create" class="tab tab-create active">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <span>create</span>
  </a>
  <a href="/inbox" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    inbox
  </a>
  <a href="/profile" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    profile
  </a>
</nav>

<script>


  // ============================================================
  // SUPABASE CONFIG — same project as index.html / auth.html.
  // The anon key is safe to expose in client-side code; it can
  // only do what your Row Level Security policies allow.
  // Never put your service_role key in a file like this one.
  // ============================================================
  const SUPABASE_URL = 'https://yacrwbpvcqurxsqpmron.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Any50PwhIupj5rZbez1W4Q_dIx-VRIs';

  let supabaseClient = null;
  let supabaseConfigured = false;
  try {
    if (!SUPABASE_URL.startsWith('http')) throw new Error('Supabase URL not set');
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    supabaseConfigured = true;
  } catch (err) {
    console.warn('Supabase is not configured yet — fill in SUPABASE_URL / SUPABASE_ANON_KEY in create.html.', err);
  }

  function initials(name) {
    return (name || '?').trim().slice(0, 1).toUpperCase();
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  let currentUser = null;
  let currentUsername = null;
  let selectedFile = null;

  // ---- gate the whole page behind sign-in ----
  async function checkAuthAndRender() {
    const createBody = document.getElementById('createBody');

    if (!supabaseConfigured) {
      createBody.innerHTML = '<div class="feed-status" style="padding:40px 0;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--grey);">Supabase is not configured yet.</div>';
      return;
    }

    const { data } = await supabaseClient.auth.getSession();
    currentUser = data.session ? data.session.user : null;

    if (!currentUser) {
      createBody.innerHTML = `
        <div class="signin-gate">
          <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
          <p>Sign in to log today.</p>
          <a href="/auth?next=${encodeURIComponent('/create')}">Sign in</a>
        </div>
      `;
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('username')
      .eq('id', currentUser.id)
      .maybeSingle();

    if (!profile || !profile.username) {
      // Auth exists but they never finished the username step.
      window.location.href = `/auth?next=${encodeURIComponent('/create')}`;
      return;
    }

    currentUsername = profile.username;

    document.getElementById('sidebarAuthArea').innerHTML = `
      <a href="/profile" class="sidebar-profile">
        <div class="avatar">${initials(currentUsername)}</div>
        <div class="who">
          <span>${escapeHtml(currentUsername)}</span>
          <span>day —</span>
        </div>
      </a>
    `;

    renderForm();
  }

  function renderForm() {

    const createBody = document.getElementById('createBody');
    createBody.innerHTML = `
      <form id="createForm">
        <div class="uploader" id="uploader">
          <input type="file" id="fileInput" accept="image/*,video/*">
          <div class="uploader-empty" id="uploaderEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
            <span class="big">Tap to add a photo or video</span>
            <span class="small">or drag a file here</span>
          </div>
          <div class="uploader-preview" id="uploaderPreview" style="display:none;"></div>
        </div>

        
       <div class="caption-field">
        <button type="button" class="prompt-chip" id="promptChip" aria-label="Get a different prompt">
          <svg class="prompt-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M21 3l-8.5 8.5M4 20L12.5 11.5M21 16v5h-5M4 4l5 5"/></svg>
          <span id="promptText">What made you laugh today?</span>
        </button>
        <textarea id="captionInput" rows="1" maxlength="280" placeholder="What made you laugh today?"></textarea>
        <div class="char-count"><span id="charCount">0</span>/280</div>
      </div>




        <div class="action-bar">
          <div class="upload-progress" id="uploadProgress"><div class="bar" id="uploadBar"></div></div>
          <div class="status-msg" id="statusMsg"></div>

          <div class="create-actions">

            <button type="submit" class="post-btn" id="postBtn">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>

              <span id="postBtnLabel">Share this</span>


            </button>
          </div>
        </div>
      </form>
    `;

    const uploader = document.getElementById('uploader');
    const fileInput = document.getElementById('fileInput');
    const uploaderEmpty = document.getElementById('uploaderEmpty');
    const uploaderPreview = document.getElementById('uploaderPreview');
    const captionInput = document.getElementById('captionInput');
    const charCount = document.getElementById('charCount');
    const charCountWrap = document.querySelector('.char-count');
    const statusMsg = document.getElementById('statusMsg');
    const postBtn = document.getElementById('postBtn');
    const postBtnLabel = document.getElementById('postBtnLabel');
    const postBtnIcon = postBtn.querySelector('svg');
    const uploadProgress = document.getElementById('uploadProgress');
    const uploadBar = document.getElementById('uploadBar');

    const promptChip = document.getElementById('promptChip');

    const promptTextEl = document.getElementById('promptText');

    const PROMPTS = [

      "What made you laugh today?",
      "What's one thing that didn't go as planned?",
      "Something small that made today better",

      "What did someone say that stuck with you?",

      "What almost ruined your day (but didn't)?",
      "The most random thing that happened today",

      "What are you low-key proud of today?",

      "One thing you'd tell a friend about today",
      "What surprised you today?",

      "The best five minutes of today",

      "What's a weird thing you saw today?",

      "Something you overheard today",

      "What went better than expected?",

      "What's still making you smile from today?",

      "A tiny win nobody else noticed",

    ];

    let lastPromptIndex = -1;
    function pickPrompt(){
      let i;
      do { i = Math.floor(Math.random() * PROMPTS.length); } while (i === lastPromptIndex);
      lastPromptIndex = i;
      return PROMPTS[i];
    }

    function setPrompt(text){
      promptTextEl.textContent = text;
      captionInput.placeholder = text;
      promptChip.classList.remove('cycling');
      void promptChip.offsetWidth;
      promptChip.classList.add('cycling');
    }

    setPrompt(pickPrompt());

    promptChip.addEventListener('click', () => {
      setPrompt(pickPrompt());
    });



    let progressTimer = null;

    uploader.addEventListener('click', () => fileInput.click());
    uploader.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    uploader.setAttribute('tabindex', '0');
    uploader.setAttribute('role', 'button');
    uploader.setAttribute('aria-label', 'Add a photo or video');

    ['dragover', 'dragenter'].forEach(evt =>
      uploader.addEventListener(evt, e => {
        e.preventDefault();
        uploader.classList.add('dragover');
      })
    );
    ['dragleave', 'drop'].forEach(evt =>
      uploader.addEventListener(evt, e => {
        e.preventDefault();
        uploader.classList.remove('dragover');
      })
    );
    uploader.addEventListener('drop', e => {
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');
      if (!isImage && !isVideo) {
        showStatus('Please choose a photo or video file.', 'error');
        return;
      }

      selectedFile = file;
      const url = URL.createObjectURL(file);

      uploaderEmpty.style.display = 'none';
      uploaderPreview.style.display = 'block';
      uploaderPreview.style.animation = 'none';
      void uploaderPreview.offsetWidth; // restart entrance animation on each new file
      uploaderPreview.style.animation = '';
      uploader.classList.add('has-media');
      uploaderPreview.innerHTML = `
        <button type="button" class="uploader-clear" aria-label="Remove file" id="clearBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <span class="uploader-filetag">${isVideo ? 'video' : 'photo'}</span>
        ${isVideo
          ? `<video src="${url}" muted loop autoplay playsinline id="previewVideo"></video>
             <button type="button" class="uploader-mute" id="muteBtn" aria-label="Unmute preview">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
             </button>`
          : `<img src="${url}" alt="">`
        }
      `;

      document.getElementById('clearBtn').addEventListener('click', e => {
        e.stopPropagation();
        clearFile();
      });

      if (isVideo) {
        const vid = document.getElementById('previewVideo');
        const muteBtn = document.getElementById('muteBtn');
        muteBtn.addEventListener('click', e => {
          e.stopPropagation();
          vid.muted = !vid.muted;
          muteBtn.innerHTML = vid.muted
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>`;
        });
      }
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      uploaderEmpty.style.display = 'flex';
      uploaderPreview.style.display = 'none';
      uploaderPreview.innerHTML = '';
      uploader.classList.remove('has-media');
    }

    // auto-grow the caption textarea
    function autoGrow() {
      captionInput.style.height = 'auto';
      captionInput.style.height = Math.min(captionInput.scrollHeight, 260) + 'px';
    }
    captionInput.addEventListener('input', () => {
      charCount.textContent = captionInput.value.length;
      const near = captionInput.value.length >= 250;
      charCountWrap.classList.toggle('near-limit', near);
      autoGrow();
    });
    autoGrow();

    function showStatus(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = `status-msg show ${type}${type === 'error' ? ' shake' : ''}`;
    }

    function setBtnState(state) {
      // states: idle | loading | success
      if (state === 'loading') {
        postBtn.disabled = true;
        postBtnIcon.style.display = 'none';
        postBtnLabel.textContent = 'Posting…';
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.id = 'btnSpinner';
        postBtn.insertBefore(spinner, postBtnLabel);
      } else if (state === 'success') {
        postBtn.classList.add('is-success');
        const spinner = document.getElementById('btnSpinner');
        if (spinner) spinner.remove();
        postBtnLabel.textContent = 'Posted';
        const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        check.setAttribute('viewBox', '0 0 24 24');
        check.setAttribute('fill', 'none');
        check.setAttribute('stroke', 'currentColor');
        check.setAttribute('stroke-width', '2.4');
        check.setAttribute('class', 'check-pop');
        check.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
        postBtn.insertBefore(check, postBtnLabel);
      } else {
        postBtn.disabled = false;
        postBtn.classList.remove('is-success');
        const spinner = document.getElementById('btnSpinner');
        if (spinner) spinner.remove();
        const check = postBtn.querySelector('.check-pop');
        if (check) check.remove();
        postBtnIcon.style.display = '';

        postBtnLabel.textContent = 'Share this';

      }
    }

    // Smoothly creeps the bar toward a ceiling while the real upload is
    // in flight (Supabase JS doesn't expose byte-level progress), then
    // snaps to 100% the instant the upload actually resolves.
    function startFakeProgress() {
      uploadProgress.classList.add('show');
      uploadBar.style.width = '6%';
      let pct = 6;
      progressTimer = setInterval(() => {
        const ceiling = 88;
        pct += (ceiling - pct) * 0.12;
        uploadBar.style.width = pct.toFixed(1) + '%';
      }, 180);
    }
    function finishFakeProgress() {
      if (progressTimer) clearInterval(progressTimer);
      uploadBar.style.width = '100%';
    }
    function resetProgress() {
      if (progressTimer) clearInterval(progressTimer);
      uploadProgress.classList.remove('show');
      uploadBar.style.width = '0%';
    }

    document.getElementById('createForm').addEventListener('submit', async e => {
      e.preventDefault();

      if (!currentUser) {
        window.location.href = `/auth?next=${encodeURIComponent('/create')}`;
        return;
      }

      const caption = captionInput.value.trim();
      if (!selectedFile && !caption) {
        showStatus('Add a photo/video or write something first.', 'error');
        return;
      }

      setBtnState('loading');
      statusMsg.className = 'status-msg';

      try {
        let mediaUrl = null;
        let mediaType = 'text';

        if (selectedFile) {
          mediaType = selectedFile.type.startsWith('video/') ? 'video' : 'photo';
          const ext = selectedFile.name.split('.').pop();
          const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

          startFakeProgress();

          const { error: uploadError } = await supabaseClient.storage
            .from('post-media')
            .upload(path, selectedFile, { cacheControl: '3600', upsert: false });

          if (uploadError) throw uploadError;

          const { data: publicUrlData } = supabaseClient.storage
            .from('post-media')
            .getPublicUrl(path);

          mediaUrl = publicUrlData.publicUrl;
          finishFakeProgress();
        }

        // user_id is now the real authenticated user id, not a guest id —
        // RLS (see supabase-setup.sql) only allows inserting rows where
        // user_id matches auth.uid(), so this must be currentUser.id.
        const { error: insertError } = await supabaseClient
          .from('posts')
          .insert({
            user_id: currentUser.id,
            caption,
            media_url: mediaUrl,
            media_type: mediaType
          });

        if (insertError) throw insertError;

        setBtnState('success');
        createBody.querySelector('form').style.transition = 'opacity .25s var(--ease)';

        setTimeout(() => {
          createBody.innerHTML = `
            <div class="success-splash">
              <div class="success-ring">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
              </div>
              <p>Posted to your day</p>
              <span>Taking you home…</span>
            </div>
          `;
        }, 550);

        setTimeout(() => { window.location.href = '/'; }, 1250);

      } catch (err) {
        console.error(err);
        showStatus(err.message || 'Something went wrong. Try again.', 'error');
        setBtnState('idle');
        resetProgress();
      }
    });
  }

  checkAuthAndRender();
</script>

</body>
</html>
